---
# (d2) restore of the NEW smoketest@smoke-dst series (no sourceNamespace) after the forward backup.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata: {name: smoke-dst-local-d, namespace: smoke-dst, labels: {smoke-test: hermes-ns-move}}
spec:
  trigger: {manual: restore-once}
  kopia:
    repository: smoke-volsync-local-secret
    sourceIdentity: {sourceName: smoketest}
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapclass
    cacheStorageClassName: longhorn-1-replica
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 2Gi
    storageClassName: longhorn-1-replica-local
    accessModes:
      - ReadWriteOnce
    capacity: 1Gi
    moverSecurityContext: {runAsUser: 0, runAsGroup: 0, fsGroup: 0, fsGroupChangePolicy: OnRootMismatch}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: smokedata-d, namespace: smoke-dst, labels: {smoke-test: hermes-ns-move}}
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef: {kind: ReplicationDestination, apiGroup: volsync.backube, name: smoke-dst-local-d}
  resources: {requests: {storage: 1Gi}}
  storageClassName: longhorn-1-replica-local
