---
apiVersion: batch/v1
kind: Job
metadata: {name: reader-g2, namespace: smoke-dst, labels: {smoke-test: hermes-ns-move}}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: r
          image: busybox:1.38
          command:
            - sh
            - -c
            - "ls -laR /data | grep -v lost; cat /data/secretdir/.env /data/auth.json"
          volumeMounts:
            - {name: d, mountPath: /data}
      volumes:
        - {name: d, persistentVolumeClaim: {claimName: volsync-smoke-dst-local-g-dest}}
