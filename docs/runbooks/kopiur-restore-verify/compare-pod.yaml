---
# Read-only comparison of the live calibre-web volume against both W1 restores.
# All three volumes mounted readOnly in one pod (the pilot method). Runs as root with
# default capabilities so it can read 0600 files of any owner; baseline PSA allows it.
# Uses calibre-web's own image (digest of the running pod) for its sqlite3 and the tools.
# Known writers: app.db and calibre-web.log change on live after both snapshots, so they
# are excluded from the strict live comparison and checked separately (integrity_check
# for app.db, informational for the log). Everything else must match exactly.
# nodeName: the live PVC is RWO and attached to the running calibre-web pod on brokkr01.
# Prints a short summary only: kubectl output of long streams can truncate silently.
apiVersion: v1
kind: Pod
metadata:
  name: w1-verify-calibre-web-compare
  namespace: media
spec:
  restartPolicy: Never
  nodeName: brokkr01
  containers:
    - name: compare
      image: ghcr.io/linuxserver/calibre-web@sha256:868b56271e4fdd37f4b5d2fe925e62ffd74f89e0e290082e76be6b1f21b77bd8
      command:
        - /usr/bin/bash
        - -c
        - |
          set -uo pipefail
          WRITERS='^(app\.db|calibre-web\.log)$'
          # content: sha256 of every regular file; meta: type/mode/owner/size of every
          # entry, plus file mtimes. Directory mtimes are listed separately because the
          # pilot found kopia does not preserve them. Lines are keyed by path (last field).
          manifest() {
            cd "$1" || exit 1
            find . -path ./lost+found -prune -o -type f -printf '%P\0' | sort -z | xargs -0 sha256sum > /tmp/$2.sha
            find . -mindepth 1 -path ./lost+found -prune -o -printf '%y %m %U:%G %s %P\n' | sort -k5 > /tmp/$2.meta
            find . -path ./lost+found -prune -o -type f -printf '%T@ %P\n' | sort -k2 > /tmp/$2.fmtime
            find . -mindepth 1 -path ./lost+found -prune -o -type d -printf '%T@ %P\n' | sort -k2 > /tmp/$2.dmtime
          }
          strict() { awk -v re="$WRITERS" '{ if ($NF !~ re) print }' "$1"; }
          manifest /live live; manifest /local local; manifest /r2 r2
          for t in live local r2; do
            printf '%-5s files=%s entries=%s owners=%s\n' $t "$(wc -l < /tmp/$t.sha)" \
              "$(wc -l < /tmp/$t.meta)" "$(awk '{print $3}' /tmp/$t.meta | sort | uniq -c | tr -s ' ' | paste -sd,)"
          done
          rc=0
          cmp_pair() {  # $1 $2 = manifests; strict except known writers
            for k in sha meta fmtime dmtime; do
              n=$(diff <(strict /tmp/$1.$k) <(strict /tmp/$2.$k) | grep -c '^[<>]')
              echo "$1 vs $2 $k (excl. writers): $n differing lines"
              if [ "$n" -gt 0 ]; then
                [ "$k" != dmtime ] && rc=1
                diff <(strict /tmp/$1.$k) <(strict /tmp/$2.$k) | grep '^[<>]' | head -10
              fi
            done
          }
          cmp_pair live local; cmp_pair live r2; cmp_pair local r2
          echo "--- known writers (informational except integrity)"
          for t in live local r2; do grep -E ' (app\.db|calibre-web\.log)$' /tmp/$t.meta | sed "s/^/$t meta: /"; done
          for f in app.db calibre-web.log; do
            a=$(grep " $f\$" /tmp/local.sha | cut -c1-16); b=$(grep " $f\$" /tmp/r2.sha | cut -c1-16)
            echo "local vs r2 $f: $([ "$a" = "$b" ] && echo identical || echo "differs ($a / $b)")"
          done
          for t in local r2; do
            for db in app.db gdrive.db; do
              # immutable=1: open read-only without creating -wal/-shm on the RO mount
              r=$(sqlite3 "file:/$t/$db?immutable=1" 'PRAGMA integrity_check;' 2>&1 | head -3 | paste -sd' ')
              echo "$t $db integrity_check: $r"
              [ "$r" = ok ] || rc=1
            done
            echo "$t app.db tables: $(sqlite3 "file:/$t/app.db?immutable=1" 'select count(*) from sqlite_master where type="table";' 2>&1)"
          done
          echo "RESULT: $([ $rc = 0 ] && echo PASS || echo FAIL) (dir mtimes + writer contents informational)"
      volumeMounts:
        - name: live
          mountPath: /live
          readOnly: true
        - name: local
          mountPath: /local
          readOnly: true
        - name: r2
          mountPath: /r2
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
  volumes:
    - name: live
      persistentVolumeClaim:
        claimName: calibre-web
        readOnly: true
    - name: local
      persistentVolumeClaim:
        claimName: w1-verify-calibre-web-local
        readOnly: true
    - name: r2
      persistentVolumeClaim:
        claimName: w1-verify-calibre-web-r2
        readOnly: true
