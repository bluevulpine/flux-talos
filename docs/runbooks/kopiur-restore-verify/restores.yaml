---
# kopiur restore gate (see README.md). As committed: W0, recyclarr (longhorn-1-replica), one restore per leg.
# Both source snapshots were taken after recyclarr's 00:00Z @daily run and nothing
# has written the volume since, so the restores must be byte-identical to live.
# The target PVCs are NOT owned by the Restore (kopiur docs/restores.md); delete them by hand.
# Mover runs as root on purpose: this is the first restore with root movers, and the point
# is to confirm ownership now survives (the pilot's 568 mover re-owned a uid-0 file).
# Run 1 (root, caps dropped): content identical, but all 2,523 entries came back 0:0.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: w0-verify-recyclarr-local
  namespace: media
spec:
  source:
    snapshotRef:
      name: recyclarr-local-20260924065332
  target:
    pvc:
      name: w0-verify-recyclarr-local
      storageClassName: longhorn-1-replica
      capacity: 1Gi
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      # runAsUser 0 alone keeps kopiur's hardened drop: [ALL], so the mover cannot chown
      # and every entry restored 0:0 (run 1). `privilegedMode: true` would not help in
      # 0.10.9: it only feeds the admission gate, never the Job (restore/mod.rs:3451-3483).
      # These merge over drop: [ALL]; all four are allowed under baseline PSA.
      # CHOWN: owners; FOWNER: chmod/utimes on files it no longer owns;
      # FSETID: keep setgid (the 2775 dirs) when root is not in the file's group;
      # DAC_OVERRIDE: write into dirs already chowned to 568.
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - FSETID
          - DAC_OVERRIDE
    cache:
      mode: Ephemeral
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: w0-verify-recyclarr-r2
  namespace: media
spec:
  source:
    snapshotRef:
      name: recyclarr-r2-20260924044158
  target:
    pvc:
      name: w0-verify-recyclarr-r2
      storageClassName: longhorn-1-replica
      capacity: 1Gi
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      # runAsUser 0 alone keeps kopiur's hardened drop: [ALL], so the mover cannot chown
      # and every entry restored 0:0 (run 1). `privilegedMode: true` would not help in
      # 0.10.9: it only feeds the admission gate, never the Job (restore/mod.rs:3451-3483).
      # These merge over drop: [ALL]; all four are allowed under baseline PSA.
      # CHOWN: owners; FOWNER: chmod/utimes on files it no longer owns;
      # FSETID: keep setgid (the 2775 dirs) when root is not in the file's group;
      # DAC_OVERRIDE: write into dirs already chowned to 568.
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - FSETID
          - DAC_OVERRIDE
    cache:
      mode: Ephemeral
