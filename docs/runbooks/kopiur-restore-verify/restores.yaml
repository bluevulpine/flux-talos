---
# kopiur restore gate, W1 (longhorn-1-replica): calibre-web, one restore per leg.
# Sources: calibre-web-r2 04:16:58Z and calibre-web-local 04:20:07Z, both 2,792,918 B.
# Live keeps writing app.db (last 09:00Z) and calibre-web.log after both, so the compare
# pod treats those two as known writers vs live and checks them by integrity instead.
# Root mover + the capability block: live is 568:568 (abc) with setgid dirs.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: w1-verify-calibre-web-local
  namespace: media
spec:
  source:
    snapshotRef:
      name: calibre-web-local-20260925042007
  target:
    pvc:
      name: w1-verify-calibre-web-local
      storageClassName: longhorn-1-replica
      capacity: 1Gi
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      # runAsUser 0 alone keeps kopiur's hardened drop: [ALL], so the mover cannot chown
      # and every entry restored 0:0 (run 1). `privilegedMode: true` would not help in
      # 0.10.9: it only feeds the admission gate, never the Job (restore/mod.rs:3451-3483).
      # These merge over drop: [ALL]; all four are allowed under baseline PSA.
      # CHOWN: owners; FOWNER: chmod/utimes on files it no longer owns;
      # FSETID: keep setgid (the 2775 dirs) when root is not in the file's group;
      # DAC_OVERRIDE: write into dirs already chowned to 568.
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - FSETID
          - DAC_OVERRIDE
    cache:
      mode: Ephemeral
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: w1-verify-calibre-web-r2
  namespace: media
spec:
  source:
    snapshotRef:
      name: calibre-web-r2-20260925041658
  target:
    pvc:
      name: w1-verify-calibre-web-r2
      storageClassName: longhorn-1-replica
      capacity: 1Gi
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      # runAsUser 0 alone keeps kopiur's hardened drop: [ALL], so the mover cannot chown
      # and every entry restored 0:0 (run 1). `privilegedMode: true` would not help in
      # 0.10.9: it only feeds the admission gate, never the Job (restore/mod.rs:3451-3483).
      # These merge over drop: [ALL]; all four are allowed under baseline PSA.
      # CHOWN: owners; FOWNER: chmod/utimes on files it no longer owns;
      # FSETID: keep setgid (the 2775 dirs) when root is not in the file's group;
      # DAC_OVERRIDE: write into dirs already chowned to 568.
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - FSETID
          - DAC_OVERRIDE
    cache:
      mode: Ephemeral
