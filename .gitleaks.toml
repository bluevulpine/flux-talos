# Extend gitleaks' default ruleset (unchanged) and add narrow allowlists.
[extend]
useDefault = true

[[allowlists]]
description = """
Vendored upstream CloudNativePG barman-cloud plugin release manifest. Its only
Secret (plugin-barman-cloud-*) holds the SIDECAR_IMAGE key — a container image
reference (ghcr.io/.../plugin-barman-cloud-sidecar:<tag>), not a credential.
Allowlisted by path so re-vendoring on version bumps stays clean.
"""
paths = ['''kubernetes/apps/database/cloudnative-pg/plugin-barman-cloud/manifest\.yaml''']

[[allowlists]]
description = """
Vendored kn-guard.sh test suite (sha256-pinned copy, must stay byte-identical to the
shared source). It feeds a FAKE 'password: hunter2-TOPSECRET' string to kn to prove
the guard's refusal messages never echo manifest content; it is not a credential.
Allowlisted by path so re-vendoring stays clean.
"""
paths = ['''\.claude/move-workload/guards/kn-guard\.test\.sh''']

[[allowlists]]
description = """
Element Web's own public MapTiler key, shipped as the ESS matrix-stack chart's
default map_style_url and copied verbatim into the per-host Element config
(kubernetes/apps/matrix/matrix-stack/app/element-web-bluevulpine.yaml). It is
Element's key, served to every browser that loads Element; not a credential of
ours. Allowlisted by the exact URL, NOT by path, so a real secret added to that
file is still caught. If the chart changes the key, update both.
"""
regexTarget = "line"
regexes = ['''api\.maptiler\.com/maps/streets/style\.json\?key=fU3vlMsMn4Jb6dnEIFsx''']
