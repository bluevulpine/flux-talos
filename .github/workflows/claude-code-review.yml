name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Claude review on Renovate's bot-authored PRs. They are routine,
    # first-party dependency bumps that don't warrant an AI code review, and the
    # sweep evaluates them deliberately instead. A job-level guard yields a clean
    # "skipped" check rather than the red failure the action's non-human-actor
    # prompt-injection guardrail would otherwise produce on every Renovate PR.
    if: github.event.pull_request.user.login != 'renovate[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # The action bundles its own Claude Code CLI, so this pin also decides which models
        # `--model` below can use. Must bundle Claude Code >= 2.1.280 for claude-opus-5-5:
        # cfc3eb2 shipped 2.1.278, and the API answers that version with "400 Claude Code
        # 2.1.278 does not support this model; version 2.1.280 or newer is required" - a
        # 0-token, ~300ms `is_error:true` failure whose message the action hides.
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action refuses PRs opened by a GitHub App with
          # "Workflow initiated by non-human actor: fizz-bot-bvn (type: Bot)" and
          # exits 1 in ~10s, posting nothing - a red check that looks like a
          # review verdict but is an authorisation refusal. fizz-bot-bvn is the
          # App the Fizz agent authors PRs through; those are exactly the PRs
          # that most want reviewing, so it is allow-listed rather than skipped
          # the way renovate[bot] is in the job-level `if:` above.
          allowed_bots: 'fizz-bot-bvn'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Must be a form `gh pr view` accepts: a number, or a full URL.
          # This previously passed `${{ github.repository }}/pull/<n>`, which gh
          # parses as a BRANCH NAME - `gh pr view bluevulpine/flux-talos/pull/1712`
          # returns `no pull requests found for branch "..."`. Correct on its own
          # terms, but NOT the reason the reviewer is silent: changing it alone
          # was tested on this PR and the run still went green without posting.
          # Keeping it because the old form was wrong, not because it was the bug.
          prompt: '/code-review:code-review ${{ github.event.pull_request.html_url }}'
          # Forces tag mode with a tracking comment. The only comment claude[bot]
          # has ever posted in this repo (2026-07-14) came from tag mode; the
          # pull_request-triggered agent mode has never posted anything. This is
          # the better-grounded hypothesis - it gives the run a comment surface
          # to write into rather than assuming one exists.
          track_progress: true
          # The review command is a multi-agent workflow - it spawns agents to
          # gate, gather context, summarise, review in parallel and validate each
          # finding. The run on 91ca8711 recorded permission_denials_count: 26
          # across 12 turns, roughly two refusals per turn: it tries to spawn
          # them, is refused, and exits success with nothing to post.
          #
          # show_full_output would name the denied tools, but it is NOT set here
          # deliberately. This repository is public and that input emits all tool
          # results - "which may contain secrets, API keys" - into world-readable
          # logs. It is unnecessary: permission_denials_count is already visible
          # in the ordinary log, so the fix has a free numeric readout. 26 -> 0
          # means solved. Guessing wrong costs one CI run; a permanent disclosure
          # would cost until someone remembered to turn it back off.
          #
          # Model: pinned to Opus 5.5. This used to be unset, so the run silently took the
          # action's default (claude-sonnet-5, per the 2026-09-25 run log), and a review model that
          # changes when the action's default changes is not one anybody chose. The plugin's
          # sub-agents (gating, summarising) pick their own models regardless of this flag.
          # Trade-off: Opus is slower and costs more per run. Drop `--model` to go back.
          #
          # A newer model needs a newer CLI: see the version note on `uses:` above. If this
          # step fails in well under a second with `result is_error:true` and $0 cost,
          # suspect that first. Re-running with debug logging does NOT reveal the hidden
          # message (the action reads ACTIONS_STEP_DEBUG from the process env, which a
          # debug re-run does not set). Reproduce locally with the bundled CLI version
          # instead: `npx @anthropic-ai/claude-code@<ver> -p --model <id> ok`.
          claude_args: '--model claude-opus-5-5 --allowedTools "Task,Read,Grep,Glob,Bash(gh:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
        # A step-level env, not claude_args: the variable is read by Claude Code,
        # not passed as a flag. It is documented to turn off `run_in_background`
        # for Bash and for subagents, so every finder agent the review spawns runs
        # in the foreground and the parent has the results in hand before it posts.
        # Why: on large docs-only PRs (#1919, #1929) the run finished `success` in
        # 7-12 turns at the highest cost ($1.7-2.2) with the tracking comment stuck
        # at "finder agents running in background" and no verdict, while PRs that
        # DID get a verdict took 6-62 turns. permission_denials_count does not
        # separate the two groups (3-15 posted, 12-16 stalled), so the denials fix
        # above is not this. UNVERIFIED that background mode is the cause - headless
        # mode is documented to wait for background subagents, so the mechanism may
        # be something else - and the action validates this file against main, so
        # it can only be tested after merge: the next large docs PR either gets a
        # verdict or does not. A review bot has no use for background tasks anyway.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'

