name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Claude review on Renovate's bot-authored PRs. They are routine,
    # first-party dependency bumps that don't warrant an AI code review, and the
    # sweep evaluates them deliberately instead. A job-level guard yields a clean
    # "skipped" check rather than the red failure the action's non-human-actor
    # prompt-injection guardrail would otherwise produce on every Renovate PR.
    if: github.event.pull_request.user.login != 'renovate[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Must be a form `gh pr view` accepts: a number, or a full URL.
          # This previously passed `${{ github.repository }}/pull/<n>`, which gh
          # parses as a BRANCH NAME - `gh pr view bluevulpine/flux-talos/pull/1712`
          # returns `no pull requests found for branch "..."`. Correct on its own
          # terms, but NOT the reason the reviewer is silent: changing it alone
          # was tested on this PR and the run still went green without posting.
          # Keeping it because the old form was wrong, not because it was the bug.
          prompt: '/code-review:code-review ${{ github.event.pull_request.html_url }}'
          # Forces tag mode with a tracking comment. The only comment claude[bot]
          # has ever posted in this repo (2026-07-14) came from tag mode; the
          # pull_request-triggered agent mode has never posted anything. This is
          # the better-grounded hypothesis - it gives the run a comment surface
          # to write into rather than assuming one exists.
          track_progress: true
          # The review command is a multi-agent workflow - it spawns agents to
          # gate, gather context, summarise, review in parallel and validate each
          # finding. The run on 91ca8711 recorded permission_denials_count: 26
          # across 12 turns, roughly two refusals per turn: it tries to spawn
          # them, is refused, and exits success with nothing to post.
          #
          # show_full_output would name the denied tools, but it is NOT set here
          # deliberately. This repository is public and that input emits all tool
          # results - "which may contain secrets, API keys" - into world-readable
          # logs. It is unnecessary: permission_denials_count is already visible
          # in the ordinary log, so the fix has a free numeric readout. 26 -> 0
          # means solved. Guessing wrong costs one CI run; a permanent disclosure
          # would cost until someone remembered to turn it back off.
          claude_args: '--allowedTools "Task,Read,Grep,Glob,Bash(gh:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

