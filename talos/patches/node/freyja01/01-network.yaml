---
# The control-plane VM's virtio NIC (br1, VLAN 10), selected by MAC, plus the API VIP.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("00:a0:98:67:d0:98", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: ethSel0
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.10.30
link: ethSel0
