---
# Raspberry Pi workers (jormungandr1-4). Expected ID a6c707bf3d72…b184.
# Extracted from the retired talos/talconfig.yaml (jormungandr1's schematic, anchors resolved) so the
# Image Factory ID stayed identical across the talhelper->topf move. Do not hand-edit: the ID depends on the exact content.
customization:
  extraKernelArgs:
    - -init_on_alloc
    - -init_on_free
    - -selinux
    - apparmor=0
    - init_on_alloc=0
    - init_on_free=0
    - mitigations=off
    - security=none
    - talos.auditd.disabled=1
  systemExtensions:
    officialExtensions:
      - siderolabs/binfmt-misc
      - siderolabs/iscsi-tools
      - siderolabs/nfsrahead
      - siderolabs/tailscale
      - siderolabs/util-linux-tools
