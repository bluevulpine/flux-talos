---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# These routes replace the Ingresses the chart renders (deleted by the HelmRelease
# postRenderer). Paths and backends are copied from `helm template` of the
# matrix-stack tag pinned in ./ocirepository.yaml — re-diff them on chart upgrades.
# Mirrors kubernetes/apps/matrix/matrix-stack/app/httproute.yaml for bluevulpine.net.
#
# NAMES ARE PREFIXED `bluevulpine-` ON PURPOSE: HTTPRoute names must be unique
# CLUSTER-WIDE, not just per namespace. gatus-sidecar (--auto-httproute) names each
# endpoint after the bare route name, no namespace, and Gatus panics on a duplicate
# group+name — reusing kubernetes/apps/matrix's names would crash-loop Gatus for
# every app in the cluster.
#
# Public hosts attach to `internal` (LAN A record via external-dns-unifi) and
# `external-pangolin` (public CNAME from ./dnsendpoint.yaml). Pangolin, not the
# Cloudflare tunnel: no 100MB body cap on media, and no Cloudflare bot challenges
# in front of server-to-server federation traffic.
#
# Synapse client + federation API. Deliberately NARROWER than the chart's Ingress,
# which exposes all of /_synapse: here only /_synapse/client is public, so the
# admin API (/_synapse/admin) and MAS's Synapse endpoints (/_synapse/mas) are not
# reachable from the internet. See bluevulpine-matrix-synapse-lan below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluevulpine-matrix-synapse
  annotations:
    gatus.home-operations.com/endpoint: |
      group: matrix-bluevulpine
      url: https://matrix.${SECRET_DOMAIN_BLOG}/_matrix/client/versions
spec:
  hostnames:
    - "matrix.${SECRET_DOMAIN_BLOG}"
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
    - name: external-pangolin
      namespace: network
      sectionName: https
  rules:
    # With MAS, login/refresh/logout on the client API are served by MAS's
    # compatibility layer, not Synapse. Longest-prefix wins over /_matrix below.
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/client/api/v1/login
        - path:
            type: PathPrefix
            value: /_matrix/client/api/v1/refresh
        - path:
            type: PathPrefix
            value: /_matrix/client/api/v1/logout
        - path:
            type: PathPrefix
            value: /_matrix/client/r0/login
        - path:
            type: PathPrefix
            value: /_matrix/client/r0/refresh
        - path:
            type: PathPrefix
            value: /_matrix/client/r0/logout
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/login
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/refresh
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/logout
        - path:
            type: PathPrefix
            value: /_matrix/client/unstable/login
        - path:
            type: PathPrefix
            value: /_matrix/client/unstable/refresh
        - path:
            type: PathPrefix
            value: /_matrix/client/unstable/logout
      backendRefs:
        - name: matrix-stack-matrix-authentication-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse/client
      backendRefs:
        # HAProxy in front of Synapse (routes to workers if ever enabled).
        - name: matrix-stack-synapse
          port: 8008
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The rest of /_synapse (admin API, /_synapse/mas, /_synapse/ess/version) for LAN
# and tailnet clients only — Element Admin runs in the browser and calls
# matrix.<domain>/_synapse/admin directly, which resolves to the internal gateway
# on-network. Same hostname as above: Gateway API merges the two routes' rules on
# `internal`, and the longer /_synapse/client prefix above still wins for that path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluevulpine-matrix-synapse-lan
spec:
  hostnames:
    - "matrix.${SECRET_DOMAIN_BLOG}"
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: matrix-stack-synapse
          port: 8008
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Matrix Authentication Service: OAuth/OIDC endpoints, account management UI, and
# the upstream callback Authentik redirects to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluevulpine-matrix-account
spec:
  hostnames:
    - "account.${SECRET_DOMAIN_BLOG}"
  # LAN / tailnet: everything, including the MAS admin API (/api/admin), which
  # Element Admin calls from the browser.
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: matrix-stack-matrix-authentication-service
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internet (Pangolin): the same host minus the MAS admin API. The chart puts the
# `adminapi` resource on MAS's single public `web` listener, so it cannot be split
# at the Service; it is refused here at the edge instead, matching the Synapse
# admin API (bluevulpine-matrix-synapse-lan). Gateway API has no "all except" match, hence a
# separate route per gateway: a second /api/admin rule on `internal` would tie on
# prefix length with the one above and be resolved by creation time.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluevulpine-matrix-account-public
spec:
  hostnames:
    - "account.${SECRET_DOMAIN_BLOG}"
  parentRefs:
    - name: external-pangolin
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/admin
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: matrix-not-found
    - backendRefs:
        - name: matrix-stack-matrix-authentication-service
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
# Answers at the edge without reaching a backend (Envoy Gateway extension).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: matrix-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "Not Found"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# (No Element Web / Element Admin routes here: this release disables both, and
# chat.${SECRET_DOMAIN_BLOG} is served by the derekjacobs.dev release's Element Web.)
#
# Delegation: the apex (serverName) answers /.well-known/matrix/{server,client,support};
# federation then goes to matrix.<domain>:443. ONLY that path is claimed: the blog
# (kubernetes/apps/default/bluevulpine-blog) owns everything else on the apex, and
# Gateway API gives the more specific PathPrefix to this route.
#
# BOTH gateways, unlike the derekjacobs.dev route: the blog's apex is on `external`
# AND `internal`, so on the LAN bluevulpine.net resolves to the internal gateway,
# where an external-only route would fall through to the blog's nginx and 404.
# No apex DNS change: the apex record already exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluevulpine-matrix-well-known
spec:
  hostnames:
    - "${SECRET_DOMAIN_BLOG}"
  parentRefs:
    - name: external
      namespace: network
      sectionName: https
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
      backendRefs:
        - name: matrix-stack-well-known
          port: 8010
