---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# bluevulpine.net homeserver — the SECOND ESS Community release (Synapse + Matrix
# Authentication Service + .well-known delegation; no Element Web/Admin, see below).
# Mirrors kubernetes/apps/matrix/matrix-stack (derekjacobs.dev). Design:
# docs/superpowers/specs/2026-10-02-matrix-bluevulpine-design.md
# Original decision record: docs/briefs/2026-09-24-matrix-homeserver-evaluation.md
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matrix-stack
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: matrix-stack
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # The chart renders networking.k8s.io Ingress objects only; this cluster routes
  # with Gateway API (./httproute.yaml mirrors the chart's Ingress paths). No
  # ingress controller would ever serve them, so drop them rather than leave
  # dead objects around. Kind-only target: every Ingress this chart emits goes.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
            patch: |-
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: not-used
          # Restart Synapse and MAS when matrix-stack-secret changes. Both bake the
          # Postgres password (and every other secret) into their rendered config at
          # pod start, and the chart's k8s.element.io/*-hash labels hash the Secret's
          # NAME and key, not its contents — so without this a rotated password is
          # only picked up by an unrelated restart, and until then every NEW
          # connection fails. Ordering against the db Job: README "Rotating".
          # Strategic merge, not a JSON-patch `add /metadata/annotations`, which would
          # replace any annotations a future chart version sets. `target` because the
          # rendered objects carry namespace: matrix, which a bare patch would not match.
          - target:
              kind: StatefulSet
              name: matrix-stack-synapse-main
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: matrix-stack-synapse-main
                annotations:
                  secret.reloader.stakater.com/reload: matrix-stack-secret
          - target:
              kind: Deployment
              name: matrix-stack-matrix-authentication-service
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: matrix-stack-matrix-authentication-service
                annotations:
                  secret.reloader.stakater.com/reload: matrix-stack-secret
  values:
    # PERMANENT. Embedded in every user ID (@user:<serverName>) and room ID; per
    # the chart it "can not change after the initial deployment". The apex, delegated to
    # matrix.<domain> via /.well-known/matrix/server (no port 8448).
    serverName: "${SECRET_DOMAIN_BLOG}"

    # Every secret comes from OpenBao (./externalsecret.yaml) — see the comment
    # there for why the chart's own generator is off.
    initSecrets:
      enabled: false

    # State lives on the shared CNPG postgres18 cluster; roles and databases are
    # provisioned by the matrix-stack-db Kustomization (../db), which this one
    # dependsOn. With both components pointed at an external Postgres the chart's
    # bundled Postgres is not rendered at all.
    postgres:
      enabled: false

    ingress:
      # The Ingresses are deleted by the postRenderer; this only stops the chart
      # from wanting a TLS Secret for them. TLS terminates at Envoy Gateway.
      tlsEnabled: false

    synapse:
      # No workers: a handful of users is well inside one Synapse process, and a
      # monolith needs no Redis. If that changes, point synapse.redisOrValkey at
      # the existing Dragonfly rather than letting the chart deploy its Valkey.
      postgres:
        host: "${POSTGRES_HOST}"
        port: 5432
        # _bluevulpine: postgres18 is shared, and `synapse` belongs to derekjacobs.dev.
        user: synapse_bluevulpine
        database: synapse_bluevulpine
        password:
          secret: matrix-stack-secret
          secretKey: SYNAPSE_POSTGRES_PASSWORD
      signingKey:
        secret: matrix-stack-secret
        secretKey: SYNAPSE_SIGNING_KEY
      macaroon:
        secret: matrix-stack-secret
        secretKey: SYNAPSE_MACAROON
      registrationSharedSecret:
        secret: matrix-stack-secret
        secretKey: SYNAPSE_REGISTRATION_SHARED_SECRET
      ingress:
        host: "matrix.${SECRET_DOMAIN_BLOG}"
      media:
        storage:
          # ./pvc.yaml (plain claim, longhorn-2-replica, kopiur-backed).
          existingClaim: synapse-media
        # Public traffic comes through Pangolin, not Cloudflare, so the 100MB CF
        # body cap does not apply. Uploads buffer in the tmp emptyDir first, so it
        # is moved off tmpfs (medium "") — a 500M upload in a Memory emptyDir would
        # count against the pod's memory limit.
        maxUploadSize: 500M
        ephemeralStorages:
          tmp:
            sizeLimit: 2Gi
            medium: ""

    matrixAuthenticationService:
      postgres:
        host: "${POSTGRES_HOST}"
        port: 5432
        user: mas_bluevulpine
        database: mas_bluevulpine
        password:
          secret: matrix-stack-secret
          secretKey: MAS_POSTGRES_PASSWORD
      encryptionSecret:
        secret: matrix-stack-secret
        secretKey: MAS_ENCRYPTION_SECRET
      synapseSharedSecret:
        secret: matrix-stack-secret
        secretKey: MAS_SYNAPSE_SHARED_SECRET
      privateKeys:
        rsa:
          secret: matrix-stack-secret
          secretKey: MAS_KEY_RSA
        ecdsaPrime256v1:
          secret: matrix-stack-secret
          secretKey: MAS_KEY_ECDSA_PRIME256V1
      ingress:
        host: "account.${SECRET_DOMAIN_BLOG}"
      additional:
        00-authentik-only:
          # Authentik is the only way to sign in or register: no local passwords
          # to leak, and account lifecycle stays in one place.
          config: |
            passwords:
              enabled: false
        01-upstream-authentik:
          configSecret: matrix-stack-secret
          configSecretKey: mas-upstream-authentik.yaml

    # The ONE Element Web lives in the derekjacobs.dev release and serves
    # chat.${SECRET_DOMAIN_BLOG} too, via a per-host config
    # (kubernetes/apps/matrix/matrix-stack/app/element-web-bluevulpine.yaml).
    elementWeb:
      enabled: false
    elementAdmin:
      enabled: false

    wellKnownDelegation:
      # Only /.well-known/matrix/* is routed on the apex (./httproute.yaml); the
      # apex itself is not handed to Element Web.
      baseDomainRedirect:
        enabled: false

    # Element Call backend (LiveKit SFU + lk-jwt-service). Needs UDP from the
    # internet, which the Cloudflare tunnel cannot carry — rollout step 6, over a
    # Pangolin UDP resource.
    matrixRTC:
      enabled: false
