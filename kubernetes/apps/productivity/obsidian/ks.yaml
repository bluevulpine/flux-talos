---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app obsidian
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: longhorn
      namespace: longhorn-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/productivity/obsidian/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: productivity
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: productivity
      GATUS_PORT: "3000"
      GATUS_SERVICE: obsidian
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      # kopiur (components/kopiur), W2. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H), chosen as
      # VolSync's +5 so the two engines stayed apart during the parallel run.
      KOPIUR_LOCAL_CRON: "17,47 * * * *"
      # R2 pinned to an explicit minute <= :39, not H 2: jitter could spill
      # into hour 03, reserved for kopia-maint-r2 (waves table footnote 2).
      KOPIUR_R2_CRON: "35 2 * * *"
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass

