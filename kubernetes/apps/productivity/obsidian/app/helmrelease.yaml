---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app obsidian
spec:
  chartRef:
    kind: OCIRepository
    name: obsidian
  interval: 1h
  values:
    controllers:
      obsidian:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # The image only chowns .XDG inside its `if [ ! -d ]` branch, so a
          # pre-mounted tmpfs is left root-owned and the abc (568) user cannot
          # create sockets in it. Set ownership/mode here instead.
          init-xdg:
            image:
              repository: public.ecr.aws/docker/library/busybox
              # renovate: datasource=docker depName=public.ecr.aws/docker/library/busybox
              tag: "1.37.0"
            command:
              - sh
              - -c
              - |
                chown 568:568 /config/.XDG
                chmod 700 /config/.XDG
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/obsidian
              # renovate: datasource=docker depName=lscr.io/linuxserver/obsidian
              tag: v1.10.6-ls106
            env:
              TZ: "${TIMEZONE}"
              PUID: "568"
              PGID: "568"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    # Note: linuxserver images run as root internally and use PUID/PGID
    # for file ownership, so we don't set pod security context
    service:
      app:
        controller: obsidian
        ports:
          http:
            port: *port
          https:
            port: 3001
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: productivity
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Obsidian LiveSync"
          gethomepage.dev/group: "Productivity"
          gethomepage.dev/icon: "obsidian.png"
          gethomepage.dev/description: "Notes Sync"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - obsidian.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - name: obsidian
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      # Shared memory required for Electron apps
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      # XDG_RUNTIME_DIR is hardcoded to $HOME/.XDG by the image's
      # init-selkies-config, putting UNIX sockets (obsidian-cli, wayland) on the
      # RWX config PVC. Longhorn re-exports that PVC over NFS, and NFSv4.1
      # readdir returns EINVAL on a directory containing them - which broke the
      # volsync mover for both local and R2 backups. tmpfs keeps sockets off the
      # exported volume, and matches what XDG_RUNTIME_DIR is meant to be.
      xdg:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        globalMounts:
          - path: /config/.XDG

