---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
components:
  - ../../../../components/volsync-claim
  # kopiur backs this PVC up (W2 cutover, docs/runbooks/kopiur-migration.md).
  # volsync-claim stays: it owns the PVC and its (now inert) dataSourceRef.
  - ../../../../components/kopiur

patches:
  # Target by KIND, not name: the component resources are named ${APP} at build
  # time and only become "obsidian" after Flux postBuild substitution, so a name
  # target matches nothing and kustomize silently drops it. Kind-only is safe
  # ONLY while this app has exactly one PersistentVolumeClaim -- re-check if a
  # second claim is ever added.
  - target: {kind: PersistentVolumeClaim}
    patch: |-
      # Pre-bind the claim to the existing Longhorn volume. storageClassName is
      # immutable on a bound PVC, so the move from longhorn-1-replica to
      # longhorn-2-replica re-binds the SAME volume (already live-patched to 2
      # replicas) instead of restoring from backup. TEMPORARY: do not just delete
      # it (kustomize-controller owns the field by SSA; unsetting an immutable
      # field stalls the Kustomization at dry-run) and do not leave it forever (on
      # a rebuilt cluster it names a PV that no longer exists, so the claim stays
      # Pending). Retire it with the `ssa: IfNotPresent` strategic-merge patch in
      # docs/runbooks/volsync-app-namespace-move.md, "Retiring the permanent pin".
      - op: add
        path: /spec/volumeName
        value: pvc-eddd5579-eead-4690-bd78-1feb0f0883c6
