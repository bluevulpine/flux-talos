---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # NextAuth secret for JWT signing
        NEXTAUTH_SECRET: "{{ .Karakeep__NextAuthSecret }}"
        # Meilisearch master key
        MEILI_MASTER_KEY: "{{ .Karakeep__MeiliMasterKey }}"
        # Postgres Init container variables
        INIT_POSTGRES_DBNAME: "{{ .Karakeep__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Karakeep__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Karakeep__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # Database URL for Karakeep
        DATABASE_URL: postgresql://{{ .Karakeep__PostgresUser }}:{{ .Karakeep__PostgresPass }}@${POSTGRES_HOST}:5432/{{ .Karakeep__DbName }}
        # OAuth credentials for Authentik integration
        OAUTH_CLIENT_ID: "{{ .Karakeep__OAuthClientId }}"
        OAUTH_CLIENT_SECRET: "{{ .Karakeep__OAuthClientSecret }}"
        # In-cluster LiteLLM gateway for AI tagging, replacing Azure — that
        # subscription has no credits left and every call returns 401. See
        # hindsight's externalsecret for why this is LiteLLM's MASTER key
        # rather than a per-consumer virtual one.
        #
        # ⚠️ ONE base URL serves BOTH inference slots in the HelmRelease. The
        # text slot is now a Spark model; the image slot is not, because no
        # vision model is served here yet — see INFERENCE_IMAGE_MODEL there.
        OPENAI_API_KEY: "{{ .LiteLLM__MasterKey }}"
        OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: karakeep
    - extract:
        key: litellm

