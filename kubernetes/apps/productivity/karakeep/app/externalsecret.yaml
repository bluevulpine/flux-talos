---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # NextAuth secret for JWT signing
        NEXTAUTH_SECRET: "{{ .Karakeep__NextAuthSecret }}"
        # Meilisearch master key
        MEILI_MASTER_KEY: "{{ .Karakeep__MeiliMasterKey }}"
        # Postgres Init container variables
        INIT_POSTGRES_DBNAME: "{{ .Karakeep__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Karakeep__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Karakeep__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # Database URL for Karakeep
        DATABASE_URL: postgresql://{{ .Karakeep__PostgresUser }}:{{ .Karakeep__PostgresPass }}@${POSTGRES_HOST}:5432/{{ .Karakeep__DbName }}
        # OAuth credentials for Authentik integration
        OAUTH_CLIENT_ID: "{{ .Karakeep__OAuthClientId }}"
        OAUTH_CLIENT_SECRET: "{{ .Karakeep__OAuthClientSecret }}"
        # In-cluster LiteLLM gateway for AI tagging, replacing Azure, whose credits
        # are exhausted (every call returned 401).
        # Per-app LiteLLM VIRTUAL key (secret/litellm, field LiteLLM__Keys__Karakeep), not the
        # master key. It is restricted to the models this app needs, capped at 2
        # parallel requests (the Spark's 8 slots are shared with hindsight's 4), and
        # cannot mint keys or read spend. Virtual keys live in LiteLLM's Postgres,
        # which is CNPG-backed with continuous WAL archiving, so a restore keeps
        # them; only a from-scratch rebuild would invalidate them, and the remedy
        # there is re-minting into OpenBao. Rotate: revoke via /key/delete, mint a
        # new one, `bao kv patch secret/litellm LiteLLM__Keys__Karakeep=...`.
        #
        # One base URL serves BOTH inference slots in the HelmRelease: text runs on
        # spark-gpt-oss-20b, images on spark-qwen25-vl-7b; the key allows both.
        OPENAI_API_KEY: "{{ .LiteLLM__Keys__Karakeep }}"
        OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: karakeep
    - extract:
        key: litellm

