---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
  - ./dnsendpoint.yaml
components:
  - ../../../../components/volsync-claim
  # kopiur backs this PVC up (W2 cutover, docs/runbooks/kopiur-migration.md).
  # volsync-claim stays: it owns the PVC and its (now inert) dataSourceRef.
  - ../../../../components/kopiur

patches:
  # Moving the data claim to longhorn-2-replica WITHOUT a restore: storageClassName
  # is immutable on a bound PVC, so the claim is deleted (PV on Retain) and Flux
  # re-creates it pre-bound to the SAME Longhorn volume (already live-patched to 2
  # replicas). See reference procedure in docs/runbooks/volsync-app-namespace-move.md.
  #  - `ssa: IfNotPresent`: Flux skips the claim while it exists, so git changes to
  #    it never reach the live claim. NEVER remove it while the claim exists
  #    (Flux owns f:volumeName -> immutable stall). Claim edits in git (capacity,
  #    class, labels) are then silently ignored; expand by hand and keep git equal:
  #    kubectl -n productivity patch pvc karakeep -p '{"spec":{"resources":{"requests":{"storage":"<size>"}}}}'
  #  - The temporary `volumeName` pin used for the re-create was dropped once the
  #    swap was done (2026-10-02); a rebuilt cluster now re-creates the claim
  #    unpinned.
  # kopiur app: the claim's dataSourceRef RD is inert; a rebuild restores via
  # kopiur (docs/runbooks/kopiur-migration.md).
  - target:
      kind: PersistentVolumeClaim
      # By NAME: karakeep also has the karakeep-meili claim (app/pvc.yaml). The
      # data claim is literally `${APP}` at build time, so the regex escapes it.
      name: \$\{APP\}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
