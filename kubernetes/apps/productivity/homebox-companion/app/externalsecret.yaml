---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homebox-companion-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # In-cluster LiteLLM gateway, replacing Azure — that subscription has
        # no credits left and every call returns 401. See hindsight's
        # externalsecret for why this is LiteLLM's MASTER key rather than a
        # per-consumer virtual one.
        #
        # ⚠️ This restores the CHAT half only. Item detection from photos needs
        # a vision model and neither Spark model is one — see HBC_LLM_MODEL in
        # the HelmRelease.
        HBC_LLM_API_KEY: "{{ .LiteLLM__MasterKey }}"
        HBC_LLM_API_BASE: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: litellm

