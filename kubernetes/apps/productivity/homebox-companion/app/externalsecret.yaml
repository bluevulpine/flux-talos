---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homebox-companion-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # In-cluster LiteLLM gateway, replacing Azure, whose credits are exhausted
        # (every call returned 401).
        # Per-app LiteLLM VIRTUAL key (secret/litellm, field LiteLLM__Keys__HomeboxCompanion), not the
        # master key. It is restricted to the models this app needs, capped at 2
        # parallel requests (the Spark's 8 slots are shared with hindsight's 4), and
        # cannot mint keys or read spend. Virtual keys live in LiteLLM's Postgres,
        # which is CNPG-backed with continuous WAL archiving, so a restore keeps
        # them; only a from-scratch rebuild would invalidate them, and the remedy
        # there is re-minting into OpenBao. Rotate: revoke via /key/delete, mint a
        # new one, `bao kv patch secret/litellm LiteLLM__Keys__HomeboxCompanion=...`.
        #
        # The app's single model slot is the vision model (see HBC_LLM_MODEL in the
        # HelmRelease), so the key allows spark-qwen25-vl-7b as well as gpt-oss.
        HBC_LLM_API_KEY: "{{ .LiteLLM__Keys__HomeboxCompanion }}"
        HBC_LLM_API_BASE: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: litellm

