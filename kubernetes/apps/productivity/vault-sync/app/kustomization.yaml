---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: vault-sync-scripts
    files:
      - commit.sh=./resources/commit.sh
      - known_hosts=./resources/known_hosts
      - passwd=./resources/passwd
    options:
      annotations:
        # commit.sh is shell: Flux postBuild envsubst would rewrite its ${...}
        # expansions at build time (e.g. ${MAX_DELETIONS:-25} -> 25).
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
