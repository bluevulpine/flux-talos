---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name vault-sync-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # ed25519 key whose public half is deploy key "vault-sync" (write access)
        # on Gitea repo bluevulpine/obsidian-vault.
        # Block scalar: the rendered key always ends in exactly one newline,
        # which OpenSSH requires, however the value was written to OpenBao.
        id_ed25519: |
          {{ .VaultSync__SshPrivateKey | trim }}
        # Syncthing GUI login, applied by the syncthing init container.
        STGUI_USER: "{{ .VaultSync__GuiUser }}"
        STGUI_PASSWORD: "{{ .VaultSync__GuiPassword }}"
  dataFrom:
    - extract:
        key: vault-sync
