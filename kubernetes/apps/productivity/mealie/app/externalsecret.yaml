---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mealie-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .Mealie__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Mealie__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Mealie__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # Database configuration
        DB_ENGINE: postgres
        POSTGRES_URL_OVERRIDE: postgresql://{{ .Mealie__PostgresUser }}:{{ .Mealie__PostgresPass }}@${POSTGRES_HOST}:5432/{{ .Mealie__DbName }}
        # OIDC configuration
        OIDC_CLIENT_ID: "{{ .Mealie__OidcClientId }}"
        OIDC_CLIENT_SECRET: "{{ .Mealie__OidcClientSecret }}"
        # No OPENAI_* here, deliberately. Mealie's AI provider is configured in
        # its own admin settings (LiteLLM: spark-main for text,
        # spark-main-vision for images, spark-stt for audio; set 2026-10-05) and
        # ignores these
        # env vars. They pointed at Azure OpenAI, whose credits are exhausted.
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: mealie

