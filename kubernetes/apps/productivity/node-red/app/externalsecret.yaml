---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name node-red-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Credential secret for encrypting credentials in flows
        NODE_RED_CREDENTIAL_SECRET: "{{ .Nodered__CredentialSecret }}"
        # In-cluster LiteLLM gateway (for OpenAI nodes and custom
        # integrations), replacing Azure — that subscription has no credits left
        # and every call returns 401. See hindsight's externalsecret for why
        # this is LiteLLM's MASTER key rather than a per-consumer virtual one.
        #
        # ⚠️ Only reaches flows that read these env vars (e.g. via $(OPENAI_*)
        # substitution or a function node). Any node with credentials baked into
        # the flow file keeps its own endpoint and must be repointed in the
        # Node-RED editor.
        OPENAI_API_KEY: "{{ .LiteLLM__MasterKey }}"
        OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: nodered
    - extract:
        key: litellm

