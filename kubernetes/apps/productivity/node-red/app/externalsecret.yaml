---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name node-red-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Credential secret for encrypting credentials in flows
        NODE_RED_CREDENTIAL_SECRET: "{{ .Nodered__CredentialSecret }}"
        # In-cluster LiteLLM gateway (OpenAI nodes, custom integrations), replacing
        # Azure, whose credits are exhausted (every call returned 401).
        # Per-app LiteLLM VIRTUAL key (secret/litellm, field LiteLLM__Keys__NodeRed), not the
        # master key. It is restricted to the models this app needs, capped at 2
        # parallel requests (the Spark's 8 slots are shared with hindsight's 4), and
        # cannot mint keys or read spend. Virtual keys live in LiteLLM's Postgres,
        # which is CNPG-backed with continuous WAL archiving, so a restore keeps
        # them; only a from-scratch rebuild would invalidate them, and the remedy
        # there is re-minting into OpenBao. Rotate: revoke via /key/delete, mint a
        # new one, `bao kv patch secret/litellm LiteLLM__Keys__NodeRed=...`.
        #
        # ⚠️ Only reaches flows that read these env vars (e.g. via $(OPENAI_*)
        # substitution or a function node). Any node with credentials baked into
        # the flow file keeps its own endpoint and must be repointed in the
        # Node-RED editor.
        OPENAI_API_KEY: "{{ .LiteLLM__Keys__NodeRed }}"
        OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: nodered
    - extract:
        key: litellm

