---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Two OpenBao keys are combined:
#
#   tapestry        - this app's own role. Fields Derek mints with
#                     `bao kv patch` (never `put`, which wipes sibling fields):
#                       Postgres__User, Postgres__Password
#   cloudnative-pg  - the Postgres superuser password, used only by the
#                     postgres-init init container to create the database.
#                     Its fields are Postgres__Host, Postgres__Username and
#                     Postgres__SuperPassword, so nothing collides with the
#                     two Postgres__User/Password fields above (checked
#                     2026-11-07, names only).
#
# INIT_POSTGRES_SUPER_PASS lives in this Secret, so ONLY the 01-init-db init
# container may envFrom it. The app and migrate read the five TF_DB_* keys one
# by one (see helmrelease.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name tapestry-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # PostgreSQL bootstrap, consumed by the postgres-init init container.
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_DBNAME: tapestry
        INIT_POSTGRES_USER: "{{ .Postgres__User }}"
        INIT_POSTGRES_PASS: "{{ .Postgres__Password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"

        # The app's connection, as parts rather than a URL: no percent-encoding
        # trouble when the password contains characters like %.
        TF_DB_HOST: ${POSTGRES_HOST}
        TF_DB_PORT: "5432"
        TF_DB_NAME: tapestry
        TF_DB_USER: "{{ .Postgres__User }}"
        TF_DB_PASSWORD: "{{ .Postgres__Password }}"
  dataFrom:
    - extract:
        key: tapestry
    - extract:
        key: cloudnative-pg
