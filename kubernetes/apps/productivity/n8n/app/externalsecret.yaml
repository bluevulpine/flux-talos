---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name n8n-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # n8n database configuration
        DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: "{{ .N8n__DbName }}"
        DB_POSTGRESDB_USER: "{{ .N8n__PostgresUser }}"
        DB_POSTGRESDB_PASSWORD: "{{ .N8n__PostgresPass }}"
        # n8n encryption key for workflow credentials
        N8N_ENCRYPTION_KEY: "{{ .N8n__EncryptionKey }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .N8n__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .N8n__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .N8n__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # In-cluster LiteLLM gateway (for Code nodes and custom integrations),
        # replacing Azure — that subscription has no credits left and every call
        # returns 401. Same base URL and key as hindsight; see that app's
        # externalsecret for why this is the MASTER key rather than a virtual
        # one (virtual keys live only in LiteLLM's Postgres, so they would
        # silently die if that database were rebuilt and nothing in git would
        # explain why).
        #
        # ⚠️ These env vars only reach n8n **Code nodes** that read
        # process.env directly. Credentials attached to OpenAI/LangChain nodes
        # are stored in n8n's own database, encrypted with N8N_ENCRYPTION_KEY,
        # and are NOT affected by this change — those must be repointed in the
        # n8n UI or they keep calling the dead Azure endpoint.
        OPENAI_API_KEY: "{{ .LiteLLM__MasterKey }}"
        OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: n8n
    - extract:
        key: litellm

