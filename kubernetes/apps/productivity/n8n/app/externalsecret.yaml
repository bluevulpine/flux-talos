---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name n8n-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # n8n database configuration
        DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: "{{ .N8n__DbName }}"
        DB_POSTGRESDB_USER: "{{ .N8n__PostgresUser }}"
        DB_POSTGRESDB_PASSWORD: "{{ .N8n__PostgresPass }}"
        # n8n encryption key for workflow credentials
        N8N_ENCRYPTION_KEY: "{{ .N8n__EncryptionKey }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .N8n__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .N8n__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .N8n__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # In-cluster LiteLLM gateway (Code nodes, custom integrations), replacing
        # Azure, whose credits are exhausted (every call returned 401).
        # Per-app LiteLLM VIRTUAL key (secret/litellm, field LiteLLM__Keys__N8n), not the
        # master key. It is restricted to the models this app needs, capped at 2
        # parallel requests (the Spark's 8 slots are shared with hindsight's 4), and
        # cannot mint keys or read spend. Virtual keys live in LiteLLM's Postgres,
        # which is CNPG-backed with continuous WAL archiving, so a restore keeps
        # them; only a from-scratch rebuild would invalidate them, and the remedy
        # there is re-minting into OpenBao. Rotate: revoke via /key/delete, mint a
        # new one, `bao kv patch secret/litellm LiteLLM__Keys__N8n=...`.
        #
        # ⚠️ These env vars only reach n8n **Code nodes** that read
        # process.env directly. Credentials attached to OpenAI/LangChain nodes
        # are stored in n8n's own database, encrypted with N8N_ENCRYPTION_KEY,
        # and are NOT affected by this change — those must be repointed in the
        # n8n UI or they keep calling the dead Azure endpoint.
        OPENAI_API_KEY: "{{ .LiteLLM__Keys__N8n }}"
        OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: n8n
    - extract:
        key: litellm

