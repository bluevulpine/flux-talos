---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homebox-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Postgres Init container variables
        INIT_POSTGRES_DBNAME: "{{ .Homebox__DbName }}"
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .Homebox__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Homebox__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # Database configuration for Homebox
        HBOX_DATABASE_HOST: postgres16-rw.database.svc.cluster.local
        HBOX_DATABASE_PORT: "5432"
        HBOX_DATABASE_USERNAME: "{{ .Homebox__PostgresUser }}"
        HBOX_DATABASE_PASSWORD: "{{ .Homebox__PostgresPass }}"
        HBOX_DATABASE_DATABASE: "{{ .Homebox__DbName }}"
        # OIDC credentials for Authentik integration
        HBOX_OIDC_CLIENT_ID: "{{ .Homebox__OAuthClientId }}"
        HBOX_OIDC_CLIENT_SECRET: "{{ .Homebox__OAuthClientSecret }}"
        # API-key pepper — homebox ≥ the current build panics on startup without
        # it ("auth.api_key_pepper must be set to at least 32 bytes"). Generated
        # with `openssl rand -base64 48`; rotating it invalidates all issued API
        # keys, so it is set once and left stable in OpenBao.
        HBOX_AUTH_API_KEY_PEPPER: "{{ .Homebox__AuthApiKeyPepper }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: homebox

