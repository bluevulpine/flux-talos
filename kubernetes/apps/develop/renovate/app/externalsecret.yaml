---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name renovate-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # PAT of the `renovate` Gitea bot user. Scopes: repository read/write,
        # issue read/write, organization read, user read.
        RENOVATE_TOKEN: "{{ .Renovate__Gitea__Token }}"
        # Read-only GitHub token, used only for lookups: ghcr/GitHub release
        # datasources and changelogs. Without it github.com rate-limits
        # anonymous lookups after 60 requests an hour and PRs lose their
        # release notes. It is never given write access to anything.
        RENOVATE_GITHUB_COM_TOKEN: "{{ .Renovate__Github__Token }}"
  dataFrom:
    - extract:
        key: renovate
