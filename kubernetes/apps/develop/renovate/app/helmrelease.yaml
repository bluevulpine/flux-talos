---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Self-hosted Renovate for the repos on Gitea (gitea.derekjacobs.dev). This
# repo is NOT one of them: flux-talos lives on GitHub and is handled by the
# hosted Renovate app there, configured in .renovaterc.json5. Nothing here
# touches or duplicates that.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    controllers:
      renovate:
        type: cronjob
        cronjob:
          # Hourly, off the top of the hour. Forbid, because two runs against
          # one repo race each other's branch force-pushes.
          schedule: "23 * * * *"
          concurrencyPolicy: Forbid
          # A run is a few minutes; anything near an hour is hung, and would
          # otherwise block every later run under Forbid.
          activeDeadlineSeconds: 3000
          # No retries: the next hourly run is the retry, and a retry of a
          # half-finished run only repeats its failure against the API.
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              # Renovate ships near-daily. flux-talos's own Renovate bumps this
              # tag; spark-setup's renovate.json uses managerFilePatterns, so
              # this must stay >= 41.
              repository: ghcr.io/renovatebot/renovate
              tag: 44.239.1
            env:
              TZ: "${TIMEZONE}"
              LOG_LEVEL: info
              RENOVATE_PLATFORM: gitea
              RENOVATE_ENDPOINT: https://gitea.derekjacobs.dev/api/v1
              # Autodiscover, gated by Gitea access rather than by a list in this
              # public repo. Plain autodiscover asks Gitea for the repos the bot
              # owns or collaborates on (`repos/search?uid=<bot>`), so being able
              # to READ a public repo does not enrol it. Enrolling a repo means
              # granting `renovate` write on it; Renovate then opens an onboarding
              # PR, and merging that PR is the opt-in, recorded in that repo's own
              # history. Grant per repo, as a collaborator with write: that
              # search also matches a read-only grant (Renovate then fails on the
              # repo every hour) and every repo of any org team the bot joins, so
              # never put `renovate` in a team. Never set
              # RENOVATE_AUTODISCOVER_NAMESPACES either: that lists every repo in
              # the org whether or not the bot was granted it.
              # The filter keeps a grant outside bvn-homelab (a personal repo, a
              # fork) out of scope; Gitea pull mirrors are skipped by Renovate.
              RENOVATE_AUTODISCOVER: "true"
              RENOVATE_AUTODISCOVER_FILTER: "bvn-homelab/*"
              # Repos must carry their own renovate.json. Without one Renovate
              # opens an onboarding PR and changes nothing else.
              RENOVATE_ONBOARDING: "true"
              RENOVATE_REQUIRE_CONFIG: required
              # The onboarding PR proposes the shared homelab preset, so a newly
              # enrolled repo starts with the grouping and automerge policy in
              # bvn-homelab/renovate-config instead of Renovate's defaults. That
              # repo has to exist, and be readable by the bot, before anything
              # new is enrolled; a missing preset fails the onboarding PR.
              RENOVATE_ONBOARDING_CONFIG: '{"extends":["local>bvn-homelab/renovate-config"]}'
              RENOVATE_TIMEZONE: "${TIMEZONE}"
              # Cold runs, no cache volume. Renovate's caches (repository and
              # package lookups) only save time, never correctness; one repo ran
              # in 32-72 s cold (2026-11-04). A PVC would buy little and cost a
              # Longhorn volume plus its backup wiring. If enrolled repos grow
              # until runs near the 50-minute deadline, move RENOVATE_CACHE_DIR onto
              # a small longhorn-1-replica claim and set
              # RENOVATE_REPOSITORY_CACHE: enabled.
              RENOVATE_BASE_DIR: /tmp/renovate
              RENOVATE_CACHE_DIR: /tmp/renovate/cache
              # The image's HOME (/home/ubuntu) is on the read-only root, and git
              # and the package managers write dotfiles there (~/.gitconfig,
              # ~/.npm). PATH still lists /home/ubuntu/bin explicitly, so moving
              # HOME does not hide the image's own tools. HOME is the emptyDir's
              # own mount point because nothing creates a subdirectory of it
              # before Renovate starts, and `git config --global` fails on a
              # missing HOME instead of creating it.
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: renovate-secret
            securityContext:
              allowPrivilegeEscalation: false
              # Verified with this image: Renovate starts, initialises its
              # tools and runs with only /tmp writable.
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # The image's own `ubuntu` user.
        runAsUser: 12021
        runAsGroup: 12021
        fsGroup: 12021
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
