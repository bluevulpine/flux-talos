---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gitea
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster18
      namespace: database
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/develop/gitea/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: develop
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: develop
      GATUS_PORT: "3000"
      GATUS_SERVICE: gitea-http
      GATUS_SUBDOMAIN: gitea
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_STORAGECLASS: tns-csi-nfs
      # kopiur (components/kopiur), the only backup since the W7 cutover. These
      # vars landed one PR BEFORE the component so the SnapshotSchedules were
      # created with these crons, not the component's defaults (runbook trap: a
      # cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H). Chosen to keep
      # VolSync's old :18/:48 out of the 20m forward-jitter windows during the
      # parallel run (runbook footnote 1): +6, as +5 (:23) is paperclip's.
      KOPIUR_LOCAL_CRON: "24,54 * * * *"
      # H picks a minute; the hour matches VolSync's old R2 run.
      KOPIUR_R2_CRON: "H 1 * * *"
      # Direct, as under VolSync. Repos are git's own files, written
      # atomically; the LevelDB queue (queues/common) is transient.
      # The volume is tns-csi-nfs RWX, so the mover co-mounts it with no
      # staged clone, which keeps it clear of tns-csi's non-idempotent
      # CreateVolume (runbook Sequence step 7).
      KOPIUR_COPYMETHOD: Direct
