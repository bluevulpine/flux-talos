---
apiVersion: v1
kind: Namespace
metadata:
  name: develop
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # kopiur refuses root movers (PrivilegedMoverNotPermitted) without this; see docs/runbooks/kopiur-migration.md
    kopiur.home-operations.com/privileged-movers: "true"
  labels:
    name: develop
    # Changed from 'restricted' to 'privileged' for Nexus's root chownDataDir init
    # container. Nexus is gone (2026-11-13, replaced by zot on the NAS), but drone and
    # dev-shell have run here under 'privileged' since; audit them before tightening.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
