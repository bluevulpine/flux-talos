---
apiVersion: v1
kind: Service
metadata:
  name: dev-shell
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "dev-shell"
  labels:
    app.kubernetes.io/name: dev-shell
    app.kubernetes.io/instance: dev-shell
    tailscale.com/proxy-class: "tun-access"
spec:
  type: ClusterIP
  ports:
    # Service port 22 so clients use plain `ssh bluevulpine@dev-shell`; sshd itself
    # stays on 2222 in the pod (the `ssh` container port), so the container never
    # needs a privileged-port bind.
    - port: 22
      targetPort: ssh
      protocol: TCP
      name: ssh
  selector:
    app.kubernetes.io/name: dev-shell
    app.kubernetes.io/instance: dev-shell
