---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/serviceaccount-v1.json
# Dedicated identity for the dev-shell pod. It used to run as `default`, which
# gitea and drone-server share, so any binding to `default` would have leaked to
# them. Bindings to this SA live with the namespace they grant access in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-shell
