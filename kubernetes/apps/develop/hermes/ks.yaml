---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/develop/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: develop
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: develop
      GATUS_PORT: "9119"
      GATUS_SERVICE: hermes
      VOLSYNC_CAPACITY: 20Gi
      # Agent state: config, .env, SOUL.md, sessions, memories, skills, cron.
      # Hourly local, nightly R2 — it accretes slowly but is expensive to lose.
      VOLSYNC_LOCAL_SCHEDULE: "23 * * * *"
      # 06:29, extending the documented 8-minute grid past #1736's slots:
      # 06:13 (timescaledb) -> 06:21 (maintainerr) -> 06:29. Hour 03 stays
      # reserved for kopiamaintenance-r2 ("0 3 * * *").
      #
      # It was 06:05, which collided EXACTLY with media/bazarr and media/radarr,
      # whose VOLSYNC_LOCAL_SCHEDULE is "5 */2 * * *" and "5 * * * *". Measured
      # by expanding every cron in the repo: that was the only exact local/R2
      # collision left on main, one day after #1736 cleared eleven of them.
      #
      # The trap is worth naming because the note this replaces fell into it:
      # checking a new R2 slot against the other R2 slots is not enough. The
      # grid in components/volsync/r2.yaml spaces R2 sources from each OTHER and
      # never modelled local movers, which run hourly on a ~2-minute pitch --
      # which is exactly how the eleven arose. Minute 29 is free of every local
      # AND every R2 source in every hour.
      #
      # Low severity, stated so it is not over-read: all three apps are on
      # longhorn-snapclass, not tns-csi, so this never touched the CreateVolume
      # path the grid exists to protect.
      #
      # The wider problem -- 44 sources in a window sized for ~40, with 02:17
      # still off-grid -- is not this app's to fix.
      VOLSYNC_R2_SCHEDULE: "29 6 * * *"
      # Node-local single replica: dataLocality best-effort keeps the replica on
      # the pod's node without the hard pin of strict-local, so a Talos drain can
      # still move the agent and rebuild locally. VolSync provides the redundancy.
      VOLSYNC_STORAGECLASS: longhorn-1-replica-local
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      # RWO + Snapshot: the mover cannot co-mount an RWO volume the agent holds,
      # and a Direct copy would read a live SQLite state.db mid-write.
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      VOLSYNC_COPYMETHOD: Snapshot
