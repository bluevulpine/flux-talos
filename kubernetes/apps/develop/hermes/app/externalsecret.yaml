---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # LLM provider. The TrueNAS catalog app has no field for this at all —
        # a gateway with no provider key starts and then cannot think.
        ANTHROPIC_API_KEY: "{{ .Hermes__AnthropicApiKey }}"
        # Public PKCE client registered in Authentik (no client secret: the
        # self_hosted OIDC plugin does not support confidential clients).
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .Hermes__OidcClientId }}"
        # Belt-and-braces on a loopback-only listener.
        API_SERVER_KEY: "{{ .Hermes__ApiServerKey }}"
  dataFrom:
    - extract:
        key: hermes
