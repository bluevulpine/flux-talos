---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Public PKCE client registered in Authentik. The self_hosted OIDC
        # plugin does not support confidential clients, so there is no secret.
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .Hermes__OidcClientId }}"
        # Belt-and-braces on a listener already bound to container loopback.
        API_SERVER_KEY: "{{ .Hermes__ApiServerKey }}"
  dataFrom:
    - extract:
        key: hermes
