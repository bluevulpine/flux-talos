---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# GENERATED SHAPE — 9 namespaces x 2 legs. Edit the generator intent here, not
# one copy: every block is identical but for `namespace` and the leg.
#
# WHY PER-NAMESPACE, rather than kopiur's own credentialProjection: a mover Job
# reads its repository credential with `envFrom`, which is namespace-local, so
# the Secret must exist in each consuming namespace. kopiur can copy it there
# itself (spec.credentialProjection.allowed), but those copies are not managed
# by ESO — an OpenBao rotation would update the source and leave the projected
# copies to kopiur's own refresh. Minting them with ExternalSecrets keeps
# "secrets come exclusively from OpenBao via ExternalSecret" true, and makes
# rotation a single `bao kv patch` that propagates everywhere.
#
# These pull the SAME OpenBao keys the VolSync component uses. The kopia
# repository password MUST match — it is the repository's encryption key and a
# different value cannot decrypt the snapshots being adopted. The Secret OBJECT
# is new, so nothing is "reused in place"; the Garage/R2 access keys can be
# rotated later as an independent step without touching KOPIA_PASSWORD.
#
# Note there is no KOPIA_REPOSITORY here, unlike the VolSync secrets: bucket,
# prefix and endpoint are fields on the ClusterRepository, not env vars.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-local
  namespace: kopiur-system
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: kopiur-local-secret
    template:
      engineVersion: v2
      data:
        KOPIA_PASSWORD: "{{ .VolSync__Local__KopiaPassword }}"
        AWS_ACCESS_KEY_ID: "{{ .VolSync__Local__AwsAccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .VolSync__Local__AwsSecretKey }}"
  dataFrom:
    - extract:
        key: volsync-local-template
---
