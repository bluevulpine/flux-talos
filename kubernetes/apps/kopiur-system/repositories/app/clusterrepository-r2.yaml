---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopia-r2
spec:
  # Adoption, as with kopia-local: no `create` block, same bucket root the
  # fork has been writing to. See clusterrepository-local.yaml for the full
  # reasoning on every field that is shared between the two.
  backend:
    s3:
      bucket: kopia
      # ${SECRET_CLOUDFLARE_ACCOUNT_ID} comes from the cluster-secrets Secret
      # via the cluster-apps postBuild substituteFrom, exactly as
      # openbao/snapshot-cronjob.yaml builds the same host. It is substituted
      # by Flux at reconcile time — NEVER `kustomize build | kubectl apply`
      # this directory, which skips envsubst and would publish the literal
      # string as a hostname.
      endpoint: ${SECRET_CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      auth:
        secretRef:
          name: kopiur-r2-secret
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-r2-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  allowedNamespaces:
    list:
      - ai
      - database
      - develop
      - download
      - games
      - home
      - identity
      # Not a backup consumer: the managed Maintenance lives here. Without it
      # the webhook rejects the Maintenance ("kopiur-system is not in the
      # allowedNamespaces"), which left kopia-r2 with
      # MaintenanceConfigured=False from 2026-09-22 until this was added.
      - kopiur-system
      - matrix
      - matrix-bluevulpine
      - media
      - productivity
  # NO spec.parameters.epoch here, and unlike kopia-local this one does not
  # need it later either. The R2 repository takes ~1.8 writes/hour (46 sources
  # x 1/day) against the local repository's ~97, and 0 of 44 sampled R2 mover
  # logs have ever carried the "too many index blobs" warning — a measured
  # negative, not missing data: all 44 had populated logs.
  catalog:
    # Ignore, as on kopia-local; the reasoning is there.
    adoption: Ignore
    retain:
      perIdentity: 50
      maxAgeDays: 120
  maintenance:
    # kopiur owns maintenance since the VolSync decommission (runbook step 3),
    # replacing the fork's kopia-maintenance-r2 in the same change. Force:
    # see kopia-local; revert to Never once kopiur holds the lease.
    enabled: true
    takeoverPolicy: Force
    schedule:
      # The fork's slot: one full run a day at 03:00 UTC, the hour the R2
      # backup crons keep clear (components/kopiur/r2.yaml). Quick on the same
      # cron, so the full run covers it: no extra 6-hourly quick runs landing
      # in the 00-06 backup hours. No epoch tuning here (kopia defaults).
      quick:
        cron: "0 3 * * *"
      full:
        cron: "0 3 * * *"
    mover:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
      # Non-root for the same reason as kopia-local (see there).
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
    failurePolicy:
      activeDeadlineSeconds: 10800
  moverDefaults:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    podSecurityContext:
      fsGroup: 0
      fsGroupChangePolicy: OnRootMismatch
    cache:
      # Same bound as kopia-local; the reasoning is there. Changes nothing
      # today (R2 index 184 MB, its caches <= 1.8 GB against a 5,000 MiB
      # default) and stops them growing to it.
      metadataCacheSizeMb: 2048
  scheduleDefaults:
    jitter: 20m
