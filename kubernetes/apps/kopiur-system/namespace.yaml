---
apiVersion: v1
kind: Namespace
metadata:
  name: kopiur-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # ENFORCE baseline, WARN/AUDIT restricted.
    #
    # This was enforce: restricted, reasoned from kopiur's own Deployments
    # (controller + webhook, both non-root and fully hardened; still true, and
    # restricted is still warned/audited so they stay visible if that changes).
    # The premise that movers "run in the workload's own namespace, not here"
    # held for the namespaced pilot Repository, but not for ClusterRepository:
    # its repository-level Jobs (catalog discovery/bootstrap) run HERE, and
    # they inherit ClusterRepository.moverDefaults, which is root (runAsUser 0)
    # to match VolSync's movers. kopiur has no per-job override for discovery,
    # only for maintenance. On 2026-09-22 every kopia-{local,r2}-discovery pod
    # was rejected at admission ("runAsUser=0 ... violates restricted") until
    # this changed. Loud, as the old comment predicted; nothing ran.
    #
    # Baseline over the alternative (dropping moverDefaults root): app backups
    # pin root per SnapshotPolicy anyway, but Restores inherit moverDefaults,
    # and a non-root restore mover silently re-owns root-owned files. See
    # docs/runbooks/kopiur-migration.md. The hardened mover baseline (drop
    # ALL, seccomp RuntimeDefault, no privilege escalation) still applies.
    #
    # Still stricter than volsync-system, which runs privileged.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
