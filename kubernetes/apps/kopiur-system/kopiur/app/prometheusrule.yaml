---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kopiur-local
spec:
  groups:
    - name: kopiur-local.rules
      rules:
        # The chart's rules can't see a backup that never runs.
        # KopiurBackupStale needs either a past success or
        # consecutive_failures > 0, and a refused Snapshot has neither: it
        # stays Pending, not Failed, and with concurrencyPolicy: Forbid it also
        # blocks every later slot of that schedule. That hid W0's
        # PrivilegedMoverNotPermitted refusals for ~21 h (2026-09-23/24,
        # docs/runbooks/kopiur-migration.md traps). Backtested over that window:
        # both rules below fire on exactly those four Snapshots and on nothing
        # else in 3 days (normal Snapshots are Pending for ~2.5 min).
        #
        # Refused and still waiting: names the reason directly. The refusal
        # counter is per Snapshot and outlives it, so it is joined against the
        # Snapshot still being Pending; a refused Snapshot that is later
        # admitted (as W0's were) resolves on its own.
        - alert: KopiurSnapshotRefused
          annotations:
            summary: >-
              kopiur refused Snapshot {{ $labels.namespace }}/{{ $labels.name }}
              ({{ $labels.reason }}) and it is still Pending, so no backup runs
              for its schedule. For PrivilegedMoverNotPermitted, the namespace
              needs kopiur.home-operations.com/privileged-movers: "true".
          expr: |
            max by (namespace, name, reason) (kopiur_snapshot_refusals_total) > 0
              and on (namespace, name)
            (kopiur_resource_phase{kind="Snapshot", phase="Pending"} == 1)
          for: 10m
          labels:
            severity: critical

        # Stuck for any other reason: a staging wait is bounded by
        # spec.staging.timeout (10m default, 30m for plex and jellyfin), so an
        # hour in Pending is never normal.
        - alert: KopiurSnapshotStuckPending
          annotations:
            summary: >-
              Snapshot {{ $labels.namespace }}/{{ $labels.name }} (policy
              {{ $labels.policy }}) has been Pending for over an hour; with
              concurrencyPolicy Forbid its schedule fires nothing else until it
              clears. `kubectl -n {{ $labels.namespace }} describe
              snapshots.kopiur.home-operations.com {{ $labels.name }}`.
          expr: |
            max by (namespace, name, policy) (kopiur_resource_phase{kind="Snapshot", phase="Pending"}) == 1
          for: 1h
          labels:
            severity: warning

        # Stuck while running: a mover that hangs (e.g. on an NFS mount) holds
        # its schedule under concurrencyPolicy Forbid until the Job's 48h
        # deadline, and KopiurBackupStale only fires at 48h too, so nothing
        # saw plex-local stall for 48h (2026-10-08..10). Backtested over 7 days:
        # the longest normal run was 70 min (mealie), plex's 25-30 min; only
        # that stalled run (2,880 min) crosses 2h.
        - alert: KopiurSnapshotStuckRunning
          annotations:
            summary: >-
              Snapshot {{ $labels.namespace }}/{{ $labels.name }} (policy
              {{ $labels.policy }}) has been Running for over two hours; with
              concurrencyPolicy Forbid its schedule fires nothing else until it
              ends. Check the mover pod's logs and its staged volume's mount.
          expr: |
            max by (namespace, name, policy) (kopiur_resource_phase{kind="Snapshot", phase="Running"}) == 1
          for: 2h
          labels:
            severity: warning
    - name: kopiur-replication.rules
      rules:
        # A failed replication Job already pages through the stock
        # KubeJobFailed. This catches the quiet case: no run at all (suspended
        # CR, refused by the webhook, parked waiting for a slot, operator down).
        # kopiur exports only a run counter with no CR label, so this keys off
        # kube-state-metrics: completion_time is set only on a SUCCEEDED Job,
        # and its VALUE is when it completed.
        #
        # Two branches. kopiur reaps replication Jobs 1h after they finish, so
        # today the series simply vanishes and absent_over_time does the work.
        # The age branch keeps the rule right if Jobs are ever retained longer
        # (a ttlSecondsAfterFinished override), where a stale Job would
        # otherwise keep the series present forever. Both branches are max()ed
        # to the same empty label set so `or` yields ONE alert instance whose
        # `for` timer carries across the hand-off between them; unwrapped, the
        # absent branch keeps {namespace} and becomes a second instance that
        # fires after the first resolves, mid-outage.
        #
        # 40h, not 48h: rules run against Prometheus's 2-day local window, and
        # a daily cron that misses one run is ~48h old by its next slot. Pages
        # ~52h after the last good mirror. The first seed is started by hand on
        # deploy (run-requested annotation); if it has not succeeded within 12h,
        # this pages, which is the right signal for a broken seed.
        - alert: KopiurReplicationPinasStale
          annotations:
            summary: >-
              The kopia-local mirror to pinas (RepositoryReplication
              kopiur-system/kopia-local-to-pinas) has not completed a run in
              over 40h. `kubectl -n kopiur-system describe
              repositoryreplications.kopiur.home-operations.com
              kopia-local-to-pinas`.
          expr: |
            (
              time() - max(max_over_time(kube_job_status_completion_time{namespace="kopiur-system", job_name=~"kopia-local-to-pinas-.*"}[2d])) > 40 * 3600
            )
            or
            max(absent_over_time(kube_job_status_completion_time{namespace="kopiur-system", job_name=~"kopia-local-to-pinas-.*"}[40h]))
          for: 12h
          labels:
            severity: warning
