---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  maxHistory: 3
  install:
    # kopiur ships its 9 CRDs in the chart's `crds/` directory, which Helm
    # installs once and NEVER touches on upgrade - there is no chart toggle for
    # it. CreateReplace makes Flux apply schema changes on every reconcile.
    #
    # This is not cosmetic. Upstream docs/install.md: when a release adds a spec
    # field and the apiserver still runs the old schema, it PRUNES that field
    # out of every object silently - the object admits cleanly, `kubectl get -o
    # yaml` shows no trace, and the feature simply never happens. On an alpha
    # CRD that moves between patch releases, that is the likeliest way this ends
    # up quietly not doing what the manifests say.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # webhook.tls.mode defaults to `self`: the operator mints its own CA and
    # serving cert, injects the caBundle and rotates it. cert-manager is
    # available in this cluster but adds a dependency for no benefit here.
    replicaCount: 1
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
