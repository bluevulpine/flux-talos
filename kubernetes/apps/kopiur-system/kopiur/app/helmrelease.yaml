---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # webhook.tls.mode defaults to `self`: the operator mints its own CA and
    # serving cert, injects the caBundle and rotates it. cert-manager is
    # available in this cluster but adds a dependency for no benefit here.
    replicaCount: 1
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
    # Controller metrics + the chart's alerts, from W0 on (backup success,
    # staleness, repository phase, breaker). Prometheus selects every
    # ServiceMonitor/PrometheusRule here (*SelectorNilUsesHelmValues: false),
    # so no extra labels. NOT covered by any of the 122 metrics: the
    # index-blob count behind the epoch decision; it lives only in
    # ClusterRepository.status.storageStats.indexBlobCount (see the runbook).
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
