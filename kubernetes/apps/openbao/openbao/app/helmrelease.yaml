---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: 0.30.2
      sourceRef:
        kind: HelmRepository
        name: openbao
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    global:
      # TLS terminated at the Envoy Gateway; pods communicate in plaintext internally
      tlsDisable: true

    server:
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          # Uses pod name as the Raft node ID for stable cluster membership
          setNodeId: true
          config: |
            ui = true

            # Required when running as non-root; containers cannot lock memory pages
            disable_mlock = true

            listener "tcp" {
              tls_disable     = 1
              address         = "[::]:8200"
              cluster_address = "[::]:8201"
              telemetry {
                unauthenticated_metrics_access = "true"
              }
            }

            storage "raft" {
              path = "/openbao/data"
              retry_join {
                leader_api_addr = "http://openbao-0.openbao-internal:8200"
              }
              retry_join {
                leader_api_addr = "http://openbao-1.openbao-internal:8200"
              }
              retry_join {
                leader_api_addr = "http://openbao-2.openbao-internal:8200"
              }
            }

            # Static auto-unseal: key read from SOPS-managed Secret mounted as a file.
            # Key format: base64-encoded 32 bytes — generate with: openssl rand -base64 32
            # Rotate by adding previous_key_id/previous_key alongside current_key_id/current_key.
            # Path: extraVolumes type:secret mounts at /openbao/userconfig/<name>/
            seal "static" {
              current_key_id = "homelab-unseal-1"
              current_key    = "file:///openbao/userconfig/openbao-unseal/current_key"
            }

            # Enables pod-label-based leader discovery and health check annotations
            service_registration "kubernetes" {}

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

      dataStorage:
        enabled: true
        size: 10Gi
        # 3-replica 'longhorn' class, not longhorn-1-replica: Raft replication does
        # not help when the storage of two members is co-located. With 1 replica,
        # two of the three volumes had their only copy on the same node, so a
        # single node reboot could cost quorum. Longhorn's drain-policy blocks
        # make node reboots a routine event here, so this was a matter of when.
        # Spreading replicas one per node makes any single-node loss survivable.
        #
        # A PVC's storageClassName and a StatefulSet's volumeClaimTemplates are
        # immutable, so the existing PVCs keep the old class NAME even though
        # their live Longhorn volumes were already patched to 3 replicas
        # (2026-09-29). This value only affects newly created PVCs.
        storageClass: longhorn
        accessMode: ReadWriteOnce

      auditStorage:
        enabled: true
        size: 1Gi
        storageClass: longhorn
        accessMode: ReadWriteOnce

      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 100
        fsGroup: 1000

      # Mount the SOPS-managed unseal key Secret; each Secret key becomes a file.
      # The chart mounts type:secret at {path}/{name}/ — defaults to /openbao/userconfig/<name>/.
      # Omitting path uses the default, so the key lands at /openbao/userconfig/openbao-unseal/current_key.
      extraVolumes:
        - type: secret
          name: openbao-unseal

      serviceAccount:
        create: true
        name: openbao

      # Binds the ServiceAccount to system:auth-delegator for Kubernetes auth method
      authDelegator:
        enabled: true

    # The sidecar injector creates a cluster-wide MutatingWebhookConfiguration
    # that can block pod scheduling if OpenBao is unhealthy. ESO handles secret
    # sync instead, which decouples pod lifecycle from OpenBao availability.
    injector:
      enabled: false

    ui:
      enabled: true
      serviceType: ClusterIP
      # Route UI traffic to the active/leader pod only
      activeOpenbaoPodOnly: true
