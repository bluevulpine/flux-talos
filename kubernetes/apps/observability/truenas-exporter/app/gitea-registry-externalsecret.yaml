---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name truenas-exporter-registry-creds
spec:
  # Deliberately its OWN Secret rather than reusing the `gitea-registry-creds`
  # that rackpanel creates in this namespace. Two ExternalSecrets targeting one
  # Secret means two owners fighting over it, and pointing this app at
  # rackpanel's Secret would make deleting or renaming rackpanel silently break
  # image pulls here. The duplicated value is a read-only registry token.
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "gitea.derekjacobs.dev": {
                "username": "bluevulpine",
                "password": "{{ .Gitea__Registry_Read }}",
                "auth": "{{ (printf "%s:%s" "bluevulpine" .Gitea__Registry_Read) | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: gitea
