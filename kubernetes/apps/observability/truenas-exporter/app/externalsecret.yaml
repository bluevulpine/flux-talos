---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name truenas-exporter-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Consumed via envFrom, so the key IS the environment variable name.
        # The API key belongs to the dedicated `prometheus` service account on
        # vault, whose group holds exactly one role: POOL_READ. TrueNAS API
        # keys inherit the user's privileges, so binding this to a human admin
        # would silently hand the exporter every role that admin later gains.
        TRUENAS_API_KEY: "{{ .Truenas__Api__Key }}"
  dataFrom:
    - extract:
        key: truenas
