---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./configmap.yaml
# TrueNAS/vault Grafana dashboard, provisioned via the sidecar.
configMapGenerator:
  - name: truenas-dashboard
    files:
      - truenas-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

