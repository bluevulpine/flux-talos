---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ipmi-exporter
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The BMC username/password come from OpenBao and are rendered into the
    # exporter's config.yml; without the store the ExternalSecret never
    # materialises and the pod has no config to start from.
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/observability/ipmi-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: observability
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
