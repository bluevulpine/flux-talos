---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ipmi-exporter-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # ipmi_exporter has no way to read the BMC password from an env var —
        # the credential lives inside config.yml. So the WHOLE config file is
        # rendered here from OpenBao and mounted read-only; the password never
        # touches git or a ConfigMap.
        #
        # The account is a dedicated BMC user (NOT the factory ADMIN/ADMIN).
        #
        # privilege MUST be "admin": measured 2026-09-21, this X9DR3-F returns
        # DCMI "insufficient privilege (d4)" at operator, and its SDR exposes
        # NO power sensor at any level — so system watts are reachable only via
        # DCMI at ADMINISTRATOR. Everything else (temps/fans/voltages/chassis)
        # reads fine at operator; admin is the price of the power number alone.
        # The account is dedicated, LAN-only, password in OpenBao.
        #
        # collectors: bmc (board sensors), ipmi (all sensors: temps/fans/
        # voltages), chassis (power state, intrusion), dcmi (system watts).
        config.yml: |
          modules:
            default:
              user: "{{ .Ipmi__Vault__User }}"
              pass: "{{ .Ipmi__Vault__Pass }}"
              driver: "LAN_2_0"
              privilege: "admin"
              timeout: 5000
              collectors:
                - bmc
                - ipmi
                - chassis
                - dcmi
  dataFrom:
    - extract:
        key: ipmi
