---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ipmi-exporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: ipmi-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  values:
    controllers:
      ipmi-exporter:
        annotations:
          # Config lives in a rendered Secret; roll the pod when it changes so
          # a credential rotation actually takes effect.
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/prometheuscommunity/ipmi-exporter
              tag: v1.10.1
            args:
              - "--config.file=/etc/ipmi_exporter/config.yml"
            env:
              TZ: "${TIMEZONE}"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: 9290}
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: ipmi-exporter
        ports:
          http:
            port: 9290
            protocol: TCP
    persistence:
      # The exporter's own /metrics (port 9290) is scraped for exporter health;
      # the BMC data is fetched per-target via GET /ipmi?target=...&module=...
      config:
        type: secret
        name: ipmi-exporter-secret
        advancedMounts:
          ipmi-exporter:
            app:
              - path: /etc/ipmi_exporter/config.yml
                subPath: config.yml
                readOnly: true
