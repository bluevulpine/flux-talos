---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name node-exporter
spec:
  staticConfigs:
    # Scrape by tailscale IP, not MagicDNS name: cluster CoreDNS can't resolve
    # *.ts.net ("no such host"). Per Tailscale docs + Talos lessons, the operator
    # DNSConfig only resolves operator-managed proxies (not plain tailnet nodes),
    # and 100.100.100.100 isn't reachable from Talos pods — so static tailnet IPs
    # are the sanctioned workaround. Routing to the 100.x tailnet already works.
    - targets:
        - 100.104.24.17:9100 # chronos
      labels:
        instance: chronos
    - targets:
        - 100.114.176.10:9100 # pinas
      labels:
        instance: pinas
    # The two GB10 boxes (spark-setup roles/node_exporter), by LAN IP like
    # vllm-spark below: the exporter binds lan_ip only, and pods already reach
    # it. node_memory_MemAvailable_bytes is the headroom figure on their unified
    # memory -- GPU allocations come out of the same pool and nvidia-smi
    # reports GPU memory as unsupported.
    - targets:
        - 10.0.10.237:9100
      labels:
        instance: spark-ab23
    - targets:
        - 10.0.10.117:9100
      labels:
        instance: gx10-7ac6
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name garage
spec:
  staticConfigs:
    # Garage admin API on TrueNAS (vault, 10.0.10.11). /metrics is unauthenticated
    # because no [admin] metrics_token is set in garage.toml — so no bearer needed.
    - targets:
        - 10.0.10.11:30190
      labels:
        instance: garage
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name garage-pinas
spec:
  staticConfigs:
    # Single-node Garage on pinas, the second copy in the 3-2-1 backup scheme.
    # Its own job (not `garage`) so the critical GarageDown, which is about the
    # vault write path, does not fire for it. Scraped by tailnet IP like
    # node-exporter above, so it keeps working if pinas moves offsite. /metrics
    # is unauthenticated (no [admin] metrics_token), same as vault.
    - targets:
        - 100.114.176.10:3903
      labels:
        instance: pinas
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nv-monitor
spec:
  staticConfigs:
    # GPU metrics from the two GB10 boxes (spark-setup roles/nv_monitor):
    # utilisation, GPU-rail power, temperature, clocks, NVENC/NVDEC
    # utilisation (Tdarr). No DCGM exporter has a GB10 report, and
    # node-exporter has no GPU side. nv-monitor listens on every interface,
    # so on the boxes a systemd cgroup firewall admits only VLAN 10 and
    # loopback; pods reach it through their node's masqueraded address, as
    # for node-exporter and vllm-spark. Power here is the GPU rail only,
    # roughly half of wall draw, and there is no memory-bandwidth metric.
    - targets:
        - 10.0.10.237:9101
      labels:
        instance: spark-ab23
    - targets:
        - 10.0.10.117:9101
      labels:
        instance: gx10-7ac6
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name gatus
spec:
  staticConfigs:
    - targets:
        - "status.derekjacobs.dev"
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name smtp-relay
spec:
  staticConfigs:
    - targets:
        - "${SVC_SMTP_RELAY_ADDR}:8080"
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pangolin-gerbil
spec:
  staticConfigs:
    # Gerbil (the WireGuard server on the Pangolin VPS) ships a Prometheus
    # exporter out of the box -- nothing had to be enabled, only published.
    # Scrape by tailnet IP for the same reason as node-exporter above: cluster
    # CoreDNS cannot resolve *.ts.net.
    #
    # Port 3004 is published on the VPS bound to 100.65.0.27 ONLY (see
    # /opt/pangolin/docker-compose.yml), so it is not reachable from the public
    # internet. Pod egress to the tailnet is masqueraded to the node's own
    # tailnet address, so this scrape arrives as tag:server -- verified by
    # tcpdump on the VPS, not assumed.
    - targets:
        - 100.65.0.27:3004
      labels:
        instance: pangolin-vps
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name pangolin-traefik
spec:
  staticConfigs:
    # Traefik on the Pangolin VPS. Its exporter listens on a dedicated `metrics`
    # entryPoint (:8082) so /metrics is never served on the public web/websecure
    # listeners, and 8082 is likewise published bound to the tailnet IP only.
    #
    # This is the only source with a per-hostname view: newt sees the tunnel as
    # opaque bytes (labelled by tunnel_id, with no hostname anywhere), so
    # "which app is being hit, and with what status code" can ONLY be answered
    # here.
    - targets:
        - 100.65.0.27:8082
      labels:
        instance: pangolin-vps
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name vllm-spark
spec:
  staticConfigs:
    # vLLM on the DGX Spark (spark-setup roles/vllm), serving Qwen3.6 for the
    # `spark-main`, `spark-main-vision`, `hindsight-main` and `spark-direct`
    # routes in LiteLLM (two replicas since 2026-10-26, four names). Its
    # /metrics is unauthenticated and bound to the LAN address, which pods
    # already reach (LiteLLM calls the same host:port). Addressed by IP for
    # the same reason as the LiteLLM api_base: the spark-ab23 name has not
    # resolved reliably from pods.
    #
    # The token counters here are the only durable record of LLM volume:
    # hindsight keeps one day of llm_requests, LiteLLM one hour of spend logs,
    # and these counters reset whenever vLLM restarts (increase() handles that).
    # The spark-llm recording rules turn them into hourly tokens and an
    # API-equivalent cost.
    #
    # The second replica, on gx10-7ac6 (2026-10-26). Same job, so the
    # spark-llm recording rules (sum over the job) count both boxes' tokens.
    # ⚠️ OFF for the Qwen3.8 eval window (from 2026-10-27): the box runs the
    # candidate on :8001 instead, and a down :8000 target would fire the
    # chart's TargetDown. Not repointed at :8001, because eval tokens would
    # then count as production volume and cost in the spark-llm rules.
    # Uncomment with the LiteLLM replica deployments; it sits ABOVE the
    # spark-ab23 item so that formatting keeps it at list-item indentation.
    # - targets:
    #     - 10.0.10.117:8000
    #   labels:
    #     instance: gx10-7ac6
    - targets:
        - 10.0.10.237:8000
      labels:
        instance: spark-ab23
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
