---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name node-exporter
spec:
  staticConfigs:
    # Scrape by tailscale IP, not MagicDNS name: cluster CoreDNS can't resolve
    # *.ts.net ("no such host"). Per Tailscale docs + Talos lessons, the operator
    # DNSConfig only resolves operator-managed proxies (not plain tailnet nodes),
    # and 100.100.100.100 isn't reachable from Talos pods — so static tailnet IPs
    # are the sanctioned workaround. Routing to the 100.x tailnet already works.
    - targets:
        - 100.104.24.17:9100 # chronos
      labels:
        instance: chronos
    - targets:
        - 100.114.176.10:9100 # pinas (offline; will go green when back up)
      labels:
        instance: pinas
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name garage
spec:
  staticConfigs:
    # Garage admin API on TrueNAS (vault, 10.0.10.11). /metrics is unauthenticated
    # because no [admin] metrics_token is set in garage.toml — so no bearer needed.
    - targets:
        - 10.0.10.11:30190
      labels:
        instance: garage
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name gatus
spec:
  staticConfigs:
    - targets:
        - "status.derekjacobs.dev"
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name smtp-relay
spec:
  staticConfigs:
    - targets:
        - "${SVC_SMTP_RELAY_ADDR}:8080"
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
