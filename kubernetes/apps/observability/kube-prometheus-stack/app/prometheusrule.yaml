---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
    - name: memory
      rules:
        - alert: ContainerMemoryNearLimit
          annotations:
            summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit.
          expr: |
            (
              container_memory_working_set_bytes{container!="", container!="POD"}
              / on(namespace, pod, container) kube_pod_container_resource_limits{resource="memory"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
        - alert: ContainerMemoryCritical
          annotations:
            summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit. OOM kill imminent!
          expr: |
            (
              container_memory_working_set_bytes{container!="", container!="POD"}
              / on(namespace, pod, container) kube_pod_container_resource_limits{resource="memory"}
            ) > 0.90
          for: 2m
          labels:
            severity: critical
    - name: zfs
      rules:
        - alert: ZfsUnexpectedPoolState
          annotations:
            summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 15m
          labels:
            severity: critical
    - name: volsync
      rules:
        # A VolSync mover pod stuck in ContainerCreating means the snapshot/clone
        # it is trying to mount is wedged (commonly the tns-csi XFS "bad superblock"
        # snapshot-restore bug — the driver retries a doomed mount forever). Normal
        # movers complete in minutes, so 20m stuck is unambiguous. Fires ahead of
        # the critical VolSyncVolumeOutOfSync. Runbook: docs/runbooks/volsync-mover-stuck.md
        - alert: VolSyncMoverStuck
          annotations:
            summary: VolSync mover {{ $labels.namespace }}/{{ $labels.pod }} stuck in ContainerCreating >20m on {{ $labels.node }} — snapshot/clone likely fails to mount.
            runbook_url: https://github.com/bluevulpine/flux-talos/blob/main/docs/runbooks/volsync-mover-stuck.md
          expr: |
            (
              kube_pod_container_status_waiting_reason{reason="ContainerCreating", pod=~"volsync-(src|dst)-.*"} == 1
            ) * on(namespace, pod) group_left(node) kube_pod_info
          for: 20m
          labels:
            severity: warning
