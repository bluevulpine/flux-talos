---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml

  - ./prometheusrule.yaml
  - ./scrapeconfig.yaml
  - ./alertmanagerconfig.yaml
  - ./externalsecret.yaml
  - ./httproute.yaml
components:
  - ../../../../components/externalsecret-refresh
# Garage (S3 on vault) Grafana dashboard, provisioned via the sidecar.
configMapGenerator:
  - name: garage-dashboard
    files:
      - garage-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
