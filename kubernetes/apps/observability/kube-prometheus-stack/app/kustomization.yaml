---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml

  - ./prometheusrule.yaml
  - ./prometheusrule-spark-llm.yaml
  - ./scrapeconfig.yaml
  - ./alertmanagerconfig.yaml
  - ./externalsecret.yaml
  - ./httproute.yaml
components:
  - ../../../../components/externalsecret-refresh
# Garage (S3 on vault) Grafana dashboard, provisioned via the sidecar.
configMapGenerator:
  - name: garage-dashboard
    files:
      - garage-dashboard.json
  # DGX Spark LLM usage & payback: reads the spark-llm recording rules and the
  # vllm-spark scrape (both in this app).
  - name: spark-llm-dashboard
    files:
      - spark-llm-dashboard.json
    options:
      annotations:
        grafana_folder: DGX Spark
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
