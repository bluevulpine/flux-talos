---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 10m
    groupWait: 1m
    # Warnings and anything without a matching route below (tier 3, priority 0).
    receiver: pushover
    # Re-notify every 4h while an alert is still firing (was 12h — long enough
    # to miss/forget an ongoing incident).
    repeatInterval: 4h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: heartbeat
        groupInterval: 5m
        groupWait: 0s
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      # Three tiers, so severity is visible on the phone. Until 2026-10-24 every alert
      # went out at priority 1 with one sound, and the critical "postgres18-2 volume
      # full" (09:22Z) looked exactly like the ~160 warning pushes a day around it.
      # It sat for ~10 h.
      #
      # 1. Emergency: an opt-in list of criticals that cannot wait for morning. Most
      #    criticals here are data-loss-within-days (collector jobs, upstream
      #    retention windows) and some stay firing for days; paging those as
      #    emergencies would have sirened ~3x a day over the 30 days to 2026-10-24.
      #    This list fired 6 times in that window. Add an alert by name.
      #    FluxComponentAbsent comes from the live flux-system/flux-rules
      #    PrometheusRule, which is not defined in this repo.
      - receiver: pushover-emergency
        matchers:
          - name: severity
            value: critical
            matchType: =
          - name: alertname
            value: PGReplication|KubePersistentVolumeFillingUp|etcdInsufficientMembers|KubeAPIDown|FluxInstanceAbsent|FluxInstanceNotReady|FluxComponentAbsent
            matchType: =~
      # 2. Every other critical: high priority, as all alerts were before.
      - receiver: pushover-critical
        matchers:
          - name: severity
            value: critical
            matchType: =
  inhibitRules:
    # A firing critical mutes the warning of the same alertname+namespace (the
    # usual warning/critical threshold pair). The warning matcher must be in
    # targetMatch: with both in sourceMatch, a source had to be critical AND
    # warning at once, so the rule never matched and both pages went out.
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: &secret alertmanager-secret
            key: ALERTMANAGER_HEARTBEAT_URL
    # Warnings (the default route): normal priority. The other two Pushover
    # receivers merge this one (<<: *pushover) and override priority/sound.
    - name: pushover
      pushoverConfigs:
        - &pushover
          html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: "0"
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          token:
            name: *secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: *secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
    - name: pushover-critical
      pushoverConfigs:
        - <<: *pushover
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
    # Pushover emergency priority (2) re-alerts every `retry` until acknowledged or
    # `expire` passes, and the route's repeatInterval (4h) pages again while it is
    # still firing. The resolved notice is a separate normal message: it does NOT
    # cancel the retries, so a siren after the resolve is not proof it still fires.
    # Each new notification for a group (a new alert joining) is its own emergency.
    - name: pushover-emergency
      pushoverConfigs:
        - <<: *pushover
          priority: |-
            {{ if eq .Status "firing" }}2{{ else }}0{{ end }}
          retry: 5m
          expire: 1h
          sound: siren
