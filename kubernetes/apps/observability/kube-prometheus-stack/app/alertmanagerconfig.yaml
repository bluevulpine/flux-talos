---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 10m
    groupWait: 1m
    receiver: pushover
    # Re-notify every 4h while an alert is still firing (was 12h — long enough
    # to miss/forget an ongoing incident).
    repeatInterval: 4h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: heartbeat
        groupInterval: 5m
        groupWait: 0s
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      # Critical alerts get their own receiver so they page differently from warnings:
      # until 2026-10-24 every alert went out at priority 1 with one sound, and the
      # critical "postgres18-2 volume full" (09:22Z) looked exactly like the ~160
      # warning pushes a day around it. It sat for ~10 h.
      - receiver: pushover-critical
        matchers:
          - name: severity
            value: critical
            matchType: =
  inhibitRules:
    # A firing critical mutes the warning of the same alertname+namespace (the
    # usual warning/critical threshold pair). The warning matcher must be in
    # targetMatch: with both in sourceMatch, a source had to be critical AND
    # warning at once, so the rule never matched and both pages went out.
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: &secret alertmanager-secret
            key: ALERTMANAGER_HEARTBEAT_URL
    # Warnings (the default route): normal priority.
    - name: pushover
      pushoverConfigs:
        - &pushover
          html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: "0"
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          token:
            name: *secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: *secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
    # Critical: Pushover emergency priority (2), which re-alerts every `retry` until
    # acknowledged or `expire` passes; the route's repeatInterval (4h) pages again
    # if it is still firing after that. Resolved notices drop to normal priority.
    - name: pushover-critical
      pushoverConfigs:
        - <<: *pushover
          priority: |-
            {{ if eq .Status "firing" }}2{{ else }}0{{ end }}
          retry: 5m
          expire: 1h
          sound: siren
