---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: openebs
      namespace: openebs-system
    - name: thanos
      namespace: observability
  values:
    crds:
      enabled: true
    cleanPrometheusOperatorObjectNames: true
    # Use EndpointSlice instead of deprecated Endpoints API (Kubernetes v1.33+)
    prometheusOperator:
      kubeletEndpointsEnabled: false
      kubeletEndpointSliceEnabled: true
    # Disable rules that depend on metrics we're dropping for cardinality reduction
    defaultRules:
      rules:
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
    alertmanager:
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 1
        useExistingSecret: true
        configSecret: alertmanager-secret
        # Route AlertmanagerConfigs from ALL namespaces. The default
        # (OnNamespace) injects a namespace="observability" matcher on this
        # AlertmanagerConfig's route, so every alert from another namespace
        # (home/database/media/...) fell through to the top-level "null"
        # receiver and was silently dropped — no notifications for ~5 days.
        # Safe here: there is exactly one AlertmanagerConfig.
        alertmanagerConfigMatcherStrategy:
          type: "None"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-1-replica
              resources:
                requests:
                  storage: 1Gi
    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels:
              - "__name__"
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: drop
            sourceLabels:
              - "__name__"
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels:
              - "__name__"
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
    kubeControllerManager:
      enabled: false
    # Enabled 2026-08-20. Talos already exposes etcd metrics on every control
    # plane node -- talos/patches/control-plane/02-etcd.yaml sets
    # `cluster.etcd.extraArgs.listen-metrics-urls: http://0.0.0.0:2381` -- and
    # all three answer HTTP 200 on :2381/metrics. Only the scraper was off, so
    # this is a scraper change, not a cluster change.
    #
    # Explicit `endpoints` are required: the chart otherwise builds Endpoints
    # from a pod selector, and on Talos etcd is a Talos service rather than a
    # Kubernetes pod, so nothing would match.
    #
    # Plain HTTP on 2381 (not the client port 2379), so scheme must be http and
    # no client certificates are involved.
    #
    # Motivation: etcd_disk_backend_commit_duration_seconds and
    # etcd_disk_wal_fsync_duration_seconds are what make "does workload X add
    # jitter to etcd?" a measurable question. It came up deciding the CPU limit
    # for the rackpanel panel-agent, which runs on three control plane nodes,
    # and could not be answered.
    #
    # 2026-09-22: etcd now runs on ONE member, the freyja01 VM on vault
    # (docs/runbooks/controlplane-migration-to-vault-vm.md). Its disk is a zvol on
    # vault's `apps` pool, so etcd_disk_wal_fsync_duration_seconds is the signal
    # that tells us whether that disk is keeping up (p99 should stay < 10 ms).
    # If the control plane moves again, this list must move with it; a stale
    # endpoint fails silently as a down target, not as an error anywhere.
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.0.10.35
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
      prometheusSpec:
        # Use EndpointSlice for service discovery (Kubernetes v1.33+ deprecation)
        serviceDiscoveryRole: EndpointSlice
        podMetadata:
          annotations:
            secret.reloader.stakater.com/reload: &secret thanos-objstore-config
        replicas: 2
        replicaExternalLabelName: __replica__
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        # OTLP metrics receiver (`--web.enable-otlp-receiver`, POST
        # /api/v1/otlp/v1/metrics). First consumer, 2026-10-26: Claude Code's
        # own telemetry from Derek's Mac (CLAUDE_CODE_ENABLE_TELEMETRY, OTLP
        # http/protobuf), which reports tokens and dollars per request by
        # model, session and repo. Chosen over routing the harness through
        # LiteLLM because a non-Anthropic ANTHROPIC_BASE_URL disables Claude
        # Code's Remote Control (>= 2.1.196), and the client's own export is
        # the richer record anyway (subagents and background calls included,
        # attribution labels LiteLLM never sees). Reached through the existing
        # `prometheus` HTTPRoute on the internal gateway, which carries no
        # `auth: authentik` label, the same posture as the UI; the exporter
        # cannot do SSO. If Lens or a second sink ever wants the same stream,
        # the place for the fan-out is an OpenTelemetry Collector, since
        # Claude Code sends each signal to exactly one endpoint.
        #
        # Two things every exporter pointed here must get right (#2318
        # review): send CUMULATIVE temporality, because this receiver rejects
        # delta sums with "invalid temporality and type combination" unless
        # the `otlp-deltatocumulative` feature is on, and Claude Code's
        # default is delta (OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=
        # cumulative on the client); and look for the translated names, since
        # the default UnderscoreEscapingWithSuffixes strategy appends the
        # unit and `_total`: claude_code_session_count_total,
        # claude_code_token_usage_tokens_total, claude_code_cost_usage_USD_total.
        # Per-session series are kept out of Prometheus
        # (OTEL_METRICS_INCLUDE_SESSION_ID=false on the client): Thanos holds
        # the 1h downsample for three years and a new label set per session
        # would pile up for nothing, while the per-session detail lives in
        # the VictoriaLogs events for their 14-day retention, which is what
        # that detail is worth; the aggregates by model and repo are what
        # stay for years.
        #
        # Resource attributes land in `target_info` unless promoted; these
        # three are the ones worth a label (`host.name` tells aurelia from a
        # future second machine). The per-request attributes Claude Code puts
        # on the data points themselves (model, type, session.id, user.email,
        # repository) become labels on their own.
        enableOTLPReceiver: true
        otlp:
          promoteResourceAttributes:
            - service.name
            - service.version
            - host.name
        enableFeatures:
          - auto-gomemlimit
          - auto-gomaxprocs
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        thanos:
          version: "${THANOS_VERSION:=temp}"
          objectStorageConfig:
            existingSecret:
              name: *secret
              key: config
        retention: 2d
        retentionSize: 15GB
        externalLabels:
          cluster: main
        resources:
          requests:
            cpu: 100m
            memory: 4Gi
          limits:
            memory: 8Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-1-replica
              resources:
                requests:
                  storage: 100Gi
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - "__meta_kubernetes_pod_node_name"
              targetLabel: kubernetes_node
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - "__meta_kubernetes_pod_node_name"
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes
          multicluster:
            etcd:
              enabled: true
