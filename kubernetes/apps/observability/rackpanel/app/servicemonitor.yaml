---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rackpanel-agent
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  # A ServiceMonitor rather than a PodMonitor, for a concrete reason:
  # app-template 5.1.0 does not emit container `ports` at all (verified by
  # rendering — the conductor Deployment has none either), so a PodMonitor
  # keyed on `port: metrics` would select nothing and leave an empty target
  # list without erroring. The Service DOES carry the named port, and its
  # selector is already scoped to the agent controller, so scraping it hits
  # exactly the four agent pods.
  #
  # rackpanel_agent_frame_lag_seconds is the series that answers "are the four
  # panels actually in unison?" — four series tracking together means yes, and
  # a single outlier names the node whose agent is polling late or throttling
  # harder than the others.
  # NOTE the label key: app-template stamps Services with
  # `app.kubernetes.io/service: <release>-<serviceKey>`. There is no
  # `controller` or `component` label on the Service — selecting on either
  # matches nothing, silently.
  selector:
    matchLabels:
      app.kubernetes.io/instance: rackpanel
      app.kubernetes.io/service: rackpanel-agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
