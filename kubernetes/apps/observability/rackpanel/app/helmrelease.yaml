# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rackpanel
spec:
  chartRef:
    kind: OCIRepository
    name: rackpanel
  interval: 1h
  values:
    # Explicitly enabled (rather than relying on app-template's implicit
    # "one ServiceAccount named after the release" default) so the identifier
    # referenced by controllers.rackpanel.serviceAccount.identifier below is
    # guaranteed to resolve, and so the binding is self-documenting. Verified
    # against the pulled app-template 5.0.1 chart source
    # (charts/common/templates/values/_init.tpl and
    # lib/pod/fields/_serviceAccountName.tpl): a controller's
    # `serviceAccount.identifier` is looked up against `values.serviceAccount`
    # and `fail`s the render if no enabled entry with that identifier exists.
    # Matches the pattern already used by homepage, dragonfly and gatus in
    # this repo. The ClusterRole/ClusterRoleBinding for the "rackpanel"
    # identity the chart creates here live in rbac.yaml.
    serviceAccount:
      rackpanel:
        enabled: true
    controllers:
      rackpanel:
        type: deployment
        pod:
          # amd64 only: rendering is the one CPU-hungry thing here, and the
          # Pis are already carrying the panels. Stated per-controller rather
          # than as a defaultPodOption because the agent below needs the
          # opposite, and app-template's defaultPodOptionsStrategy is
          # "overwrite" (verified in 5.1.0 lib/pod/_getOption.tpl) -- being
          # explicit removes any question about precedence.
          nodeSelector:
            kubernetes.io/arch: amd64
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        serviceAccount:
          identifier: rackpanel
        containers:
          app:
            # First-party image — built by Drone CI from
            # https://gitea.derekjacobs.dev/bluevulpine/rackpanel
            image:
              repository: gitea.derekjacobs.dev/bluevulpine/rackpanel
              tag: 7-766878dc # {"$imagepolicy": "flux-system:rackpanel:tag"}
            env:
              TZ: "${TIMEZONE}"
              RACKPANEL_NODES: jormungandr1,jormungandr2,jormungandr3,jormungandr4
              RACKPANEL_DWELL: "20"
              RACKPANEL_THANOS_URL: http://thanos-query-frontend.observability.svc:10902
              RACKPANEL_CLUSTER: home-kubernetes
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: 8080}
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 384Mi
      agent:
        type: daemonset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The four Pis are the only arm64 nodes. This selects the wrong
          # property (architecture, not "has a panel") but avoids a
          # machine-config apply across all four for a cosmetic gain. If a
          # non-panel arm64 node is ever added, add nodeLabels to
          # talconfig.yaml and switch this selector.
          nodeSelector:
            kubernetes.io/arch: arm64
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node.kubernetes.io/low-power
              operator: Exists
              effect: NoSchedule
          # app-template's defaultPodOptionsStrategy is "overwrite", NOT
          # "merge", so this block REPLACES defaultPodOptions.securityContext
          # wholesale. seccompProfile has to be restated here or it is
          # silently dropped -- a missing seccomp profile would not fail the
          # render.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            # First-party image — built by Drone CI from the same repo as the
            # conductor. Dedicated `tag:` subfield, so the marker carries the
            # `:tag` suffix (the opposite of a combined `image: repo:tag`
            # scalar). See docs/runbooks/flux-image-automation.md.
            image:
              repository: gitea.derekjacobs.dev/bluevulpine/rackpanel-agent
              tag: 6-348390b8 # {"$imagepolicy": "flux-system:rackpanel-agent:tag"}
            env:
              TZ: "${TIMEZONE}"
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              # rackpanel-app, not rackpanel: the Service name is derived
              # by app-template and changed when the agent's metrics Service
              # was added. See the note in httproute.yaml.
              RACKPANEL_CONDUCTOR_URL: http://rackpanel-app.observability.svc.cluster.local:8080
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: 8080}
                  initialDelaySeconds: 15
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  # A wedged panel goes NotReady and STAYS RUNNING. The design
                  # rule is that the display is never important enough to
                  # restart for, so an I2C fault must never reach liveness.
                  httpGet: {path: /readyz, port: 8080}
                  initialDelaySeconds: 10
                  periodSeconds: 30
            securityContext:
              # MEASURED 2026-08-19, not assumed: a non-privileged hostPath
              # mount of /dev/gpiochip0 fails open() with EPERM on both
              # O_RDONLY and O_RDWR, while an otherwise identical privileged
              # pod on the same node succeeds. The cgroup v2 device controller
              # is the cause and capabilities do not bypass it. Scope is one
              # container on four Pis running a ~10MB FROM scratch image with
              # no shell and no package manager.
              privileged: true
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 32Mi
              limits:
                # Raised 500m -> 1000m on 2026-08-20 after measurement. At 500m
                # the agents were throttled in 46-56% of CFS periods while
                # averaging only ~0.07 cores: bursty work exhausting a 50ms
                # quota inside each 100ms window during a blit, then stalling.
                # Full sweeps took 4.24-4.61s, no faster than the unthrottled
                # Python probe, and 22% of a 20s dwell was spent wiping.
                #
                # Still a bound rather than "unlimited": one core of four, so a
                # blit cannot monopolise a Pi that is also running etcd on
                # three of the four nodes. Safe to tune either way because I2C
                # has no minimum clock rate -- CFS throttling makes the sweep
                # slower and cannot make it incorrect. The same limit would be
                # reckless on SPI or WS2812.
                cpu: 1000m
                memory: 64Mi
    defaultPodOptions:
      # app-template 5.0.1 defaults automountServiceAccountToken to false.
      # Without this, /var/run/secrets/kubernetes.io/serviceaccount/token
      # never exists, KubeClient.in_cluster() raises FileNotFoundError, and
      # the failure is swallowed -- NODES/CLUSTER tiles show "--" forever and
      # FLEET never becomes eligible, with no visible error. Every other app
      # in this repo that talks to the API server (gatus, homepage, drone,
      # dragonfly) sets this explicitly for the same reason.
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: gitea-registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: rackpanel
        ports:
          http:
            port: 8080
      # Exists so app-template gives the agent container a NAMED containerPort;
      # the PodMonitor selects `port: metrics`. The ClusterIP itself is
      # incidental -- scraping is per-pod.
      agent:
        controller: agent
        ports:
          metrics:
            port: 8080
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      gpio:
        type: hostPath
        hostPath: /dev/gpiochip0
        # advancedMounts, NOT globalMounts: a global mount would put
        # /dev/gpiochip0 into the conductor pod on an amd64 node, where the
        # path does not exist and the pod would fail to start.
        advancedMounts:
          agent:
            app:
              - path: /dev/gpiochip0
