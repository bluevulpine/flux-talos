---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rackpanel
  annotations:
    gatus.home-operations.com/endpoint: |
      group: observability
    gethomepage.dev/enabled: "true"
    gethomepage.dev/icon: mdi-monitor-dashboard
    gethomepage.dev/name: Rackview
    gethomepage.dev/group: Observability
spec:
  hostnames:
    - "rackview.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # "rackpanel-app", not "rackpanel". app-template DERIVES the Service
        # name and the schema forbids pinning it (service.<key>.name is
        # rejected). With a single service it rendered as the bare release
        # name; adding the agent's metrics Service made it disambiguate to
        # <release>-<key>. Adding or removing a Service in this HelmRelease can
        # therefore rename this backend out from under the route -- which is
        # exactly how rackview started returning 500 on 2026-08-20.
        - name: rackpanel-app
          port: 8080
