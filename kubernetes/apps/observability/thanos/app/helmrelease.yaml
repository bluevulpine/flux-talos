---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: thanos
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: openebs
      namespace: openebs-system
  valuesFrom:
    - targetPath: objstoreConfig.value.config.bucket
      kind: ConfigMap
      name: thanos-bucket
      valuesKey: BUCKET_NAME
    - targetPath: objstoreConfig.value.config.endpoint
      kind: Secret
      name: thanos-bucket
      valuesKey: BUCKET_HOST
    - targetPath: objstoreConfig.value.config.region
      kind: ConfigMap
      name: thanos-bucket
      valuesKey: BUCKET_REGION
    - targetPath: objstoreConfig.value.config.access_key
      kind: Secret
      name: thanos-bucket
      valuesKey: AWS_ACCESS_KEY_ID
    - targetPath: objstoreConfig.value.config.secret_key
      kind: Secret
      name: thanos-bucket
      valuesKey: AWS_SECRET_ACCESS_KEY
  values:
    objstoreConfig:
      value:
        type: s3
        config:
          insecure: true # Garage S3 API uses HTTP
    additionalEndpoints:
      - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.observability.svc.cluster.local
    additionalReplicaLabels:
      - "__replica__"
    serviceMonitor:
      enabled: true
    compact:
      enabled: true
      extraArgs:
        # 1, not the 4 this carried until 2026-10-22: a group compaction keeps
        # its inputs and its output on the data PVC at once, and four groups
        # in flight multiply that. Sizing is in the persistence note below.
        - --compact.concurrency=1
        - --delete-delay=30m
        # Retention (decided 2026-10-16). raw 30d: incident forensics at scrape
        # resolution. 5m 1y: every long-range investigation so far wanted a
        # 60d window, and a year allows same-month comparisons; a 5m block holds
        # 5% of its raw sibling's samples (measured). 1h 3y: ~2% of raw, so the
        # years are free. Raw grows ~1.2 GB/day; the whole policy is ~150 GB.
        - --retention.resolution-raw=30d
        - --retention.resolution-5m=1y
        - --retention.resolution-1h=3y
      # Not the shared 20Gi &persistence below. Sized from the second ENOSPC
      # halt (2026-10-22T01:09Z, at 100Gi): the compactor merges seven two-day
      # raw blocks into one 14d block, and a two-day block here is 7-14 GB on
      # disk (2.5-5 G samples, 0.4-1.3 M series), not the 2.3 GB the
      # 2026-10-16 sizing assumed. One group is ~65 GB of inputs plus an
      # output of about the same, ~130 GB, and --compact.concurrency=4 ran
      # several at once. 250Gi holds one group with room; concurrency is 1.
      # The first halt was at 20Gi on 2026-10-03 (thanos_compact_halted=1 is
      # permanent until a restart, and every restart halted again on the same
      # group); retention and downsampling never ran, the bucket held ~10
      # months of raw in 1,148 blocks and the store-gateway OOMKilled loading
      # them. On 2026-10-22 the 151 raw blocks already past the 30d retention
      # were marked no-compact (`thanos tools bucket mark`), so the backlog is
      # downsampled and deleted rather than compacted first; the marks stay
      # with the blocks and go when retention deletes them.
      # The live PVC is grown online, `kubectl patch pvc data-thanos-compact-0`
      # (Longhorn allowVolumeExpansion); this value keeps the chart in sync.
      # volumeClaimTemplates are immutable, so any change here needs
      # `kubectl delete sts thanos-compact --cascade=orphan` before Flux can
      # apply it (the orphaned pod is re-adopted and rolled).
      persistence:
        enabled: true
        storageClass: longhorn-1-replica
        size: 250Gi
    query:
      replicas: 2
      extraArgs:
        - "--alert.query-url=https://thanos.${SECRET_DOMAIN}"
        # Let range queries read downsampled blocks. Without it Query reads raw
        # only (max_source_resolution=0s), and raw is deleted at 30d by the
        # compactor above -- so any range past 30 days silently comes back short
        # (a plausible, low number; no error), even though 5m/1h blocks exist to
        # 1y/3y. With it, a request that names no resolution uses step/5: a
        # query at step >= 25m may fall back to 5m/1h data where raw is gone,
        # while fine-step and recent queries still read raw.
        #
        # Instant queries are NOT covered (this Thanos, 0.42, has no
        # default-max-source-resolution flag for them): a [60d] instant query
        # still tops out at 30d. Ask long windows as a range query with a coarse
        # step, or pass max_source_resolution=1h explicitly.
        - "--query.auto-downsampling"
    queryFrontend:
      enabled: true
      replicas: 2
      extraEnv: &extraEnv
        - name: THANOS_CACHE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: &configMap thanos-cache-configmap
              key: cache.yaml
      extraArgs:
        - "--query-range.response-cache-config=$(THANOS_CACHE_CONFIG)"
        # Retry a range query against downsampled data when the raw answer is
        # empty or incomplete -- the frontend half of --query.auto-downsampling.
        - "--query-range.request-downsampled"
      ingress:
        enabled: false
      podAnnotations: &podAnnotations
        configmap.reloader.stakater.com/reload: *configMap
    rule:
      enabled: true
      replicas: 2
      extraArgs:
        - "--web.prefix-header=X-Forwarded-Prefix"
      alertmanagersConfig:
        value: |-
          alertmanagers:
            - api_version: v2
              static_configs:
                - dnssrv+_http-web._tcp.alertmanager-operated.observability.svc.cluster.local
      rules:
        value: |-
          groups:
            - name: PrometheusWatcher
              rules:
                - alert: PrometheusDown
                  annotations:
                    summary: A Prometheus has disappeared from Prometheus target discovery
                  expr: absent(up{job="kube-prometheus-stack-prometheus"})
                  for: 5m
                  labels:
                    severity: critical
      persistence: &persistence
        enabled: true
        storageClass: longhorn-1-replica
        size: 20Gi
    storeGateway:
      # Single replica: Thanos v0.41.0 regression (thanos-io/thanos#8711) makes
      # Query's /metrics return HTTP 500 when two store-gateways read the same
      # bucket and advertise identical external labels — they collide on the
      # thanos_store_nodes_grpc_connections series, failing the whole scrape and
      # firing TargetDown. One store endpoint avoids the duplicate. Store-gateway
      # is a stateless read layer over object storage (recent data is served by
      # the HA sidecars), so dropping to one replica is acceptable here.
      # Revert to replicas: 2 once #8711 is fixed in a stable release.
      replicas: 1
      extraEnv: *extraEnv
      # Lazy index-header reader: by default store-gateway eagerly memory-maps
      # every block's index-header at startup, which fills the cgroup limit with
      # reclaimable page cache (working_set tracks the limit and trips
      # ContainerMemoryCritical even though anonymous RSS is only ~220Mi). Lazy
      # reader maps a block's index-header only when it is queried and releases
      # it after the idle timeout, keeping memory bounded — important now that a
      # single replica serves all store-API load.
      extraArgs:
        - "--index-cache.config=$(THANOS_CACHE_CONFIG)"
        - --store.enable-index-header-lazy-reader
      persistence: *persistence
      podAnnotations: *podAnnotations
      # 1.5Gi limit. The lazy reader above fixed the eager-mmap page-cache problem,
      # but a single replica now serves all store-API load and it OOMKilled
      # repeatedly 2026-09-26..10-01: working_set peaked at 0.96GiB against the
      # old 1Gi limit (Thanos, kube_pod_container_status_last_terminated_reason).
      # The earlier "~400Mi for months" figure was likely the two-replica era.
      # A 2Gi limit was tried before and just gave reclaimable index-header page
      # cache room to grow into (OOM-imminent alert), so step to 1.5Gi and watch.
      resources:
        requests:
          cpu: 10m
          memory: 512Mi
        limits:
          memory: 1536Mi
