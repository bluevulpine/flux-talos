---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name unpoller-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        UP_UNIFI_DEFAULT_USER: "{{ .Unifi__Poller__User }}"
        UP_UNIFI_DEFAULT_PASS: "{{ .Unifi__Poller__Pass }}"
  dataFrom:
    - extract:
        key: unifi
