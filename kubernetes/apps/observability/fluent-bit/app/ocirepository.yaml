---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fluent-bit
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.55.0
  # Fluent's own OCI chart. home-operations/charts-mirror deprecated its copy
  # 2026-01-22 (#393) and pulled it ~2026-10-28; ghcr now answers DENIED.
  url: oci://ghcr.io/fluent/helm-charts/fluent-bit
  # Fluent signs its chart keyless, as a sigstore v0.3 bundle attached as an
  # OCI referrer; source-controller v1.9.6 verifies it (checked 2026-10-29 with
  # a scratch OCIRepository: this identity Ready=True, a wrong subject
  # VerificationError). The cert SAN is NOT fluent/helm-charts: it is the
  # reusable workflow fluent's release job calls, action-stars/helm-workflows,
  # and Flux matches only issuer + SAN. That workflow is public and other
  # projects call it too (stevehipwell/helm-charts, scality/metalk8s); every
  # caller's run gets this same issuer and SAN. So this proves only "signed
  # by the action-stars release workflow on GitHub Actions", NOT tied to
  # fluent: the bundle binds a digest, not a registry path, and fluent/
  # helm-charts appears only in the cert's source-repository extension. It
  # catches an unsigned or corrupted chart, not a compromised fluent push
  # credential. The SHA after @ changes between releases (0.55.0 and 0.58.3
  # differ), so it is not pinned.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@.+$

