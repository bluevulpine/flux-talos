---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  interval: 1h
  values:
    config:
      service: |-
        [SERVICE]
          daemon off
          flush {{ .Values.flush }}
          log_level {{ .Values.logLevel }}
          parsers_file /fluent-bit/etc/parsers.conf
          parsers_file /fluent-bit/etc/conf/custom_parsers.conf
          http_server on
          http_listen 0.0.0.0
          http_port {{ .Values.metricsPort }}
          health_check on

      inputs: |-
        [INPUT]
          name tail
          alias kubernetes
          path /var/log/containers/*.log
          parser containerd
          tag kubernetes.*
          skip_empty_lines on
          skip_long_lines on

      filters: |-
        [FILTER]
          name kubernetes
          match kubernetes.*
          merge_log on
          kube_tag_prefix kubernetes.var.log.containers.
          k8s-logging.parser on
          k8s-logging.exclude on
          namespace_labels off
          annotations off
          # The pod lookup's response buffer. The 32k default is smaller than a
          # Cilium agent pod (~64k: init containers, env, volumes), so the lookup
          # failed ("[http_client] cannot increase buffer: current=32000
          # requested=64768") and every cilium-agent line, Hubble flow logs
          # included, reached VictoriaLogs with no k_* fields at all, filed
          # under a bare {stream="stdout"} where no pod/namespace query could
          # find it (found 2026-11-03; 14 days held zero cilium-agent records by
          # name). Any pod with a large spec hits the same silent loss. 512k
          # leaves room without making a runaway response unbounded.
          buffer_size 512k

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under kubernetes
          add_prefix k_

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under k_labels
          add_prefix k_labels_

        [FILTER]
          name modify
          match kubernetes.*
          rename k_labels_app.kubernetes.io/name app
          rename k_labels_app app
          rename k_labels_k8s-app app

      customParsers: |-
        [PARSER]
          name containerd
          format regex
          regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%L%z

      outputs: |-
        [OUTPUT]
          name http
          match kubernetes.*
          host victoria-logs-server.observability.svc.cluster.local
          port 9428
          uri /insert/jsonline?_stream_fields=stream,k_namespace_name,k_pod_name,app&_msg_field=log&_time_field=date
          format json_lines
          json_date_format iso8601
          compress gzip
          log_response_payload false
    # Log collection must cover every node, so tolerate all taints rather than
    # naming them. Without this the DaemonSet only scheduled on the 3 brokkr
    # workers: the jormungandr control-plane nodes carry
    # node-role.kubernetes.io/control-plane:NoSchedule and jormungandr4 carries
    # node.kubernetes.io/low-power:NoSchedule, so 4 of 7 nodes shipped no logs at
    # all. That silently hid every control-plane-hosted workload — tuppr among
    # them, which is why a failed Talos upgrade left nothing in VictoriaLogs to
    # diagnose. Enumerating the current taints would reintroduce the same gap the
    # next time a node gains one.
    tolerations:
      - operator: Exists

    dashboards:
      enabled: true
    serviceMonitor:
      enabled: true
    logLevel: warn

