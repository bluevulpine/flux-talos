---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
components:
  - ../../../../components/externalsecret-refresh
# Home Assistant (InfluxDB) dashboards, provisioned via the Grafana sidecar.
configMapGenerator:
  - name: ha-dashboards
    files:
      - ha-explorer-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
