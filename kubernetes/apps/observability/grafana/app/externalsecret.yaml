---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        GF_DATABASE_NAME: &dbName grafana
        GF_DATABASE_HOST: ${POSTGRES_HOST}:5432
        GF_DATABASE_USER: &dbUser "{{ .Grafana__PostgresUser }}"
        GF_DATABASE_PASSWORD: &dbPass "{{ .Grafana__PostgresPass }}"
        GF_DATABASE_SSL_MODE: disable
        GF_DATABASE_TYPE: postgres
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .Grafana__OauthClientId }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .Grafana__OauthClientSecret }}"
        # Manage the local admin login so it's a known value shared with the
        # homepage widget (which hits /api/admin/stats via basic auth). Grafana
        # applies these on startup. Login is normally via SSO; this just makes the
        # server-admin credential explicit and matched to the OpenBao grafana item.
        GF_SECURITY_ADMIN_USER: "{{ .Grafana__Username }}"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .Grafana__Password }}"
        # Read-only InfluxDB token for the Kia EV9 datasource. Optional: renders
        # empty until the OpenBao grafana item gains Grafana__InfluxdbKiaToken.
        # nospace (not trim): the pasted token had an embedded newline from
        # line-wrapping; strip ALL whitespace since InfluxDB tokens contain none.
        INFLUXDB_KIA_TOKEN: '{{ .Grafana__InfluxdbKiaToken | default "" | nospace }}'
        # Read-only InfluxDB token for the Home Assistant datasource. Renders empty
        # until the OpenBao grafana item gains Grafana__InfluxdbHaToken.
        INFLUXDB_HA_TOKEN: '{{ .Grafana__InfluxdbHaToken | default "" | nospace }}'
        # Read-only InfluxDB token for the ChargePoint datasource. Renders empty
        # until the OpenBao grafana item gains Grafana__InfluxdbChargepointToken.
        INFLUXDB_CHARGEPOINT_TOKEN: '{{ .Grafana__InfluxdbChargepointToken | default "" | nospace }}'
        # Read-only InfluxDB token for the beestat (ecobee archive) datasource.
        # Renders empty until the OpenBao grafana item gains Grafana__InfluxdbBeestatToken.
        INFLUXDB_BEESTAT_TOKEN: '{{ .Grafana__InfluxdbBeestatToken | default "" | nospace }}'
        # Read-only InfluxDB token for the minnkota (demand-response) datasource.
        # Grafana__InfluxdbMinnkotaToken already exists in the OpenBao grafana
        # item and is live; the `default ""` is a boot-safety fallback (same
        # pattern as the other tokens above), not a placeholder for a field
        # that hasn't been created yet.
        INFLUXDB_MINNKOTA_TOKEN: '{{ .Grafana__InfluxdbMinnkotaToken | default "" | nospace }}'
        # Read-only InfluxDB token for the WiCAN (EV9 OBD-II) datasource.
        # Grafana__InfluxdbWicanToken is live in the OpenBao grafana item; the
        # `default ""` is the same boot-safety fallback as the tokens above.
        INFLUXDB_WICAN_TOKEN: '{{ .Grafana__InfluxdbWicanToken | default "" | nospace }}'
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
  dataFrom:
    - extract:
        key: grafana
    - extract:
        key: cloudnative-pg
