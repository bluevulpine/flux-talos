---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kromgo/main/config.schema.json
# kromgo >= 0.11 config: badges are served at /badges/<id>; valueExpr/colorExpr are CEL.
# Thresholds are decimals because colorScale rejects integer literals.
defaults:
  badge:
    size: 12

badges:
  - id: talos_version
    query: node_os_info{cluster="main", name="Talos"}
    valueExpr: labels[?"version_id"].orValue("unknown")

  - id: kubernetes_version
    query: kubernetes_build_info{cluster="main", service="kubernetes"}
    valueExpr: labels[?"git_version"].orValue("unknown")

  - id: cluster_node_count
    query: count(count by (node) (kube_node_status_condition{cluster="main", condition="Ready"}))
    valueExpr: humanizeFloat(result)
    colorExpr: '"green"'

  - id: cluster_pod_count
    query: sum(kube_pod_status_phase{cluster="main", phase="Running"})
    valueExpr: humanizeFloat(result)
    colorExpr: '"green"'

  - id: cluster_cpu_usage
    query: round(avg(instance:node_cpu_utilisation:rate5m{cluster="main"}) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: 'colorScale(result, [36.0, 76.0], ["green", "orange", "red"])'

  - id: cluster_memory_usage
    query: round(sum(node_memory_MemTotal_bytes{cluster="main"} - node_memory_MemAvailable_bytes{cluster="main"}) / sum(node_memory_MemTotal_bytes{cluster="main"}) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: 'colorScale(result, [36.0, 76.0], ["green", "orange", "red"])'

  - id: cluster_power_usage
    query: round(upsHighPrecOutputCurrent * upsHighPrecOutputVoltage * 0.01, 0.1)
    valueExpr: humanizeFloat(result) + "W"
    colorExpr: 'colorScale(result, [401.0, 751.0], ["green", "orange", "red"])'

  - id: cluster_age_days
    query: round((time() - min(kube_node_created{cluster="main"}) ) / 86400)
    valueExpr: humanizeFloat(result) + "d"
    colorExpr: 'colorScale(result, [181.0, 361.0], ["green", "orange", "red"])'

  - id: cluster_uptime_days
    query: round(avg(node_time_seconds{cluster="main"} - node_boot_time_seconds{cluster="main"}) / 86400)
    valueExpr: humanizeFloat(result) + "d"
    colorExpr: 'colorScale(result, [181.0, 361.0], ["green", "orange", "red"])'
