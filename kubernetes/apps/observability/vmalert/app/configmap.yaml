---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
data:
  rules.yaml: |-
    groups:
      # Log-based alerting over VictoriaLogs (type: vlogs). Gitea does not surface
      # mirror-sync failures via the UI or a Prometheus metric; the only signal is
      # its stdout log line, collected by fluent-bit into VictoriaLogs.
      # The trip archiver exits 3 when Kia forces an OTP, so KiaTripArchiverJobFailed
      # already fires — but it fires identically for a database outage or a schema
      # change, and the remedy is completely different. This rule names the cause.
      #
      # Matching on the bare marker rather than an `app:` selector is deliberate:
      # the string is globally unique to this one log line, so the alert does not
      # depend on how fluent-bit happens to map pod labels into VictoriaLogs fields.
      - name: kia-trip-archiver
        type: vlogs
        interval: 15m
        rules:
          - alert: KiaTripArchiverReauthRequired
            # _time:8h against a 6h sync cadence spans one or two attempts: sticky
            # enough not to flap between runs, and it auto-resolves within ~8h of a
            # successful bootstrap rather than dragging on for a day.
            expr: >-
              _time:8h "KIA_PORTAL_REAUTH_REQUIRED"
              | stats count() as events | filter events:>0
            labels:
              severity: critical
            annotations:
              summary: 'Kia trip archiver needs an OTP — the portal rmToken is dead'
              # This is a human-with-a-phone job. There is no credential, retry or
              # backoff that resolves it, which is why the archiver refuses to retry
              # rather than hammering a credential endpoint into an account lockout.
              description: >-
                Kia rejected the stored portal rmToken and demanded SMS verification,
                so trip history has stopped syncing. Re-enrol:
                `kubectl run kia-trip-bootstrap -n home ...` then
                `kubectl exec -n home kia-trip-bootstrap -it -- python -m archiver.bootstrap`
                (full invocation in the archiver.bootstrap docstring). Nothing retries
                this and nothing else will clear it.
                How long the dead token lasted is recorded, in seconds, on the newest
                `otp_required` row of the kia_trips database's auth_events table —
                that measurement is the whole reason this alert exists, because the
                portal rmToken has no known lifetime. Do NOT infer one from the live
                telemetry collector's rmtoken: whether the two are even the same
                credential is unresolved. The oft-quoted ~90 days is folklore.
      - name: gitea
        type: vlogs
        interval: 15m
        rules:
          - alert: GiteaMirrorSyncFailing
            # _time:1h = a rolling 1h window. Mirrors sync roughly every ~10 min, so
            # 1h spans ~6 attempts: sticky enough not to flap between syncs, but the
            # alert auto-resolves within ~1h of a fix (once the last failure ages out
            # of the window) rather than dragging on for a full day. If you ever set
            # mirrors to a much longer interval, widen this to stay above it.
            # `extract` pulls the repo slug out of the log line so `stats by (repo)`
            # yields one alert per failing repo (label `repo`) — naming exactly
            # which mirror is broken instead of a single aggregate count.
            # Match on "[E]" rather than a specific failure string. This used to
            # filter on "failed to update mirror repository", which silently missed
            # the other shape Gitea emits — `remote URL is not allowed:
            # migration/cloning from '<host>' is not allowed.` On 2026-08-09 three
            # failures occurred but only one matched, so the alert under-reported
            # (1 of 3) and the two hidden entries were the ones naming the real
            # cause. Both shapes carry "[E]" and "SyncMirrors" and the same
            # `[repo: <Repository N:owner/name>]` prefix, so extract still works.
            expr: >-
              _time:1h app:gitea "[E]" "SyncMirrors"
              | extract "Repository <repo_id>:<repo>>]"
              | stats by (repo) count() as failures | filter failures:>0
            labels:
              severity: warning
            annotations:
              summary: 'Gitea mirror sync failing: {{ $labels.repo }}'
              # Check DNS before credentials. A failure to resolve the upstream host
              # surfaces as `remote URL is not allowed: migration/cloning from
              # 'github.com' is not allowed.` — which reads like an auth/policy
              # problem but is not one. Gitea resolves the host and matches the
              # returned IPs against its allow-list; an empty answer means no
              # permitted IP, so it reports permission-denied. This annotation
              # previously said "most often an expired credential", which sent the
              # 2026-08-09 investigation toward rolling a perfectly good PAT.
              description: >-
                {{ $labels.repo }} — {{ $value }} mirror sync failure(s) in the last
                hour. This mirror can't pull from upstream. Check in this order:
                (1) DNS — if the log says "Could not resolve host" or "remote URL is
                not allowed", it is resolution, not auth; confirm with
                `kubectl exec -n develop deploy/gitea -c gitea -- getent ahostsv4 github.com`
                and check CoreDNS before touching any credential.
                (2) Credential — only if DNS resolves: Gitea → this repo → Settings →
                Mirror Settings → update the upstream credential. Logs: Grafana →
                Explore → VictoriaLogs: app:gitea "[E]" "SyncMirrors"
      # A telemetry field that stops being reported, while the collector keeps
      # succeeding. KiaCollectorJobFailed, KiaCollectorImagePullFailing and
      # KiaCollectorStale all detect the collector NOT RUNNING; none of them can
      # see a run that succeeds and writes nothing. aux_battery_pct vanished on
      # 2026-08-08 and stayed gone for six weeks underneath all three.
      #
      # The collector emits "DEATHWATCH:" from exactly one log.warning call when a
      # field it normally writes comes back None. Matching the bare marker follows
      # the kia-trip-archiver precedent above: the string is globally unique
      # (verified — 0 hits across the full 14d retention before this shipped), so
      # the alert does not depend on fluent-bit's pod-label mapping. Do not add an
      # app: selector or a second substring; the Gitea rule one group up is a
      # standing reminder of what over-specific matching costs.
      - name: kia-collector
        type: vlogs
        interval: 15m
        rules:
          - alert: KiaCollectorFieldStoppedReporting
            # _time:1h against a 10-min cadence spans ~6 runs. `failures:>3` rather
            # than `>0` so a single transient None cannot page: a genuinely stopped
            # field warns on every run and crosses the threshold within the hour,
            # while a one-off blip ages out. Auto-resolves ~1h after the field
            # returns rather than dragging on for a day.
            #
            # Grouped, not a bare count — mirroring the gitea rule above, and for
            # the same reason. Without grouping every DEATHWATCH line in the window
            # lands in one bucket, so four SEPARATE runs each blipping on a
            # DIFFERENT field sum to 4 and page: precisely the false alarm `>3`
            # exists to prevent, moved from "one field over six runs" to "four
            # fields over four runs". The threshold only ever meant what the
            # summary claims if it is counted per field. (Review of #1834.)
            #
            # `fields` is a LIST, not one name: the collector emits one line per
            # run carrying every dead field comma-joined, so a persistent failure
            # repeats an identical list and groups cleanly. The known limit, stated
            # rather than glossed: if one field is permanently dead while another
            # blips, the list alternates between "a" and "a, b" and splits across
            # two groups, which can undercount. Emitting one line per field would
            # make this exactly per-field — a collector change, not an alert one.
            expr: >-
              _time:1h "DEATHWATCH:"
              | extract "returned nothing this run: <fields>."
              | stats by (fields) count() as failures | filter failures:>3
            labels:
              severity: warning
            annotations:
              summary: 'Kia collector: {{ $labels.fields }} stopped reporting'
              # Deliberately not critical. Nothing is broken or at risk; a metric has
              # stopped, and the remedy is diagnosis rather than a 3am intervention.
              description: >-
                {{ $labels.fields }} — wrote nothing on {{ $value }} of the last
                hour's runs, while the job itself kept succeeding, so no other alert
                can see it. Full log line: Grafana → Explore → VictoriaLogs:
                "DEATHWATCH:"
                First question is whether the value went away or the meaning did:
                the library maps out-of-range sentinels (255/0xFF) to None, so a
                field can "stop" because the car started reporting it as
                unavailable rather than because collection broke.
                If the field is known-broken and the cause is understood, add it to
                KNOWN_DEAD in collector.py with the date and reason — that silences
                this alert for that field while still reporting it if it recovers.
