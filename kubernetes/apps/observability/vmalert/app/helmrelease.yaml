---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vmalert
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: vmalert
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
    - name: victoria-logs
      namespace: observability
  values:
    controllers:
      vmalert:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: victoriametrics/vmalert
              tag: v1.148.0
            args:
              # Query logs from VictoriaLogs, notify the existing Alertmanager.
              - --datasource.url=http://victoria-logs-server.observability.svc.cluster.local:9428
              - --notifier.url=http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
              - --rule=/config/rules.yaml
              # Default any group without an explicit type to LogsQL (vlogs).
              - --rule.defaultRuleType=vlogs
              - --httpListenAddr=:8880
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8880
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8880
                  initialDelaySeconds: 5
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: vmalert
        ports:
          http:
            port: 8880
            protocol: TCP
    serviceMonitor:
      app:
        serviceName: vmalert
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 60s
    persistence:
      config:
        type: configMap
        name: vmalert-rules
        globalMounts:
          - path: /config/rules.yaml
            subPath: rules.yaml
            readOnly: true
