---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name gatus-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        INIT_POSTGRES_DBNAME: "{{ .Gatus__PostgresDbname }}"
        INIT_POSTGRES_HOST: &pghost ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Gatus__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Gatus__PostgresPass }}"
        CUSTOM_PUSHOVER_TOKEN: "{{ .Gatus__PushoverToken }}"
        CUSTOM_PUSHOVER_USER_KEY: "{{ .Pushover__UserKey }}"
        GATUS_AUTHENTIK_BASIC_AUTH: "{{ .Gatus__AuthentikBasicAuth }}"
        # A LiteLLM VIRTUAL key (alias `gatus`) restricted to the
        # `nous-qwen36-fallback` route with a $1/30d budget, for the Nous Portal
        # probe in resources/config.yaml. It cannot reach the Spark routes or
        # any admin endpoint. Rotate: mint a new key with /key/generate, patch
        # this field, delete the old one with /key/delete.
        LITELLM_GATUS_KEY: "{{ .LiteLLM__Keys__Gatus }}"

  dataFrom:
    - extract:
        key: gatus
    - extract:
        key: pushover
    - extract:
        key: cloudnative-pg
    - extract:
        key: litellm
