---
# Note: Gatus vars should be escaped with $${VAR_NAME} to avoid interpolation by Flux
# Service endpoints are auto-generated by gatus-sidecar from HTTPRoute/Ingress resources
# Manual endpoints below for connectivity and external monitoring

web:
  port: $${CUSTOM_WEB_PORT}

storage:
  type: postgres
  path: "postgres://$${INIT_POSTGRES_USER}:$${INIT_POSTGRES_PASS}@$${INIT_POSTGRES_HOST}:5432/$${INIT_POSTGRES_DBNAME}?sslmode=disable"
  caching: true

metrics: true
debug: false

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/180652609
  link: https://github.com/bluevulpine
  buttons:
    - name: GitHub
      link: https://github.com/bluevulpine
    - name: Homelab
      link: https://github.com/bluevulpine/flux-talos

alerting:
  pushover:
    application-token: $${CUSTOM_PUSHOVER_TOKEN}
    user-key: $${CUSTOM_PUSHOVER_USER_KEY}
    default-alert:
      description: health-check failed
      send-on-resolved: true
      failure-threshold: 5
      success-threshold: 2

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

# Manual endpoints for connectivity and external monitoring
endpoints:
  # Connectivity checks - verify internet access via multiple DNS providers
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  # External monitoring - check services from outside perspective
  - name: Status Page
    group: external
    url: "https://status.${SECRET_DOMAIN}"
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: Flux Webhook
    group: external
    url: "https://flux-webhook.${SECRET_DOMAIN}"
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 404"
    alerts:
      - type: pushover

  # Pangolin tunnel path (VPS → Newt → Envoy). These are the only checks that
  # exercise what a user off-LAN actually experiences. Every other Pangolin
  # signal — newt's websocket, gerbil's wg0, traefik's metrics — is component
  # health, and during the 2026-08-22 outage all of it stayed green while the
  # hostnames were dark, because what broke sat in front of the components (DNS).
  # "All components healthy, users can't connect" is undetectable without an
  # end-to-end probe, so these exist to catch precisely that.
  #
  # dns-resolver is load-bearing, not boilerplate: without it these names resolve
  # through split-horizon to the LAN Envoy IP (172.16.8.2), the check passes over
  # the internal path, and it silently tests nothing about the tunnel.
  #
  # These conditions assert AVAILABILITY ONLY, deliberately. An earlier draft
  # also asserted [CERTIFICATE_EXPIRATION] > 168h here; that was dropped for two
  # reasons. It is not the only cert monitoring — PangolinCertificateExpiringSoon
  # already alerts on traefik_tls_certs_not_after at 14 days, which is a WEEK
  # MORE lead time, not less. And folding cert age into an availability probe
  # corrupts the signal this probe exists to produce: a cert six days from expiry
  # would mark the endpoint DOWN in gatus's uptime history and page
  # "health-check failed" for a service that is serving every request perfectly.
  # A genuine expiry still fails the TLS handshake and is caught here anyway.
  # (A tailnet-independent cert check would have real value — the PromQL alert
  # dies with the VPS exporter scrape — but it belongs in its own endpoint, not
  # bolted onto this one.)
  #
  # Coverage is 2 of the 9 hostnames on this path, chosen as the two whose loss
  # matters most: the Immich data path and the Authentik front door. Traefik
  # routes per-host, so a failure confined to mealie/karakeep/requests/couchdb/
  # openspeedtest/echo-server-pangolin is still invisible here.
  - name: Immich (Pangolin)
    group: external
    url: "https://photos.${SECRET_DOMAIN}"
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  - name: Authentik (Pangolin)
    group: external
    url: "https://sso.${SECRET_DOMAIN}"
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      # Unauthenticated, authentik answers 302 to its default authentication
      # flow. Gatus follows redirects by default and would then record the 200
      # from that flow instead — accept both, so this does not page whenever
      # authentik changes its mind about which one we observe.
      - "[STATUS] == any(200, 302)"
    alerts:
      - type: pushover

  # The DGX Spark's inference engine: vLLM on :8000 (spark-setup, roles/vllm),
  # serving Qwen3.6 behind every `spark-*` text and vision route in LiteLLM.
  # Hindsight's retain, consolidation and reflect all depend on it, and it is a
  # box OUTSIDE the cluster, so pod health says nothing about it.
  #
  # Probes /v1/models, the same OpenAI-compatible surface LiteLLM calls. The
  # len() condition is the load-bearing half: a listener that answers 200 with
  # NOTHING loaded fails every request with "model not found" while a plain
  # status check sits green.
  #
  # ⚠️ Reachability, not capacity: /v1/models answers in milliseconds even when
  # the engine is saturated. A dead ENGINE behind a live API server does fail
  # this (the container's own watchdog restarts it).
  #
  # Addressed by IP, matching the api_base LiteLLM uses, so this exercises the
  # SAME path. `spark-ab23.${SECRET_DOMAIN}` once stopped resolving hours after
  # it was created; restore the name here only when the LiteLLM api_base goes
  # back to it, and only after verifying it resolves from inside a pod.
  #
  # There was a second probe, `DGX Spark (Ollama)` on :11434. Ollama was retired
  # on 2026-10-05 (spark-setup ollama_enabled: false) when Qwen3.6 took over
  # vision; a probe for a stopped service with no consumers only pages.
  - name: DGX Spark (vLLM)
    group: inference
    url: "http://10.0.10.237:8000/v1/models"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].data) > 0"
    alerts:
      - type: pushover

  # The second vLLM replica (2026-10-26). LiteLLM routes around it when it is
  # down, so nothing user-facing fails -- but capacity halves, and that is
  # worth a page.
  - name: GX10 (vLLM)
    group: inference
    url: "http://10.0.10.117:8000/v1/models"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].data) > 0"
    alerts:
      - type: pushover

  # LiteLLM itself, probed DIRECTLY over cluster DNS rather than through its
  # HTTPRoute. The route carries `auth: authentik`, so an unauthenticated probe
  # against the hostname is redirected to SSO -- and gatus follows redirects, so
  # a 200 from the Authentik LOGIN PAGE would read as healthy while LiteLLM was
  # dead. That check would monitor the SSO layer, not the gateway.
  #
  # This matters more than usual here: LiteLLM is the single path every LLM call
  # in the cluster takes, and the `DGX Spark (vLLM)` probe above tests only the
  # BACKEND -- it stays green when the proxy in front of it is down.
  #
  # /health/readiness is LiteLLM's own readiness endpoint and returns
  # {"status":"healthy","db":"connected"}, so the db condition also catches a
  # Postgres-side failure that would break key lookups and spend tracking.
  - name: LiteLLM
    group: inference
    url: "http://litellm.ai.svc.cluster.local:4000/health/readiness"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].db == connected"
    alerts:
      - type: pushover

  # The hosted fallback behind `spark-main` and `hindsight-main` (whose chain
  # continues to claude-haiku-5-5): Nous Portal, probed THROUGH LiteLLM
  # on the `nous-qwen36-fallback` route with a key that can reach nothing else
  # (LITELLM_GATUS_KEY, alias `gatus`, $1/30d budget). Nothing exercises this
  # path until the Spark is down, which is exactly when a lapsed key or spent
  # credits would surface -- and badly: LiteLLM buries a dead fallback in a
  # nested AuthenticationError, so a Spark outage reads as an auth problem
  # somewhere else (fallbacks note in the litellm HelmRelease). A probe of
  # /v1/models would not do: it answers 200 on an exhausted account. Only a
  # real completion proves the key AND the credits.
  #
  # Cost: max_tokens 1 on a 19-token prompt measured $0.00000285 a call
  # (usage.cost, 2026-10-12), so every 30 minutes is under a cent a year; the
  # key's own budget caps a runaway at $1. completion_tokens >= 1 is the
  # load-bearing condition: it proves the MODEL answered, not just that the
  # gateway returned JSON. Thinking is off on the route, so that one token is
  # the answer ("pong", finish_reason length), not reasoning. 1.6s measured.
  - name: Nous Portal (LiteLLM fallback)
    group: inference
    url: "http://litellm.ai.svc.cluster.local:4000/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer $${LITELLM_GATUS_KEY}"
      Content-Type: application/json
    body: '{"model":"nous-qwen36-fallback","messages":[{"role":"user","content":"Reply with the single word pong."}],"max_tokens":1}'
    interval: 30m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].usage.completion_tokens >= 1"
    alerts:
      - type: pushover
        # The default-alert threshold of 5 is tuned for 1m probes; at 30m it
        # would be ~2.5h before anyone heard. 2 x 30m is about an hour, and a
        # single Nous blip still does not page.
        failure-threshold: 2
