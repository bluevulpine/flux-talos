---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/imageupdateautomation-image-v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: &app bluevulpine-blog
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-talos-ssh
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: Flux
        email: flux@derekjacobs.dev
      messageTemplate: |
        chore(images): update {{ range .Changed.Changes }}{{ println .NewValue }}{{ end }}
    push:
      branch: main
  update:
    # Scope to this app only. A whole-repo (./kubernetes) scan with Setters
    # rewrites EVERY $imagepolicy marker in the tree, silently driving other
    # apps' images (this is what mangled kia-collector's marker). One
    # automation per app keeps ownership explicit.
    path: ./kubernetes/apps/default/bluevulpine-blog
    strategy: Setters
