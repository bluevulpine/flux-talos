---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_DOMAIN/./-}-production"
spec:
  secretName: "${SECRET_DOMAIN/./-}-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${SECRET_DOMAIN:=temp}"
  dnsNames:
    - "${SECRET_DOMAIN:=temp}"
    - "*.${SECRET_DOMAIN:=temp}"
    # Nexus registry mirrors (docker-hub.nexus., ghcr.nexus., ...) are one label
    # deeper than *.${SECRET_DOMAIN} covers, so without this the internal gateway
    # served them a cert with no matching SAN and containerd's mirror requests to
    # Nexus failed TLS (found 2026-10-20). Talos points every node at these hosts
    # in talos/patches/all/12-registry-mirrors.yaml.tpl.
    - "*.nexus.${SECRET_DOMAIN:=temp}"
    - "${SECRET_DOMAIN_BLOG:=temp}"
    - "*.${SECRET_DOMAIN_BLOG:=temp}"
    - "${SECRET_DOMAIN_BLOGCOM:=temp}"
    - "*.${SECRET_DOMAIN_BLOGCOM:=temp}"
    - "${SECRET_DOMAIN_MEDIA:=temp}"
    - "*.${SECRET_DOMAIN_MEDIA:=temp}"
    - "${SECRET_DOMAIN_LAKE:=temp}"
    - "*.${SECRET_DOMAIN_LAKE:=temp}"
    - "${SECRET_DOMAIN_YOYO:=temp}"
    - "*.${SECRET_DOMAIN_YOYO:=temp}"
    - "${SECRET_DOMAIN_BON:=temp}"
    - "*.${SECRET_DOMAIN_BON:=temp}"

