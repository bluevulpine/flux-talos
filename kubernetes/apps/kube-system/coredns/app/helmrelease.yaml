---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    replicaCount: 2
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.96.0.10
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Suppress AAAA cluster-wide: kopia resolves AAAA for R2 and then can't
          # connect over IPv6 (original rationale, commit 6bb34324d). This replaces
          # `acl { filter type AAAA }`, which achieved the same suppression but
          # emitted ~14 errors/sec:
          #   [ERROR] plugin/acl: Blocking request. Unable to parse source address:
          #
          # Measured on 2026-08-09 (5m rates, both pods):
          #   coredns_acl_blocked_requests_total   14.266666666666666/s
          #   coredns_cache_prefetch_total         14.266666666666666/s  (identical)
          #   coredns_cache_served_stale_total     ~14.27/s
          #   coredns_acl_filtered_requests_total   0.07/s
          # The blocked and prefetch counters track each other exactly, and stale
          # serving runs at the same rate. Client resolution was unaffected (60/60
          # A lookups OK), so the blocked requests are not client queries.
          #
          # At the time we inferred acl was rejecting the cache's background
          # refreshes (no parseable source address), leaving the cache effectively
          # stale-only. MEASURED AFTER APPLY, that inference did NOT hold:
          #
          #             prefetch/s  served_stale/s  ratio   acl errors/5m
          #   pre-fix     14.27        14.27        1.000      ~4200
          #   T+0.4h      16.31        11.77        0.722         0
          #   T+1.4h      15.93        11.57        0.726         0
          #   T+2.4h      15.96        11.80        0.738         0
          #   T+3.5h      16.15        11.72        0.726         0
          #
          # The 1:1 lock is gone, but served_stale only fell ~18% and then parked
          # at ~0.73 of prefetch, flat over 3+ hours. Had acl blocking been what
          # prevented refreshes, removing it should have collapsed stale-serving.
          # It did not — so ~12/s stale-serving is this cache's normal behaviour
          # for this TTL and query mix, not damage acl was doing. The pre-fix 1:1
          # equality was an artifact: every prefetch passed through acl and tripped
          # the unparseable-source path, so the counters moved together without acl
          # actually preventing the refresh.
          #
          # What the change DID deliver, verified: the acl error stream is gone
          # (~14/s -> 0, roughly 1.2M log lines/day), coredns_acl_* series no longer
          # exist, and client behaviour is unchanged — AAAA still returns NOERROR
          # with an empty answer (cloudflare.com and google.com both 0 IPv6 records
          # before and after) while A resolution is clean (0/40 failures).
          #
          # FOLLOW-UP (the actual cache finding): the stale-serving above is the AAAA
          # suppression itself, not a sick cache. Measured:
          #   served_stale / denial-cache-hits = 1.06  (~every NODATA hit is stale)
          #   served_stale / success-cache-hits = 0.42 (normal entries cache fine)
          #   AAAA 18.3/s vs A 18.3/s — clients all resolve dual-stack
          #   cache misses 0.05/s — entries never leave cache, they just expire
          #
          # `dig` showed why: the suppressed answer was
          #   status: NOERROR, ANSWER: 0, AUTHORITY: 0
          # a bare NODATA with NO SOA. Negative-answer cache lifetime comes from the
          # SOA minimum (RFC 2308); with no authority section there is nothing to
          # derive a TTL from, so each entry expires ~immediately and every following
          # AAAA query is served stale and triggers another prefetch. acl's `filter`
          # emitted an equally bare NODATA, which is exactly why swapping acl->template
          # barely moved the ratio: it changed which plugin answers, not the fact that
          # the answer was uncacheable.
          #
          # The authority SOA below makes the negative answer cacheable for 300s, so
          # AAAA is answered from cache instead of regenerated + served stale.
          # 300s is deliberately modest: a cached NODATA delays any future IPv6
          # enablement by at most that long.
          #
          # ⚠️ DO NOT write the SOA names as `ns.dns.{{ .Zone }}` — that is the form
          # in the upstream CoreDNS examples, but those assume a zone like
          # `example.com.`. Our server block's zone is `.`, so it renders `ns.dns..`
          # (double dot), which is an invalid name. CoreDNS then fails the template
          # and returns SERVFAIL for EVERY AAAA query cluster-wide:
          #   [ERROR] plugin/errors: ... AAAA: dns: bad SOA Ns: "ns.dns.." at line: 1:22
          # A-record resolution keeps working, so this does not look like an outage
          # at first glance — but dual-stack clients get SERVFAIL on the AAAA half.
          # Use absolute names that do not interpolate the zone, as below.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
              authority "{{ .Zone }} 300 IN SOA ns.dns. hostmaster.dns. (1 300 300 300 300)"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
      # bluevulpine.net is answered from PUBLIC DNS inside the cluster, not from the
      # UniFi split horizon. Why: our two Matrix homeservers federate with each other
      # (kubernetes/apps/matrix, kubernetes/apps/matrix-bluevulpine), and discovering
      # bluevulpine.net starts with its APEX /.well-known/matrix/server. UniFi answers
      # the apex (the blog) with the internal gateway 172.16.8.2, which Synapse's SSRF
      # blacklist refuses, so derekjacobs.dev could not federate to bluevulpine.net.
      # The derekjacobs.dev apex already resolves publicly, so this makes the two
      # zones behave the same. Every *.bluevulpine.net HOST is public (Cloudflare or
      # Pangolin), so nothing in-cluster loses a name; LAN clients still use UniFi,
      # unaffected. But in-cluster clients now take the PUBLIC path, so paths routed
      # only on the `internal` gateway are unreachable from pods: matrix.bluevulpine.net
      # /_synapse/admin, /_synapse/mas, /_synapse/ess and account.bluevulpine.net
      # /api/admin (404 at the Pangolin edge). Nothing in-cluster calls them today; an
      # in-cluster admin job for that server must use the Service, not the hostname.
      # Gatus checks of bluevulpine.net routes likewise go via Cloudflare/Pangolin.
      # Rejected alternatives (#2059): Synapse ip_range_whitelist for .2 (opens the
      # whole internal gateway to Synapse's outbound clients, pushers included), an
      # SRV fallback (Synapse keeps Host/SNI = server_name, so it hits the blog),
      # pinning the apex to a Cloudflare edge IP (brittle).
      #
      # The zone is a LITERAL, not ${SECRET_DOMAIN_BLOG}: bootstrap/helmfile.d reads
      # these values raw (no Flux substitution), and an unrendered placeholder in a
      # Corefile zone could stop cluster DNS from starting during a rebuild. The
      # domain is public anyway (it is the blog).
      #
      # forward appears once per server block, hence a block of its own. It repeats
      # the AAAA suppression above, absolute SOA names included (see the outage note
      # there); without it this zone would hand pods Cloudflare's IPv6 answers.
      - zones:
          - zone: bluevulpine.net.
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
              authority "{{ .Zone }} 300 IN SOA ns.dns. hostmaster.dns. (1 300 300 300 300)"
          - name: forward
            parameters: . 1.1.1.1 1.0.0.1
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          # Metrics are per server block; without this the zone's queries never reach
          # coredns_dns_requests_total. The same address in several blocks is supported.
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    # Memory: requests = limits (Guaranteed QoS). The 66.6 MiB coredns binary's
    # executed pages are charged to the container's memory cgroup on top of ~20 MiB
    # RSS: measured 91.6 MiB working set (2026-10-03) against the old 128Mi limit,
    # so only ~36 MiB headroom for cache + service growth. A limit near the binary
    # size thrashes page cache and wedges startup, see wican-bridge in #2045.
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 100m
        memory: 192Mi
    # Never two replicas on one node; prefer the control plane (a preference only:
    # after a rollout both may sit on brokkr until something reschedules them).
    # This was a REQUIRED control-plane pin, which with a single control plane
    # (freyja01) put both replicas on it: draining freyja01 for the v1.13.11
    # upgrade left them Pending and cluster DNS was down ~5.5 min (2026-10-03),
    # crashlooping Flux, authentik, envoy-gateway and others. A running replica
    # keeps answering from its in-memory service list while the API is down, and
    # Cilium keeps routing the kube-dns VIP, so the worker replica covers a
    # control-plane reboot. All nodes forward upstream to the same resolver
    # (10.0.10.1), so placement does not change answers.
    # Eligible nodes: freyja01 + brokkr01-03. The Pis are excluded by their
    # node.kubernetes.io/low-power NoSchedule taint, which CoreDNS does not tolerate.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: coredns
                k8s-app: kube-dns
    # A drain (e.g. a Talos node roll) may take down only one replica at a time.
    podDisruptionBudget:
      maxUnavailable: 1
    # Cluster DNS is a critical add-on: schedule ahead of (and preempt) ordinary
    # pods when a node is full, and fall under the descheduler's
    # evictSystemCriticalPods: false protection. The chart default is none.
    priorityClassName: system-cluster-critical
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
