---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    replicaCount: 2
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.96.0.10
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Suppress AAAA cluster-wide: kopia resolves AAAA for R2 and then can't
          # connect over IPv6 (original rationale, commit 6bb34324d). This replaces
          # `acl { filter type AAAA }`, which achieved the same suppression but
          # emitted ~14 errors/sec:
          #   [ERROR] plugin/acl: Blocking request. Unable to parse source address:
          #
          # Measured on 2026-08-09 (5m rates, both pods):
          #   coredns_acl_blocked_requests_total   14.266666666666666/s
          #   coredns_cache_prefetch_total         14.266666666666666/s  (identical)
          #   coredns_cache_served_stale_total     ~14.27/s
          #   coredns_acl_filtered_requests_total   0.07/s
          # The blocked and prefetch counters track each other exactly, and stale
          # serving runs at the same rate. Client resolution was unaffected (60/60
          # A lookups OK), so the blocked requests are not client queries.
          #
          # At the time we inferred acl was rejecting the cache's background
          # refreshes (no parseable source address), leaving the cache effectively
          # stale-only. MEASURED AFTER APPLY, that inference did NOT hold:
          #
          #             prefetch/s  served_stale/s  ratio   acl errors/5m
          #   pre-fix     14.27        14.27        1.000      ~4200
          #   T+0.4h      16.31        11.77        0.722         0
          #   T+1.4h      15.93        11.57        0.726         0
          #   T+2.4h      15.96        11.80        0.738         0
          #   T+3.5h      16.15        11.72        0.726         0
          #
          # The 1:1 lock is gone, but served_stale only fell ~18% and then parked
          # at ~0.73 of prefetch, flat over 3+ hours. Had acl blocking been what
          # prevented refreshes, removing it should have collapsed stale-serving.
          # It did not — so ~12/s stale-serving is this cache's normal behaviour
          # for this TTL and query mix, not damage acl was doing. The pre-fix 1:1
          # equality was an artifact: every prefetch passed through acl and tripped
          # the unparseable-source path, so the counters moved together without acl
          # actually preventing the refresh.
          #
          # What the change DID deliver, verified: the acl error stream is gone
          # (~14/s -> 0, roughly 1.2M log lines/day), coredns_acl_* series no longer
          # exist, and client behaviour is unchanged — AAAA still returns NOERROR
          # with an empty answer (cloudflare.com and google.com both 0 IPv6 records
          # before and after) while A resolution is clean (0/40 failures).
          #
          # Keep template regardless: it achieves the same AAAA suppression without
          # an error path. But do NOT cite this change as a DNS-caching fix.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
