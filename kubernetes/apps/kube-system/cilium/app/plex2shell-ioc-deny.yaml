---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: plex2shell-ioc-deny
spec:
  description: >-
    Deny traffic to and from the published Plex2Shell indicators (PMS
    CVE-2026-96651..96656, unauthenticated RCE, fixed in 1.43.3.10861, in the
    wild since 2026-10-17; The Hacker News and Aviatrix write-ups, 2026-10).
    217.60.194.116 hosts the miner payload the exploit's dropper fetches with
    wget/curl; the other three are the reported exploit sources. Plex is
    internet-facing here, so this is cheap defence in depth behind the real
    fix, which is running a patched PMS (pinned, automerged by Renovate).

    The C2/pool names (proxystream.st, ota.proxystream.st) are not here:
    Cilium's egressDeny has no toFQDNs. They belong in a UniFi DNS block,
    because UniFi is also the cluster's upstream (CoreDNS -> node resolver ->
    10.0.10.1), so that one block covers pods and the rest of the LAN.

    enableDefaultDeny is false in BOTH directions, and that is load-bearing:
    this selects every endpoint, and without it a policy with egress/ingress
    sections puts every pod into default-deny (see the warning in
    ai/hermes/app/ciliumnetworkpolicy.yaml). With it, this only subtracts these
    addresses.

    Limits: inbound matching needs the client IP preserved to the pod, which
    Plex's LoadBalancer Service (externalTrafficPolicy: Cluster) may SNAT away,
    so treat the UniFi WAN firewall as the authoritative inbound block; the
    ingressDeny here only catches what arrives unmasqueraded. Host-network pods
    and the nodes are outside endpointSelector entirely (host firewall is off).
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 217.60.194.116/32
        - 91.92.40.202/32
        - 176.65.139.228/32
        - 45.194.92.222/32
  ingressDeny:
    - fromCIDR:
        - 217.60.194.116/32
        - 91.92.40.202/32
        - 176.65.139.228/32
        - 45.194.92.222/32
