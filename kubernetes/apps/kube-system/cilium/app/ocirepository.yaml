---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.20.4
  # Cilium's own OCI chart. home-operations/charts-mirror deprecated its copy
  # 2026-01-13 (#388) and pulled it ~2026-10-28; ghcr now answers DENIED.
  # No `verify:` block: the mirror's cosign identity was the mirror's own CI,
  # and quay.io/cilium/charts publishes no signature (no .sig tag, empty
  # referrers for 1.18.6, checked 2026-10-29).
  url: oci://quay.io/cilium/charts/cilium
