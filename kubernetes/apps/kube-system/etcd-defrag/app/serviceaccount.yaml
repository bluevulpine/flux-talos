---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/talos.dev/serviceaccount_v1alpha1.json
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-etcd-defrag
spec:
  # os:admin is the narrowest role already allowed by kubernetesTalosAPIAccess
  # in talconfig.yaml (talos/talconfig.yaml) — etcd defrag has no dedicated
  # os:etcd:* role the way backup does, so admin is required.
  roles:
    - os:admin
