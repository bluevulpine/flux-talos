---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
spec:
  # Sundays 03:30 — clear of talos-s3-backup's hourly :10 and talos-offsite's :40, low-traffic window.
  schedule: "30 3 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          restartPolicy: Never
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # One etcd member since 2026-09-22: the freyja01 control-plane VM on
          # vault (docs/runbooks/controlplane-migration-to-vault-vm.md). A defrag
          # blocks reads and writes on the member it runs against, and with one
          # member that is the whole cluster API. At ~360 MB it takes seconds, and
          # Sunday 03:30 is the quietest window. It stays an initContainer so a
          # failure fails the Job before the `done` container runs.
          #
          # If more control-plane members are ever added, give each its own
          # initContainer again: they must be defragmented one at a time, never
          # concurrently, and initContainers give that sequencing for free.
          initContainers:
            - name: defrag-freyja01
              # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
              image: ghcr.io/siderolabs/talosctl:v1.13.9
              args:
                - "-n"
                - "10.0.10.35"
                - "etcd"
                - "defrag"
              restartPolicy: Never
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets
                  readOnly: true
          containers:
            # initContainers do the real work; this just gives the Pod a required
            # main container and a cheap proof the Talos API was reachable at all.
            - name: done
              image: ghcr.io/siderolabs/talosctl:v1.13.9
              args:
                - "version"
                - "--client"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: talos-secrets
              secret:
                secretName: talos-etcd-defrag
