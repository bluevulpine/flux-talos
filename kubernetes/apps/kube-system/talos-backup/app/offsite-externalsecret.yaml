---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# rclone remotes for talos-offsite: source is the Garage `talos` bucket on vault,
# destination is the R2 bucket `talos-etcd`.
#
# rclone's env-var config form (RCLONE_CONFIG_<REMOTE>_<KEY>) keeps the job free of
# an rclone.conf on disk, same as cnpg-offsite.
#
# R2 credentials come from the existing OpenBao key `r2` (also used by
# openbao-snapshot). The bucket must exist and that token must be able to write to it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name talos-offsite-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Source: Garage on vault. REGION must be us-east-1 — Garage rejects any
        # other region string with AuthorizationHeaderMalformed.
        RCLONE_CONFIG_GARAGE_TYPE: s3
        RCLONE_CONFIG_GARAGE_PROVIDER: Other
        RCLONE_CONFIG_GARAGE_REGION: us-east-1
        RCLONE_CONFIG_GARAGE_ENDPOINT: "{{ .Garage__Host }}"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .Garage__AccessKey }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .Garage__SecretKey }}"
        # Destination: Cloudflare R2.
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_REGION: auto
        RCLONE_CONFIG_R2_ENDPOINT: "https://${SECRET_CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ .R2__AccessKey }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ .R2__SecretKey }}"
        # Don't try to create the bucket: a bucket-scoped R2 token can't, and the
        # failed CreateBucket would abort the copy.
        RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  dataFrom:
    - extract:
        key: garage
    - extract:
        key: r2
