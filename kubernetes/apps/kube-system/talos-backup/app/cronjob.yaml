---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
# Snapshots etcd and uploads it to the Garage `talos` bucket, then prunes.
#
# The prune step exists because the retention this job's README has always claimed
# ("the bucket has a retention of 7 days") was never actually happening on Garage:
# no lifecycle configuration exists on any Garage bucket, so every snapshot ever
# taken was still present — 975 objects / 443 GiB going back to 2025-12-27, at
# 4/day, none ever deleted. The rule almost certainly lived on the old R2 bucket
# and did not survive the move to Garage.
#
# Retention is enforced HERE rather than as a Garage lifecycle rule on purpose:
# a bucket-side rule is invisible to git, which is precisely how this regressed
# unnoticed for eight months. Garage exposes no per-bucket object-count metric,
# so there is nothing to alert on either — a job that fails is the only loud option.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-s3-backup
spec:
  schedule: "10 0/6 * * *"
  jobTemplate:
    spec:
      # Give up after one retry instead of the default 6. restartPolicy below is
      # OnFailure, which restarts the container IN PLACE rather than making a new
      # Pod (verified in-cluster: a deliberately OOMKilled mirror of this Job
      # produced one Pod whose restartCount climbed, never a second Pod). So this
      # does not bound anything per-Pod -- what it bounds is how long the Job
      # thrashes before failing: the default 6 kept the 2026-09-04 18:10Z run
      # restarting for 32 minutes. Runs are 6h apart against 30d of retention, so
      # losing one attempt costs nothing and a fast, loud failure is worth more.
      backoffLimit: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            # Snapshot + upload runs to completion FIRST, so the prune below can
            # never race it and count a not-yet-uploaded snapshot toward the keep set.
            - name: talos-backup
              # renovate: datasource=docker depName=ghcr.io/siderolabs/talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
              workingDir: /tmp
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: talos-s3-secret
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /talos-backup
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets
          containers:
            # Keep the 120 most recent snapshots = 30 days at the 4/day schedule
            # above. 30d rather than the 7d the README used to claim: a snapshot is
            # ~260 MB and Garage dedupes near-identical ones hard, so the wider
            # window costs ~24 GB over a 7d one and matches the 30d retention now
            # used for Postgres (see cluster18/objectstore.yaml).
            # Count-based rather than date-based (same approach as openbao-snapshot):
            # the schedule is fixed, so a count needs no date arithmetic and cannot
            # misfire on a timezone or a GNU-vs-BSD `date` difference.
            # NOTE: if the schedule changes, change 121 (= keep + 1) to match.
            # Deletes run SERIALLY, deliberately. `xargs -P 8` here OOMKilled this
            # job on 2026-09-04 (exit 137): aws-cli v2 is a bundled Python
            # interpreter, and while one process peaks at ~69 MB (measured in-pod),
            # eight concurrent ones blow past the 256Mi limit below before the
            # prune can finish. Observed side effect: that run wrote 9 snapshots on
            # 2026-09-04 instead of the scheduled 4, six of them inside the 24-min
            # failure window, so a job meant to REDUCE the object count increased
            # it. The mechanism was not reproduced -- OnFailure restarts the
            # container in place and re-runs no initContainer, so why the snapshot
            # step ran repeatedly is still unexplained. Do not assume backoffLimit
            # alone prevents it.
            # Serial costs nothing: steady state is 4 deletes per run (~4s), and
            # the one-time ~855-object backfill that justified -P 8 is already done.
            # If a future backfill needs speed, batch with `aws s3api delete-objects`
            # (1000 keys per call, still ONE process) -- never with more processes.
            - name: prune
              image: amazon/aws-cli:2.36.32
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                # Supplies AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION
                # plus BUCKET, S3_PREFIX and CUSTOM_S3_ENDPOINT.
                - secretRef:
                    name: talos-s3-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BASE="s3://$${BUCKET}/$${S3_PREFIX}/"
                  TOTAL=$(aws s3 ls "$${BASE}" --endpoint-url "$${CUSTOM_S3_ENDPOINT}" | wc -l)
                  echo "$${TOTAL} snapshots present; keeping 120 most recent."
                  aws s3 ls "$${BASE}" --endpoint-url "$${CUSTOM_S3_ENDPOINT}" \
                    | awk '{print $4}' | sort -r | tail -n +121 \
                    | xargs -r -I{} aws s3 rm "$${BASE}{}" \
                        --endpoint-url "$${CUSTOM_S3_ENDPOINT}"
                  REMAIN=$(aws s3 ls "$${BASE}" --endpoint-url "$${CUSTOM_S3_ENDPOINT}" | wc -l)
                  echo "Prune complete: $${TOTAL} -> $${REMAIN}."
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
          restartPolicy: OnFailure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          volumes:
            - emptyDir: {}
              name: tmp
            - name: talos-secrets
              secret:
                secretName: talos-s3-backup
