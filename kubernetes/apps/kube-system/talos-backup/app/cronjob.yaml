---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
# Snapshots etcd and uploads it to the Garage `talos` bucket, then prunes.
#
# The prune step exists because the retention this job's README has always claimed
# ("the bucket has a retention of 7 days") was never actually happening on Garage:
# no lifecycle configuration exists on any Garage bucket, so every snapshot ever
# taken was still present — 975 objects / 443 GiB going back to 2025-12-27, at
# 4/day, none ever deleted. The rule almost certainly lived on the old R2 bucket
# and did not survive the move to Garage.
#
# Retention is enforced HERE rather than as a Garage lifecycle rule on purpose:
# a bucket-side rule is invisible to git, which is precisely how this regressed
# unnoticed for eight months. Garage exposes no per-bucket object-count metric,
# so there is nothing to alert on either — a job that fails is the only loud option.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-s3-backup
spec:
  schedule: "10 0/6 * * *"
  jobTemplate:
    spec:
      # Give up after one retry instead of the default 6. restartPolicy below is
      # OnFailure, which restarts the container IN PLACE rather than making a new
      # Pod (verified in-cluster: a deliberately OOMKilled mirror of this Job
      # produced one Pod whose restartCount climbed, never a second Pod), so an
      # in-place restart never touches .status.failed. What DOES increment it is
      # losing the whole Pod -- and on 2026-09-04 that happened seven times via
      # descheduler eviction, which is exactly why that run reached .status.failed=7
      # and thrashed for 32 minutes on the default limit.
      #
      # That makes this bound sharper than 990289ff claimed. Each increment is one
      # replacement Pod, and each replacement Pod re-runs the initContainer, so the
      # limit caps snapshots at backoffLimit + 1 -- it does bound initContainer
      # executions. At 1, a repeat of that day costs one extra snapshot, not five.
      # Runs are 6h apart against 30d of retention, so losing one attempt costs
      # nothing and a fast, loud failure is worth more. See the prune comment below.
      backoffLimit: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            # Snapshot + upload runs to completion FIRST, so the prune below can
            # never race it and count a not-yet-uploaded snapshot toward the keep set.
            - name: talos-backup
              # renovate: datasource=docker depName=ghcr.io/siderolabs/talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3
              workingDir: /tmp
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: talos-s3-secret
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /talos-backup
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets
          containers:
            # Keep the 120 most recent snapshots = 30 days at the 4/day schedule
            # above. 30d rather than the 7d the README used to claim: a snapshot is
            # ~260 MB and Garage dedupes near-identical ones hard, so the wider
            # window costs ~24 GB over a 7d one and matches the 30d retention now
            # used for Postgres (see cluster18/objectstore.yaml).
            # Count-based rather than date-based (same approach as openbao-snapshot):
            # the schedule is fixed, so a count needs no date arithmetic and cannot
            # misfire on a timezone or a GNU-vs-BSD `date` difference.
            # NOTE: if the schedule changes, change 121 (= keep + 1) to match.
            # Deletes run SERIALLY, deliberately. `xargs -P 8` here OOMKilled this
            # job on 2026-09-04 (exit 137): aws-cli v2 is a bundled Python
            # interpreter, and while one process peaks at ~69 MB (measured in-pod),
            # eight concurrent ones blow past the 256Mi limit below before the
            # prune can finish. Thanos confirms it for that run --
            # kube_pod_container_status_last_terminated_reason returns OOMKilled for
            # the prune container in all six Pods that reached it, and no Pod ever
            # logged "Prune complete".
            #
            # That run also took 6 etcd snapshots inside its 32-minute failure window
            # instead of the scheduled 1, so a job meant to REDUCE the object count
            # raised it by 5. 990289ff left that mechanism unexplained, correctly
            # ruling out OnFailure (which restarts the container IN PLACE and re-runs
            # no initContainer). The Pods were not restarting, they were being
            # REPLACED: the descheduler evicted this Job's Pod seven times, exactly
            # five minutes apart, strategy=LowNodeUtilization, every one from
            # brokkr02. An eviction deletes the Pod, so the Job controller creates a
            # new one -- and a new Pod runs the initContainer again. Snapshot
            # timestamps line up one-for-one with the evictions. Seven evictions
            # yield six snapshots because the seventh Pod was evicted at 18:42:30Z,
            # the same second the Job hit BackoffLimitExceeded, and logged none.
            #
            # The standing hazard is therefore not retries: any run of this Job that
            # outlives one 5-minute descheduler pass can be restarted from scratch,
            # snapshot included. backoffLimit above caps that at one extra snapshot,
            # and a fast prune -- 62-94s post-fix against the 300s pass -- is what
            # actually avoids it. Opting the Pod out of eviction was considered and
            # declined on 2026-09-06; see
            # ../../descheduler/LOAD_BALANCING_ENHANCEMENT.md.
            # Serial costs nothing: steady state is ONE delete per run (4/day), and
            # the one-time ~855-object backfill that justified -P 8 is already done.
            # If a future backfill needs speed, batch with `aws s3api delete-objects`
            # (1000 keys per call, still ONE process) -- never with more processes.
            - name: prune
              image: amazon/aws-cli:2.36.44
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                # Supplies AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION
                # plus BUCKET, S3_PREFIX and CUSTOM_S3_ENDPOINT.
                - secretRef:
                    name: talos-s3-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BASE="s3://$${BUCKET}/$${S3_PREFIX}/"
                  TOTAL=$(aws s3 ls "$${BASE}" --endpoint-url "$${CUSTOM_S3_ENDPOINT}" | wc -l)
                  echo "$${TOTAL} snapshots present; keeping 120 most recent."
                  aws s3 ls "$${BASE}" --endpoint-url "$${CUSTOM_S3_ENDPOINT}" \
                    | awk '{print $4}' | sort -r | tail -n +121 \
                    | xargs -r -I{} aws s3 rm "$${BASE}{}" \
                        --endpoint-url "$${CUSTOM_S3_ENDPOINT}"
                  REMAIN=$(aws s3 ls "$${BASE}" --endpoint-url "$${CUSTOM_S3_ENDPOINT}" | wc -l)
                  echo "Prune complete: $${TOTAL} -> $${REMAIN}."
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
          restartPolicy: OnFailure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          volumes:
            - emptyDir: {}
              name: tmp
            - name: talos-secrets
              secret:
                secretName: talos-s3-backup
