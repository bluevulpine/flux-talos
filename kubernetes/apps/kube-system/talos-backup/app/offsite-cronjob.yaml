---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
# Copies etcd snapshots off vault: Garage `talos/backups` -> R2 `talos-etcd`.
#
# WHY: the Garage bucket lives on vault, and the control plane is moving onto a VM
# on vault (docs/runbooks/controlplane-migration-to-vault-vm.md). A backup that
# shares a host with the thing it backs up is not a backup. This is the copy you
# restore from if vault is gone.
#
# WHY MIRROR rather than a second talos-backup pointed at R2: that would take a
# second etcd snapshot every hour, on control-plane nodes already short of memory.
# The objects are already age-encrypted by talos-backup, so they are copied as-is.
#
# Layout in the bucket, each pruned by count:
#   hourly/  48 most recent  = 2 days. Interim: moves to the pinas once it exists.
#   daily/   30 most recent  = 30 days. The newest snapshot of each UTC day; the
#            long tail that Garage's 7-day window no longer holds.
#
# While vault is down this job fails, since the source is gone. That is expected:
# it is the case where the objects already in R2 are the ones you need.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-offsite
spec:
  # :40, i.e. 30 minutes after talos-s3-backup's :10 run. A snapshot plus prune
  # takes ~2 minutes, so the newest snapshot is in Garage by then.
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1
              env:
                # rclone writes its cache under $HOME; the root fs is read-only.
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: talos-offsite-secret
              # Shell variables are written $${VAR}: Flux postBuild substitution
              # would otherwise expand them (to empty) before the shell sees them.
              command:
                - /bin/sh
                - -c
                - |
                  # pipefail: an rclone listing that fails must fail the Job, not
                  # read as "nothing to copy/prune". Listings go to files (plain
                  # commands, so set -e sees them) before anything consumes them.
                  set -euo pipefail
                  SRC="garage:talos/backups"
                  DST="r2:talos-etcd"

                  # hourly/: the window equals hourly/'s own retention (48 objects
                  # = 48h). Anything older would be copied only to be pruned below,
                  # re-uploading ~358 MB per object on every run. Because the window
                  # matches retention, a catch-up after an outage of any length
                  # leaves hourly/ exactly as it would have been without one.
                  rclone copy "$${SRC}" "$${DST}/hourly" \
                    --include "*.snap.age" --max-age 48h \
                    --retries 3 --low-level-retries 10 \
                    --stats-one-line --stats-log-level NOTICE

                  # daily/: the NEWEST snapshot of each UTC day, for every day Garage
                  # still holds (7d). Today's entry is replaced each hour as newer
                  # snapshots land, so it settles on the day's last one; earlier days
                  # are a no-op once present. Walking Garage's whole window, not just
                  # today, backfills the dailies missed during an outage of this job
                  # of up to 7 days. Names are talos-<RFC3339 UTC>.snap.age, so a
                  # lexical sort is chronological and characters 7-16 are the day.
                  rclone lsf "$${SRC}" --include "*.snap.age" --max-age 7d > /tmp/src.txt
                  rclone lsf "$${DST}/hourly" --include "*.snap.age" > /tmp/hourly.txt
                  rclone lsf "$${DST}/daily" --include "*.snap.age" > /tmp/daily.txt
                  for DAY in $(cut -c7-16 /tmp/src.txt | sort -u); do
                    PICK=$(grep "^talos-$${DAY}T" /tmp/src.txt | sort | tail -n 1)
                    if ! grep -qxF "$${PICK}" /tmp/daily.txt; then
                      # Server-side copy within R2 when hourly/ has it (free, no
                      # upload); otherwise from Garage.
                      if grep -qxF "$${PICK}" /tmp/hourly.txt; then
                        FROM="$${DST}/hourly"
                      else
                        FROM="$${SRC}"
                      fi
                      echo "daily: $${PICK} (from $${FROM})"
                      rclone copyto "$${FROM}/$${PICK}" "$${DST}/daily/$${PICK}"
                    fi
                    # Drop that day's superseded entries.
                    for OLD in $(grep "^talos-$${DAY}T" /tmp/daily.txt | grep -vxF "$${PICK}" || true); do
                      rclone deletefile "$${DST}/daily/$${OLD}"
                    done
                  done

                  # Prune by count, newest kept. tail -n +N keeps N-1.
                  rclone lsf "$${DST}/hourly" --include "*.snap.age" | sort -r > /tmp/hourly.txt
                  for f in $(tail -n +49 /tmp/hourly.txt); do rclone deletefile "$${DST}/hourly/$${f}"; done
                  rclone lsf "$${DST}/daily" --include "*.snap.age" | sort -r > /tmp/daily.txt
                  for f in $(tail -n +31 /tmp/daily.txt); do rclone deletefile "$${DST}/daily/$${f}"; done

                  rclone lsf "$${DST}/hourly" --include "*.snap.age" | sort > /tmp/hourly.txt
                  rclone lsf "$${DST}/daily" --include "*.snap.age" | sort > /tmp/daily.txt
                  echo "hourly: $(wc -l < /tmp/hourly.txt) objects," \
                    "daily: $(wc -l < /tmp/daily.txt) objects," \
                    "newest: $(tail -n 1 /tmp/hourly.txt)"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # S3-to-S3 streams through the pod in multipart chunks (4 x 5 MiB per
              # transfer by default), so memory stays small regardless of the
              # ~358 MB object size. Not Storj: no erasure-coding buffers here.
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
