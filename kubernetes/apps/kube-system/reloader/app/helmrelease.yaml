---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: reloader
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: reloader
    reloader:
      readOnlyRootFileSystem: true
      deployment:
        # Prefers the Raspberry Pi workers (the only arm64 nodes), falling back to
        # brokkr. Small, stateless, multi-arch image; moved 2026-09-22 when
        # jormungandr1-3 stopped being control-plane nodes.
        tolerations:
          - key: "node.kubernetes.io/low-power"
            operator: "Equal"
            value: "raspberry-pi"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: "kubernetes.io/arch"
                      operator: "In"
                      values:
                        - "arm64"
      podMonitor:
        enabled: true
        namespace: "{{ .Release.Namespace }}"
