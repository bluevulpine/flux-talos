---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: valheim
spec:
  endpoints:
    - dnsName: "valheim.${SECRET_DOMAIN_MEDIA}"
      recordType: CNAME
      targets:
        - "wheels.${SECRET_DOMAIN_MEDIA}"
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
