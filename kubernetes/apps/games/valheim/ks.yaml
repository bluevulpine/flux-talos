---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app valheim
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/games/valheim/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: games
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: games
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      VOLSYNC_STORAGECLASS: tns-csi-nvmeof
      VOLSYNC_SNAPSHOTCLASS: tns-csi-nvmeof-snapshot
      # Direct reads the live PVC and never stages a CSI snapshot/clone, which is
      # where tns-csi's non-idempotent CreateVolume wedges. valheim-local hung
      # 7.5h on 2026-08-29 ("cannot create ...: dataset already exists", NVMe-oF
      # namespace never appearing) and had wedged before on 2026-07-05.
      #
      # CANARY: this is the FIRST Direct source in the cluster on a ReadWriteOnce
      # volume -- all 14 existing Direct sources are RWX. On RWO the mover must
      # land on the app's node or it will sit Pending with a Multi-Attach error.
      # VolSync exposes spec.kopia.moverAffinity for that; we are deliberately
      # testing without it first, because whether VolSync already co-locates a
      # Direct mover for RWO is unverified here. If the mover goes Pending,
      # add moverAffinity (podAffinity on app.kubernetes.io/name=valheim,
      # topologyKey kubernetes.io/hostname) or revert this line.
      #
      # satisfactory is the other RWO/nvmeof candidate and is deliberately NOT
      # changed yet -- it waits on this canary.
      VOLSYNC_COPYMETHOD: Direct
      VOLSYNC_CACHE_CLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: tns-csi-nvmeof
      VOLSYNC_RUN_AS_USER: "1000"
      VOLSYNC_RUN_AS_GROUP: "1000"
      VOLSYNC_FS_GROUP: "1000"
      VOLSYNC_LOCAL_SCHEDULE: "58 * * * *"
      VOLSYNC_R2_SCHEDULE: "41 5 * * *"
      # kopiur (components/kopiur), W8. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's old ones.
      KOPIUR_LOCAL_CRON: "H * * * *"
      KOPIUR_R2_CRON: "H 5 * * *"
      # Direct, as under VolSync (the canary above): no staged clone, so
      # tns-csi's non-idempotent CreateVolume is never called. kopiur co-locates
      # a Direct mover onto an RWO volume's attach node by itself
      # (moverDefaults.sourceColocation, default Auto), so it needs no affinity.
      KOPIUR_COPYMETHOD: Direct
      # Mover runs as the game server's own uid/gid, as VolSync's did.
      KOPIUR_RUN_AS_USER: "1000"
      KOPIUR_RUN_AS_GROUP: "1000"
      KOPIUR_FS_GROUP: "1000"
