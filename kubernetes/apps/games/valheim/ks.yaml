---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app valheim
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/games/valheim/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: games
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: games
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      VOLSYNC_STORAGECLASS: tns-csi-nvmeof
      # kopiur (components/kopiur), the only backup since the W8 cutover. These
      # vars landed one PR BEFORE the component so the SnapshotSchedules were
      # created with these crons, not the component's defaults (runbook trap: a
      # cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the R2 hour matches VolSync's
      # old one, the local hour is this app's slot in the daily window
      # (components/kopiur/local.yaml).
      KOPIUR_LOCAL_CRON: "H 7 * * *"
      KOPIUR_R2_CRON: "H 5 * * *"
      # Direct reads the live PVC and never stages a CSI snapshot/clone, so
      # tns-csi's non-idempotent CreateVolume is never called. NEVER switch this
      # to Snapshot (runbook: the tns-csi-nvmeof driver bug). Under VolSync's
      # Snapshot, valheim-local hung 7.5h on 2026-08-29 ("dataset already
      # exists", NVMe-oF namespace never appearing) and had wedged on 2026-07-05.
      # The volume is RWO: kopiur co-locates a Direct mover onto its attach node
      # by itself (moverDefaults.sourceColocation, default Auto). Verified W8,
      # 2026-10-11: every mover landed on the app's node, no affinity set.
      KOPIUR_COPYMETHOD: Direct
      # Mover runs as the game server's own uid/gid, as VolSync's did.
      KOPIUR_RUN_AS_USER: "1000"
      KOPIUR_RUN_AS_GROUP: "1000"
      KOPIUR_FS_GROUP: "1000"
