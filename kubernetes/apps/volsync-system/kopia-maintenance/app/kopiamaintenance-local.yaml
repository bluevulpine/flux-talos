---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: kopia-maintenance-local
spec:
  # Repository configuration - references the secret with connection details
  repository:
    repository: kopia-maintenance-local-secret
    repositoryType: s3

  # HOURLY, because the trigger interval IS the kopia epoch length. kopia only
  # advances the write epoch inside a maintenance run (maintenance_run.go calls
  # MaybeAdvanceWriteEpoch; nothing else does), and it cannot compact an index
  # blob until its epoch closes. At 0 */4 every epoch was 4 h long and the
  # uncompacted count climbed from ~250 to ~1,200 inside each window: measured
  # 2026-10-23, epoch 493 held 743 blobs after 3h58m (~187/h, about 4 per
  # mover run at 1,135 local runs/day), against kopia's hard-coded warning
  # threshold of 1,000 ("Found too many index blobs", error-level, on every
  # connect). Hourly keeps the peak near 200-400 plus ~70 compacted blobs.
  #
  # Cost, accepted: the fork's entry.sh runs `maintenance run` AND
  # `maintenance run --full` on every trigger (it has no quick-only mode), so
  # this is hourly full maintenance, ~6.5 min a run against a 4Gi limit. It
  # is the interim until the VolSync decommission, when kopiur's managed
  # Maintenance takes this repository over with quick hourly / full daily.
  #
  # Pair: clusterrepository-local.yaml raises epoch.checkpointFrequency, or
  # hourly epochs would mint a range-checkpoint blob every 8 h and those are
  # never merged. R2 stays daily: ~1.8 writes/hour, 472 index blobs.
  trigger:
    schedule: "0 * * * *"

  # Keep history of maintenance jobs for debugging
  successfulJobsHistoryLimit: 3

  # Resource limits for maintenance pod
  # Full maintenance can be memory-intensive for large repositories: kopia
  # mmaps the whole repo index, so a tight limit forces constant page reclaim.
  # At 1Gi this repo (~1,440 index blobs/day) thrashed ~2,000 major page
  # faults/sec on the node (NodeMemoryMajorPagesFaults) and periodically
  # OOM-killed at ~1GB RSS (2026-07-04). Raised to 4Gi — the node has ample
  # headroom — to keep the index cached and stop the fault storm.
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 4Gi

  # Security context matching VolSync defaults
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

  # Maintenance job timeout (3 hours default)
  activeDeadlineSeconds: 10800

