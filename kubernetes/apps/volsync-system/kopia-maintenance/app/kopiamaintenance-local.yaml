---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: kopia-maintenance-local
spec:
  # Repository configuration - references the secret with connection details
  repository:
    repository: kopia-maintenance-local-secret
    repositoryType: s3

  # Run maintenance every 4 hours to keep up with high backup frequency
  # (~30 apps × every 30 min = ~1,440 index blobs/day)
  # R2 maintenance stays daily since it only gets 1 backup/app/day
  trigger:
    schedule: "0 */4 * * *"

  # Keep history of maintenance jobs for debugging
  successfulJobsHistoryLimit: 3

  # Resource limits for maintenance pod
  # Full maintenance can be memory-intensive for large repositories: kopia
  # mmaps the whole repo index, so a tight limit forces constant page reclaim.
  # At 1Gi this repo (~1,440 index blobs/day) thrashed ~2,000 major page
  # faults/sec on the node (NodeMemoryMajorPagesFaults) and periodically
  # OOM-killed at ~1GB RSS (2026-07-04). Raised to 4Gi — the node has ample
  # headroom — to keep the index cached and stop the fault storm.
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 4Gi

  # Security context matching VolSync defaults
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

  # Maintenance job timeout (3 hours default)
  activeDeadlineSeconds: 10800

