---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          annotations:
            summary: VolSync component has disappeared from Prometheus target discovery.
          expr: |
            absent(up{job="volsync-volsync-perfectra1n-metrics"})
          for: 15m
          labels:
            severity: critical
        - alert: VolSyncVolumeOutOfSync
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume
              is out of sync.
          # Exclude Syncthing movers: they replicate continuously and never
          # report a discrete "in-sync" completion, so volsync_volume_out_of_sync
          # is pinned at 1 for them even when the peer is connected and healthy
          # (false positive — e.g. games/valheim-syncthing firing since 2026-06-23).
          expr: |
            volsync_volume_out_of_sync{method!="syncthing"} == 1
          for: 15m
          labels:
            severity: critical
