---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: brokkr03
spec:
  disks:
    # data-1 is the AirDisk, too slow for Longhorn: see brokkr02.yaml. Unschedulable,
    # and its replicas are evicted to data-2 disks (data-1 is unschedulable on every
    # brokkr, so no other target exists). Remove this entry once it holds 0 replicas.
    data-1:
      path: /var/mnt/data-1
      allowScheduling: false
      evictionRequested: true
    data-2:
      path: /var/mnt/data-2
      allowScheduling: true
