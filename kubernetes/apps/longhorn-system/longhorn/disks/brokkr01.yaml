---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: brokkr01
spec:
  disks:
    # data-1 is the AirDisk, too slow for Longhorn: see brokkr02.yaml. Unschedulable
    # so no new replica (including one evicted from brokkr02) lands here. Existing
    # replicas stay until this node's own eviction, after brokkr02's completes.
    data-1:
      path: /var/mnt/data-1
      allowScheduling: false
    data-2:
      path: /var/mnt/data-2
      allowScheduling: true
