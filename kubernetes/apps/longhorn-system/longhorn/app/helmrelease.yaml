---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: longhorn
  values:
    # Allow Longhorn components to run on tainted nodes (for CSI volume mounts)
    # Note: jormungandr4 has storage disabled but can still mount Longhorn volumes
    global:
      tolerations:
        - key: "node.kubernetes.io/low-power"
          operator: "Equal"
          value: "raspberry-pi"
          effect: "NoSchedule"
    persistence:
      defaultClass: false
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      defaultReplicaCount: "3"
      # Allow system-managed components (CSI plugin, instance manager) on tainted nodes
      taintToleration: "node.kubernetes.io/low-power=raspberry-pi:NoSchedule"
      # Longhorn's default (block-if-contains-last-replica) makes every storage
      # node permanently undrainable here. longhorn-1-replica is the default
      # StorageClass (202 of 222 volumes), so every attached volume's only
      # replica IS its last replica -- Longhorn therefore holds a per-node
      # instance-manager PDB at minAvailable:1 over exactly 1 pod, i.e.
      # disruptionsAllowed:0, which no eviction can ever satisfy. A Talos
      # upgrade drain hangs on that pod until the job times out; that is why
      # only the 3 control-plane nodes (no Longhorn storage, no PDB) took
      # v1.13.9 while all 4 storage nodes failed.
      #
      # Deliberately left at Longhorn's default guard. always-allow was used
      # on 2026-08-29 to complete the Talos v1.13.9 roll and it works — but it
      # lets Longhorn detach a volume from a pod that has not finished shutting
      # down, which corrupted sabnzbd's SQLite history DB and VolSync's kopia
      # cache for influxdb during that roll.
      #
      # allow-if-replica-is-stopped does NOT help: tested on brokkr01, the
      # instance-manager PDB held at disruptionsAllowed:0 for 10 minutes,
      # because that pod also serves engines for volumes attached from other
      # nodes.
      #
      # So node drains WILL block while volumes are attached. That is the
      # intended trade: to drain a storage node, scale down the workloads
      # holding volumes on it first (graceful shutdown), then drain. That
      # procedure completed brokkr03 with zero corruption. Flipping this to
      # always-allow for an unattended roll is what causes silent data damage.
      nodeDrainPolicy: "block-if-contains-last-replica"
      # Longhorn's default of 0 turns automatic engine upgrades off: a chart
      # upgrade moves the manager and instance managers, but each volume keeps
      # the engine image it was created with until someone upgrades it by hand.
      # After the 1.13.0 upgrade (#1989) that left 177 of 178 engines spread
      # over v1.10.1-v1.12.1, and an engine image older than a new release's
      # minimum supported version can block that release's upgrade.
      #
      # 1 upgrades one engine per node at a time: attached V1 volumes live
      # (no detach), detached ones on their next attach. Kept at 1 afterwards
      # so every future Longhorn upgrade brings the engines along.
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
    # Longhorn exposes longhorn_volume_*/node_*/disk_* on the manager port,
    # but the chart ships the ServiceMonitor disabled -- so there were ZERO
    # longhorn_* series in Prometheus and volume health (robustness, degraded
    # replicas, per-disk fill) was invisible cluster-wide.
    #
    # The chart's ServiceMonitor selects the longhorn-backend Service, which
    # means Prometheus scrapes every manager pod via its Endpoints. That is
    # load-bearing, not incidental: each manager only reports the volumes whose
    # engine it owns, so scraping the ClusterIP directly returns a DIFFERENT
    # subset on every scrape. Confirmed live -- two consecutive curls against
    # longhorn-backend:9500 disagreed on whether longhorn_volume_robustness
    # existed at all.
    #
    # Cost: ~3.9k samples x 4 managers = ~15k series against a 1.14M-series
    # head, i.e. +1.3%. Not worth dropping the client-go/workqueue histograms
    # via metricRelabelings for that.
    metrics:
      serviceMonitor:
        enabled: true
