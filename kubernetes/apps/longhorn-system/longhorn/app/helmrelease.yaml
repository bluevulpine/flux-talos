---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: longhorn
  values:
    # Allow Longhorn components to run on tainted nodes (for CSI volume mounts)
    # Note: jormungandr4 has storage disabled but can still mount Longhorn volumes
    global:
      tolerations:
        - key: "node.kubernetes.io/low-power"
          operator: "Equal"
          value: "raspberry-pi"
          effect: "NoSchedule"
    persistence:
      defaultClass: false
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      defaultReplicaCount: "3"
      # Allow system-managed components (CSI plugin, instance manager) on tainted nodes
      taintToleration: "node.kubernetes.io/low-power=raspberry-pi:NoSchedule"
      # Longhorn's default (block-if-contains-last-replica) makes every storage
      # node permanently undrainable here. longhorn-1-replica is the default
      # StorageClass (202 of 222 volumes), so every attached volume's only
      # replica IS its last replica -- Longhorn therefore holds a per-node
      # instance-manager PDB at minAvailable:1 over exactly 1 pod, i.e.
      # disruptionsAllowed:0, which no eviction can ever satisfy. A Talos
      # upgrade drain hangs on that pod until the job times out; that is why
      # only the 3 control-plane nodes (no Longhorn storage, no PDB) took
      # v1.13.9 while all 4 storage nodes failed.
      #
      # NEVER always-allow: used on 2026-08-29 to finish the Talos v1.13.9 roll,
      # it let Longhorn detach volumes from pods still shutting down and
      # corrupted sabnzbd's SQLite history DB and a kopia cache.
      #
      # allow-if-replica-is-stopped is the middle ground: a RUNNING last
      # replica (an attached single-replica volume) still blocks, so data in
      # use is protected, while the STOPPED last replicas of detached volumes
      # (the ~40 single-replica kopiur caches) no longer do; their data stays
      # on the node's disk across the reboot. Volumes attached elsewhere with
      # their only replica on the draining node still block: give them a
      # second replica first.
      #
      # The 2026-08-29 test recorded "allow-if-replica-is-stopped does NOT
      # help" (PDB stuck 10 min on brokkr01). On 2026-11-06 (Talos PKI
      # rotation roll) the same symptom had other causes, none of them the
      # policy, and brokkr01 drained in 5 s under it once they were cleared:
      # - an orphaned engine instance for a deleted volume: delete its
      #   `orphans.longhorn.io` record. With no orphan record (brokkr02), check
      #   by hand that nothing but the instance-manager is left and no attached
      #   volume's only running replica is on the node, then skip the drain;
      # - orphaned `snapshot-controller-*` attachment tickets holding detached
      #   volumes attached to the node: remove the ticket;
      # - `volume-rebuilding-controller` tickets (brokkr03): an offline
      #   rebuild keeps the volume attached on the node holding its only
      #   healthy replica. Wait for the rebuild; raising
      #   concurrent-replica-rebuild-per-node-limit (2) for the window
      #   drains the queue faster.
      # The manager log names the exact blocker:
      #   "removing <node> PDB is blocked: ..."
      nodeDrainPolicy: "allow-if-replica-is-stopped"
      # Longhorn's default of 0 turns automatic engine upgrades off: a chart
      # upgrade moves the manager and instance managers, but each volume keeps
      # the engine image it was created with until someone upgrades it by hand.
      # After the 1.13.0 upgrade (#1989) that left 177 of 178 engines spread
      # over v1.10.1-v1.12.1, and an engine image older than a new release's
      # minimum supported version can block that release's upgrade.
      #
      # 1 upgrades one engine per node at a time: attached V1 volumes live
      # (no detach), detached ones on their next attach. Kept at 1 afterwards
      # so every future Longhorn upgrade brings the engines along.
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
      # Scheduling limits, set in the UI long ago and recorded here (same
      # values as live on 2026-11-05, so committing them changed nothing).
      # Longhorn places or grows a replica on a disk only if BOTH hold:
      # - scheduled + new <= (max - reserved) x overProvisioning% (200 %: a
      #   volume's full size is promised up front, but most are far from full,
      #   so promises may reach twice the disk);
      # - free space after the write stays above minimalAvailable% of the
      #   disk (25 %), a real-bytes floor that over-provisioning cannot lift.
      # Per-disk numbers: status.diskStatus.<disk>.storageMaximum,
      # .storageAvailable and .storageScheduled on `nodes.longhorn.io`.
      # 2026-11-05 (1862Gi data-2 disks): scheduled 1131/1158/1497Gi on
      # brokkr01/02/03 against a 3724Gi limit; avail 1233-1494Gi against a
      # 466Gi floor. The free-space floor, not over-provisioning, is the one
      # to watch as disks fill.
      storageOverProvisioningPercentage: "200"
      storageMinimalAvailablePercentage: "25"
    # Longhorn exposes longhorn_volume_*/node_*/disk_* on the manager port,
    # but the chart ships the ServiceMonitor disabled -- so there were ZERO
    # longhorn_* series in Prometheus and volume health (robustness, degraded
    # replicas, per-disk fill) was invisible cluster-wide.
    #
    # The chart's ServiceMonitor selects the longhorn-backend Service, which
    # means Prometheus scrapes every manager pod via its Endpoints. That is
    # load-bearing, not incidental: each manager only reports the volumes whose
    # engine it owns, so scraping the ClusterIP directly returns a DIFFERENT
    # subset on every scrape. Confirmed live -- two consecutive curls against
    # longhorn-backend:9500 disagreed on whether longhorn_volume_robustness
    # existed at all.
    #
    # Cost: ~3.9k samples x 4 managers = ~15k series against a 1.14M-series
    # head, i.e. +1.3%. Not worth dropping the client-go/workqueue histograms
    # via metricRelabelings for that.
    metrics:
      serviceMonitor:
        enabled: true
