---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app readarr-audiobooks
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster18
      namespace: database
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: rreading-glasses
      namespace: media
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/readarr-audiobooks/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: media
      GATUS_PORT: "8787"
      GATUS_SERVICE: readarr-audiobooks
      VOLSYNC_CAPACITY: 4Gi
      VOLSYNC_STORAGECLASS: tns-csi-nfs
      VOLSYNC_ACCESSMODES: ReadWriteMany
      # kopiur (components/kopiur), the only backup since the W7 cutover. These
      # vars landed one PR BEFORE the component so the SnapshotSchedules were
      # created with these crons, not the component's defaults (runbook trap: a
      # cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's old ones.
      KOPIUR_LOCAL_CRON: "H * * * *"
      KOPIUR_R2_CRON: "H 4 * * *"
      # Direct: the volume is tns-csi-nfs RWX, so the mover co-mounts it with no
      # staged clone, which keeps it clear of tns-csi's non-idempotent
      # CreateVolume (runbook Sequence step 7).
      # Safe here: the database is Postgres, and the volume holds only config
      # and logs (no SQLite).
      KOPIUR_COPYMETHOD: Direct
