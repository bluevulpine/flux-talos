---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app recyclarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
    - name: sonarr
      namespace: media
    - name: radarr
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/recyclarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to the NS var. VolSync
      # never needed it (the fork takes the namespace implicitly); unset, Flux
      # substitutes an empty string and kopiur silently falls back to its
      # default instead of the explicit pin.
      NS: media
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Low criticality: config only, git-managed - backup once daily at 6 AM
      # kopiur (components/kopiur). H picks a minute per schedule; the hours are
      # the ones VolSync used before the cutover.
      KOPIUR_LOCAL_CRON: "H 6 * * *"
      KOPIUR_R2_CRON: "H 4 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
