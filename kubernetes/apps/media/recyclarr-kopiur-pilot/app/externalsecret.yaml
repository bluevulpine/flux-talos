---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-kopiur-pilot
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: recyclarr-kopiur-pilot-secret
    template:
      engineVersion: v2
      data:
        # kopiur reads the S3 credentials and the repository password by these
        # well-known names (docs/backends/s3.md, "The Secret shape"). Unlike the
        # volsync component there is no KOPIA_REPOSITORY here - the bucket,
        # prefix and endpoint are fields on the Repository CR, not env vars.
        AWS_ACCESS_KEY_ID: "{{ .Kopiur__Pilot__AwsAccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .Kopiur__Pilot__AwsSecretKey }}"
        KOPIA_PASSWORD: "{{ .Kopiur__Pilot__KopiaPassword }}"
  dataFrom:
    - extract:
        key: kopiur-pilot
