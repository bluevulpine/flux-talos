---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app recyclarr-kopiur-pilot
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur-system
    # The pilot backs up recyclarr's PVC, which that Kustomization creates.
    - name: recyclarr
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/recyclarr-kopiur-pilot/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
