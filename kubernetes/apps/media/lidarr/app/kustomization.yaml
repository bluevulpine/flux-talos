---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./media-nfs.yaml
components:
  - ../../../../components/volsync-claim
  - ../../../../components/volsync-backup
  # kopiur parallel run (W3, docs/runbooks/kopiur-migration.md): both engines
  # back up this PVC under the same kopia identity until the per-app gates
  # pass, then volsync-backup is removed. volsync-claim stays: it owns the PVC.
  - ../../../../components/kopiur

patches:
  # Moving the data claim to longhorn-2-replica WITHOUT a restore: storageClassName
  # is immutable on a bound PVC, so the claim is deleted (PV on Retain) and Flux
  # re-creates it pre-bound to the SAME Longhorn volume (already live-patched to 2
  # replicas). Procedure: docs/runbooks/volsync-app-namespace-move.md.
  #  - `ssa: IfNotPresent`: Flux skips the claim while it exists, so merging this
  #    before the swap changes nothing live. NEVER remove it while the claim exists
  #    (Flux owns f:volumeName -> immutable stall). Claim edits in git (capacity,
  #    class, labels) are then silently ignored; expand by hand and keep git equal:
  #    kubectl -n media patch pvc lidarr -p '{"spec":{"resources":{"requests":{"storage":"<size>"}}}}'
  #  - `volumeName`: TEMPORARY, only for the re-create. Drop it in the batch
  #    follow-up PR once the swap is done; left in, a rebuilt cluster would wait
  #    forever for a PV that no longer exists.
  # Targeted by NAME (the data claim is literally `${APP}` at build time) so any
  # other claim in this app (media NFS, caches) is left alone.
  - target:
      kind: PersistentVolumeClaim
      name: \$\{APP\}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
      spec:
        volumeName: pvc-da5fa0d2-ddb9-49b1-9df5-171b261a0e9e

