---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tdarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/media/tdarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: media
      GATUS_PORT: "8265"
      GATUS_SERVICE: tdarr
      # Raised from 4Gi 2026-09-02: this claim now also carries Tdarr's database
      # via a subPath, and Tdarr's own job-report cap defaults to 10 GiB - larger
      # than the old claim, so the volume would have filled before Tdarr pruned.
      # 20Gi keeps the claim above its own cleanup threshold.
      VOLSYNC_CAPACITY: 20Gi
      # No longer "low criticality, regenerates": as of 2026-09-02 this claim
      # holds the library definitions and flows, which are hand-built and do not
      # regenerate. Backup every 4 hours (staggered +30min).
      VOLSYNC_STORAGECLASS: tns-csi-nfs
      VOLSYNC_CLONE_STORAGECLASS: tns-csi-nfs
      VOLSYNC_SNAPSHOTCLASS: tns-csi-nfs-snapshot
      VOLSYNC_ACCESSMODES: ReadWriteMany
      VOLSYNC_COPYMETHOD: Snapshot
      VOLSYNC_LOCAL_SCHEDULE: "30 */4 * * *"
      VOLSYNC_R2_SCHEDULE: "33 5 * * *"
