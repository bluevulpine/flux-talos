---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tdarr
spec:
  chartRef:
    kind: OCIRepository
    name: tdarr
  interval: 1h
  values:
    controllers:
      tdarr:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              # renovate: datasource=docker depName=ghcr.io/haveagitgat/tdarr
              tag: 2.89.01
            env:
              TZ: "${TIMEZONE}"
              PUID: "568"
              PGID: "568"
              UMASK_SET: "002"
              serverIP: 0.0.0.0
              serverPort: &serverPort 8266
              webUIPort: &webPort 8265
              # Server only. All transcoding runs on the external NVIDIA node on
              # the DGX Spark (spark-setup repo), which reaches this pod through
              # the tdarr-node LoadBalancer. The internal node had been at 0
              # workers and was a hazard rather than spare capacity: the plugin
              # stack hardcodes hevc_nvenc, and this pod only ever had an AMD
              # iGPU, so the internal node could only fail jobs.
              internalNode: "false"
              inContainer: "true"
            envFrom:
              - secretRef:
                  name: tdarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/status
                    port: *webPort
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            # Tdarr uses s6-overlay which requires root privileges
            securityContext:
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsNonRoot: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 568 = apps. video (44) and render (109) went with the internal node's
        # GPU; nothing else in the pod opens /dev/dri.
        supplementalGroups:
          - 568
    service:
      app:
        controller: tdarr
        ports:
          http:
            port: *webPort
          server:
            port: *serverPort
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Tdarr"
          gethomepage.dev/group: "Downloads"
          gethomepage.dev/icon: "tdarr.png"
          gethomepage.dev/description: "Transcode Automation"
          gethomepage.dev/widget.type: "tdarr"
          gethomepage.dev/widget.url: "http://tdarr.media.svc.cluster.local:8265"
        labels:
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - tdarr.${SECRET_DOMAIN}
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/configs
      # Tdarr's entire database lives under /app/server/Tdarr/DB2 - library
      # definitions, flows, automations, API keys, users, the file index and
      # job history. This was an emptyDir, which meant every pod restart wiped
      # all of it. Discovered 2026-09-02 when #1720's restart destroyed a
      # configuration Derek was in the middle of building; the empty DB2 had
      # been read as "never configured" when it was in fact "cannot persist".
      #
      # Mounted as a subPath on the existing `tdarr` claim rather than a new PVC
      # so it inherits that claim's volsync backup - the config half of DB2
      # (library settings, flows, plugin stacks, node worker limits, API keys)
      # is real human effort and worth replicating. The derived half (file
      # index, job reports, statistics) rides along; Tdarr does not separate
      # them. As of 2.89 all of it is in one SQLite file, DB2/SQL/database.db;
      # the *JSONDB directories beside it are empty.
      #
      # So the claim is one volume with two halves, and any move or restore must
      # carry both: the node/server config JSON at its root (mounted below as
      # /app/configs) and this `server/` directory. volsync backs up the whole
      # volume, so a restore does.
      #
      # The claim is Longhorn RWO (see ks.yaml) because SQLite on NFS stalled
      # the server. Moved 2026-09-25 by a kopia backup and restore through the
      # claim's own ReplicationDestination, the jellyfin (#1703) method.
      #
      # Side effect worth knowing: `config` mounts this claim at its root, so
      # the DB is also visible at /app/configs/server. Cosmetic - Tdarr reads
      # /app/server. Left alone deliberately: giving `config` a subPath would
      # relocate the existing config data and lose it.
      server:
        existingClaim: *app
        globalMounts:
          - path: /app/server
            subPath: server
      media:
        existingClaim: tdarr-media-nfs
        globalMounts:
          - path: /media
      # The library's cache path. It is kept because the Movies library names
      # /temp. Since 2026-09-25 this pod runs no node, so nothing transcodes
      # here. The Spark node transcodes into its own cache.
      #
      # sizeLimit dates from when the internal node did transcode here: an
      # unbounded emptyDir sits on the node's ephemeral disk, which container
      # images, logs and every other emptyDir share, and a single 4K transcode
      # can want tens of GB. The limit is kept so that turning the internal
      # node back on cannot fill a brokkr node's disk and evict its neighbours.
      transcode-cache:
        type: emptyDir
        sizeLimit: 16Gi
        globalMounts:
          - path: /temp

