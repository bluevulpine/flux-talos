---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tdarr
spec:
  chartRef:
    kind: OCIRepository
    name: tdarr
  interval: 1h
  values:
    controllers:
      tdarr:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              # renovate: datasource=docker depName=ghcr.io/haveagitgat/tdarr
              tag: 2.86.01
            env:
              TZ: "${TIMEZONE}"
              PUID: "568"
              PGID: "568"
              UMASK_SET: "002"
              serverIP: 0.0.0.0
              serverPort: &serverPort 8266
              webUIPort: &webPort 8265
              internalNode: "true"
              inContainer: "true"
              ffmpegVersion: "6"
              nodeName: internal-node
            envFrom:
              - secretRef:
                  name: tdarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/status
                    port: *webPort
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            # Tdarr uses s6-overlay which requires root privileges
            securityContext:
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsNonRoot: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                amd.com/gpu: 1
              limits:
                memory: 4Gi
                amd.com/gpu: 1
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 44 = video, 109 = render (for GPU access), 568 = apps
        supplementalGroups:
          - 44
          - 109
          - 568
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_1002.present: "true"
    service:
      app:
        controller: tdarr
        ports:
          http:
            port: *webPort
          server:
            port: *serverPort
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Tdarr"
          gethomepage.dev/group: "Downloads"
          gethomepage.dev/icon: "tdarr.png"
          gethomepage.dev/description: "Transcode Automation"
          gethomepage.dev/widget.type: "tdarr"
          gethomepage.dev/widget.url: "http://tdarr.media.svc.cluster.local:8265"
        labels:
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - tdarr.${SECRET_DOMAIN}
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/configs
      # Tdarr's entire database lives under /app/server/Tdarr/DB2 - library
      # definitions, flows, automations, API keys, users, the file index and
      # job history. This was an emptyDir, which meant every pod restart wiped
      # all of it. Discovered 2026-09-02 when #1720's restart destroyed a
      # configuration Derek was in the middle of building; the empty DB2 had
      # been read as "never configured" when it was in fact "cannot persist".
      #
      # Mounted as a subPath on the existing `tdarr` claim rather than a new PVC
      # so it inherits that claim's volsync backup - the config half of DB2
      # (LibrarySettingsJSONDB, FlowsJSONDB, AutomationsJSONDB, ApiKeysJSONDB)
      # is real human effort and worth replicating. The derived half
      # (FileJSONDB, JobReports, StatisticsJSONDB) rides along; Tdarr does not
      # separate them.
      #
      # Side effect worth knowing: `config` mounts this claim at its root, so
      # the DB is also visible at /app/configs/server. Cosmetic - Tdarr reads
      # /app/server. Left alone deliberately: giving `config` a subPath would
      # relocate the existing config data and lose it.
      server:
        existingClaim: *app
        subPath: server
        globalMounts:
          - path: /app/server
      media:
        existingClaim: tdarr-media-nfs
        globalMounts:
          - path: /media
      # Transcode scratch. emptyDir is right - this is genuinely disposable and
      # wants NVMe rather than the NFS share, which is also serving playback.
      #
      # sizeLimit added 2026-09-02, because an unbounded emptyDir here is a
      # node-level hazard rather than a pod-level one. /temp is backed by
      # brokkr01's /dev/nvme1n1p4, which had 32G free of 100G when measured, and
      # that partition is shared with container images, logs and every other
      # emptyDir on the node. A single 4K transcode can want tens of GB; without
      # a limit Tdarr can fill the node's ephemeral storage and trigger evictions
      # across every workload on it. With a limit, the failure is one evicted
      # tdarr pod.
      #
      # 16Gi is deliberately conservative against 32G of headroom. Raise it once
      # real transcodes show what they actually need - and watch node disk before
      # raising Tdarr's worker count, which multiplies this.
      transcode-cache:
        type: emptyDir
        sizeLimit: 16Gi
        globalMounts:
          - path: /temp

