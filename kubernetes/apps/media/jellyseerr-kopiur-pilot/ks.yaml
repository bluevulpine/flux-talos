---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyseerr-kopiur-pilot
spec:
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    # The Repository and its ExternalSecret are owned by the recyclarr pilot.
    # This one adds a second source to the SAME repository rather than a second
    # repository, so it depends on that Kustomization, not on OpenBao directly.
    - name: recyclarr-kopiur-pilot
      namespace: media
    # Backs up jellyseerr's PVC, which that Kustomization creates.
    - name: jellyseerr
      namespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/media/jellyseerr-kopiur-pilot/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
