---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tautulli
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 30m
  path: "./kubernetes/apps/media/tautulli/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false # no flux ks dependents
  postBuild:
    substitute:
      APP: *app
      NS: media
      GATUS_PORT: "80"
      GATUS_SERVICE: tautulli
      GATUS_PATH: /home
      VOLSYNC_CAPACITY: 4Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Low criticality: watch statistics, can regenerate - local backup daily
      # kopiur (components/kopiur). H picks a minute per schedule; the R2 hour
      # is the one VolSync used, the local hour is this app's slot in the
      # daily window (components/kopiur/local.yaml).
      KOPIUR_LOCAL_CRON: "H 11 * * *"
      KOPIUR_R2_CRON: "H 5 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
