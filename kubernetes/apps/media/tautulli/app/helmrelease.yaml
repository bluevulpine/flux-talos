---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tautulli
spec:
  chartRef:
    kind: OCIRepository
    name: tautulli
  interval: 5m
  values:
    controllers:
      tautulli:
        # Scaled to zero 2026-09-02. Tracearr (#1712) has taken over watch
        # history: 1,184 of Tautulli's 1,264 distinct plays were imported, and
        # Tracearr collects live sessions from both Plex and Jellyfin, which
        # Tautulli never could.
        #
        # NOT deleted, and the PVC is deliberately retained. 80 records did not
        # import - 79 of them a Plex account, `Guest`, that is `is_active=0` and
        # no longer shared on the server, so no amount of re-syncing can
        # recreate it. Those plays exist nowhere else. The recovery path is
        # known if it ever matters: Tracearr's import matches on
        # `plexAccountId`, not username (services/import/userMapping.js), so
        # re-sharing that account and re-importing would land them.
        #
        # Deleting this PVC ends the only copy. Leave it.
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/tautulli
              tag: 2.18.1@sha256:2cc92abed174f89d4fa75ab98e39af0114f37829e9c675718b264cc80931c4f5
            env:
              TZ: "${TIMEZONE}"
              TAUTULLI_HTTP_BASE_URL: https://tautulli.${SECRET_DOMAIN_MEDIA}
              TAUTULLI_HTTP_PORT: &port 80
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Tautulli"
          gethomepage.dev/group: "Video"
          gethomepage.dev/icon: "tautulli.png"
          gethomepage.dev/description: "Plex Monitoring"
          gethomepage.dev/widget.type: "tautulli"
          gethomepage.dev/widget.url: "http://tautulli.media.svc.cluster.local:80"
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_TAUTULLI_TOKEN}}`}}"
        hostnames:
          - "tautulli.${SECRET_DOMAIN_MEDIA}"
          - "tautulli.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - port: *port
                name: *app
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
