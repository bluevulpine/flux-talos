---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name sportarr-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # App config. Sportarr's env-override surface is an explicit allowlist in
        # src/Constants/ConfigurationKeys.cs, not a general config binder - only
        # DataPath, ApiKey, Port, BindAddress and the Database__* keys are read.
        # Anything else in config.xml (auth method, telemetry) is UI-only and
        # cannot be set declaratively here.
        Sportarr__ApiKey: "{{ .Sportarr__ApiKey }}"
        Sportarr__Database__Provider: postgres
        Sportarr__Database__Host: &dbHost ${POSTGRES_HOST}
        Sportarr__Database__Port: "5432"
        Sportarr__Database__Name: &dbName sportarr
        Sportarr__Database__Username: &dbUser "{{ .Sportarr__Postgres__User }}"
        Sportarr__Database__Password: &dbPass "{{ .Sportarr__Postgres__Password }}"
        # Init container config
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
  dataFrom:
    - extract:
        key: sportarr
    - extract:
        key: cloudnative-pg
