---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name sportarr-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # App config. Sportarr's env-override surface is an explicit allowlist in
        # src/Constants/ConfigurationKeys.cs, not a general config binder:
        # DataPath, ApiKey, Port, BindAddress and the Database__* keys. Anything
        # else in config.xml (auth method, telemetry) is UI-only and cannot be
        # set declaratively here.
        #
        # BUT being on that list is not the same as being wired up, and ApiKey is
        # the exception. Measured against 4.1.6.1116 in-cluster:
        #
        #   GET /api/stats   no key -> 401   env key -> 401   config.xml key -> 200
        #
        # ConfigService takes IConfiguration but reads only Sportarr:DataPath from
        # it; with no config.xml it constructs `new Config()`, whose default ApiKey
        # is a fresh Guid, and ValidateApiKeyAsync compares requests against that.
        # Program.cs:204 does read Sportarr:ApiKey - the value just never reaches
        # the auth path. So the app generates its own key on first boot and this
        # env var has no effect on authentication.
        #
        # Kept anyway, at Derek's request, because openbao now holds the key the
        # app actually generated: the field is the record Prowlarr/Plex/homepage
        # read, and it will start being authoritative if upstream ever wires it.
        # It must be re-synced from /config/config.xml if that volume is ever
        # rebuilt from something other than a volsync restore.
        #
        # Port and DataPath ARE honoured - both are read directly via
        # Environment.GetEnvironmentVariable in Program.cs rather than through
        # ConfigService. Confirmed in the startup log:
        #   [Sportarr] Data directory: /config
        #   [Sportarr] Port from Sportarr__Port environment variable: 1867
        Sportarr__ApiKey: "{{ .Sportarr__ApiKey }}"
        Sportarr__Database__Provider: postgres
        Sportarr__Database__Host: &dbHost ${POSTGRES_HOST}
        Sportarr__Database__Port: "5432"
        Sportarr__Database__Name: &dbName sportarr
        Sportarr__Database__Username: &dbUser "{{ .Sportarr__Postgres__User }}"
        Sportarr__Database__Password: &dbPass "{{ .Sportarr__Postgres__Password }}"
        # Init container config
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
  dataFrom:
    - extract:
        key: sportarr
    - extract:
        key: cloudnative-pg
