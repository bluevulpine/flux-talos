---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyseerr
spec:
  chartRef:
    kind: OCIRepository
    name: jellyseerr
  interval: 1h
  values:
    controllers:
      jellyseerr:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Jellyseerr merged into Seerr; docker.io/fallenbagel/jellyseerr ends at
              # 2.7.3 and Renovate cannot cross an image rename, so it was stuck there.
              # Seerr migrates the Jellyseerr config/SQLite in place on first start
              # (one-way; pre-migration kopiur Snapshot jellyseerr-local-manual-pre-seerr,
              # 2026-11-08). The app keeps the name jellyseerr so the PVC, kopiur
              # schedules, route and in-cluster URL (Tracearr, homepage) are unchanged.
              # Seerr v3 is needed for /request/count's `completed` field, which
              # Tracearr's request sync requires.
              repository: ghcr.io/seerr-team/seerr
              # renovate: datasource=docker depName=ghcr.io/seerr-team/seerr
              tag: v3.5.2
            env:
              TZ: "${TIMEZONE}"
              LOG_LEVEL: info
              PORT: &port 5055
              # Seerr's CMD is `npm start` (Jellyseerr used pnpm). As UID 568 on a
              # read-only root, npm cannot write $HOME/.npm, so its cache and logs
              # go to the /tmp emptyDir and the update check (a network call plus
              # a write) is off.
              NPM_CONFIG_CACHE: /tmp/.npm
              NPM_CONFIG_UPDATE_NOTIFIER: "false"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 12
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      # The Seerr image has no init process (upstream requires `--init`), so
      # `npm start` would run as PID 1: nothing reaps orphaned zombies, and the
      # kernel drops any signal PID 1 has no handler for. A shared process
      # namespace makes the pause container PID 1, the Kubernetes equivalent of
      # `--init`. The pod keeps UID/GID 568 rather than the image's
      # `node` (1000): the config PVC is already 568-owned, so no chown is needed.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: jellyseerr
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Jellyseerr"
          gethomepage.dev/group: "Video"
          gethomepage.dev/icon: "jellyseerr.png"
          gethomepage.dev/description: "Media Requests"
          gethomepage.dev/widget.type: "jellyseerr"
          gethomepage.dev/widget.url: "http://jellyseerr.media.svc.cluster.local:5055"
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_JELLYSEERR_TOKEN}}`}}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
          - name: external-pangolin
            namespace: network
            sectionName: https
        hostnames:
          - requests.${SECRET_DOMAIN}
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/config
      tmp:
        type: emptyDir

