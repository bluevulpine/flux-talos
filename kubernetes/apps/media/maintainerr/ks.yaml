---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app maintainerr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Maintainerr's own credentials (Plex, Jellyfin, Radarr, Sonarr, Tracearr) are
  # all entered in the UI and stored in its SQLite, so the app renders no
  # ExternalSecret and needs no direct openbao dependency. It used to declare
  # one only because the volsync component created ExternalSecrets; that went
  # with the W2 cutover (#1959). kopiur-repositories, below, already depends on
  # external-secrets-openbao-store, so the ordering it gave is kept transitively.
  #
  # The design spec's ordering constraint - that rules be written against
  # Tracearr properties from day one - is a rule-AUTHORING constraint, not a boot
  # one, and is deliberately not expressed here.
  dependsOn:
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/maintainerr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: media
      GATUS_SUBDOMAIN: maintainerr
      # /opt/data holds the SQLite database - which contains the Plex, Jellyfin
      # and *arr API keys - plus the rule definitions and the never-touch-this
      # exclusion list. That exclusion list is the reason this is backed up at
      # all: losing it does not just lose configuration, it removes the record
      # of which media was deliberately protected from deletion.
      VOLSYNC_CAPACITY: 4Gi
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # `USER node` in Maintainerr's Dockerfile. Read out of the pinned image
      # layer rather than inferred from the base image's convention:
      #   /etc/passwd @3.26.0 -> node:x:1000:1000::/home/node:/bin/sh
      # A root mover would restore root-owned files that Maintainerr cannot read,
      # so the kopiur mover runs as 1000 (KOPIUR_RUN_AS_* below).
      # kopiur (components/kopiur), W2. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's.
      KOPIUR_LOCAL_CRON: "H */4 * * *"
      KOPIUR_R2_CRON: "H 6 * * *"
      # Snapshot, never the component's Direct default, which reads the volume
      # live while better-sqlite3 is writing to it (caught missing on
      # timescaledb in review of #1711, 2026-09-01).
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # Mover runs as the app's uid (see above).
      KOPIUR_RUN_AS_USER: "1000"
      KOPIUR_RUN_AS_GROUP: "1000"
      KOPIUR_FS_GROUP: "1000"
