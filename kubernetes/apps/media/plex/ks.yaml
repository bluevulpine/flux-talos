---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/media/plex/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to NS (runbook: the
      # "apps set no NS" trap); plex had none.
      NS: media
      GATUS_PATH: /web/index.html
      VOLSYNC_CAPACITY: 100Gi
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      # kopiur (components/kopiur), W5. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      KOPIUR_LOCAL_CRON: "H 7 * * *"
      # H picks a minute; the hour matches VolSync's old R2 run.
      KOPIUR_R2_CRON: "H 4 * * *"
      # The component defaults to Direct, which mounts the LIVE config PVC and
      # reads it while Plex is writing. That is a ~494 MB SQLite database being
      # copied under an active writer, once a day on KOPIUR_LOCAL_CRON (48 times
      # a day before 2026-10-29) plus once more for R2 - every one of those
      # snapshots can be torn, and the backup reports success either way. Same class as the defect fixed in
      # #1711. Snapshot takes a CSI point-in-time copy and the mover reads that
      # instead, so the database is never read mid-write and the mover stops
      # co-mounting the volume Plex is using. (Written for VolSync; unchanged
      # under kopiur, whose component also defaults to Direct.)
      #
      KOPIUR_COPYMETHOD: Snapshot
      # ReadWriteOnce so the config volume is a real block device (ext4 on
      # /dev/longhorn), not NFS. Longhorn serves RWX through a share-manager
      # NFS pod with local_lock=none, so every SQLite lock was a network round
      # trip; on 2026-11-02 that left Plex's view-state writes queuing 0.6-1 s
      # each ("Took too long to start a transaction",
      # MetadataItemSetting.cpp:459) until /identity stopped answering and
      # the probes failed for days (330 failures over 3d17h). Jellyfin hit the
      # same wall on NFS and moved to RWO in #1703.
      #
      # RWX was never needed: it was the claim component's default
      # (components/volsync-claim, written for VolSync's Direct mover, which
      # co-mounted the claim). The only other consumer, plex-image-cleanup,
      # is podAffinity-pinned to Plex's node, and RWO allows any number of
      # pods on one node.
      #
      # accessModes is immutable on a bound PVC, and the claim carries
      # `ssa: IfNotPresent` (app/kustomization.yaml), so this value only
      # takes effect when the claim is re-created: the Longhorn volume and PV
      # are switched to rwo by hand and the claim re-bound to the same volume,
      # no restore (docs/runbooks/plex-db-maintenance.md).
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # VolSync's cache size for this volume (the component default is 16Gi).
      KOPIUR_CACHE_CAPACITY: 30Gi
      # 30m, not the component's 10m: staging this volume takes ~12-13 min
      # (kopiur's first runs: 715s local, 772s R2; VolSync's 10-20 min, once
      # ~2 h). The 10m default would have failed both first runs (footnote 5).
      KOPIUR_STAGING_TIMEOUT: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kometa
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: tracearr
    - name: radarr
    - name: sonarr
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/media/plex/kometa
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false # no flux ks dependents
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to NS (runbook: the
      # "apps set no NS" trap); kometa had none.
      NS: media
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Low criticality: Plex metadata manager, regenerates - local backup daily
      # kopiur (components/kopiur), W3. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the R2 hour matches VolSync's
      # old one, the local hour is this app's slot in the daily window
      # (components/kopiur/local.yaml).
      KOPIUR_LOCAL_CRON: "H 9 * * *"
      KOPIUR_R2_CRON: "H 1 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-auto-languages
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/plex-auto-languages
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  interval: 30m
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-image-cleanup
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/plex-image-cleanup
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
