---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_PATH: /web/index.html
      VOLSYNC_CAPACITY: 100Gi
      VOLSYNC_CACHE_CAPACITY: 30Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_CACHE_CLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      # The component defaults to Direct, which mounts the LIVE config PVC and
      # reads it while Plex is writing. That is a ~494 MB SQLite database being
      # copied under an active writer, 48 times a day on the schedule below plus
      # once more for R2 - every one of those snapshots can be torn, and the
      # backup reports success either way. Same class as the defect fixed in
      # #1711. Snapshot takes a CSI point-in-time copy and the mover reads that
      # instead, so the database is never read mid-write and the mover stops
      # co-mounting the volume Plex is using.
      #
      # Deliberately NOT paired with VOLSYNC_ACCESSMODES: ReadWriteOnce, which
      # is the other half of the house pattern. That variable also feeds
      # components/volsync/claim.yaml, which is what creates the `plex` PVC
      # itself - so setting it here would try to mutate a bound PVC's
      # accessModes. Confirmed against the live cluster with a server-side
      # dry-run: "The PersistentVolumeClaim \"plex\" is invalid: spec:
      # Forbidden: spec is immutable after creation". One invalid resource
      # fails the whole kustomize apply while Flux still reports "applied
      # revision", which is exactly how the jellyfin migration lost a step.
      # RWO belongs in the RWX->RWO migration, where the PVC is recreated
      # anyway - not here.
      #
      # RWX + Snapshot is not a novel combination in this repo: frigate, tdarr
      # and both readarr instances already run it.
      VOLSYNC_COPYMETHOD: Snapshot
      VOLSYNC_LOCAL_SCHEDULE: "20,50 * * * *"
      VOLSYNC_R2_SCHEDULE: "3 4 * * *"
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kometa
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: tautulli
    - name: radarr
    - name: sonarr
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/kometa
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false # no flux ks dependents
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 10Gi
      # Low criticality: Plex metadata manager, regenerates - backup every 4 hours (staggered +25min)
      VOLSYNC_LOCAL_SCHEDULE: "25 */4 * * *"
      VOLSYNC_R2_SCHEDULE: "57 1 * * *"
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      VOLSYNC_COPYMETHOD: Snapshot
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-auto-languages
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/plex-auto-languages
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  interval: 30m
  timeout: 5m
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-image-cleanup
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/plex-image-cleanup
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
