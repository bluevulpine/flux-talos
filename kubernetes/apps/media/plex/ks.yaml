---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/media/plex/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to NS (runbook: the
      # "apps set no NS" trap); plex had none.
      NS: media
      GATUS_PATH: /web/index.html
      VOLSYNC_CAPACITY: 100Gi
      VOLSYNC_CACHE_CAPACITY: 30Gi
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      VOLSYNC_CACHE_CLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      # The component defaults to Direct, which mounts the LIVE config PVC and
      # reads it while Plex is writing. That is a ~494 MB SQLite database being
      # copied under an active writer, 48 times a day on the schedule below plus
      # once more for R2 - every one of those snapshots can be torn, and the
      # backup reports success either way. Same class as the defect fixed in
      # #1711. Snapshot takes a CSI point-in-time copy and the mover reads that
      # instead, so the database is never read mid-write and the mover stops
      # co-mounting the volume Plex is using.
      #
      # Deliberately NOT paired with VOLSYNC_ACCESSMODES: ReadWriteOnce, which
      # is the other half of the house pattern. That variable also feeds
      # components/volsync/claim.yaml, which is what creates the `plex` PVC
      # itself - so setting it here would try to mutate a bound PVC's
      # accessModes. Confirmed against the live cluster with a server-side
      # dry-run: "The PersistentVolumeClaim \"plex\" is invalid: spec:
      # Forbidden: spec is immutable after creation". One invalid resource
      # fails the whole kustomize apply while Flux still reports "applied
      # revision", which is exactly how the jellyfin migration lost a step.
      # RWO belongs in the RWX->RWO migration, where the PVC is recreated
      # anyway - not here.
      #
      # RWX + Snapshot is not a novel combination in this repo: frigate and
      # both readarr instances already run it.
      VOLSYNC_COPYMETHOD: Snapshot
      VOLSYNC_LOCAL_SCHEDULE: "20,50 * * * *"
      VOLSYNC_R2_SCHEDULE: "3 4 * * *"
      # kopiur (components/kopiur), W5. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H), VolSync's +5,
      # which keeps VolSync's slots outside the 20m forward jitter window.
      KOPIUR_LOCAL_CRON: "25,55 * * * *"
      # H picks a minute; the hour matches VolSync's R2 run.
      KOPIUR_R2_CRON: "H 4 * * *"
      # Snapshot, matching VolSync: see the torn-SQLite reasoning above.
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # Matches VOLSYNC_CACHE_CAPACITY (the component default is 16Gi).
      KOPIUR_CACHE_CAPACITY: 30Gi
      # 30m, not the component's 10m: VolSync's movers for this volume sit in
      # ContainerCreating 10-20 min on most runs while Longhorn clones it, and
      # once stalled ~2 h (runbook waves table, footnote 5).
      KOPIUR_STAGING_TIMEOUT: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kometa
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: tracearr
    - name: radarr
    - name: sonarr
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/media/plex/kometa
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false # no flux ks dependents
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to NS (runbook: the
      # "apps set no NS" trap); kometa had none.
      NS: media
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Low criticality: Plex metadata manager, regenerates - backup every 4 hours
      # kopiur (components/kopiur), W3. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's.
      KOPIUR_LOCAL_CRON: "H */4 * * *"
      KOPIUR_R2_CRON: "H 1 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-auto-languages
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/plex-auto-languages
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  interval: 30m
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex-image-cleanup
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: plex
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/media/plex/plex-image-cleanup
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
