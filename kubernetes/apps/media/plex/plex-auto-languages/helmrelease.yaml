---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex-auto-languages
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: plex-auto-languages
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      plex-auto-languages:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: remirigal/plex-auto-languages
              # renovate: datasource=docker depName=remirigal/plex-auto-languages
              tag: v1.2.3
            env:
              TZ: ${TIMEZONE}
              PLEX_URL: "http://plex.media.svc.cluster.local:32400"
            envFrom:
              - secretRef:
                  name: plex-secret
            resources:
              requests:
                cpu: 75m
                # Steady-state sits ~560Mi; on (re)connect to Plex it rescans the
                # library and spikes past the old 600M limit → OOMKilled loop
                # (surfaced when Plex restarts). Raised for scan headroom; bump
                # further if OOM recurs on larger libraries.
                memory: 512M
              limits:
                memory: 1Gi
