# Made by Magic815                                                      I modified the titles, sort_title, and commented out the posters
# Builders moved from Trakt charts to TMDb trending / IMDb popular when Kometa 2.5.0 dropped Trakt
# support (Trakt closed its API to free-account apps and forbade data-source use, Sept 2026).

collections:
  Trending Today (Unplayed):
    tmdb_trending_daily: 100
    sort_title: "!01_Charts_01 Trending Today (Unplayed)"
    sync_mode: sync
    collection_mode: hide
    collection_filtering: user
    visible_library: true
    visible_home: true
    visible_shared: true
    smart_label:
      sort_by: release.desc
      all:
        label: <<smart_label>>
        unplayed: true
    schedule: daily
  Trending This Week (Unplayed):
    tmdb_trending_weekly: 100
    sort_title: "!01_Charts_02 Trending This Week (Unplayed)"
    sync_mode: sync
    collection_mode: hide
    collection_filtering: user
    visible_library: false
    visible_home: false
    visible_shared: false
    smart_label:
      sort_by: release.desc
      all:
        label: <<smart_label>>
        unplayed: true
    schedule: daily
  Most Popular (Unplayed):
    imdb_chart: popular_movies
    sort_title: "!01_Charts_03 Most Popular (Unplayed)"
    sync_mode: sync
    collection_mode: hide
    collection_filtering: user
    visible_library: false
    visible_home: false
    visible_shared: false
    smart_label:
      sort_by: release.desc
      all:
        label: <<smart_label>>
        unplayed: true
    schedule: daily