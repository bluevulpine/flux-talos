######################################################
#                Chart Collections                   #
######################################################
templates:
  Chart:
    sort_title: +1_<<num>><<collection_name>>
    sync_mode: sync
    smart_label: random
collections:
  Plex Popular:
    template: { name: Chart, num: 1 }
    # tracearr_* take list_days/list_size like tautulli_*, but have no list_buffer.
    tracearr_popular:
      list_days: 30
      list_size: 20
    tracearr_watched:
      list_days: 30
      list_size: 20
    summary: Shows Popular on Plex
  Popular:
    template: { name: Chart, num: 3 }
    # anidb_popular was removed from Kometa (AniDB now only has id/relation/tag builders);
    # it failed the whole collection with "'anidb_popular' attribute is invalid".
    anilist_popular: 30
    summary: Popular Anime across the internet
  Top Rated:
    template: { name: Chart, num: 4 }
    anilist_top_rated: 50
    summary: Top Rated Anime across the internet
  Current Anime Season:
    # anilist_season is legacy: Kometa rewrites it to anilist_search without a season,
    # which fails validation ("must have at least one valid search option").
    anilist_search:
      season: current
      sort_by: popular
      limit: 100
    sync_mode: sync
