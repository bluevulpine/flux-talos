---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync-claim
  # kopiur backs this PVC up (W3 cutover, docs/runbooks/kopiur-migration.md).
  # volsync-claim stays: it owns the PVC and its (now inert) dataSourceRef.
  # A rebuild restores via kopiur: the claim's dataSourceRef points at a VolSync
  # RD that is no longer deployed, so the VolSync DR path does not apply.
  - ../../../../components/kopiur

resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: kometa-configmap
    files:
      - ./configs/config.yml
generatorOptions:
  disableNameSuffixHash: true
