---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: plex
  install:
    timeout: 120m
    remediation:
      retries: 3
  upgrade:
    timeout: 120m
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: volsync-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 44 = video, 109 = render (for GPU access), 10000 = media, 8675309 = custom
        supplementalGroups:
          - 44
          - 109
          - 10000
          - 8675309
        seccompProfile: {type: RuntimeDefault}
    controllers:
      plex:
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-permissions:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                # Exclude marker from future backups, but allow .kopiaignore to be backed up
                # This ensures new snapshots after restore don't immediately re-backup the marker
                echo ".permissions-fixed" > /config/.kopiaignore

                MARKER="/config/.permissions-fixed"

                # Check if marker exists and is already owned by correct user
                if [ -f "$MARKER" ] && [ "$(stat -c '%u:%g' "$MARKER" 2>/dev/null)" = "568:568" ]; then
                  echo "Permissions already fixed, skipping."
                  exit 0
                fi

                echo "Fixing ownership on /config..."
                chown -R 568:568 /config
                chmod -R u+rwX /config
                touch "$MARKER"
                chown 568:568 "$MARKER"
                echo "Permissions fixed."
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: rolling
            env:
              TZ: "${TIMEZONE}"
              # Model 3 remote path: wheels (WAN1, DDNS'd) direct on the forwarded
              # port, with Plex terminating TLS via the mounted *.funb.us cert (see
              # certificate.yaml) so the hostname validates. The LAN entry is kept
              # so LAN clients get a direct local connection to the LoadBalancer VIP
              # (Plex self-detects only its pod IP otherwise). rims/WAN2 dropped
              # (same ISP, IoT-only); plex.funb.us:443 dropped (that was the
              # Cloudflare/gateway path — throttled for streaming).
              # NOTE: the :32400 below must match the UniFi WAN1 forward and Plex's
              # "manually specify public port". Change all three together if retuned.
              PLEX_ADVERTISE_URL: https://wheels.${SECRET_DOMAIN_MEDIA}:32400,http://${SVC_PLEX_ADDR}:32400
              PLEX_NO_AUTH_NETWORKS: 10.0.10.0/24
            probes:
              # Liveness and readiness are deliberately NOT shared. Plex's config
              # is a ~494 MB SQLite database on an RWX volume, which Longhorn
              # serves over NFS (local_lock=none). A library scan or scheduled
              # maintenance can stall /identity for longer than the 30s a shared
              # 10s x 3 budget allowed - that is what killed jellyfin, which had
              # 50s. Readiness should pull the pod from endpoints; liveness must
              # not kill a busy server.
              #
              # Plex cannot take jellyfin's other fix: plex-image-cleanup mounts
              # the same claim, so the volume must stay RWX and therefore NFS.
              # The probe split is the only mitigation available here.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &probePath /identity
                    port: &probePort 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 18
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *probePort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 16Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_PLEX_ADDR:=temp}
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 32400
    ingress:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: *app
      # Separate PVC for cache to avoid backing up cache files
      plex-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      # Tuned NFS mounts (nconnect/noatime/1M rsize+wsize) via dedicated PV/PVC —
      # see media-nfs.yaml. Replaces the inline `type: nfs` volume, which could
      # not carry mountOptions.
      media:
        existingClaim: plex-media-nfs
        globalMounts:
          - path: /data
            readOnly: true
      media-home:
        existingClaim: plex-media-home-nfs
        globalMounts:
          - path: /data/video/Home
            readOnly: true
      # cert-manager PKCS#12 bundle for Plex's custom certificate (Model 3).
      # The plex ks dependsOn nothing that guarantees the cert exists first, but
      # cert-manager issues it within the same reconcile window; Reloader rolls
      # the pod on issue and on every renewal. (app-template's schema rejects an
      # `optional` flag here, so on a cold cluster this mount waits for the cert.)
      plex-cert:
        type: secret
        name: plex-funbus-tls
        globalMounts:
          - path: /certs
            readOnly: true
