---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: plex
  install:
    timeout: 120m
    remediation:
      retries: 3
  upgrade:
    timeout: 120m
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: volsync-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 44 = video, 109 = render (for GPU access), 10000 = media, 8675309 = custom
        supplementalGroups:
          - 44
          - 109
          - 10000
          - 8675309
        seccompProfile: {type: RuntimeDefault}
    controllers:
      plex:
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-permissions:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                # Exclude marker from future backups, but allow .kopiaignore to be backed up
                # This ensures new snapshots after restore don't immediately re-backup the marker
                echo ".permissions-fixed" > /config/.kopiaignore

                MARKER="/config/.permissions-fixed"

                # Check if marker exists and is already owned by correct user
                if [ -f "$MARKER" ] && [ "$(stat -c '%u:%g' "$MARKER" 2>/dev/null)" = "568:568" ]; then
                  echo "Permissions already fixed, skipping."
                  exit 0
                fi

                echo "Fixing ownership on /config..."
                chown -R 568:568 /config
                chmod -R u+rwX /config
                touch "$MARKER"
                chown 568:568 "$MARKER"
                echo "Permissions fixed."
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: rolling
            env:
              TZ: "${TIMEZONE}"
              # Model 3 remote path: wheels (WAN1, DDNS'd) direct on the forwarded
              # port, with Plex terminating TLS via the mounted *.funb.us cert (see
              # certificate.yaml) so the hostname validates. The LAN entry is kept
              # so LAN clients get a direct local connection to the LoadBalancer VIP
              # (Plex self-detects only its pod IP otherwise). rims/WAN2 dropped
              # (same ISP, IoT-only); plex.funb.us:443 dropped (that was the
              # Cloudflare/gateway path — throttled for streaming).
              # NOTE: the :32400 below must match the UniFi WAN1 forward and Plex's
              # "manually specify public port". Change all three together if retuned.
              PLEX_ADVERTISE_URL: https://wheels.${SECRET_DOMAIN_MEDIA}:32400,http://${SVC_PLEX_ADDR}:32400
              PLEX_NO_AUTH_NETWORKS: 10.0.10.0/24
            probes:
              # Liveness and readiness are deliberately NOT shared. Plex serves
              # /identity from the same process that runs library maintenance, so
              # a scan or a scheduled task can stall it for far longer than the
              # 30s a shared 10s x 3 budget allowed - that is what killed
              # jellyfin, which had 50s. Readiness should pull the pod from
              # endpoints; liveness must not kill a busy server.
              #
              # The config volume is a ~494 MB SQLite database on an RWX claim
              # that Longhorn serves over NFS. That is context, not cause: the
              # measurement further down rules the storage out.
              #
              # The thresholds below are sized against a measured stall, not an
              # estimate. On 2026-09-02 Plex froze process-wide twice - 08:13Z and
              # 18:31Z - with 62s of zero log output and requests completing at
              # 123,077ms, while jellyseerr issued up to 62 concurrent
              # /library/metadata/...?includeChildren=1 alongside Plex's own Butler
              # RefreshPeriodicMetadata. Not CPU-bound: 5m cores with the node at
              # 18%. What does move is database contention - SLOW QUERY warnings
              # ran 1259 in hour 03 against 37 and 56 either side - and Plex's
              # SLOW QUERY measures wall time, so lock waits inflate it just as
              # much as slow I/O would. Which of those it was is settled below.
              #
              # Against a 123s worst case the previous budgets were wrong in both
              # directions. Readiness at 3 x 10s = 30s fired, ejecting a healthy
              # Plex from its endpoints for the rest of the stall - and with one
              # replica and nothing to fail over to, that converts a slow response
              # into a hard failure. Liveness at 18 x 10s = 180s left only 57s of
              # headroom, so a slightly longer scan would have had the kubelet kill
              # Plex mid-maintenance, mid-write to its database.
              #
              # 15 x 10s = 150s readiness rides out the measured stall with 27s to
              # spare and still ejects a genuinely wedged server inside 2.5 minutes.
              # 30 x 10s = 300s liveness keeps the backstop while restoring the
              # margin the split was meant to provide.
              #
              # This is a cushion, not a fix - it makes the stall survivable, not
              # shorter. But it is a cushion over the right thing, which was not
              # obvious: this comment used to reason from the volume being NFS,
              # and concluded the probe split was "the only mitigation available
              # here" because plex-image-cleanup mounts the same claim and so Plex
              # could not take jellyfin's RWO fix.
              #
              # Both halves of that are now measured and both are wrong.
              #
              # NFS is not the mechanism. /proc/self/mountstats inside the running
              # pod, over the same 25h that contains both stalls:
              #
              #   config (Longhorn share-manager)  READ 1.43ms  COMMIT 2.95ms
              #                                    retrans 0, timeouts 0, backlog 0
              #   /data  (TrueNAS vault.funb.us)   READ 30.90ms COMMIT 62.62ms
              #
              # timeouts and retrans are cumulative counts, not means, so zero
              # covers every instant including the stalls; the mount is timeo=600,
              # so no single RPC ever ran 60s. Jellyfin's win came off the 30ms
              # store, not this one - a different NFS entirely. And RWO would not
              # even remove the network hop: longhorn-1-replica sets
              # dataLocality: disabled, and Plex's sole replica already sits on a
              # different node than its pod. Idle CPU, a storage path measured
              # fast, and a freeze that silences every thread at once: that is
              # serialisation inside the application, not I/O. Note the storage
              # side is measured at the NFS client, not at the disks behind it -
              # enough to clear this mount, not a claim about the whole stack.
              #
              # The co-mount blocker is also not real. RWO is per-node, not per-pod
              # (ReadWriteOncePod is the strict one and is not in use), and
              # plex-image-cleanup ALREADY co-mounts the RWO plex-cache claim
              # alongside a running Plex in the same pod spec. If RWO blocked this,
              # it would already be blocked. Migrating is still worth doing - it
              # takes SQLite's 1.37M LOCK + 1.37M LOCKU RPCs off the wire - but as
              # hygiene, not as the fix for this stall.
              #
              # Measured by Pollen 2026-09-02 and reproduced independently before
              # this comment was written. Full workings live in the agent
              # workspace (~/.buzz/RESEARCH/PLEX_RWX_TO_RWO_2026-09-02.md), not in
              # this repo - the numbers above are the part worth keeping here.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &probePath /identity
                    port: &probePort 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *probePort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 15
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 16Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_PLEX_ADDR:=temp}
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 32400
    ingress:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: *app
      # Separate PVC for cache to avoid backing up cache files
      plex-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      # Tuned NFS mounts (nconnect/noatime/1M rsize+wsize) via dedicated PV/PVC —
      # see media-nfs.yaml. Replaces the inline `type: nfs` volume, which could
      # not carry mountOptions.
      media:
        existingClaim: plex-media-nfs
        globalMounts:
          - path: /data
            readOnly: true
      media-home:
        existingClaim: plex-media-home-nfs
        globalMounts:
          - path: /data/video/Home
            readOnly: true
      # cert-manager PKCS#12 bundle for Plex's custom certificate (Model 3).
      # The plex ks dependsOn nothing that guarantees the cert exists first, but
      # cert-manager issues it within the same reconcile window; Reloader rolls
      # the pod on issue and on every renewal. (app-template's schema rejects an
      # `optional` flag here, so on a cold cluster this mount waits for the cert.)
      plex-cert:
        type: secret
        name: plex-funbus-tls
        globalMounts:
          - path: /certs
            readOnly: true
