---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name plex-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        PLEX_TOKEN: "{{ .Plex__Token }}"
        # Password for the cert-manager PKCS#12 keystore (see certificate.yaml).
        # Add `Plex__Cert__P12Password` under the `plex` key in OpenBao. The same
        # value is entered into Plex's "Custom certificate encryption key" field.
        PLEX_CERT_P12_PASSWORD: "{{ .Plex__Cert__P12Password }}"
  dataFrom:
    - extract:
        key: plex
