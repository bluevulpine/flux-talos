---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync-claim
  # kopiur backs this PVC up (W5 cutover, docs/runbooks/kopiur-migration.md).
  # volsync-claim stays: it owns the PVC and its (now inert) dataSourceRef.
  - ../../../../components/kopiur

resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./certificate.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./media-nfs.yaml
  - ./pvc.yaml

patches:
  # Stage kopiur's snapshot clones on 1 replica, as VolSync did. A staged PVC
  # otherwise inherits the source class, and since the 2-replica re-bind every
  # run would clone a 100Gi 2-REPLICA volume only to read it once and delete it
  # (runbook waves table, footnote 6; same patch as matrix-bluevulpine).
  #
  # And stage it ReadWriteOnce. The staged PVC otherwise copies the source's
  # access modes, and plex's claim is ReadWriteMany (see ks.yaml for why), so
  # Longhorn served every clone over NFS from a share-manager pod, which can
  # land on any node, Pis included. On 2026-10-08 it landed on jormungandr1:
  # the mover mounted 100Gi / 175k files over NFS from a Pi, hung on its first
  # reads, and held the schedule (concurrencyPolicy Forbid) for 48h until the
  # Job's deadline. One pod reads the clone, so RWX bought nothing.
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/staging/storageClassName
        value: longhorn-1-replica
      - op: add
        path: /spec/staging/accessModes
        value:
          - ReadWriteOnce
  # Moving the data claim to longhorn-2-replica WITHOUT a restore: storageClassName
  # is immutable on a bound PVC, so the claim is deleted (PV on Retain) and Flux
  # re-creates it pre-bound to the SAME Longhorn volume (already live-patched to 2
  # replicas). Procedure: docs/runbooks/volsync-app-namespace-move.md.
  #  - `ssa: IfNotPresent`: Flux skips the claim while it exists, so git changes to
  #    it never reach the live claim. NEVER remove it while the claim exists
  #    (Flux owns f:volumeName -> immutable stall). Claim edits in git (capacity,
  #    class, labels) are then silently ignored; expand by hand and keep git equal:
  #    kubectl -n media patch pvc plex -p '{"spec":{"resources":{"requests":{"storage":"<size>"}}}}'
  #  - The temporary `volumeName` pin used for the re-create was dropped once the
  #    swap was done (2026-10-03); a rebuilt cluster now re-creates the claim
  #    unpinned.
  # kopiur app: the claim's dataSourceRef points at a VolSync RD that is no longer
  # deployed (inert), so a rebuild restores via kopiur, NOT the VolSync DR path
  # (docs/runbooks/kopiur-migration.md).
  # Targeted by NAME (the data claim is literally `${APP}` at build time) so any
  # other claim in this app (media NFS, caches) is left alone.
  - target:
      kind: PersistentVolumeClaim
      name: \$\{APP\}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
