---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plex-daily-restart
---
# Scoped to the plex Deployment only: `rollout restart` patches it and the wait
# loop gets it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plex-daily-restart
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - plex
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plex-daily-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plex-daily-restart
subjects:
  - kind: ServiceAccount
    name: plex-daily-restart
    namespace: media
