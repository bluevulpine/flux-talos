---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatcharr-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Modular mode reads these directly (docker/entrypoint.sh, settings.py).
        # POSTGRES_USER is ALSO the Linux account the entrypoint creates and
        # runs uwsgi as (`su - "$POSTGRES_USER"`), so it must be a valid
        # username - keep the OpenBao value plain lowercase.
        POSTGRES_HOST: &dbHost ${POSTGRES_HOST}
        POSTGRES_PORT: "5432"
        POSTGRES_DB: &dbName dispatcharr
        POSTGRES_USER: &dbUser "{{ .Dispatcharr__Postgres__User }}"
        POSTGRES_PASSWORD: &dbPass "{{ .Dispatcharr__Postgres__Password }}"
        # Init container config
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
  dataFrom:
    - extract:
        key: dispatcharr
    - extract:
        key: cloudnative-pg
