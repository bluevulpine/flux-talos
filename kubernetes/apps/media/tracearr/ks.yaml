---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tracearr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Tracearr runs migrations and creates its continuous aggregates against
    # timescaledb at boot, and coordinates its connection-pool budget through
    # the shared dragonfly. Neither is optional at startup.
    - name: timescaledb
      namespace: database
    - name: dragonfly-cluster
      namespace: database
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/tracearr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: media
      GATUS_SUBDOMAIN: tracearr
      # The volsync claim is Tracearr's own logical database backups, not its
      # cache. Snapshotting timescaledb's volume is crash-consistent but not
      # logically consistent; these dumps are what covers that gap, so they are
      # the thing worth replicating offsite. The poster cache is a separate,
      # deliberately unbacked-up PVC - see app/pvc.yaml.
      VOLSYNC_CAPACITY: 10Gi
      # Was "27,57 * * * *". Minutes 27 and 57 are both R2 grid slots, and this
      # source fires EVERY hour, so it collided exactly - same minute, not near
      # it - with a different app's R2 mover in all five R2 hours: 10 of the 11
      # exact local/R2 collisions in the repo came from this one line. The R2
      # grid in components/volsync/r2.yaml spaces R2 sources from each OTHER and
      # never accounted for local movers, which run hourly on a ~2-minute pitch.
      # 24 and 54 keep the twice-hourly cadence, are off the R2 grid entirely,
      # and are free of every other local mover in every hour.
      VOLSYNC_LOCAL_SCHEDULE: "24,54 * * * *"
      VOLSYNC_R2_SCHEDULE: "17 2 * * *"
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Set alongside ACCESSMODES, never on its own: the component defaults to
      # Direct, which reads the volume live. Pollen caught exactly this pairing
      # missing on timescaledb, 2026-09-01.
      VOLSYNC_COPYMETHOD: Snapshot
      # Upstream Dockerfile user is 1001:1001 (tracearr:nodejs) - NOT the 1000
      # timescaledb uses. A root mover would restore root-owned dumps.
      VOLSYNC_RUN_AS_USER: "1001"
      VOLSYNC_RUN_AS_GROUP: "1001"
      VOLSYNC_FS_GROUP: "1001"
      # kopiur (components/kopiur), W3. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H), VolSync's +5,
      # which keeps VolSync's slots outside the 20m forward jitter window.
      KOPIUR_LOCAL_CRON: "29,59 * * * *"
      # R2 pinned to an explicit minute <= :39, not H 2: jitter could spill
      # into hour 03, reserved for kopia-maint-r2 (waves table footnote 2).
      # The minute also keeps VolSync's own R2 run outside the 20m window.
      KOPIUR_R2_CRON: "38 2 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # Mirrors VOLSYNC_RUN_AS_* / VOLSYNC_FS_GROUP.
      KOPIUR_RUN_AS_USER: "1001"
      KOPIUR_RUN_AS_GROUP: "1001"
      KOPIUR_FS_GROUP: "1001"
