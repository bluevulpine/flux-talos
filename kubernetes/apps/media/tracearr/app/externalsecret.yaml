---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name tracearr-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Assembled here rather than via upstream's $(DB_PASSWORD) env
        # interpolation, which only works because the password is URL-safe.
        # It was generated alphanumeric for exactly this reason: a '/' or '+'
        # in a connection string needs percent-encoding and fails late.
        DATABASE_URL: "postgres://tracearr:{{ .Timescaledb__Password }}@timescaledb.database.svc.cluster.local:5432/tracearr"
        JWT_SECRET: "{{ .Tracearr__JwtSecret }}"
        COOKIE_SECRET: "{{ .Tracearr__CookieSecret }}"
  dataFrom:
    # Two extracts: the database password is owned by timescaledb and must not
    # be duplicated here, or rotation silently drifts between the two copies.
    - extract:
        key: tracearr
    - extract:
        key: timescaledb
