---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tracearr-rules
spec:
  groups:
    - name: tracearr.backups
      rules:
        # Tracearr's logical database backups are the only logically-consistent
        # copy of the watch history - a volsync snapshot of timescaledb's volume
        # is crash-consistent, which WAL replay recovers but which cannot give a
        # per-table or point-in-time restore.
        #
        # They ship DISABLED (`backupScheduleType: 'disabled'`, services/settings.ts)
        # and are enabled through the UI, not through this repo. That makes them
        # undeclared state: a rebuild from git restores every manifest here and
        # does not restore that toggle. This alert is what turns "somebody
        # remembered" into something the cluster checks.
        #
        # COUNT INODES, NOT BYTES. The first shipped version used
        # `used_bytes < 1048576` on the reasoning that "an empty ext4 volume still
        # carries lost+found" - a floor picked without measuring either side of it.
        # Both sides were then measured, live, on 2026-09-01:
        #
        #   empty volume    11 inodes / 24576 bytes.  Identical on `tracearr` and
        #                   `tracearr-image-cache`, two independently provisioned
        #                   longhorn-1-replica volumes - so this is the ext4 baseline,
        #                   not something Tracearr did.
        #
        #   one backup      services/backup.js runs `pg_dump -Fc`, then packs the dump
        #                   plus metadata.json into a zip at `zlib: { level: 1 }`.
        #                   Against the live database: -Fc is 205,519 bytes, and the
        #                   same stream through deflate level 1 is 48,825 bytes.
        #                   So the artifact on disk is ~49 KB and the volume reads
        #                   roughly 73 KB - still 14x BELOW the 1 MiB floor.
        #
        # The old rule therefore kept firing after a successful backup, asserting
        # "backups are almost certainly still disabled" while they were running. It
        # only cleared once the database had grown enough to push a dump past 1 MiB,
        # which depends entirely on how much watch history gets imported - i.e. the
        # threshold was calibrated against an unknown.
        #
        # Inode count removes that dependency. Each backup writes exactly two files
        # (the zip and its .meta.json sidecar) regardless of database size, so any
        # backup at all moves 11 -> 13. `<= 11` is exactly "nothing has ever been
        # written here".
        #
        # Known limit, in the silent direction: if a future volume's empty baseline
        # were ever 12 rather than 11, this would stop firing rather than fire
        # wrongly. Two independent volumes both read 11; re-measure if the
        # storageclass or filesystem changes.
        - alert: TracearrBackupVolumeEmpty
          expr: |-
            kubelet_volume_stats_inodes_used{namespace="media", persistentvolumeclaim="tracearr"} <= 11
          for: 24h
          annotations:
            summary: >-
              Tracearr's backup volume has held no files for 24h — scheduled backups
              are almost certainly still disabled. Enable them in Settings; volsync
              replicates /data/backup once they exist.
          labels:
            severity: warning
            # NOT SHIPPED: a staleness alert. Two attempts, both wrong, recorded so
            # nobody re-derives them:
            #
            #   increase(...[14d])  - `increase()` is counter-aware and reads every
            #     decrease as a reset, so retention pruning (the exact event we want
            #     flagged) is scored as a large positive. Signal inverted. Use
            #     delta() or max_over_time-min_over_time on a gauge.
            #
            #   any [14d] window     - kube-prometheus-stack retains 2d. A
            #     PrometheusRule is evaluated by Prometheus against its LOCAL TSDB
            #     (ruleSelector: {}), not by thanos-rule, which loads its own
            #     --rule-file=/etc/thanos/rules/*.yaml. Thanos holds the long-term
            #     data and does not evaluate this rule. Measured: 3036 samples in
            #     [14d] against 1437 in [1d] - the series is 2.1 days long.
            #
            # Staleness stays uncovered. Inode count answers "has a backup ever been
            # written", not "was the last one recent" - a volume holding one dump from
            # six months ago reads the same as one written last night. File mtime is
            # the honest signal for freshness, and every backup route in Tracearr is
            # owner-authenticated, so it needs a credential or a small exporter. If a
            # long window is ever wanted, the place is thanos-rule's rule-file, not a
            # PrometheusRule.
            #
            # TracearrBackupVolumeEmpty answers "was this ever turned on", which is
            # the risk actually being carried, and now answers it correctly in both
            # directions.
