---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/calibre/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: media
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: media
      GATUS_PORT: "8080"
      GATUS_SERVICE: calibre
      VOLSYNC_CAPACITY: 2Gi
      # Low criticality: ebook library config - backup every hour (staggered +30min)
      VOLSYNC_LOCAL_SCHEDULE: "30 * * * *"
      VOLSYNC_R2_SCHEDULE: "27 0 * * *"
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      VOLSYNC_COPYMETHOD: Snapshot
      # kopiur (components/kopiur), W2. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's.
      KOPIUR_LOCAL_CRON: "H * * * *"
      KOPIUR_R2_CRON: "H 0 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass

