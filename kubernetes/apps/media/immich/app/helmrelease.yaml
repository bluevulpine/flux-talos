---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      immich:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: rolling
            envFrom:
              - secretRef:
                  name: immich-secret
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              TZ: "${TIMEZONE}"
              IMMICH_WORKERS_INCLUDE: "api"
              IMMICH_LOG_LEVEL: log
              IMMICH_MEDIA_LOCATION: /usr/src/app/upload
              # Machine learning URL - points to ML sidecar
              IMMICH_MACHINE_LEARNING_URL: http://localhost:3003
              # potential fix for tiled HEIC - use local tempdir
              IMMICH_IMAGE_PROCESSING_TEMP_DIRECTORY: /tmp
              IMMICH_MEDIA_PROCESSING_CONCURRENCY: "1"
            envFrom:
              - secretRef:
                  name: immich-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 2283
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
          # Machine learning sidecar - CPU only
          machine-learning:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0
            env:
              TZ: "${TIMEZONE}"
              IMMICH_LOG_LEVEL: log
              # Use CPU for ML (no GPU acceleration)
              MACHINE_LEARNING_WORKERS: "3"
              MACHINE_LEARNING_WORKER_TIMEOUT: "120"
              # HuggingFace needs writable home for download metadata
              HF_HOME: /cache
              MPLCONFIGDIR: /tmp/matplotlib
            envFrom:
              - secretRef:
                  name: immich-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                # ML holds a full copy of every active model per worker (3 workers:
                # CLIP ViT-B-32, buffalo_l face det+rec, PP-OCRv5_server OCR). During
                # first-time backups all three families load at once across all
                # workers and peak well past the old 4Gi limit -> repeated OOMKills.
                # Node has ~40Gi free, so give a generous ceiling for the ingest surge.
                memory: 2Gi
              limits:
                memory: 12Gi
      # Microservices controller for background jobs
      microservices:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              TZ: "${TIMEZONE}"
              IMMICH_WORKERS_EXCLUDE: "api"
              IMMICH_LOG_LEVEL: log
              IMMICH_MEDIA_LOCATION: /usr/src/app/upload
              IMMICH_MACHINE_LEARNING_URL: http://immich:3003
              # potential fix for tiled HEIC - use local tempdir
              IMMICH_IMAGE_PROCESSING_TEMP_DIRECTORY: /tmp
              IMMICH_MEDIA_PROCESSING_CONCURRENCY: "1"
            envFrom:
              - secretRef:
                  name: immich-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: immich
        ports:
          http:
            port: *port
          ml:
            port: 3003
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Immich"
          gethomepage.dev/group: "Photos"
          gethomepage.dev/icon: "immich.png"
          gethomepage.dev/description: "Photo Management"
          gethomepage.dev/widget.type: "immich"
          gethomepage.dev/widget.url: "http://immich.media.svc.cluster.local:2283"
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_IMMICH_TOKEN}}`}}"
          gethomepage.dev/widget.version: "2"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
          # Public traffic arrives via the Pangolin VPS -> Newt connector, NOT the
          # Cloudflare tunnel: CF caps proxied uploads at 100MB (Immich 413s on
          # full-res video) and throttles to ~1.6MB/s per stream. Attaching to
          # `external-pangolin` instead of `external` is also what keeps split
          # horizon working -- external-dns derives records per-gateway, so the
          # public record comes from ./dnsendpoint.yaml while `internal` above
          # still publishes the LAN A record for on-network clients.
          - name: external-pangolin
            namespace: network
            sectionName: https
        hostnames:
          - photos.${SECRET_DOMAIN}
    # Tailnet-only door for the Immich mobile app: direct WireGuard, no
    # Cloudflare 100MB upload cap. NOT funneled — private to the tailnet.
    # The public `route:` above stays for share links (served via Cloudflare).
    ingress:
      tailscale:
        enabled: true
        className: tailscale
        hosts:
          - host: immich
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - immich
    persistence:
      # Main media storage on NFS - large capacity for iCloud library
      library:
        existingClaim: immich-nfs
        globalMounts:
          - path: /usr/src/app/upload
            readOnly: false
      # ML cache directory - must be /cache to match MACHINE_LEARNING_CACHE_FOLDER
      # PVC to persist downloaded models across restarts (no volsync needed)
      cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: longhorn-1-replica
        advancedMounts:
          immich:
            machine-learning:
              - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
