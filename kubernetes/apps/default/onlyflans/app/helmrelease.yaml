---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app onlyflans
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: onlyflans
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      # Prefers the Raspberry Pi workers (the only arm64 nodes), falling back to
      # brokkr. Small, stateless or NFS-only, with a multi-arch image; moved
      # 2026-09-22 when jormungandr1-3 stopped being control-plane nodes.
      tolerations:
        - key: "node.kubernetes.io/low-power"
          operator: "Equal"
          value: "raspberry-pi"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: "kubernetes.io/arch"
                    operator: "In"
                    values:
                      - "arm64"
    controllers:
      onlyflans:
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              # nginxinc/nginx-unprivileged is archived on Docker Hub; NGINX publishes it here now.
              # Pinned to a version + digest, not a floating tag: with `alpine`/`1.31-alpine`
              # Renovate had nothing to bump, so the 2026-11-18 HTTP/2 CVEs (fixed in 1.31.9)
              # produced no PR. A digest change also changes the pod spec, so Flux rolls it.
              repository: nginx/nginx-unprivileged
              tag: 1.31.10-alpine@sha256:86628f2c9eaa5e84e3b98d25e26563c4a4f9b0ead9cf5656da4731d86e0621de
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        pod:
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
    service:
      app:
        controller: onlyflans
        ports:
          http:
            port: *port
    persistence:
      html:
        type: configMap
        name: onlyflans-html
        globalMounts:
          - path: /usr/share/nginx/html/index.html
            subPath: index.html
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx

