---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app timescaledb
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: longhorn
      namespace: longhorn-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/database/timescaledb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database
      VOLSYNC_CAPACITY: 20Gi
      # 2 replicas: a single replica makes every Talos drain a data-loss risk until
      # a crash-consistent kopiur snapshot is restored (see KOPIUR_COPYMETHOD).
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      # Explicit RWO. The volsync-claim component defaults to ReadWriteMany, which on
      # Longhorn means a share-manager and therefore NFS - the wrong substrate
      # for a database. Nothing else mounts this claim, so RWO is correct and
      # stating it keeps the default from being load-bearing.
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # kopiur (components/kopiur), W4. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H), chosen as
      # VolSync's +5 so the two engines stayed apart during the parallel run.
      KOPIUR_LOCAL_CRON: "27,57 * * * *"
      # H picks a minute; the hour matches VolSync's old R2 run.
      KOPIUR_R2_CRON: "H 6 * * *"
      # Snapshot, not the component default of Direct. Direct has kopia walk a
      # live PGDATA while Postgres writes to it - files read at different
      # instants, no consistency point. Snapshot takes an atomic point-in-time
      # that Postgres crash-recovers from via WAL on restore. Note the limit:
      # crash-consistent, not logically consistent - no per-table or PITR
      # restore, and a corrupt page is copied faithfully into every snapshot.
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # timescaledb-ha runs as postgres, uid/gid 1000.
      KOPIUR_RUN_AS_USER: "1000"
      KOPIUR_RUN_AS_GROUP: "1000"
      KOPIUR_FS_GROUP: "1000"
