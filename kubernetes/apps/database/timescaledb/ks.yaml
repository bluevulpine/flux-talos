---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app timescaledb
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: longhorn
      namespace: longhorn-system
  path: ./kubernetes/apps/database/timescaledb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      VOLSYNC_CACHE_CLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      # Explicit RWO. The volsync component defaults to ReadWriteMany, which on
      # Longhorn means a share-manager and therefore NFS - the wrong substrate
      # for a database. Nothing else mounts this claim, so RWO is correct and
      # stating it keeps the default from being load-bearing.
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Snapshot, not the component default of Direct. Direct has kopia walk a
      # live PGDATA while Postgres writes to it - files read at different
      # instants, no consistency point. Snapshot takes an atomic point-in-time
      # that Postgres crash-recovers from via WAL on restore. Note the limit:
      # crash-consistent, not logically consistent - no per-table or PITR
      # restore, and a corrupt page is copied faithfully into every snapshot.
      VOLSYNC_COPYMETHOD: Snapshot
      # timescaledb-ha runs as postgres, uid/gid 1000.
      VOLSYNC_RUN_AS_USER: "1000"
      VOLSYNC_RUN_AS_GROUP: "1000"
      VOLSYNC_FS_GROUP: "1000"
      VOLSYNC_LOCAL_SCHEDULE: "22,52 * * * *"
      VOLSYNC_R2_SCHEDULE: "52 1 * * *"
