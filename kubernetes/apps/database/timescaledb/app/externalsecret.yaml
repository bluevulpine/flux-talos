---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name timescaledb-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Superuser password for the initdb run. The image also creates
        # POSTGRES_DB/POSTGRES_USER on first boot from the env below.
        POSTGRES_PASSWORD: "{{ .Timescaledb__Password }}"
  dataFrom:
    - extract:
        key: timescaledb
