---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cloudnative-pg-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          # Without this the CNPG operator does not watch the Secret, so a
          # rotated superuser password reaches the Secret but never the
          # role: on 2026-11-11 the old password kept working until a manual
          # `cnpg.io/reloadedAt` annotation on the Cluster. With the label,
          # the change is picked up and applied as ALTER ROLE.
          cnpg.io/reload: "true"
      data:
        username: "{{ .Postgres__Username }}"
        password: "{{ .Postgres__SuperPassword }}"
        # R2 credentials (kept for externalClusters recovery from v6, v7)
        s3-access-key-id: "{{ .R2__AccessKey }}"
        s3-secret-access-key: "{{ .R2__SecretKey }}"
        # Garage credentials (new primary destination for v8+)
        s3-access-key-id-garage: "{{ .Garage__AccessKey }}"
        s3-secret-access-key-garage: "{{ .Garage__SecretKey }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: r2
    - extract:
        key: garage
