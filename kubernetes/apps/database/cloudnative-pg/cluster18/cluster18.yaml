---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# NEW pg18 cluster. Stood up ALONGSIDE the live postgres16 and seeded once via a
# logical monolith import (pg_dump/restore) over postgres16-rw. Fresh Longhorn 50Gi
# PVCs sidestep the openebs→longhorn resize deadlock, and the logical restore
# de-bloats the data. Extension preflight PASSED: every extension in use
# (pg_trgm, uuid-ossp, unaccent, earthdistance, cube, vector) ships in
# 18.2-standard-trixie; pgvector goes 0.7.0→0.8.1 (immich), storage-compatible.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
spec:
  instances: 3
  # Tracked by the "CloudNativePG Cluster imageName" custom manager in
  # .renovate/customManagers.json5, NOT by a `# renovate:` annotation. One sat
  # here from the pg18 cutover on and never produced a PR: the generic annotated
  # -dependency regex reads its value from the line directly below the annotation,
  # which was a NOTE comment, and even placed correctly it would capture the whole
  # `repo:tag` reference as the version. So this stayed on 18.2 for seven months,
  # through 18.3's fix for a substring()/LEFT() regression ("invalid byte sequence
  # for encoding UTF8" on TOASTed non-ASCII text) that was 500ing hindsight's
  # knowledge-page search.
  #
  # 18.x uses the flavor tag format (18.6-standard-trixie), not the old
  # <ver>-<build> ("16.2-16") scheme; the manager's versioning pins the flavor.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  primaryUpdateStrategy: unsupervised

  storage:
    size: 50Gi
    storageClass: longhorn-1-replica-local

  # Required (not CNPG's default preferred/soft) anti-affinity. With the soft rule,
  # two instances once landed on the same node (brokkr03), and Longhorn's
  # best-effort data locality then moved both instances' sole volume replicas
  # there, so one node loss or reboot would have taken two of three members'
  # storage offline. With `required` there is one instance per node, so locality
  # keeps each volume next to its own pod and the replicas spread one per node.
  # Trade-off: if a node is down for a long time its instance stays Pending rather
  # than doubling up on another node; acceptable because the other two keep serving.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  superuserSecret:
    name: &secretName cloudnative-pg-secret
  enableSuperuserAccess: true

  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
    # Added to the default queries, not replacing them. See the ConfigMap.
    customQueriesConfigMap:
      - name: postgres18-monitoring-hindsight
        key: queries

  # Backups via the Barman Cloud Plugin — the in-tree spec.backup.barmanObjectStore
  # no longer works on 18.x (the image dropped the in-image barman-cloud tools). WAL
  # archiving + base backups stream to the postgres18-backup ObjectStore (see
  # objectstore.yaml: same Garage S3 target as postgres16). The plugin injects a
  # sidecar into each instance; it's the sidecar-based successor to what postgres16
  # does in-image. scheduledbackup.yaml drives the base-backup cron.
  # serverName (postgres18-v1) is set HERE, not on the ObjectStore: plugin v0.13.0
  # requires the per-cluster serverName as a plugin parameter — it keeps postgres18's
  # WAL/base backups from colliding with postgres16's in the shared bucket.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres18-backup
        serverName: postgres18-v1

  # One-shot logical import of ALL databases + roles from the live postgres16.
  # Runs once, at initial creation only; read-only (pg_dump) on the source.
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - "*"
        roles:
          - "*"
        source:
          externalCluster: postgres16

  # Live-connection source for the import (stays literal postgres16-rw — this is the
  # one place that must NOT be swapped to ${POSTGRES_HOST}).
  externalClusters:
    - name: postgres16
      connectionParameters:
        host: postgres16-rw.database.svc.cluster.local
        user: postgres
        dbname: postgres
      password:
        name: *secretName
        key: password
