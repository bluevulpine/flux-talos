---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        # Immich's nightly file-checksum job (IntegrityService, 03:00 local,
        # capped at 1 hour) holds one transaction open for the whole run: on
        # 2026-11-15 it was 3515 s old at 09:59Z, opened as the job started
        # at 09:00Z. That paged on ~85 of 90 days and taught the alert to be
        # ignored. Only that connection (immich db, postgres.js) is exempt,
        # and only 08:00-10:59 UTC, which covers 03:00-04:00 local under
        # both CST and CDT. Any other database, or Immich outside that
        # window, still fires. If the job's schedule or time limit changes
        # in Immich's settings, move this window with it.
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
            unless (
              cnpg_backends_max_tx_duration_seconds{datname="immich", application_name="postgres.js"}
              and on () (hour() >= 8 <= 10)
            )
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        # Critical twin (paged as an emergency, see alertmanagerconfig.yaml): an hour
        # of lag means replay has stopped. On 2026-10-23 an orphaned pg_dump blocked
        # postgres18-2's replay for ~21 h while the warning repeated unnoticed.
        # `for: 15m` covers the ~10 min of high lag while a standby catches up.
        - alert: PGReplication
          annotations:
            description: >-
              {{ $labels.pod }} has not replayed for {{ $value | humanizeDuration }}: replay
              is stalled, not slow. Look for a long query blocking it on the standby
              (pg_stat_activity), and check the standby's disk.
            summary: Standby replay has stalled for over an hour
          expr: |-
            cnpg_pg_replication_lag > 3600
          for: 15m
          labels:
            severity: critical
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
