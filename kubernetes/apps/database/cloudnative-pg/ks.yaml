---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/cloudnative-pg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg-cluster
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/cloudnative-pg/cluster
  prune: true
  dependsOn:
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg-cluster18
spec:
  # SUSPENDED on purpose: this stages the pg18 migration cluster without deploying
  # it. Merging is inert. Activate the migration deliberately with
  # `flux resume kustomization cloudnative-pg-cluster18` (or set suspend: false),
  # which creates postgres18 and runs the one-shot import from live postgres16.
  suspend: true
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/cloudnative-pg/cluster18
  prune: true
  dependsOn:
    - name: cloudnative-pg
    - name: cnpg-barman-plugin
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      APP: *app
      NS: database

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cnpg-barman-plugin
spec:
  # SUSPENDED with the rest of the pg18 migration — nothing deploys on merge.
  # At phase 1, resume THIS first (installs the Barman Cloud Plugin: CRD + operator
  # sidecar-injector in the database ns), wait for it Ready, THEN resume
  # cloudnative-pg-cluster18 (which depends on it for the ObjectStore CRD).
  # The plugin only ever affects clusters that opt in via spec.plugins — postgres16
  # (in-image barman) is untouched.
  suspend: true
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/cloudnative-pg/plugin-barman-cloud
  prune: true
  dependsOn:
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m

