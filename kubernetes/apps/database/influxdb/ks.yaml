---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app influxdb
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: longhorn
      namespace: longhorn-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/database/influxdb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database
      GATUS_SUBDOMAIN: influxdb
      VOLSYNC_CAPACITY: 20Gi
      # 2 replicas: years of Home Assistant and collector history live only on this
      # volume between the twice-hourly kopiur snapshots.
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      # kopiur (components/kopiur), W4. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H), chosen as
      # VolSync's +5 so the two engines stayed apart during the parallel run.
      KOPIUR_LOCAL_CRON: "21,51 * * * *"
      # H picks a minute; the hour matches VolSync's old R2 run.
      KOPIUR_R2_CRON: "H 1 * * *"
      # Direct, as VolSync was (its default); a switch to Snapshot is a
      # post-migration follow-up (docs/runbooks/kopiur-migration.md).
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # InfluxDB runs as the influxdb user, uid/gid 1000.
      KOPIUR_RUN_AS_USER: "1000"
      KOPIUR_RUN_AS_GROUP: "1000"
      KOPIUR_FS_GROUP: "1000"

