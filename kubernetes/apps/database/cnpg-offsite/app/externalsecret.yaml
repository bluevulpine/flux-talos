---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Credentials for mirroring the Garage `cnpg` bucket offsite to Storj.
#
# Everything here is rclone's env-var config form (RCLONE_CONFIG_<REMOTE>_<KEY>),
# so the CronJob needs no rclone.conf on disk and no writable config path.
#
# Requires the OpenBao key `storj` to carry the field:
#   Storj__AccessGrant__Cnpg  — an rclone-compatible access grant, created with
#                         `uplink access create` or from the Storj console
#                         (Access → Create Access → type "S3-less"/native).
#                         Scope it to the `cnpg` bucket with write+delete only;
#                         it does NOT need read access to vault-home/vault-apps.
#
#                         The `__Cnpg` suffix is deliberate: grants here are
#                         bucket-scoped, so the key holds one field per bucket
#                         rather than a single ambiguous Storj__AccessGrant.
#                         Name any future grant the same way (…__Thanos, etc.).
#
# The native `storj` backend is used rather than the S3 gateway: it talks to the
# satellite directly, so uploads don't traverse (or depend on) gateway.storjshare.io.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cnpg-offsite-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Source: Garage on vault. REGION is mandatory and must be us-east-1 —
        # Garage rejects any other region string with AuthorizationHeaderMalformed.
        RCLONE_CONFIG_GARAGE_TYPE: s3
        RCLONE_CONFIG_GARAGE_PROVIDER: Other
        RCLONE_CONFIG_GARAGE_REGION: us-east-1
        RCLONE_CONFIG_GARAGE_ENDPOINT: "{{ .Garage__Host }}"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .Garage__AccessKey }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .Garage__SecretKey }}"
        # Destination: Storj, native backend.
        RCLONE_CONFIG_STORJ_TYPE: storj
        RCLONE_CONFIG_STORJ_PROVIDER: existing
        RCLONE_CONFIG_STORJ_ACCESS_GRANT: "{{ .Storj__AccessGrant__Cnpg }}"
  dataFrom:
    - extract:
        key: garage
    - extract:
        key: storj
