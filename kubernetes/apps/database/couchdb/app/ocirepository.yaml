---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: couchdb
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # ghcr.io/bjw-s/helm/app-template stopped at 3.7.3 when the chart moved to bjw-s-labs, so
  # Renovate never offered 4.x/5.x here. 4.x changed the Deployment selector label
  # (component -> controller): the first upgrade needs the Deployment deleted (PVC kept).
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template

