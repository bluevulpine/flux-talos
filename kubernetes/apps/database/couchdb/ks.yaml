---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app couchdb
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: longhorn
      namespace: longhorn-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/database/couchdb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database
      GATUS_SUBDOMAIN: couchdb
      VOLSYNC_CAPACITY: 5Gi
      # 2 replicas: the Obsidian LiveSync database lives only on this volume between
      # the 6-hourly kopiur snapshots.
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      # kopiur (components/kopiur), W4. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # 6-hourly: one of three exceptions to the daily local default
      # (vaultwarden, gitea, couchdb; Derek, 2026-10-29), where losing a day
      # of changes hurts. H picks the minute.
      KOPIUR_LOCAL_CRON: "H */6 * * *"
      # H picks a minute; the hour matches VolSync's old R2 run.
      KOPIUR_R2_CRON: "H 0 * * *"
      # Direct, as VolSync was (its default); a switch to Snapshot is a
      # post-migration follow-up (docs/runbooks/kopiur-migration.md).
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass

