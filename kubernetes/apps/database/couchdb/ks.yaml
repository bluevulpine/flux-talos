---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app couchdb
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: longhorn
      namespace: longhorn-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/database/couchdb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: database
      GATUS_SUBDOMAIN: couchdb
      VOLSYNC_CAPACITY: 5Gi
      # 2 replicas: the Obsidian LiveSync database lives only on this volume between
      # the twice-hourly VolSync snapshots.
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      VOLSYNC_CACHE_CLASS: longhorn-1-replica
      VOLSYNC_CLONE_STORAGECLASS: longhorn-1-replica
      VOLSYNC_SNAPSHOTCLASS: longhorn-snapclass
      VOLSYNC_LOCAL_SCHEDULE: "14,44 * * * *"
      VOLSYNC_R2_SCHEDULE: "41 0 * * *"
      # kopiur (components/kopiur), W4. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # Twice-hourly: explicit minutes (kopiur has no stepped H), VolSync's +5,
      # which keeps VolSync's slots outside the 20m forward jitter window.
      KOPIUR_LOCAL_CRON: "19,49 * * * *"
      # H picks a minute; the hour matches VolSync's R2 run.
      KOPIUR_R2_CRON: "H 0 * * *"
      # Direct, matching VolSync (no VOLSYNC_COPYMETHOD set, so its default).
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass

