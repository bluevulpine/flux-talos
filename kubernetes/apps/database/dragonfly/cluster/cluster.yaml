---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2
  replicas: 3
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --default_lua_flags=allow-undeclared-keys
    # Since v2.0.2 the daily version check also reports anonymous deployment
    # info upstream. Renovate already tells us about new releases.
    - --version_check=false
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 512Mi
  nodeSelector:
    kubernetes.io/arch: amd64 # the image is not currently multi-arch
