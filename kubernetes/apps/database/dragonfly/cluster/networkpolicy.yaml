---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-observability
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 6379
          protocol: TCP
        # Prometheus scrapes the dragonfly admin/metrics port (PodMonitor
        # targets the "admin" port). Without this the scrape to :9999 is
        # dropped -> TargetDown for all dragonfly pods.
        - port: 9999
          protocol: TCP
---
