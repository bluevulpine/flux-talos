---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Consumed ONLY by the matrix-db-init Job. It carries the postgres superuser password,
# so the Synapse/MAS workloads get their own secret in step 2 instead of this one.
# Both read the same OpenBao key (secret/matrix), so the passwords cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name matrix-db-init-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        SYNAPSE_POSTGRES_PASS: "{{ .Synapse__Postgres__Password }}"
        MAS_POSTGRES_PASS: "{{ .Mas__Postgres__Password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: matrix
