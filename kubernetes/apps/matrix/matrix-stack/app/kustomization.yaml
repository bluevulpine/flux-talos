---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./dnsendpoint.yaml
components:
  # Synapse media PVC (${APP} = synapse-media). The same pair ~44 apps still use;
  # kopiur's per-app cutover is a one-line swap of volsync-backup for kopiur
  # (docs/runbooks/kopiur-migration.md). Temporary either way: rollout step 4
  # moves media to Garage S3.
  - ../../../../components/volsync-claim
  - ../../../../components/volsync-backup
