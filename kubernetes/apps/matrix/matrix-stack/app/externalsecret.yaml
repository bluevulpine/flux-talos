---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Every secret the ESS chart would otherwise generate itself. initSecrets is OFF in
# the HelmRelease: its generated Secret lives only in the cluster, and losing the
# Synapse signing key changes this server's federation identity (other servers
# reject our events until their key cache expires) — so all of it lives in OpenBao.
# Generate once with scripts/matrix-generate-secrets.sh (idempotent).
#
# No superuser password here — that stays in matrix-db-init-secret (db/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name matrix-stack-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        SYNAPSE_POSTGRES_PASSWORD: "{{ .Synapse__Postgres__Password }}"
        SYNAPSE_SIGNING_KEY: "{{ .Synapse__SigningKey }}"
        SYNAPSE_MACAROON: "{{ .Synapse__Macaroon }}"
        SYNAPSE_REGISTRATION_SHARED_SECRET: "{{ .Synapse__RegistrationSharedSecret }}"
        MAS_POSTGRES_PASSWORD: "{{ .Mas__Postgres__Password }}"
        MAS_ENCRYPTION_SECRET: "{{ .Mas__EncryptionSecret }}"
        MAS_SYNAPSE_SHARED_SECRET: "{{ .Mas__SynapseSharedSecret }}"
        MAS_KEY_RSA: "{{ .Mas__Keys__Rsa }}"
        MAS_KEY_ECDSA_PRIME256V1: "{{ .Mas__Keys__EcdsaPrime256v1 }}"
        # Merged into mas-config.yaml via matrixAuthenticationService.additional.
        # The whole provider entry lives here, next to its client secret, rather
        # than half in the HelmRelease: matrix-tools deep-merges maps but APPENDS
        # lists across config files (renderer.go deepMergeMaps), so half an entry
        # in each file would yield two broken providers, not one merged one.
        #
        # No claim templates on purpose: MAS's defaults are exactly
        # preferred_username / name / email, and writing them out would put Jinja
        # `{{ user.* }}` inside this Go template (and Flux's envsubst) — two layers
        # of escaping for no behaviour change.
        #
        # `id` is a fixed ULID, not a secret: it is part of the redirect URI
        # registered in Authentik (https://account.<domain>/upstream/callback/<id>)
        # and must never change.
        mas-upstream-authentik.yaml: |
          upstream_oauth2:
            providers:
              - id: 01M3AYCYVJ7HE0FG3HPQYC0ZE7
                human_name: Authentik
                issuer: "https://sso.${SECRET_DOMAIN}/application/o/matrix/"
                client_id: "{{ .Mas__Authentik__ClientId }}"
                client_secret: "{{ .Mas__Authentik__ClientSecret }}"
                token_endpoint_auth_method: client_secret_basic
                scope: "openid profile email"
                # Authentik is the only way in (passwords are disabled in the
                # HelmRelease), so skip MAS's "confirm your details" screen. That
                # requires localpart=require and every other claim ignore/force/require.
                skip_confirmation: true
                claims_imports:
                  # The Authentik username becomes @<username>:${SECRET_DOMAIN}
                  # permanently — Matrix IDs cannot be renamed.
                  localpart:
                    action: require
                  displayname:
                    action: force
                  email:
                    action: force
  dataFrom:
    - extract:
        key: matrix
