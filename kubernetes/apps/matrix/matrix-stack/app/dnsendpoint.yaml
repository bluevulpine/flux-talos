---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: matrix-stack
spec:
  endpoints:
    # Public records for the Pangolin-served hosts (see ./httproute.yaml), pointing
    # at the Pangolin VPS entry host instead of the Cloudflare tunnel. Only
    # external-dns-cloudflare reads `crd` sources, so the LAN A records published
    # from the `internal` Gateway are untouched — split horizon preserved.
    #
    # DNS-only (cloudflare-proxied: false) is mandatory, not cosmetic: orange
    # clouding would put Cloudflare back in the path, restoring the 100MB upload cap
    # and putting bot challenges in front of federation.
    #
    # Each host ALSO needs a Pangolin HTTP Resource (manual, Pangolin dashboard) —
    # docs/runbooks/pangolin-vps-setup.md step 4.
    - dnsName: "matrix.${SECRET_DOMAIN}"
      recordType: CNAME
      targets:
        - "pangolin.${SECRET_DOMAIN}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: "account.${SECRET_DOMAIN}"
      recordType: CNAME
      targets:
        - "pangolin.${SECRET_DOMAIN}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: "chat.${SECRET_DOMAIN}"
      recordType: CNAME
      targets:
        - "pangolin.${SECRET_DOMAIN}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
