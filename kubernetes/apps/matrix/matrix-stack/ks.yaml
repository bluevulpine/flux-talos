---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Step 1 of the Matrix rollout (docs/briefs/2026-09-24-matrix-homeserver-evaluation.md):
# provision the `synapse` and `mas` roles + databases on postgres18. The ESS
# matrix-stack HelmRelease (step 2) will be its own Kustomization that dependsOn this
# one, so Synapse and MAS never start against a database that does not exist yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app matrix-stack-db
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: matrix-stack
  dependsOn:
    # NOTE the `18` suffix — there is no `cloudnative-pg-cluster` Kustomization, and
    # Flux parks silently on a missing dependsOn target.
    - name: cloudnative-pg-cluster18
      namespace: database
    - name: external-secrets-openbao-store
      namespace: external-secrets
  path: ./kubernetes/apps/matrix/matrix-stack/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: matrix
  # wait: the Job is health-checked, so this Kustomization is only Ready once the
  # databases exist and the collation assertion passed. Step 2 relies on that.
  wait: true
  # The Job deletes itself (ttlSecondsAfterFinished) and every reconcile recreates it,
  # so this interval is also how often the roles' passwords are re-synced from
  # OpenBao — same semantics postgres-init has as an init container, where it runs on
  # every pod start.
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Step 2: the ESS matrix-stack HelmRelease, its secrets, routes and DNS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app matrix-stack
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Ready only once the synapse/mas databases exist and passed the collation
    # assertion (wait: true on that Kustomization).
    - name: matrix-stack-db
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/matrix/matrix-stack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: matrix
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substitute:
      # APP names the media PVC and its kopiur policies (components/kopiur), which
      # is why it is not the Kustomization name.
      APP: synapse-media
      NS: matrix
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # kopiur (components/kopiur), W6. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's old ones.
      KOPIUR_LOCAL_CRON: "H */2 * * *"
      KOPIUR_R2_CRON: "H 6 * * *"
      # Snapshot: Synapse holds the RWO volume, so the mover cannot co-mount it.
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # Mover runs as Synapse's own uid/gid (chart default 10091), as
      # matrix-bluevulpine does. It still needs the namespace's privileged-movers
      # annotation: kopiur's movers always add DAC_OVERRIDE (../namespace.yaml).
      KOPIUR_RUN_AS_USER: "10091"
      KOPIUR_RUN_AS_GROUP: "10091"
      KOPIUR_FS_GROUP: "10091"
