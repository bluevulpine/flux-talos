---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "chargepoint-collector"
# Required fields:
#   ChargePointCollector__PrimaryUsername / __PrimaryPassword — primary (EV) account
#   ChargePointCollector__GuestUsername / __GuestPassword     — guest (NACS-heater) account
#   ChargePointCollector__InfluxdbToken — InfluxDB write token for chargepoint bucket
# Session tokens are NOT here — the app reads/writes those itself at
# secret/chargepoint/tokens/* via Kubernetes auth (SA chargepoint-collector).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name chargepoint-collector-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        CP_PRIMARY_USERNAME: "{{ .ChargePointCollector__PrimaryUsername }}"
        CP_PRIMARY_PASSWORD: "{{ .ChargePointCollector__PrimaryPassword }}"
        CP_GUEST_USERNAME: "{{ .ChargePointCollector__GuestUsername }}"
        CP_GUEST_PASSWORD: "{{ .ChargePointCollector__GuestPassword }}"
        INFLUX_TOKEN: "{{ .ChargePointCollector__InfluxdbToken }}"
  dataFrom:
    - extract:
        key: chargepoint-collector
