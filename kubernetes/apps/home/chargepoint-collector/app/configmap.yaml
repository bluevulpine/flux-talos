---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chargepoint-collector-config
data:
  CHARGEPOINT_ACCOUNTS: "primary,guest"
  # PRE_CUT_STOP_ACCOUNTS is deliberately unset: the pre-cut stop experiment
  # (chargepoint-collector #4) is off. A remote stop() on 2026-11-06 12:55Z left the
  # Home Flex refusing every remote start (ChargePoint 422 "charger isn't responding",
  # from the collector and the official app) and ignoring plug events through four
  # power cycles; only a physical unplug/replug on a powered charger cleared it
  # (2026-11-08 06:05Z). Do not re-enable without a tested way to resume.
  POLL_INTERVAL_S: "60"
  SCHEDULE_PATH: "/config/schedule.yaml"
  INFLUX_URL: "http://influxdb.database.svc.cluster.local:8086"
  INFLUX_ORG: "homelab"
  INFLUX_BUCKET: "chargepoint"
  OPENBAO_URL: "http://openbao-active.openbao.svc.cluster.local:8200"
  OPENBAO_KV_MOUNT: "secret"
  OPENBAO_K8S_ROLE: "chargepoint-collector"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chargepoint-collector-schedule
data:
  # RLEC off-peak baseline — must stay in sync with schedule.yaml in the app repo.
  schedule.yaml: |-
    timezone: America/Chicago
    seasons:
      - name: oct-may
        months: [10, 11, 12, 1, 2, 3, 4, 5]
        power_on_windows:
          - { start: "12:00", end: "17:00" }
          - { start: "23:00", end: "07:00" }
      - name: jun-sep
        months: [6, 7, 8, 9]
        power_on_windows:
          - { start: "00:00", end: "10:00" }
