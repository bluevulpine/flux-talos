---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Two OpenBao items:
#   abrp-relay    AbrpRelay__MqttUsername / AbrpRelay__MqttPassword: the relay's own
#                 read-only mosquitto user (acl: topic read wican/fc012cdbd521/#),
#                 separate from telegraf's so either can rotate alone.
#   wican-bridge  WicanBridge__AbrpApiKey (Iternio telemetry key) and
#                 WicanBridge__AbrpToken (the EV9's "Generic live data" vehicle token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name abrp-relay-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MQTT_USERNAME: "{{ .AbrpRelay__MqttUsername }}"
        MQTT_PASSWORD: "{{ .AbrpRelay__MqttPassword }}"
        ABRP_API_KEY: "{{ .WicanBridge__AbrpApiKey }}"
        ABRP_TOKEN: "{{ .WicanBridge__AbrpToken }}"
  dataFrom:
    - extract:
        key: abrp-relay
    - extract:
        key: wican-bridge
