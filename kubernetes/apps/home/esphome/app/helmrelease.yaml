---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app esphome
spec:
  chartRef:
    kind: OCIRepository
    name: esphome
  interval: 1h
  values:
    controllers:
      esphome:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # Attach to IOT VLAN 50 network via Multus with static IP
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "vlan-50",
                "namespace": "kube-system",
                "ips": ["192.168.50.12/24"]
              }]
        containers:
          app:
            image:
              repository: ghcr.io/esphome/esphome
              # renovate: datasource=docker depName=ghcr.io/esphome/esphome
              tag: 2026.7.3
            env:
              TZ: "${TIMEZONE}"
              # The container runs as uid 568, whose HOME defaults to "/"
              # (root-owned, unwritable), so any ~/-relative write dies with
              # PermissionError [Errno 13]. Point HOME at the writable /config.
              HOME: /config
              # PlatformIO's core dir lives under the NVMe-oF volume that backs
              # the whole /config/.esphome build tree (see persistence below).
              # NFS /config measured ~100 small-file creates/s vs ~25k/s on NVMe
              # — a 250x penalty that made a cold esp-idf install (~30k tiny
              # files) take 10-20min and look hung. Because /config/.esphome is a
              # separate NVMe mount, toolchains AND per-build object files avoid
              # NFS; only the source configs on /config itself stay on NFS.
              PLATFORMIO_CORE_DIR: /config/.esphome/platformio
              # Keep uv's package cache on the same NVMe filesystem as the
              # esp-idf venv it populates (/config/.esphome/...). uv hardlinks
              # packages from cache into the venv, which only works within one
              # filesystem; the default $HOME/.cache/uv sits on the NFS /config,
              # a different fs, so uv logs "Failed to hardlink … falling back to
              # full copy". Pointing the cache at the NVMe subtree restores
              # hardlinking and moves the small-file cache I/O off NFS too.
              UV_CACHE_DIR: /config/.esphome/.uv-cache
              # ESPHome dashboard settings
              ESPHOME_DASHBOARD_USE_PING: "true"
              # Remote-build peer-link (device-builder offload feature).
              # The listener binds 0.0.0.0, so it is already reachable on the
              # Multus VLAN-50 IP (192.168.50.12) declared above — that IP is a
              # direct L2 endpoint on the physical IOT VLAN, bypassing Services
              # and NetworkPolicy. Pin the port so a peer paired by hand (the Pi
              # build server) always finds it at 192.168.50.12:6055 rather than a
              # fall-forward port when 6055 is contended. mDNS (224.0.0.251) is
              # already advertised out net1, but pairing here is manual by IP.
              ESPHOME_REMOTE_BUILD_PORT: "6055"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 6052
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              # esp-idf compiles ~nproc-way parallel (16 on brokkr); each C++
              # compiler can peak at 100-300MB, so a full framework build blew
              # past a 2Gi limit and OOMKilled the pod mid-compile — restarting
              # the build from scratch in an endless loop. 8Gi gives headroom
              # for 16 concurrent compilers; the node has ~60Gi allocatable.
              limits:
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      # Schedule on brokkr workers which have bond0.50 for VLAN 50 access
      # These nodes have more compute power for ESPHome builds
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - brokkr01
                      - brokkr02
                      - brokkr03
    service:
      app:
        controller: esphome
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "ESPHome"
          gethomepage.dev/group: "Home"
          gethomepage.dev/icon: "esphome.png"
          gethomepage.dev/description: "ESP Device Management"
          gethomepage.dev/widget.type: "esphome"
          gethomepage.dev/widget.url: "http://esphome.home.svc.cluster.local:6052"
        labels:
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - esphome.${SECRET_DOMAIN}
    persistence:
      config:
        existingClaim: esphome-nfs
        globalMounts:
          - path: /config
      # Build scratch on fast NVMe-oF, mounted over the NFS /config at the
      # .esphome subtree. Holds everything esphome regenerates: PlatformIO
      # toolchains/frameworks (esp-idf, arduino), the package cache, the
      # remote-build sources synced from the offloader, and per-device object
      # files (.pioenvs). Keeping this off NFS is what makes builds fast (see
      # PLATFORMIO_CORE_DIR above). The source-of-truth device YAMLs, secrets
      # and the peer-link key live directly under /config and stay on NFS
      # (backed up); this subtree is fully regenerable, so it needs no backup.
      esphome-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 25Gi
        storageClass: tns-csi-nvmeof
        globalMounts:
          - path: /config/.esphome

