---
# The ServiceAccount the CronJob authenticates to OpenBao with, via the Kubernetes
# auth method. Needs its own OpenBao role bound to this SA in namespace home, with
# a policy scoped to secret/data/kia/portal-rmtoken — deliberately NOT the live
# telemetry collector's secret/data/kia/token. Whether the portal and mobile
# rmTokens are the same credential is unresolved, and neither job may overwrite
# the other's while that is true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kia-trip-archiver
