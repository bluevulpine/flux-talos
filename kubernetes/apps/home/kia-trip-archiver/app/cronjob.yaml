# Trip-history archive sync, every 6 hours.
#
# Cadence is not driven by cost — the whole retained history is one ~10 KB request
# — but by how tightly a portal rmToken death can be located in time. Four runs a
# day bound a forced re-auth to a ~6h window, which is the resolution needed to
# turn the auth_events table into an actual measurement of the credential's
# lifetime. That lifetime is currently UNKNOWN: nine days of idleness proved the
# token survives idleness and nothing more, and the mobile side's measured 31d and
# 12.9d gaps may not describe this credential at all.
#
# Minute :47 is deliberately not a multiple of 10. The sibling kia-collector-cached
# CronJob runs "*/10 * * * *" in this same namespace, and concurrencyPolicy only
# serializes a CronJob against itself, never against a neighbour. The container
# adds up to 5 more minutes of its own jitter (SYNC_JITTER_SECONDS) so the actual
# request does not land on a metronome.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-trip-archiver
spec:
  schedule: "47 1,7,13,19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # Wider than the jitter plus a slow run, so a briefly-unschedulable job still
  # runs rather than being counted as missed.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # Auto-delete finished jobs and their pods after 12h. A transient failure
      # self-clears well before the next run, so KubeJobFailed resolves on its own;
      # a persistent one keeps producing fresh failed jobs and correctly stays
      # alerting.
      ttlSecondsAfterFinished: 43200
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kia-trip-archiver
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Creates the kia_trips database and its owning role if absent. The
            # application creates and migrates its own tables (archiver/schema.sql,
            # applied idempotently at every start).
            - name: 01-init-db
              image: ghcr.io/home-operations/postgres-init:rolling
              envFrom:
                - secretRef:
                    name: kia-trip-archiver-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          containers:
            - name: archiver
              # Full ref auto-updated by Flux image automation (ImagePolicy
              # flux-system:kia-trip-archiver). NOTE: no ":tag" suffix on the
              # marker — this is a combined image:repo:tag scalar, so Flux must
              # write the whole ref. ":tag" would overwrite the scalar with the
              # bare tag and produce an unpullable image.
              image: gitea.derekjacobs.dev/bluevulpine/kia-trip-archiver:12-383fce16 # {"$imagepolicy": "flux-system:kia-trip-archiver"}
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: kia-trip-archiver-config
                - secretRef:
                    name: kia-trip-archiver-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  # timezonefinder memory-maps its boundary data rather than
                  # loading it, so this stays modest.
                  memory: 384Mi
          volumes:
            - name: tmp
              emptyDir: {}
