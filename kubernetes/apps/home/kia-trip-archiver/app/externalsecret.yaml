---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Three OpenBao keys are combined here rather than one, so nothing is duplicated:
#
#   kia-collector      — the Kia account credentials, already stored for the live
#                        telemetry collector. Reused, not copied: one account
#                        password in one place.
#   kia-trip-archiver  — this job's own material (below).
#   cloudnative-pg     — the Postgres superuser password, used only by the
#                        postgres-init init container to create the database.
#
# Fields required under the `kia-trip-archiver` key:
#   KiaTripArchiver__Postgres__User        — role postgres-init will create/own
#   KiaTripArchiver__Postgres__Password
#   KiaTripArchiver__Fingerprint__Fpv      — the replayed browser device fingerprint
#   KiaTripArchiver__Fingerprint__Ua         (fpv/ua/pt/ln/hc/wfh). Extract it with
#   KiaTripArchiver__Fingerprint__Pt         `spike/portal_auth_spike.py
#   KiaTripArchiver__Fingerprint__Ln          --fingerprint-from-har <file.har>`.
#   KiaTripArchiver__Fingerprint__Hc
#   KiaTripArchiver__Fingerprint__Wfh
#
# The fingerprint is six SHA-256 hashes of static browser/OS/GPU strings — not
# secrets in themselves, but together they are the device identity that most
# plausibly explains why a scripted login is treated as enrolled rather than new.
# It is delivered as a secret rather than baked into the image or a ConfigMap for
# that reason.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kia-trip-archiver-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        KIA_USERNAME: "{{ .KiaCollector__Username }}"
        KIA_PASSWORD: "{{ .KiaCollector__Password }}"

        KIA_FP_FPV: "{{ .KiaTripArchiver__Fingerprint__Fpv }}"
        KIA_FP_UA: "{{ .KiaTripArchiver__Fingerprint__Ua }}"
        KIA_FP_PT: "{{ .KiaTripArchiver__Fingerprint__Pt }}"
        KIA_FP_LN: "{{ .KiaTripArchiver__Fingerprint__Ln }}"
        KIA_FP_HC: "{{ .KiaTripArchiver__Fingerprint__Hc }}"
        KIA_FP_WFH: "{{ .KiaTripArchiver__Fingerprint__Wfh }}"

        # PostgreSQL bootstrap, consumed by the postgres-init init container.
        # Its own database on the shared postgres18 cluster — the same instance
        # Home Assistant's recorder uses, a separate database from it.
        INIT_POSTGRES_HOST: &dbHost ${POSTGRES_HOST}
        INIT_POSTGRES_DBNAME: &dbName kia_trips
        INIT_POSTGRES_USER: &dbUser "{{ .KiaTripArchiver__Postgres__User }}"
        INIT_POSTGRES_PASS: &dbPass "{{ .KiaTripArchiver__Postgres__Password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"

        # key=value conninfo rather than a URI: it avoids percent-encoding
        # problems when the password contains characters like %.
        KIA_TRIPS_DB_URL: "host=${POSTGRES_HOST} port=5432 dbname=kia_trips user={{ .KiaTripArchiver__Postgres__User }} password={{ .KiaTripArchiver__Postgres__Password }}"
  dataFrom:
    - extract:
        key: kia-collector
    - extract:
        key: kia-trip-archiver
    - extract:
        key: cloudnative-pg
