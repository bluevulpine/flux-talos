---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ev-charge-ledger
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/home/ev-charge-ledger/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: home
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to NS (runbook: the
      # "Four apps set no NS" trap).
      NS: home
      # One SQLite file of a few hundred KB.
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_STORAGECLASS: longhorn-1-replica
      # ReadWriteOnce + Snapshot (KOPIUR_COPYMETHOD) for a single SQLite file,
      # for the reasons spelled out in home/ev-charge-tracker/ks.yaml.
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Hour 03 stays reserved for kopia-maint-r2 (R2 is H 6).
      # kopiur (components/kopiur). H picks a minute per schedule; the hours are
      # the ones VolSync used before the cutover.
      KOPIUR_LOCAL_CRON: "H */2 * * *"
      KOPIUR_R2_CRON: "H 6 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
