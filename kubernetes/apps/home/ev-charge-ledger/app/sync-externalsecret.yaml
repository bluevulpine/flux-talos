---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "ev-charge-ledger"
# Required fields:
#   EvChargeLedger__InfluxReadToken -- InfluxDB token with READ on the chargepoint
#                                      bucket only; never the admin token
#   EvChargeLedger__VehicleVin      -- the 2026 EV9's VIN. A secret only because
#                                      this repo is public.
#   EvChargeLedger__KiaInfluxReadToken -- InfluxDB token with READ on the
#                                      kia-vehicle bucket only. A DIFFERENT token
#                                      from the one above: each is scoped to its
#                                      own bucket, so the chargepoint token 404s
#                                      on kia-vehicle by design.
#   EvChargeLedger__KiaTag          -- the Kia API's vehicle identifier (NOT a
#                                      VIN) used to select this car's telemetry.
#                                      It equals the real VIN's last six
#                                      characters for the 2026 car only; never
#                                      derive either from the other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ev-charge-ledger-sync-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ECL_INFLUX_TOKEN: "{{ .EvChargeLedger__InfluxReadToken }}"
        ECL_SYNC_VEHICLE_VIN: "{{ .EvChargeLedger__VehicleVin }}"
        ECL_KIA_INFLUX_TOKEN: "{{ .EvChargeLedger__KiaInfluxReadToken }}"
        ECL_SYNC_KIA_TAG: "{{ .EvChargeLedger__KiaTag }}"
  dataFrom:
    - extract:
        key: ev-charge-ledger
