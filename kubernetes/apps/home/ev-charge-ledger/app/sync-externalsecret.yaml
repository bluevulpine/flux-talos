---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "ev-charge-ledger"
# Required fields:
#   EvChargeLedger__InfluxReadToken -- InfluxDB token with READ on the chargepoint
#                                      bucket only; never the admin token
#   EvChargeLedger__VehicleVin      -- the 2026 EV9's VIN. A secret only because
#                                      this repo is public.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ev-charge-ledger-sync-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ECL_INFLUX_TOKEN: "{{ .EvChargeLedger__InfluxReadToken }}"
        ECL_SYNC_VEHICLE_VIN: "{{ .EvChargeLedger__VehicleVin }}"
  dataFrom:
    - extract:
        key: ev-charge-ledger
