---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ev-charge-ledger
spec:
  groups:
    - name: ev-charge-ledger.rules
      rules:
        # No ready replica: a crash loop, a failed migration in the `migrate`
        # init container, or a failing probe. Routes to Pushover via the
        # default Alertmanager receiver.
        - alert: EvChargeLedgerDown
          annotations:
            summary: >-
              EV charge ledger has no ready replicas. A failed migration shows
              in `kubectl logs -n home deploy/ev-charge-ledger -c migrate`;
              otherwise check `-c app`.
          expr: |
            kube_deployment_status_replicas_ready{namespace="home", deployment="ev-charge-ledger"} == 0
          for: 15m
          labels:
            severity: critical

        # Names the cause directly (docs/runbooks/flux-image-automation.md,
        # Gotcha 3). BOTH metrics are needed: the `migrate` init container runs
        # the same image and starts first, so on a bad tag it is the init
        # container that waits in ImagePullBackOff while `app` sits in
        # PodInitializing. kube_pod_container_status_waiting_reason alone
        # would never fire for this pod.
        - alert: EvChargeLedgerImagePullFailing
          annotations:
            summary: >-
              EV charge ledger pod {{ $labels.pod }} can't pull its image
              ({{ $labels.reason }}). Check the tag in
              kubernetes/apps/home/ev-charge-ledger/app/helmrelease.yaml and
              the image automation in
              kubernetes/apps/flux-system/ev-charge-ledger/.
          expr: |
            max by (pod, reason) (
              kube_pod_container_status_waiting_reason{namespace="home", pod=~"ev-charge-ledger.*", reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}
              or
              kube_pod_init_container_status_waiting_reason{namespace="home", pod=~"ev-charge-ledger.*", reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}
            ) > 0
          for: 15m
          labels:
            severity: critical

        # The scheduled sync (the `sync` CronJob controller). backoffLimit 0 makes
        # a failed pod a failed Job, and ttlSecondsAfterFinished (6 h) deletes it:
        # a one-off failure fires until about the next run, a persistent one
        # keeps firing. restartPolicy Never keeps the failed pod's log until then.
        - alert: EvChargeLedgerSyncFailed
          annotations:
            summary: >-
              EV charge ledger sync job {{ $labels.job_name }} failed. Its log
              names the cause: FAILED (InfluxDB, the token, no home chargers) or
              REJECTED (a session the ledger could not price).
          expr: |
            kube_job_status_failed{namespace="home", job_name=~"ev-charge-ledger-sync.*"} > 0
          for: 15m
          labels:
            severity: critical

        # Catch-all: no successful sync in 13 h is two missed 6-hourly runs plus
        # a margin, whatever the reason (Pending on the affinity, image pull, a
        # suspended CronJob). Silent until the first success, because the metric
        # does not exist before one; SyncFailed covers a job that never succeeds.
        - alert: EvChargeLedgerSyncStale
          annotations:
            summary: >-
              EV charge ledger sync has not succeeded in over 13 h, so new home
              sessions are not reaching the ledger. Check `kubectl get
              cronjob,jobs -n home | grep ev-charge-ledger-sync`.
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="home", cronjob="ev-charge-ledger-sync"}) > 46800
          for: 15m
          labels:
            severity: critical

        # The odometer fill stopping while everything else stays green.
        #
        # This is NOT covered by SyncStale above: that catches the sync failing
        # to RUN. This catches it running, succeeding, and filling nothing --
        # because `sync` deliberately degrades when the telemetry token is
        # unreadable. It imports the charge rows, says why on stderr, and exits
        # 0, so the charge data is never held hostage to an accessory. The cost
        # is that a revoked kia token, a changed bucket, or a tag that stops
        # matching leaves the Job successful, the deployment ready, the image
        # pulling fine -- and odometer_m silently unwritten. No exit code can
        # ever catch that, by design. This is what makes the design safe.
        #
        # Measured against the consequence rather than a guessed cause, so it
        # fires for reasons nobody predicted too.
        #
        # Thresholds from the real arrival rate (~1 home session/day): the two
        # permanent blanks -- 2026-07-12 and 2026-08-11, where telemetry
        # genuinely does not reach -- are old, so recent coverage sits at 100%.
        # One legitimately unreadable session drops a 10-row window to 90%, well
        # clear of 0.7; a stopped fill crosses it within a day or two. `> 0`
        # guards the empty-ledger divide-by-zero, and the metric's absence
        # before the first scrape produces no series rather than a false alert.
        - alert: EvChargeLedgerOdometerFillStopped
          annotations:
            summary: >-
              EV charge ledger odometer coverage has fallen to
              {{ $value | humanizePercentage }} of recent home sessions. The
              sync is still succeeding, so this is the fill itself: check
              `kubectl logs -n home job/$(kubectl get jobs -n home -o name |
              grep ev-charge-ledger-sync | tail -1 | cut -d/ -f2)` for a FAILED
              line naming ECL_KIA_INFLUX_TOKEN or the kia-vehicle bucket.
          expr: |
            (
              ev_charge_ledger_recent_home_with_odometer
              /
              ev_charge_ledger_recent_home_sessions
            ) < 0.7
            and ev_charge_ledger_recent_home_sessions > 0
          for: 6h
          labels:
            severity: warning
