---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ev-charge-ledger-registry-creds
spec:
  # Its own Secret rather than a shared one, for the reasons in
  # home/ev-charge-tracker/app/registry-externalsecret.yaml.
  #
  # The first image in this repo pulled from the bvn-homelab org rather than
  # the bluevulpine user namespace. The same read token covers it: with this
  # token, tags/list and the newest manifest for
  # bvn-homelab/ev-charge-ledger both returned 200 on 2026-09-11, against 401
  # unauthenticated.
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "gitea.derekjacobs.dev": {
                "username": "bluevulpine",
                "password": "{{ .Gitea__Registry_Read }}",
                "auth": "{{ (printf "%s:%s" "bluevulpine" .Gitea__Registry_Read) | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: gitea
