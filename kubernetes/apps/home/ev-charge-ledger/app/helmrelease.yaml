# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ev-charge-ledger
spec:
  chartRef:
    kind: OCIRepository
    name: ev-charge-ledger
  interval: 1h
  values:
    controllers:
      ev-charge-ledger:
        type: deployment
        replicas: 1
        # SQLite on a ReadWriteOnce volume: a second pod could neither mount
        # the claim nor safely share the database file if it did.
        strategy: Recreate
        initContainers:
          migrate:
            # The app does not migrate on start, and neither probe touches the
            # database, so an unmigrated volume would pass both probes while
            # every page returned 500. alembic reads ECL_DATABASE_URL through
            # the app's own settings (alembic/env.py), and alembic.ini sits in
            # the image's WORKDIR. At head it is a no-op.
            image:
              repository: gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger
              tag: 8-84f781e5 # {"$imagepolicy": "flux-system:ev-charge-ledger:tag"}
            command:
              - alembic
              - upgrade
              - head
            env: &env
              TZ: "${TIMEZONE}"
              # The image sets the same value; stated here because the app's
              # own default is a path relative to the working directory.
              ECL_DATABASE_URL: sqlite+pysqlite:////data/ledger.db
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            # First-party, built by Drone from
            # https://gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger. The
            # migrate init container runs the same image; each image block
            # carries its own marker, and the automation rewrites both.
            image:
              repository: gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger
              tag: 8-84f781e5 # {"$imagepolicy": "flux-system:ev-charge-ledger:tag"}
            env: *env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
      sync:
        # The scheduled import: home sessions straight from InfluxDB into the
        # ledger (ev-charge-ledger docs/superpowers/specs/2026-09-11-automated-import.md).
        # Needs an image that has the `sync` command; on an older one every run
        # fails with "invalid choice: 'sync'".
        type: cronjob
        cronjob:
          # Every 6 h (Derek, 2026-09-11). :28 is empty in hours 0, 6, 12 and 18
          # across all 112 live ReplicationSource and CronJob schedules (census
          # 2026-09-11), and 15 min clear of this app's own :43 local backup.
          schedule: "28 */6 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          # No retry: kube_job_status_failed counts failed PODS, so a retry that
          # succeeded would still leave failed=1 and fire EvChargeLedgerSyncFailed.
          # The sync is idempotent and the next run is 6 h away.
          backoffLimit: 0
          # Delete finished Jobs (and their pods) after one cycle, as the other
          # collectors do. A one-off failure alerts until about the next run and
          # then clears; a persistent one keeps leaving fresh failed Jobs and keeps
          # alerting. The failed pod's log stays readable for those 6 h.
          ttlSecondsAfterFinished: 21600
        pod:
          # Never, so a failed run keeps its pod and `kubectl logs` shows why.
          restartPolicy: Never
          # The SQLite volume is ReadWriteOnce: a second pod can mount it only on
          # the node the ledger pod holds it on. Set on this controller, not in
          # defaultPodOptions, or the ledger pod would require itself as a
          # neighbour and never reschedule.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: ev-charge-ledger
                      app.kubernetes.io/instance: ev-charge-ledger
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger
              tag: 8-84f781e5 # {"$imagepolicy": "flux-system:ev-charge-ledger:tag"}
            command:
              - ev-charge-ledger
              - sync
              - --apply
            env:
              TZ: "${TIMEZONE}"
              ECL_DATABASE_URL: sqlite+pysqlite:////data/ledger.db
              # The 2026 EV9's first telemetry; earlier sessions cannot be this car.
              ECL_SYNC_SINCE: "2026-07-11T22:21:00Z"
            envFrom:
              - secretRef:
                  name: ev-charge-ledger-sync-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: ev-charge-ledger-registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "EV Charge Ledger"
          gethomepage.dev/group: "Home"
          gethomepage.dev/icon: "mdi-receipt"
          gethomepage.dev/description: "Charge sessions and what they cost"
        labels:
          # The ledger has no login of its own, and its API accepts writes
          # (PATCH and POST under /api/transactions). Forward auth puts the
          # whole host behind Authentik SSO. Imports run through the CLI inside
          # the pod, not over HTTP.
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - ev-charge-ledger.${SECRET_DOMAIN}
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      # The root filesystem is read-only; SQLite puts its temp files in the
      # first writable of /var/tmp, /usr/tmp and /tmp.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
