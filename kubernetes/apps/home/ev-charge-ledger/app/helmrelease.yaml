# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ev-charge-ledger
spec:
  chartRef:
    kind: OCIRepository
    name: ev-charge-ledger
  interval: 1h
  values:
    controllers:
      ev-charge-ledger:
        type: deployment
        replicas: 1
        # SQLite on a ReadWriteOnce volume: a second pod could neither mount
        # the claim nor safely share the database file if it did.
        strategy: Recreate
        initContainers:
          migrate:
            # The app does not migrate on start, and neither probe touches the
            # database, so an unmigrated volume would pass both probes while
            # every page returned 500. alembic reads ECL_DATABASE_URL through
            # the app's own settings (alembic/env.py), and alembic.ini sits in
            # the image's WORKDIR. At head it is a no-op.
            image:
              repository: gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger
              tag: 5-b83af839 # {"$imagepolicy": "flux-system:ev-charge-ledger:tag"}
            command:
              - alembic
              - upgrade
              - head
            env: &env
              TZ: "${TIMEZONE}"
              # The image sets the same value; stated here because the app's
              # own default is a path relative to the working directory.
              ECL_DATABASE_URL: sqlite+pysqlite:////data/ledger.db
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            # First-party, built by Drone from
            # https://gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger. The
            # migrate init container runs the same image; each image block
            # carries its own marker, and the automation rewrites both.
            image:
              repository: gitea.derekjacobs.dev/bvn-homelab/ev-charge-ledger
              tag: 5-b83af839 # {"$imagepolicy": "flux-system:ev-charge-ledger:tag"}
            env: *env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: ev-charge-ledger-registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "EV Charge Ledger"
          gethomepage.dev/group: "Home"
          gethomepage.dev/icon: "mdi-receipt"
          gethomepage.dev/description: "Charge sessions and what they cost"
        labels:
          # The ledger has no login of its own, and its API accepts writes
          # (PATCH and POST under /api/transactions). Forward auth puts the
          # whole host behind Authentik SSO. Imports run through the CLI inside
          # the pod, not over HTTP.
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - ev-charge-ledger.${SECRET_DOMAIN}
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      # The root filesystem is read-only; SQLite puts its temp files in the
      # first writable of /var/tmp, /usr/tmp and /tmp.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
