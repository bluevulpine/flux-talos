---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app scrypted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/home/scrypted/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: home
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: home
      VOLSYNC_CAPACITY: 10Gi
      # 2 replicas, node-local best-effort (longhorn-2-replica-local): one replica
      # follows the pod's node, the other sits on a different node. The staged
      # clone and the cache stay 1-replica -- they are throwaway mover volumes.
      VOLSYNC_STORAGECLASS: longhorn-2-replica-local
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # kopiur (components/kopiur), W6. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's old ones.
      KOPIUR_LOCAL_CRON: "H * * * *"
      KOPIUR_R2_CRON: "H 5 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # VolSync's cache size and class for this volume; the component defaults
      # are 16Gi on longhorn-1-replica.
      KOPIUR_CACHE_CAPACITY: 10Gi
      KOPIUR_CACHE_CLASS: longhorn-1-replica-local
