---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scrypted
spec:
  chartRef:
    kind: OCIRepository
    name: scrypted
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      scrypted:
        type: deployment
        # Stateful pet: never roll two copies over the same pairing identity.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # Attach directly to the HomeKit L2 (VLAN 30) via Multus macvlan.
            # Static IP + PINNED MAC so the UniFi DHCP reservation for
            # de:ad:be:ef:30:12 -> 192.168.30.12 stays valid across pod
            # recreates (macvlan otherwise randomizes the MAC each start).
            # This is the interface Scrypted advertises HomeKit over via mDNS;
            # the NAD's sbr plugin keeps VLAN-30 return traffic symmetric.
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "vlan-30",
                "namespace": "kube-system",
                "ips": ["192.168.30.12/24"],
                "mac": "de:ad:be:ef:30:12"
              }]
        containers:
          app:
            image:
              repository: ghcr.io/koush/scrypted
              # Scrypted only publishes rolling tags (latest/beta/full/lite) — it
              # self-updates its own components, so there are no per-release semver
              # image tags (the vX.Y.Z GitHub *release* tags do NOT exist in ghcr).
              # Pin the digest for immutability and let Renovate track digest moves
              # of :latest.
              # renovate: datasource=docker depName=ghcr.io/koush/scrypted
              tag: latest@sha256:f23251dad07cf02b4b6b2e364e7948ab9fb77656e31f226186c2ba5304ebd2cd
            env:
              TZ: "${TIMEZONE}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    scheme: HTTPS
                    path: /
                    port: &port 10443
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              # Scrypted's plugin runtime manages node/python installs as root;
              # it does not drop to an app user. No privileged/host access is
              # needed for Protect + HomeKit once we are on VLAN 30 via macvlan.
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      # Only the brokkr (amd64) workers carry bond0.30 for the VLAN-30 macvlan.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - brokkr01
                      - brokkr02
                      - brokkr03
    service:
      app:
        controller: scrypted
        ports:
          https:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Scrypted"
          gethomepage.dev/group: "Home"
          gethomepage.dev/icon: "scrypted.png"
          gethomepage.dev/description: "Camera bridge (Protect -> HomeKit)"
        labels:
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - scrypted.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /server/volume
