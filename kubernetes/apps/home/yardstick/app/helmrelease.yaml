---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app yardstick
spec:
  chartRef:
    kind: OCIRepository
    name: yardstick
  interval: 1h
  values:
    controllers:
      yardstick:
        type: deployment
        replicas: 1
        # SQLite on a ReadWriteOnce volume, and one licence seat: a second pod
        # could neither mount the claim nor be a second "computer".
        strategy: Recreate
        containers:
          app:
            # THIRD-PARTY commercial binary (Yardstick Technologies LLC),
            # repackaged from the vendor .deb by
            # https://gitea.derekjacobs.dev/bvn-homelab/yardstick-build. A daily
            # Drone cron there pins new releases; Flux image automation rolls
            # them out here.
            image:
              repository: gitea.derekjacobs.dev/bvn-homelab/yardstick
              tag: 1-6952c30e # {"$imagepolicy": "flux-system:yardstick:tag"}
            args:
              - serve
              - --port
              - "8477"
              - --note
              - k8s
              # The robot's own MQTT broker, over HaLow (its IoT-Wi-Fi address
              # is 192.168.50.222). Reached ROUTED from the pod network: VLAN 10
              # may initiate to VLAN 50, and `yardstick discover --host` found
              # serial 25070102P2TFE555 at both addresses from off-VLAN. So no
              # Multus leg. Discovery's subnet SCAN would only see the pod
              # network, which is why the host is given here. A Yarbo account
              # sign-in in the UI is still required before it records.
              - --robot-host
              - 192.168.50.54
              - --record
            env:
              TZ: "${TIMEZONE}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: 8477
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  # The PyInstaller binary unpacks ~100MB into /tmp before
                  # Python starts.
                  httpGet:
                    path: /api/status
                    port: 8477
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 36
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
        # SIGINT (the image's STOPSIGNAL) ends the session and closes the WAL;
        # measured well under a second, the vendor unit allows 30s.
        pod:
          terminationGracePeriodSeconds: 30
    defaultPodOptions:
      imagePullSecrets:
        - name: yardstick-registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8477
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Yardstick"
          gethomepage.dev/group: "Home"
          gethomepage.dev/icon: "mdi-robot-mower"
          gethomepage.dev/description: "Yarbo telemetry recorder"
        labels:
          # The app has no login by default, shows the yard's GPS coordinates,
          # and its manual-control and plan endpoints can drive the robot.
          # Forward auth puts the whole host behind Authentik SSO.
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - yardstick.${SECRET_DOMAIN}
    persistence:
      # All state: SQLite, config.json (install_id, licence key, Yarbo account
      # tokens), TLS material. install_id, not the hostname, is what the
      # licence seat follows, so this claim is what keeps the pod one "computer".
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/yardstick
      # PyInstaller onefile extracts itself here on every start.
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
