---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app yardstick
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/home/yardstick/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: home
  timeout: 5m
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: home
      # Snapshot, not the component's Direct default: the claim is RWO and
      # holds a live SQLite database in WAL mode, so the mover gets a
      # point-in-time copy instead of the file mid-write. Same as
      # home/ev-charge-tracker and home/mosquitto.
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
      # Recordings only accrue while the robot works, and a lost hour or two
      # of telemetry is cheap; the licence/install_id in config.json is what
      # actually matters and changes rarely. Every 2h local, daily R2. Hour 03
      # is reserved for kopia-maint-r2, so R2 takes H 6.
      KOPIUR_LOCAL_CRON: "H */2 * * *"
      KOPIUR_R2_CRON: "H 6 * * *"
      # No KOPIUR_CACHE_CAPACITY override: the kopia cache is not sized by this
      # app's data. A 2Gi override on that assumption filled up and every local
      # run from 2026-10-21T23:02Z failed with ENOSPC before kopia could connect
      # (KubeJobFailed, 2026-10-22). What fills it is the shared kopia-local
      # repository's index: index-blobs/ 748 MiB + indexes/ 669 MiB + metadata/
      # 422 MiB, contents/ ~0, with the repo at 1,617 index blobs. Every client
      # caches that index whatever its source holds, which is why every local
      # cache PVC in the fleet sits at 5-9 GiB (ev-charge-tracker's few-MB
      # volume: 5.9 GiB). The component's 16Gi default is thin on Longhorn, so
      # it costs what is used. An existing cache PVC does not grow with this
      # value; delete it and kopiur recreates it, kopia rebuilds the cache.
