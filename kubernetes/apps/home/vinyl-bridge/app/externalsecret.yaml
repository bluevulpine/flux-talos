---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "vinyl-bridge" (create it before this lands; see README.md)
# Required field:
#   VinylBridge__HaWebhookId — the Home Assistant webhook id that packages/vinyl.yaml in
#                              esphome-hass listens on (same value as its !secret
#                              vinyl_bridge_webhook_id). Anyone who knows it can start or stop
#                              vinyl playback, so it stays out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name vinyl-bridge-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        HA_WEBHOOK_ID: "{{ .VinylBridge__HaWebhookId }}"
  dataFrom:
    - extract:
        key: vinyl-bridge
