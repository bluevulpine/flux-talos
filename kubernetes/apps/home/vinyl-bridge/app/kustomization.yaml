---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - deployment.yaml
# bridge.py -> configmap. The hash suffix is kept (default) so the Deployment rolls
# whenever the script changes.
configMapGenerator:
  - name: vinyl-bridge-script
    files:
      - bridge.py
