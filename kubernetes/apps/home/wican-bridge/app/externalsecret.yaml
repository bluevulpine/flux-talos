---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "wican-bridge"  (YOU MUST CREATE THIS — see app/README.md)
# Required fields:
#   WicanBridge__MqttUsername   — dedicated mosquitto user for the bridge (e.g. "telegraf")
#   WicanBridge__MqttPassword   — that user's plaintext password (the hash goes in mosquitto passwd.conf)
#   WicanBridge__InfluxdbToken  — InfluxDB write token for the kia-vehicle bucket
#                                 (reuse the value of KiaCollector__InfluxdbToken, or mint a dedicated one)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name wican-bridge-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MQTT_USERNAME: "{{ .WicanBridge__MqttUsername }}"
        MQTT_PASSWORD: "{{ .WicanBridge__MqttPassword }}"
        INFLUXDB_TOKEN: "{{ .WicanBridge__InfluxdbToken }}"
  dataFrom:
    - extract:
        key: wican-bridge
