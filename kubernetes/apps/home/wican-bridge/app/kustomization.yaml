---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - deployment.yaml
# telegraf.conf -> configmap. Hash suffix is kept (default) so the Deployment
# rolls automatically whenever telegraf.conf changes.
configMapGenerator:
  - name: wican-bridge-config
    files:
      - telegraf.conf
