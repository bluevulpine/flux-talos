# Telegraf: WiCAN Pro (EV9) MQTT -> InfluxDB bridge.
#
# Over MQTT the autopid payload is a FLAT JSON object on wican/fc012cdbd521/automate:
#   {"SOC":94,"SOH":100,"KWH_CHARGED":931,"HV_A":...,"LV_V":14.6,...}
# (the webhook wrapped it in {"autopid_data":{...}}, MQTT does not — confirmed live.)
# We also get wican/fc012cdbd521/battery {"battery_voltage":14.8}. The json parser
# turns every numeric key into a field of measurement "wican"; the string-only
# can/status payload has no numbers and is ignored.

[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto.home.svc.cluster.local:1883"]
  topics = ["wican/fc012cdbd521/#"]
  qos = 0
  client_id = "telegraf-wican-bridge"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "wican"
  # Tag each point with the device id from the topic (wican/<device>/<leaf>).
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wican/+/+"
    tags = "_/device/_"

[[outputs.health]]
  service_address = "http://:8080"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.database.svc.cluster.local:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "homelab"
  bucket = "kia-wican"

# NOTE: with the Ioniq9 profile the EV9 mis-scales HV_A / HV_W (signed-as-unsigned:
# HV_A reads ~6553 A at rest). SOC / SOH / KWH_CHARGED / LV_V / cell V / temps look
# correct. Fix the HV current PID expression on the device before trusting power.
