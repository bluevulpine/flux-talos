# Telegraf: WiCAN Pro (EV9) MQTT -> InfluxDB bridge.
#
# Over MQTT the autopid payload is a FLAT JSON object on wican/fc012cdbd521/automate:
#   {"SOC":94,"SOH":100,"KWH_CHARGED":931,"HV_A":...,"LV_V":14.6,...}
# (the webhook wrapped it in {"autopid_data":{...}}, MQTT does not — confirmed live.)
# We also get wican/fc012cdbd521/battery {"battery_voltage":14.8}. The json parser
# turns every numeric key into a field of measurement "wican"; the string-only
# can/status payload has no numbers and is ignored.

[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

# The WiCAN publishes /automate and /battery RETAINED, and its LWT sets
# /can/status to "offline" when it drops. So on every (re)connect the broker
# replays the last-known payload — which looks live but can be minutes old
# (observed: a 6-minute-old retained frame after the hotspot lost power).
# Stamping those with ingestion time would write stale values as current.
#
# /automate carries the device's own epoch-seconds `timestamp`, so use it as the
# metric time: replayed retained messages then land on their true timestamp and
# simply overwrite the identical point instead of inventing a new "now" sample.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto.home.svc.cluster.local:1883"]
  topics = ["wican/fc012cdbd521/automate"]
  qos = 0
  client_id = "telegraf-wican-automate"
  username = "$${MQTT_USERNAME}"
  password = "$${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "wican"
  json_time_key = "timestamp"
  json_time_format = "unix"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wican/+/+"
    tags = "_/device/_"

# /battery has no timestamp field, so it keeps ingestion time. It is the WiCAN's
# own ADC reading of OBD-port voltage (not a BMS value), so a replayed retained
# sample is low-stakes. Needs its own client_id — two consumers cannot share one.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto.home.svc.cluster.local:1883"]
  topics = ["wican/fc012cdbd521/battery"]
  qos = 0
  client_id = "telegraf-wican-battery"
  username = "$${MQTT_USERNAME}"
  password = "$${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "wican"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wican/+/+"
    tags = "_/device/_"

# Sanity filter: each autopid parameter issues its OWN 220101 request, so corruption
# is PER-FIELD, not per-message (confirmed on a drive: HV_V came back -599.3 in a
# message whose HV_A and SOC were fine; HV_W never equals HV_V*HV_A because the three
# are sampled moments apart). So drop only the offending FIELD and keep the rest —
# dropping whole messages would discard a lot of good data on the busy driving bus.
# Fields absent from a message (e.g. the /battery topic) skip their check.
[[processors.starlark]]
  namepass = ["wican"]
  source = '''
# HV_W is deliberately NOT range-checked: it may be published in W or kW
# (kW is wanted for the ABRP `power` mapping), so no single range fits. A corrupt
# frame is caught by HV_V/HV_A anyway, since HV_W is derived from both.
CHECKS = {
    "HV_V": (300.0, 900.0),
    "HV_A": (-600.0, 600.0),
    "SOC": (0.0, 100.0),
    "SOC_D": (0.0, 100.0),
    "SOH": (0.0, 105.0),
    "HV_C_V_MIN": (2.0, 5.0),
    "HV_C_V_MAX": (2.0, 5.0),
    "LV_V": (6.0, 18.0),
}

def apply(metric):
    for key, rng in CHECKS.items():
        v = metric.fields.get(key)
        if v != None and (v < rng[0] or v > rng[1]):
            metric.fields.pop(key)  # drop only the corrupt field
    # a message whose every numeric field was dropped carries nothing.
    # (Fields has no len(), so count by iterating.)
    remaining = 0
    for _ in metric.fields:
        remaining += 1
    if remaining == 0:
        return None
    return metric
'''

[[outputs.health]]
  service_address = "http://:8080"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.database.svc.cluster.local:8086"]
  token = "$${INFLUXDB_TOKEN}"
  organization = "homelab"
  bucket = "kia-wican"
