# Telegraf: WiCAN Pro (EV9) MQTT -> InfluxDB bridge.
#
# The WiCAN autopid payload is a single JSON object: {"autopid_data": {"SOC":86.5, ...}}
# (confirmed from the device's webhook capture). Point the device's autopid
# destination at MQTT so it publishes this under wican/fc012cdbd521/... and this
# bridge flattens autopid_data.* into fields of measurement "wican" in kia-wican.

[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto.home.svc.cluster.local:1883"]
  topics = ["wican/fc012cdbd521/#"]
  qos = 0
  client_id = "telegraf-wican-bridge"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json_v2"
  # Only messages carrying an autopid_data object produce metrics; status/can/* are ignored.
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "wican"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "autopid_data"
      disable_prepend_keys = true
  # Tag each point with the device id from the topic (wican/<device>/<leaf>).
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wican/+/+"
    tags = "_/device/_"

[[outputs.health]]
  service_address = "http://:8080"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.database.svc.cluster.local:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "homelab"
  bucket = "kia-wican"

# NOTE: with the Ioniq9 profile the EV9 mis-scales HV_A / HV_W (signed-as-unsigned:
# HV_A reads ~6553 A at rest). SOC / SOH / KWH_CHARGED / LV_V / cell V / temps look
# correct. Fix the HV current PID expression on the device before trusting power.
