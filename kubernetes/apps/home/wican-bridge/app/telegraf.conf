# Telegraf: WiCAN Pro (EV9) MQTT -> InfluxDB bridge.
#
# Over MQTT the autopid payload is a FLAT JSON object on wican/fc012cdbd521/automate:
#   {"SOC":94,"SOH":100,"KWH_CHARGED":931,"HV_A":...,"LV_V":14.6,...}
# (the webhook wrapped it in {"autopid_data":{...}}, MQTT does not — confirmed live.)
# We also get wican/fc012cdbd521/battery {"battery_voltage":14.8}. The json parser
# turns every numeric key into a field of measurement "wican"; the string-only
# can/status payload has no numbers and is ignored.

[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto.home.svc.cluster.local:1883"]
  topics = ["wican/fc012cdbd521/#"]
  qos = 0
  client_id = "telegraf-wican-bridge"
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "wican"
  # Tag each point with the device id from the topic (wican/<device>/<leaf>).
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wican/+/+"
    tags = "_/device/_"

# Sanity filter: the EV9 also polls the BMS itself, so on the busy bus the WiCAN
# occasionally reassembles a misaligned 220101 frame -> a whole autopid message of
# garbage (e.g. HV_V 2024, HV_A 386, SOC 11). A corrupt frame trips multiple fields
# at once, so if ANY sanity-checked field is out of physical range we drop the whole
# message rather than let a spike into InfluxDB. Fields absent from a given message
# (e.g. the /battery topic) skip their check. 5 s cadence makes dropped frames free.
[[processors.starlark]]
  namepass = ["wican"]
  source = '''
CHECKS = {
    "HV_V": (300.0, 900.0),
    "HV_A": (-600.0, 600.0),
    "HV_W": (-400000.0, 400000.0),
    "SOC": (0.0, 100.0),
    "SOC_D": (0.0, 100.0),
    "SOH": (0.0, 105.0),
    "HV_C_V_MIN": (2.0, 5.0),
    "HV_C_V_MAX": (2.0, 5.0),
    "LV_V": (6.0, 18.0),
}

def apply(metric):
    for key, rng in CHECKS.items():
        v = metric.fields.get(key)
        if v != None and (v < rng[0] or v > rng[1]):
            return None  # drop the whole corrupt frame
    return metric
'''

[[outputs.health]]
  service_address = "http://:8080"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.database.svc.cluster.local:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "homelab"
  bucket = "kia-wican"
