---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "ev-charge-tracker"
# Required field:
#   EvChargeTracker__SecretKey — Flask session-cookie signing key.
#
# Normal operation does not use this. auth_service.get_or_create_session_secret()
# generates a random 32-byte secret on first boot and persists it in AppConfig,
# so sessions survive restarts on their own. Config.SECRET_KEY is only reached
# on the exception path in create_app(), where the upstream default is the
# published constant "ev-tracker-dev-key-change-me". Setting it here means that
# fallback is not a known value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ev-charge-tracker-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .EvChargeTracker__SecretKey }}"
  dataFrom:
    - extract:
        key: ev-charge-tracker
