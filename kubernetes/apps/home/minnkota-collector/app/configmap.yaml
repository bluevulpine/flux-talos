    {
      "1": "Short-Term Loads (water heaters)",
      "2": "Intermediate-Term Loads (storage heat)",
      "3": "Long-Term Loads (dual heating furnaces, back-up generators)",
      "6": "Summer-Only Loads (irrigation, cycled air conditioning)"
    }
