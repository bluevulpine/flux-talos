---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name vault-power-mqtt-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # A DEDICATED, ACL-scoped broker user `vault-power`, following the
        # repo convention (minnkota-collector, telegraf each have their own
        # scoped user — not the shared `mqtt_publisher`). The user + a scoped
        # ACL (topic write homeassistant/sensor/vault_power/#) are added to the
        # OpenBao `mosquitto` key's passwd.conf/acl.conf fields; a hasher
        # sidecar rehashes and SIGHUPs the broker (no restart). Then this key:
        #   bao kv put secret/vault-power-mqtt \
        #     VaultPower__Mqtt__User=vault-power \
        #     VaultPower__Mqtt__Password=<the same password>
        # Full procedure (incl. the no-trailing-newline passwd.conf gotcha) is
        # in the runbook.
        MQTT_USER: "{{ .VaultPower__Mqtt__User }}"
        MQTT_PASSWORD: "{{ .VaultPower__Mqtt__Password }}"
  dataFrom:
    - extract:
        key: vault-power-mqtt
