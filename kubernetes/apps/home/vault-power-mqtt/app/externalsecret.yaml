---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name vault-power-mqtt-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Reuses the broker's `basicaccess` user (acl.conf: topic readwrite #),
        # so no new mosquitto user or ACL entry is needed. Provision with:
        #   bao kv put secret/vault-power-mqtt \
        #     VaultPower__Mqtt__User=basicaccess \
        #     VaultPower__Mqtt__Password=<basicaccess password>
        # A dedicated, ACL-scoped user would be tighter; basicaccess is the
        # low-friction choice for a homelab. See the runbook.
        MQTT_USER: "{{ .VaultPower__Mqtt__User }}"
        MQTT_PASSWORD: "{{ .VaultPower__Mqtt__Password }}"
  dataFrom:
    - extract:
        key: vault-power-mqtt
