---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
# What the console may do in the Kubernetes API: run a component's own CronJob once,
# to prove a re-auth held, and read the result. Nothing else -- no secrets, no pods,
# no logs, nothing outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-console
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-console
subjects:
  - kind: ServiceAccount
    name: ops-console
    namespace: home
---
# No schema header for this doc: the home-operations mirror answers 200 + HTML for
# serviceaccount_v1.json (checked 2026-09-28), which is not a schema.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-console
