---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# What the ops-console may make a Job DO.
#
# The console's Role is `create jobs` in `home`. RBAC cannot look inside the Job, and
# `home` enforces Pod Security `privileged`, so that grant is really "run any pod in
# this namespace as any ServiceAccount in it, mounting any Secret": a compromised
# console could take an OpenBao-authenticated ServiceAccount, hostPath, or a
# privileged container. This policy narrows it to the two Jobs the console exists
# to run: a copy of kia-collector-cached or kia-trip-archiver.
#
# It applies ONLY to requests by the console's own ServiceAccount (matchCondition),
# so nothing else that creates Jobs is affected, and failurePolicy: Fail cannot
# break them. Verified by server-side dry-run as a user the policy matched: the real
# CronJob templates (collector cached/force, archiver) are admitted; each rule below
# rejects its counter-example (2026-09-28; command/entrypoint and cross-workload rules
# 2026-10-06).
#
# When a CronJob legitimately changes shape (a new Secret, another init image) this
# policy must change with it, or the console's test run is refused with a message
# naming the rule. That is deliberate friction.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ops-console-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - jobs
  matchConditions:
    - name: created-by-the-console
      expression: "request.userInfo.username == 'system:serviceaccount:home:ops-console'"
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: containers
      expression: "variables.pod.containers + (has(variables.pod.initContainers) ? variables.pod.initContainers : [])"
    - name: images
      expression: >-
        ['gitea.derekjacobs.dev/bvn-homelab/kia-collector:',
         'gitea.derekjacobs.dev/bvn-homelab/kia-trip-archiver:',
         'ghcr.io/home-operations/postgres-init:']
    - name: secrets
      expression: "['kia-collector-secret', 'kia-trip-archiver-secret']"
    - name: configmaps
      expression: "['kia-collector-config', 'kia-trip-archiver-config']"
  validations:
    - expression: has(variables.pod.serviceAccountName) && variables.pod.serviceAccountName in ['kia-collector', 'kia-trip-archiver']
      message: a console Job must run as the kia-collector or kia-trip-archiver ServiceAccount
    - expression: variables.containers.all(c, variables.images.exists(p, c.image.startsWith(p)))
      message: a console Job may only run the kia-collector, kia-trip-archiver or postgres-init images
    - expression: >-
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC)
      message: a console Job may not use the host's network, PID or IPC namespace
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) ||
        ((!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)))
      message: a console Job may not run privileged or add capabilities
    - expression: "!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir))"
      message: a console Job may only use emptyDir volumes (no hostPath, Secret or projected volumes)
    - expression: >-
        variables.containers.all(c,
        (!has(c.envFrom) || c.envFrom.all(e,
        (!has(e.secretRef) || e.secretRef.name in variables.secrets) &&
        (!has(e.configMapRef) || e.configMapRef.name in variables.configmaps))) &&
        (!has(c.env) || c.env.all(e, !has(e.valueFrom) ||
        ((!has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name in variables.secrets) &&
        (!has(e.valueFrom.configMapKeyRef) || e.valueFrom.configMapKeyRef.name in variables.configmaps) &&
        !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef))))
        )
      message: a console Job may only read the two Kia Secrets and ConfigMaps
    # Image, ServiceAccount and Secrets bound the Job's reach, not what it runs: without
    # this, postgres-init + kia-trip-archiver-secret + `sh -c` reads the Postgres
    # superuser password. Neither real CronJob sets any of these (the only plain env is
    # kia-collector's FORCE_REFRESH), so the image's own entrypoint is the only thing a
    # console Job may run.
    - expression: >-
        variables.containers.all(c,
        !has(c.command) && !has(c.args) && !has(c.lifecycle) &&
        !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe) &&
        (!has(c.env) || c.env.all(e, has(e.valueFrom) || e.name == 'FORCE_REFRESH')))
      message: a console Job must run the image's own entrypoint, unmodified
    # The two workloads must not borrow each other's Secrets, ConfigMaps or images.
    - expression: >-
        variables.pod.serviceAccountName != 'kia-collector' ||
        variables.containers.all(c, !c.image.startsWith('gitea.derekjacobs.dev/bvn-homelab/kia-trip-archiver:') &&
        (!has(c.envFrom) || c.envFrom.all(e, (!has(e.secretRef) || e.secretRef.name == 'kia-collector-secret') &&
        (!has(e.configMapRef) || e.configMapRef.name == 'kia-collector-config'))))
      message: a kia-collector Job may only use kia-collector's own image, Secret and ConfigMap
    - expression: >-
        variables.pod.serviceAccountName != 'kia-trip-archiver' ||
        variables.containers.all(c, !c.image.startsWith('gitea.derekjacobs.dev/bvn-homelab/kia-collector:') &&
        (!has(c.envFrom) || c.envFrom.all(e, (!has(e.secretRef) || e.secretRef.name == 'kia-trip-archiver-secret') &&
        (!has(e.configMapRef) || e.configMapRef.name == 'kia-trip-archiver-config'))))
      message: a kia-trip-archiver Job may only use kia-trip-archiver's own image, Secret and ConfigMap
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ops-console-jobs
spec:
  policyName: ops-console-jobs
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: home
