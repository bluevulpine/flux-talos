---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Three OpenBao items; one field from each of the first two, three from the third:
#   kia-collector      KiaCollector__ReauthBearer      -> the bearer for kia-collector-reauth
#   kia-trip-archiver  KiaTripArchiver__ReauthBearer   -> the bearer for kia-trip-archiver-reauth
#   ops-console        OpsConsole__Secret              -> signs CSRF tokens, the flash cookie and the session
#                      OpsConsole__OIDC_ClientId       -> the Authentik provider's confidential client
#                      OpsConsole__OIDC_ClientSecret
# The OIDC keys must exist before this reconciles: a missing key fails the template render,
# the Secret is never created, and the pod sits in CreateContainerConfigError.
#
# The console holds no Kia or OpenBao credential. These three are all it has.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ops-console-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OPS_COLLECTOR_BEARER: "{{ .KiaCollector__ReauthBearer }}"
        OPS_ARCHIVER_BEARER: "{{ .KiaTripArchiver__ReauthBearer }}"
        OPS_SECRET: "{{ .OpsConsole__Secret }}"
        OPS_OIDC_CLIENT_ID: "{{ .OpsConsole__OIDC_ClientId }}"
        OPS_OIDC_CLIENT_SECRET: "{{ .OpsConsole__OIDC_ClientSecret }}"
  dataFrom:
    - extract:
        key: kia-collector
    - extract:
        key: kia-trip-archiver
    - extract:
        key: ops-console
