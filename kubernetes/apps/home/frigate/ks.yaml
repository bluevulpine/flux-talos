---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app frigate
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster18
      namespace: database
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: mosquitto
      namespace: home
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/home/frigate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: home
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: home
      GATUS_PORT: "5000"
      GATUS_SERVICE: frigate
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_STORAGECLASS: tns-csi-nfs
      VOLSYNC_CLONE_STORAGECLASS: tns-csi-nfs
      VOLSYNC_SNAPSHOTCLASS: tns-csi-nfs-snapshot
      VOLSYNC_ACCESSMODES: ReadWriteMany
      VOLSYNC_COPYMETHOD: Snapshot
      VOLSYNC_LOCAL_SCHEDULE: "45 * * * *"
      VOLSYNC_R2_SCHEDULE: "57 0 * * *"
      # kopiur (components/kopiur), W7. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's old ones.
      KOPIUR_LOCAL_CRON: "H * * * *"
      KOPIUR_R2_CRON: "H 0 * * *"
      # Direct: the volume is tns-csi-nfs RWX, so the mover co-mounts it with no
      # staged clone, which keeps it clear of tns-csi's non-idempotent
      # CreateVolume (runbook Sequence step 7).
      # SAFE ONLY WHILE FRIGATE IS SCALED TO 0: config/frigate.db is SQLite (WAL),
      # and a Direct copy under a live writer can capture a torn database. If
      # frigate comes back, move it off SQLite or switch this to Snapshot.
      KOPIUR_COPYMETHOD: Direct
