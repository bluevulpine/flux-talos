---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app frigate
spec:
  chartRef:
    kind: OCIRepository
    name: frigate
  interval: 1h
  values:
    controllers:
      frigate:
        type: deployment
        # Scaled to zero 2026-08-19. Frigate was never configured: the running
        # pod was serving the stock EXAMPLE config -- a single camera literally
        # named "name_of_your_camera" pointing at a placeholder RTSP URL with
        # detection disabled, no Coral detector, and MQTT off. ffmpeg retried
        # that dead URL forever while the pod held ~878Mi and reported 1/1
        # Running, so nothing ever alerted.
        #
        # Everything is kept intact and this is reversible: manifests, the
        # config PVC, the postgres database and the OpenBao key all remain.
        #
        # ⚠️ Before scaling this back up, know two things:
        #   1. The config on PVC "frigate" is still the stock example. Scaling
        #      up alone gets you the retry-loop back, not a working NVR.
        #   2. Two Coral USB Accelerators are present (brokkr01, brokkr02, both
        #      still at the unconfigured USB id 1a6e:089a). Using one needs
        #      `privileged: true` plus node pinning -- the SYS_RAWIO capability
        #      and /dev/bus/usb mount below are NOT sufficient, because the
        #      cgroup v2 device controller denies open() with EPERM. Measured;
        #      see docs/superpowers/specs/2026-08-19-rackpanel-phase2-panel-agent-design.md
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: rolling
            envFrom:
              - secretRef:
                  name: frigate-secret
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              # renovate: datasource=docker depName=ghcr.io/blakeblackshear/frigate
              tag: 0.17.2
            env:
              TZ: "${TIMEZONE}"
              # Use Coral USB TPU for object detection
              LIBUSB_DEBUG: "1"
            envFrom:
              - secretRef:
                  name: frigate-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: &port 5000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              # Removed privileged: true - using specific capabilities instead
              allowPrivilegeEscalation: true # Required for s6-overlay setuid/setgid
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  # Required for s6-overlay user/group switching
                  - SETUID
                  - SETGID
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  # Required for USB device access (Coral TPU)
                  - SYS_RAWIO
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # 44 = video, 568 = apps (NFS media writes)
        supplementalGroups:
          - 44
          - 568
      tolerations:
        - key: "node.kubernetes.io/low-power"
          operator: "Equal"
          value: "raspberry-pi"
          effect: "NoSchedule"
      nodeSelector:
        google.feature.node.kubernetes.io/coral: "true"
    service:
      app:
        controller: frigate
        ports:
          http:
            port: *port
          rtsp:
            port: 8554
          webrtc-tcp:
            port: 8555
            protocol: TCP
          webrtc-udp:
            port: 8555
            protocol: UDP
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Frigate"
          gethomepage.dev/group: "Home"
          gethomepage.dev/icon: "frigate.png"
          gethomepage.dev/description: "NVR & Object Detection"
          gethomepage.dev/widget.type: "frigate"
          gethomepage.dev/widget.url: "http://frigate.home.svc.cluster.local:5000"
        labels:
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - frigate.${SECRET_DOMAIN}
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      # Frigate configuration file - to be created by user
      # config-file:
      #   type: configMap
      #   name: frigate-configmap
      #   globalMounts:
      #     - path: /config/config.yml
      #       subPath: config.yml
      #       readOnly: true
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp/cache
      # USB device access for Coral TPU
      usb:
        type: hostPath
        hostPath: /dev/bus/usb
        globalMounts:
          - path: /dev/bus/usb
      # Media storage for clips/recordings on NFS
      media:
        existingClaim: frigate-nfs
        globalMounts:
          - path: /media/frigate

