---
# Explicit identity for the collector's Jobs.
#
# Unlike kia-collector, this ServiceAccount is NOT bound to an OpenBao
# Kubernetes auth role. The collector never talks to OpenBao itself: the beestat
# API key is static (no session token to rotate and write back), and the
# watermark lives in InfluxDB rather than in any persisted state. ESO fetches
# the secret and mounts it as env, so the pod needs no API-server token at all —
# hence automountServiceAccountToken: false on the pod spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beestat-collector
