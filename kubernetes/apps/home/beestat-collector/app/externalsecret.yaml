---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "beestat-collector"
# Required fields:
#   Beestat__ApiKey        — beestat API key (settings -> Manage API Key)
#   Beestat__InfluxdbToken — InfluxDB token for the beestat bucket
#
# The InfluxDB token needs READ as well as write: the collector is stateless and
# recovers its resume point by querying the bucket's own min/max timestamps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name beestat-collector-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        BEESTAT_API_KEY: "{{ .Beestat__ApiKey }}"
        INFLUXDB_TOKEN: "{{ .Beestat__InfluxdbToken }}"
  dataFrom:
    - extract:
        key: beestat-collector
