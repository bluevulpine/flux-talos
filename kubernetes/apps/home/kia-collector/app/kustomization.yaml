---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - externalsecret.yaml
  - serviceaccount.yaml
  - cronjob.yaml
  - prometheusrule.yaml
# Grafana dashboard, provisioned via the sidecar (label grafana_dashboard=1).
configMapGenerator:
  - name: kia-collector-dashboard
    files:
      - dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
