---
# Hourly cached-state poll — uses server-side cached data, does not wake the car.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-collector-cached
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: collector
              # renovate: datasource=docker
              image: docker.nexus.${SECRET_DOMAIN}/kia/kia-collector:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: kia-collector-config
                - secretRef:
                    name: kia-collector-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
---
# Daily force-refresh — wakes the car to get accurate fresh data.
# Runs at 7:30am Chicago time (12:30 UTC). Adjust to when car is typically idle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-collector-force
spec:
  schedule: "30 12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: collector
              # renovate: datasource=docker
              image: docker.nexus.${SECRET_DOMAIN}/kia/kia-collector:latest
              imagePullPolicy: Always
              env:
                - name: FORCE_REFRESH
                  value: "true"
              envFrom:
                - configMapRef:
                    name: kia-collector-config
                - secretRef:
                    name: kia-collector-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
