---
# Hourly cached-state poll — uses server-side cached data, does not wake the car.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-collector-cached
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kia-collector
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              # Tag auto-updated by Flux image automation (ImagePolicy flux-system:kia-collector).
              image: gitea.derekjacobs.dev/bluevulpine/kia-collector:6-ad58c5df # {"$imagepolicy": "flux-system:kia-collector:tag"}
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: kia-collector-config
                - secretRef:
                    name: kia-collector-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
# Daily force-refresh — wakes the car to get accurate fresh data.
# Runs at 7:30am Chicago time (12:30 UTC). Adjust to when car is typically idle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-collector-force
spec:
  schedule: "30 12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kia-collector
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              # Tag auto-updated by Flux image automation (ImagePolicy flux-system:kia-collector).
              image: gitea.derekjacobs.dev/bluevulpine/kia-collector:6-ad58c5df # {"$imagepolicy": "flux-system:kia-collector:tag"}
              imagePullPolicy: Always
              env:
                - name: FORCE_REFRESH
                  value: "true"
              envFrom:
                - configMapRef:
                    name: kia-collector-config
                - secretRef:
                    name: kia-collector-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir: {}
