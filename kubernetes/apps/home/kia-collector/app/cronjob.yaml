# Cached-state poll every 10 min — uses server-side cached data, does not wake
# the car (no 12V drain). ~145-290 Kia calls/day; well under EU-style caps and
# the community-recommended USA interval. Freshness is bounded by how often the
# car itself reports (drive/charge events), so cached rarely changes faster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-collector-cached
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      # Auto-delete finished jobs (success OR failure) + their pods after 30 min.
      # At the 10-min cadence a one-off transient failure self-clears after ~3
      # cycles (so KubeJobFailed auto-resolves), while a persistent failure keeps
      # producing fresh <30-min-old failed jobs and correctly stays alerting.
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kia-collector
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              # Full ref auto-updated by Flux image automation (ImagePolicy flux-system:kia-collector).
              # NOTE: no ":tag" suffix on the marker — this is a combined image:repo:tag scalar,
              # so Flux must write the whole ref. ":tag" would overwrite the scalar with the bare tag.
              image: gitea.derekjacobs.dev/bluevulpine/kia-collector:11-604bbb82 # {"$imagepolicy": "flux-system:kia-collector"}
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: kia-collector-config
                - secretRef:
                    name: kia-collector-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
# Daily force-refresh — wakes the car to get accurate fresh data.
# Runs at 7:35am Chicago time (12:35 UTC). Adjust to when car is typically idle.
#
# Minute is deliberately :35, NOT a multiple of 10. The cached CronJob above runs
# "*/10 * * * *", so any minute ending in 0 makes both collectors run in the same
# instant. concurrencyPolicy: Forbid does NOT help here — it only serializes a
# CronJob against itself, never against a sibling CronJob.
#
# Observed: the force run failed at exactly 12:30 on 2026-08-09 and 2026-08-10
# (succeeded 08-08); a manual run off-schedule succeeded. Both collectors share one
# Kia session token in OpenBao (secret/kia/token) and both write it back, so a
# same-instant overlap is the obvious suspect — but the mechanism is NOT proven:
# those pods emitted no log output at all, and the known token-death path does log
# ("No token in OpenBao ... Run setup.py first"), so it was not that.
#
# Removing the overlap is worth doing regardless: it also eliminates the duplicated
# 12:30 datapoints that 31c31bef had to dedupe in the dashboard instead of
# preventing at the schedule. Keep this off every /10 boundary.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kia-collector-force
spec:
  schedule: "35 12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      # Auto-delete finished jobs (success OR failure) + their pods after 6h.
      # A failed daily run self-clears (KubeJobFailed auto-resolves) well before
      # the next 12:30 UTC run, instead of lingering until 5 failures pile up.
      ttlSecondsAfterFinished: 21600
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kia-collector
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              # Full ref auto-updated by Flux image automation (ImagePolicy flux-system:kia-collector).
              # NOTE: no ":tag" suffix on the marker — this is a combined image:repo:tag scalar,
              # so Flux must write the whole ref. ":tag" would overwrite the scalar with the bare tag.
              image: gitea.derekjacobs.dev/bluevulpine/kia-collector:11-604bbb82 # {"$imagepolicy": "flux-system:kia-collector"}
              imagePullPolicy: Always
              env:
                - name: FORCE_REFRESH
                  value: "true"
              envFrom:
                - configMapRef:
                    name: kia-collector-config
                - secretRef:
                    name: kia-collector-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: tmp
              emptyDir: {}
