---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OpenBao KV item: "kia-collector"
# Required fields:
#   KiaCollector__Username    — Kia Connect account email
#   KiaCollector__Password    — Kia Connect account password
#   KiaCollector__InfluxdbToken — InfluxDB write token for kia-vehicle bucket
# OpenBao access itself uses Kubernetes auth (SA kia-collector -> role kia-collector),
# not a static token — no KiaCollector__OpenBaoToken needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kia-collector-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        KIA_USERNAME: "{{ .KiaCollector__Username }}"
        KIA_PASSWORD: "{{ .KiaCollector__Password }}"
        INFLUXDB_TOKEN: "{{ .KiaCollector__InfluxdbToken }}"
  dataFrom:
    - extract:
        key: kia-collector
