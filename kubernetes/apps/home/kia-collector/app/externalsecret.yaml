---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Bitwarden item: "kia-collector"
# Required fields:
#   KiaCollector__Username    — Kia Connect account email
#   KiaCollector__Password    — Kia Connect account password
#   KiaCollector__InfluxdbToken — InfluxDB write token for kia-vehicle bucket
#   KiaCollector__OpenBaoToken  — OpenBao token with policy: secret/data/kia/* rw
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kia-collector-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        KIA_USERNAME: "{{ .KiaCollector__Username }}"
        KIA_PASSWORD: "{{ .KiaCollector__Password }}"
        INFLUXDB_TOKEN: "{{ .KiaCollector__InfluxdbToken }}"
        OPENBAO_TOKEN: "{{ .KiaCollector__OpenBaoToken }}"
  dataFrom:
    - extract:
        key: kia-collector
