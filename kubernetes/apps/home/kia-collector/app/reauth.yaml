---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The server's bearer, kept out of kia-collector-secret so the CronJobs (and the Job copies the
# ops console makes of them) never receive it. OpenBao item "kia-collector", field
# KiaCollector__ReauthBearer; the console reads the same field into OPS_*_BEARER.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kia-collector-reauth-bearer
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        REAUTH_BEARER_TOKEN: "{{ .KiaCollector__ReauthBearer }}"
  dataFrom:
    - extract:
        key: kia-collector
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
# Reauth HTTP server for the ops console: python reauth_server.py.
# Runs under the same ServiceAccount as the CronJob it re-enrols (kia-collector), so it
# has exactly that component's OpenBao policy and no other: the collector and
# archiver servers can never write each other's path. Single replica and Recreate
# on purpose: a pending login lives in memory, so a restart means the user starts
# the login over, which is acceptable and simpler than persisting it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kia-collector-reauth
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kia-collector-reauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kia-collector-reauth
    spec:
      serviceAccountName: kia-collector
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reauth
          # Same image and ImagePolicy as the CronJob (flux-system:kia-collector); the marker
          # has no ":tag" suffix because this is a combined image:repo:tag scalar.
          image: gitea.derekjacobs.dev/bvn-homelab/kia-collector:35-4f1f28ff # {"$imagepolicy": "flux-system:kia-collector"}
          imagePullPolicy: Always
          command:
            - python
            - reauth_server.py
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kia-collector-config
            - secretRef:
                name: kia-collector-secret
            - secretRef:
                name: kia-collector-reauth-bearer
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: kia-collector-reauth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kia-collector-reauth
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
# Only the ops console may reach this server. Not the auth boundary (the bearer is);
# it keeps every other pod off the login endpoints. Kubelet probes come from the node,
# which Cilium admits whatever the ingress policy says.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kia-collector-reauth-allow-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kia-collector-reauth
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ops-console
      ports:
        - port: 8080
          protocol: TCP
