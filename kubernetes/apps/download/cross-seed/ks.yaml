---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cross-seed
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    - name: qbittorrent
      namespace: download
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/download/cross-seed/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: download
  wait: false
  postBuild:
    substitute:
      APP: *app
      # components/kopiur pins the kopia identity hostname to NS (runbook: the
      # "Four apps set no NS" trap).
      NS: download
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_STORAGECLASS: longhorn-2-replica
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # Low criticality: config + cache, easily rebuilt - local backup daily
      # kopiur (components/kopiur). H picks a minute per schedule; the R2 hour
      # is the one VolSync used, the local hour is this app's slot in the
      # daily window (components/kopiur/local.yaml).
      KOPIUR_LOCAL_CRON: "H 8 * * *"
      KOPIUR_R2_CRON: "H 0 * * *"
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
