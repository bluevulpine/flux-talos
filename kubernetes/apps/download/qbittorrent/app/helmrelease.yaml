---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: rolling
            env:
              TZ: "${TIMEZONE}"
              QBITTORRENT__PORT: &port 8080
              QBITTORRENT__BT_PORT: &btport 50413
              QBT_Preferences__WebUI__AuthSubnetWhitelistEnabled: true
              QBT_Preferences__WebUI__AuthSubnetWhitelist: |-
                10.42.0.0/16, 10.43.0.0/16, 172.16.0.0/16
              QBT_Preferences__WebUI__LocalHostAuth: false
              QBT_BitTorrent__Session__DefaultSavePath: /media/downloads/torrents
              QBT_BitTorrent__Session__TempPath: /media/downloads/torrents/incomplete
              QBT_BitTorrent__Session__TempPathEnabled: true
            probes:
              # Tracker liveness. From 2026-10-23 17:51Z to 2026-11-04 03:47Z
              # (10.4 days) every probe was green while qBittorrent could not
              # reach a tracker: gluetun reconnected (46 restarts over 5 min
              # when DNS through the tunnel failed), the new tunnel passed
              # gluetun's checks, but wg0 traffic fell from ~9 KB/s to ~150 B/s
              # and stayed there. A deployment restart fixed it at once.
              # Restarting gluetun would not have: its tunnel was healthy, and
              # this is the same "qBittorrent's sockets do not follow a new wg0"
              # failure as 2026-10-06 (see the gluetun comment below), this
              # time after a reconnect instead of at startup. (Mechanism
              # inferred from the traffic and the fix; not reproduced.)
              #
              # So the check asks qBittorrent itself: pass if any running
              # torrent has a tracker with status 2 ("working"; 4 is "not
              # working"). DHT, PeX and LSD are off (private trackers), so
              # dht_nodes is always 0, and connection_status reads "firewalled"
              # when healthy (no forwarded port), so neither can tell.
              #
              # Passes without judging when gluetun's health server is not 200:
              # a tunnel outage is GluetunVPNDown's to report, and restarting
              # qBittorrent then would only crashloop it. Also passes with no
              # running torrents, since there is nothing to judge. A failed API
              # call fails the probe: this replaces app-template's default TCP
              # check on :8080, so a dead WebUI must still restart qBittorrent.
              # curl runs on its own line because a `curl | jq` pipeline takes
              # jq's status, and jq exits 0 on empty input (#2389 review).
              #
              # 30 failures x 60s = 30 min of no working tracker restarts this
              # container only. 30, not 15, to ride out a tracker's maintenance
              # window. Status 2 reflects the last announce, so detection is
              # up to one announce interval (often 30-60 min on private
              # trackers) plus those 30 min. Against a 10-day outage, either
              # delay is cheap.
              #
              # If a restart does not fix it, the repeated restarts back off
              # into CrashLoopBackOff and KubePodCrashLooping fires;
              # QBittorrentRestarted (prometheusrule.yaml) fires on the first.
              # A tracker-side outage (down, or blocking the VPN exit IP) ends
              # there too, since the probe cannot tell it from stuck sockets:
              # check the tracker before restarting the deployment.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - |
                        curl -fsm5 -o /dev/null http://127.0.0.1:9999/ || exit 0
                        B=http://127.0.0.1:8080/api/v2
                        info=$(curl -fsm5 "$B/torrents/info?filter=running") || exit 1
                        hashes=$(printf '%s' "$info" \
                          | jq -r '.[] | select(.state | startswith("queued") | not) | .hash') || exit 1
                        [ -n "$hashes" ] || exit 0
                        for h in $hashes; do
                          curl -fsm5 "$B/torrents/trackers?hash=$h" \
                            | jq -e 'any(.[]; .status == 2)' >/dev/null && exit 0
                        done
                        exit 1
                  periodSeconds: 60
                  timeoutSeconds: 30
                  failureThreshold: 30
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
        # Gluetun VPN sidecar - all traffic routes through this. Declared after
        # `containers` only because it reuses the &port/&btport anchors there.
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              # renovate: datasource=docker depName=ghcr.io/qdm12/gluetun
              tag: v3.41.3
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            env:
              TZ: "${TIMEZONE}"
              VPN_INTERFACE: wg0
              FIREWALL_INPUT_PORTS: *port
              FIREWALL_VPN_INPUT_PORTS: *btport
              DOT: "off"
            securityContext:
              capabilities:
                add:
                  - "NET_ADMIN"
              allowPrivilegeEscalation: true
              runAsUser: 0
              runAsNonRoot: false
            # Native sidecar (an initContainer with restartPolicy: Always), so the
            # kubelet starts qBittorrent only after this container's startup
            # probe passes, i.e. once the tunnel is up. As a plain sidecar both
            # started together: on 2026-10-06 qBittorrent bound its listen
            # sockets at 21:26:01, gluetun brought up wg0 at 21:26:47 after
            # three failed servers, and libtorrent never bound wg0. Everything
            # it sent left via eth0 and was dropped by gluetun's kill switch:
            # 0 DHT nodes and 0 bytes for two days, with every probe green.
            restartPolicy: Always
            probes:
              # All probes run `healthcheck`, which queries gluetun's health
              # server (127.0.0.1:9999). It returns 500 from a failed startup
              # check until a check passes (internal/vpn/tunnelup.go, v3.41.3).
              # Exec, not httpGet: the server binds loopback and gluetun's
              # firewall drops input on ports not in FIREWALL_INPUT_PORTS.
              #
              # The probes used to hit qBittorrent's WebUI on :8080, which
              # answers with or without a tunnel. As a native sidecar that
              # would also deadlock: qBittorrent cannot start until this
              # startup probe passes.
              #
              # startup: up to 5m for the first tunnel. On failure the kubelet
              # restarts gluetun and qBittorrent stays unstarted, which is right
              # when there is no tunnel to use.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 60
              # readiness, not liveness: gluetun restarts its own tunnel on a
              # failed check, and restarting the container cannot fix an expired
              # subscription. A NotReady sidecar makes the pod NotReady, which
              # fires GluetunVPNDown (prometheusrule.yaml) and drops the pod
              # from the Service: the gatus check turns red and
              # Sonarr/Radarr/Lidarr log download-client errors. That is
              # expected during an outage, and it stops new grabs into a client
              # that cannot download.
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
      bittorrent:
        controller: qbittorrent
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: ${SVC_QBITTORRENT_ADDR}
        ports:
          bittorrent-tcp:
            port: *btport
            protocol: TCP
          bittorrent-udp:
            port: *btport
            protocol: UDP
    route:
      app:
        annotations:
          # Check the backend directly (internal Service), not the authentik-proxied
          # public URL. Sending the gatus-healthcheck Basic-auth credential through
          # the proxy made the outpost mint a fresh OAuth2 token every check (Basic
          # auth is stateless) — spamming authentik's event log with logins. SSO
          # itself is covered by the separate authentik/identity gatus check.
          gatus.home-operations.com/endpoint: |
            group: download
            url: http://qbittorrent-app.download.svc.cluster.local:8080
            conditions:
              - "[STATUS] == 200"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "qBittorrent"
          gethomepage.dev/group: "Downloads"
          gethomepage.dev/icon: "qbittorrent.png"
          gethomepage.dev/description: "Torrent Client"
          gethomepage.dev/widget.type: "qbittorrent"
          gethomepage.dev/widget.url: "http://qbittorrent-app.download.svc.cluster.local:8080"
          gethomepage.dev/widget.username: "{{`{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}`}}"
          gethomepage.dev/widget.password: "{{`{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}`}}"
        labels:
          auth: authentik
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - qbittorrent.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: *app
      media:
        existingClaim: qbittorrent-media-nfs
        globalMounts:
          - path: /media

