---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name qbittorrent-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Gluetun VPN config
        VPN_SERVICE_PROVIDER: mullvad
        VPN_TYPE: wireguard
        WIREGUARD_PRIVATE_KEY: "{{ .Mullvad__WireguardPrivateKey }}"
        WIREGUARD_ADDRESSES: "{{ .Mullvad__WireguardAddress }}"
        # Pinned, not a country filter. With SERVER_COUNTRIES gluetun picks a
        # random server on every reconnect, so each VPN restart announced to
        # trackers from a new exit IP (the 2026-10-06 expiry loop hopped four
        # servers in 26s); a stream of IPs per account reads as connection
        # abuse and has earned a tracker ban before. Two hosts in one city
        # cap it at two IPs while surviving one server going down. Must not
        # be combined with SERVER_COUNTRIES: the filters intersect, and a
        # Canadian host in a USA filter matches nothing. Names must exist in
        # gluetun's bundled servers.json (both do in v3.41.3).
        SERVER_HOSTNAMES: "ca-tor-wg-201,ca-tor-wg-202"
  dataFrom:
    - extract:
        key: mullvad

