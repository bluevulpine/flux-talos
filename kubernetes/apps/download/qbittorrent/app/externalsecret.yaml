---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name qbittorrent-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Gluetun VPN config: AirVPN, on trial from 2026-10-09 for its
        # forwarded port (Mullvad dropped port forwarding in 2023, so on
        # Mullvad no peer could ever connect in). The Mullvad keys stay at
        # secret/mullvad. To switch back, revert the whole PR (#2112), NOT
        # just this file: helmrelease.yaml reads QBT_TORRENTING_PORT from this
        # secret through a non-optional secretKeyRef (the app would fail with
        # CreateContainerConfigError), and it no longer sets
        # FIREWALL_VPN_INPUT_PORTS itself.
        VPN_SERVICE_PROVIDER: airvpn
        VPN_TYPE: wireguard
        WIREGUARD_PRIVATE_KEY: "{{ .Airvpn__WireguardPrivateKey }}"
        WIREGUARD_PRESHARED_KEY: "{{ .Airvpn__WireguardPresharedKey }}"
        WIREGUARD_ADDRESSES: "{{ .Airvpn__WireguardAddress }}"
        # Pinned servers, not a country filter. With a country filter gluetun
        # picks a random server on every reconnect, so each VPN restart
        # announced to trackers from a new exit IP (on 2026-10-06 one restart
        # loop hopped four servers in 26s), and a stream of IPs per account
        # reads as connection abuse and has earned a tracker ban before. Two
        # names cap it at two exit IPs and survive one server going down.
        # Agena and Regulus had the lowest load of AirVPN's Toronto servers
        # when this was written.
        #
        # SERVER_HOSTNAMES keeps the IPv4 entries only. gluetun lists every
        # AirVPN server twice, once per address family (ca.vpn.airdns.org /
        # ca.ipv6.vpn.airdns.org). The pod has no IPv6 route out, and each
        # IPv6 attempt burned a ~7s failed healthcheck on Mullvad. The filters
        # intersect, so there is no SERVER_COUNTRIES here.
        SERVER_NAMES: "Agena,Regulus"
        SERVER_HOSTNAMES: "ca.vpn.airdns.org"
        # The forwarded port reserved in AirVPN's client area works on any of
        # its servers. gluetun opens it on wg0, and qBittorrent listens on it
        # via QBT_TORRENTING_PORT (helmrelease.yaml); both come from here so
        # the port lives in one place.
        FIREWALL_VPN_INPUT_PORTS: "{{ .Airvpn__ForwardedPort }}"
        QBT_TORRENTING_PORT: "{{ .Airvpn__ForwardedPort }}"
  dataFrom:
    - extract:
        key: airvpn

