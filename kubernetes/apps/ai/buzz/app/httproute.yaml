---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: buzz
  annotations:
    gatus.home-operations.com/endpoint: |
      group: ai
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Buzz"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-bee"
    gethomepage.dev/description: "Agent workspace (Nostr relay)"
spec:
  hostnames:
    - "buzz.${SECRET_DOMAIN}"
  parentRefs:
    # Internal gateway only - not exposed externally. Clients (the Buzz
    # desktop app, agents outside the cluster) reach it on the LAN or tailnet.
    - name: internal
      namespace: network
      sectionName: https
  rules:
    # Phone pairing: the stateless NIP-AB sidecar (pairingRelay in
    # helmrelease.yaml). Exact match, because upstream's buzz-pair-relay docs
    # say the proxy should route only `/pair` to it, and it enforces no path
    # restriction of its own. Gateway API prefers the more specific match, so
    # this wins over the catch-all below regardless of order.
    - matches:
        - path:
            type: Exact
            value: /pair
      backendRefs:
        - name: buzz-pairing
          port: 5000
    # Everything else: the relay serves the WebSocket, REST API, web UI and
    # /media on the same port.
    - backendRefs:
        - name: buzz
          port: 3000
