---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name buzz-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Keys the chart reads from secrets.existingSecret (deploy/charts/buzz
        # values.yaml). Supplying them all keeps the chart's randAlphaNum
        # autogen out of the picture, which is not idempotent under Flux.
        #
        # The relay's own Nostr identity (64-char hex). Rotating it is an
        # identity change for the relay, not a routine credential rotation.
        BUZZ_RELAY_PRIVATE_KEY: "{{ .Buzz__RelayPrivateKey }}"
        BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .Buzz__GitHookHmacSecret }}"
        DATABASE_URL: "postgres://{{ .Buzz__PostgresUser }}:{{ .Buzz__PostgresPass }}@${POSTGRES_HOST}:5432/{{ .Buzz__DbName }}"
        # Shared dragonfly, no auth (same as tracearr, immich, nextcloud).
        # Buzz namespaces every key and pub/sub channel under `buzz:`.
        REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379
        # Garage key scoped to the `buzz` bucket only.
        BUZZ_S3_ACCESS_KEY: "{{ .Buzz__S3AccessKey }}"
        BUZZ_S3_SECRET_KEY: "{{ .Buzz__S3SecretKey }}"
        # postgres-init (init container in helmrelease.yaml)
        INIT_POSTGRES_DBNAME: "{{ .Buzz__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Buzz__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Buzz__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: buzz
