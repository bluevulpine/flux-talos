---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app documents
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  path: ./kubernetes/apps/ai/documents/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: ai
  # true: longhorn-2-replica binds Immediately, so the claim goes Bound as soon
  # as it is created. Waiting makes hermes' dependsOn mean "the volume exists",
  # not merely "the manifest was applied". No ExternalSecret in this app (the
  # share rides the sidecar's existing config), so longhorn is the only
  # dependency.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: ai
