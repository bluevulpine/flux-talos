---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
      remediateLastFailure: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      litellm:
        # Two replicas with a surge-only rollout, so a config change or image
        # bump never leaves the gateway with zero ready pods. This was
        # Recreate on one replica, which scaled to 0 on every reload (reloader
        # restarts it on any ConfigMap change) and dropped ~40s of traffic:
        # on 2026-09-23 four rollouts in a few hours failed every hindsight
        # retain call in flight or arriving during the gap with
        # `APIConnectionError: Connection error`.
        #
        # Safe to run more than one now because everything that has to be
        # shared already is: rate limits, spend and router state live in
        # dragonfly (`coordination_redis` / `router_settings` below), and
        # STORE_MODEL_IN_DB is false so no replica owns model config in its own
        # process. `prisma migrate deploy` at startup takes Prisma's Postgres
        # advisory lock, and surge-by-one starts replicas one at a time anyway.
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # One per node, so draining a node cannot take both replicas.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: rolling
            envFrom: &envFrom
              - secretRef:
                  name: litellm-secret
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.104.2
            args:
              - --config
              - /app/config/config.yaml
              - --port
              - "4000"
            env:
              LITELLM_MODE: PRODUCTION
              # Model routing is declared in the ConfigMap below so it lives in
              # git and reconciles like everything else. With this true, LiteLLM
              # would treat its database as the source of truth and edits made
              # in the UI would silently outlive a redeploy.
              STORE_MODEL_IN_DB: "false"

              # --- SSO via Authentik (generic OIDC), configured entirely here ---
              # The client id/secret come from litellm-secret. Everything below is
              # public configuration.
              #
              # PROXY_BASE_URL is REQUIRED, not cosmetic: TLS terminates at the
              # gateway, so LiteLLM sees http:// and would send Authentik a
              # redirect_uri of http://litellm.../sso/callback, which never matches
              # what is registered. The callback registered in Authentik must be
              # exactly ${PROXY_BASE_URL}/sso/callback.
              PROXY_BASE_URL: https://litellm.${SECRET_DOMAIN}
              GENERIC_AUTHORIZATION_ENDPOINT: https://sso.${SECRET_DOMAIN}/application/o/authorize/
              GENERIC_TOKEN_ENDPOINT: https://sso.${SECRET_DOMAIN}/application/o/token/
              GENERIC_USERINFO_ENDPOINT: https://sso.${SECRET_DOMAIN}/application/o/userinfo/
              # ⚠️ LiteLLM's default scope is "openid email profile". Authentik only
              # emits the `litellm_role` claim when that scope is REQUESTED, so
              # leaving this at the default silently gives every user the default
              # role and nobody is ever an admin. `litellm_role` is a custom scope
              # mapping on the provider: proxy_admin for the Authentik group
              # `admins` (exact name; `authentik Admins` is a different group),
              # internal_user for everyone else.
              GENERIC_SCOPE: openid email profile litellm_role
              GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
              # Readable ids in the UI. `sub` is Authentik's hashed_user_id.
              GENERIC_USER_ID_ATTRIBUTE: preferred_username
              GENERIC_USER_EMAIL_ATTRIBUTE: email
              GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
            envFrom: *envFrom
            probes:
              # LiteLLM spells the liveness path "liveliness" — not a typo here.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              # LiteLLM writes transient files under /tmp at startup.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
    configMaps:
      config:
        data:
          config.yaml: |-
            model_list:
              # --- primary: DGX Spark (spark-ab23) over the LAN ---
              # One engine on the Spark since 2026-10-05: vLLM (:8000), serving
              # Qwen3.6 for every `spark-*` text and vision route. (Ollama on
              # :11434 served gpt-oss, then only vision, and is retired.) It is
              # OpenAI-compatible at /v1 and has no auth of its own: it ignores the
              # bearer token, so api_key is a placeholder, not a secret. LiteLLM
              # is the authentication boundary in front of it; it is
              # reachable by anything on VLAN 10.
              #
              # Addressed by IP, deliberately, after the name stopped resolving.
              #
              # This was http://spark-ab23.${SECRET_DOMAIN}:11434/v1 and that
              # worked when it was set. Hours later the same lookup returned
              # NODATA from the UDM (NOERROR, no A record) while the BARE
              # `spark-ab23` still answered 10.0.10.237 — i.e. UniFi's automatic
              # DHCP-hostname registration survived but the explicit
              # derekjacobs.dev record did not. Every Hindsight call failed as
              # `litellm.InternalServerError: Connection error` until this change.
              #
              # The bare name is not a usable substitute: with ndots:5 the
              # cluster search path swallows a single-label name, and it resolves
              # only as `spark-ab23.` with a trailing dot, which not every HTTP
              # client normalises.
              #
              # Using the IP is SAFE now in a way it was not originally. The
              # first version of this file used 10.0.10.237 and carried a warning
              # that it was a DHCP lease which could move silently. It is now a
              # fixed assignment on the UDM, so that failure mode is gone.
              #
              # Switch back to the name once the A record is restored and
              # verified resolving FROM A POD, not just from the Spark — the
              # Spark resolves names the cluster cannot.
              #
              # Served by vLLM on :8000 (spark-setup, roles/vllm), not Ollama,
              # since 2026-09. vLLM pages its KV cache per request instead of
              # preallocating 8 fixed 32k slots, so there is no slot cap to
              # queue behind: measured on an idle Spark, 226 vs 153 tok/s
              # aggregate at 8 concurrent, and 385 at 16 where Ollama queued
              # requests 26s for a slot. It is ~25% slower for a LONE request
              # (46 vs 61 tok/s) -- the trade taken deliberately.
              #
              # Like Ollama, vLLM runs with no --api-key: the placeholder below
              # is sent and ignored, and LiteLLM stays the auth boundary.
              #
              # num_retries: ~4.7% of replayed reflect tool calls (3/64) came back
              # 500 "unexpected tokens remaining in message header" -- gpt-oss
              # intermittently emits a malformed harmony tool-call header that
              # vLLM's parser rejects. The same request succeeds on retry, and
              # hindsight's own retries cover only its background worker jobs, so
              # without this an interactive reflect surfaces the 500. Two retries
              # take it to ~1 in 10,000.
              #
              # ⚠️ THE NAME IS HISTORICAL. Since 2026-10-05 the model behind
              # `spark-gpt-oss-20b` is Qwen3.6-35B-A3B (spark-setup
              # group_vars: vllm_model), not gpt-oss-20b. This route is now a
              # LEGACY ALIAS: use `spark-main` (defined below), which every
              # consumer in git and mealie moved to the same day. It remains
              # only for the Hermes agent, whose model config is on its PVC.
              # Everything above about
              # vLLM versus Ollama still holds; the gpt-oss harmony-header note
              # does not apply to Qwen, and num_retries stays as cheap insurance.
              #
              # Why the model changed: replaying real hindsight calls, gpt-oss
              # returned {"facts": []} on 24 of 50 retains where Qwen returned
              # facts on all 50, and production showed the same (268 of 831
              # successful retains in 72h stored nothing). Numbers are in
              # spark-setup group_vars/all.yml.
              #
              # Thinking is OFF by default on the server
              # (--default-chat-template-kwargs). With it on, the same retain took
              # 118s instead of 13s. ⚠️ `reasoning_effort` OVERRIDES that default:
              # any value but "none" turns thinking on for that request ("low"
              # produced 508 reasoning tokens for a one-sentence answer, "none"
              # produced 0). So a consumer tuned for gpt-oss with
              # reasoning_effort: low is asking Qwen to think. An explicit
              # `chat_template_kwargs: {"enable_thinking": false}` wins over both.
              - model_name: spark-gpt-oss-20b
                litellm_params:
                  model: openai/qwen3.6-35b-a3b
                  api_base: http://10.0.10.237:8000/v1
                  api_key: unused-no-auth
                  num_retries: 2

              # --- long-context alias for hindsight reflect ---
              # The SAME vLLM instance as spark-gpt-oss-20b, kept as a separate
              # model_name only so hindsight's reflect config and virtual key
              # need no change. It used to be a second, hand-made ollama on
              # :11435 (one slot, 98k window, ~17 GiB for a second copy of the
              # weights), because reflect prompts on the flux-talos bank are
              # 55-65k tokens and the main 32k window silently kept only the tail.
              # vLLM's single instance serves the full 131,072-token window to
              # any request: an ~87k-token prompt measured 18s to first token
              # alongside short traffic.
              #
              # It no longer has ONE slot, so the old "nothing else may point
              # here" rule is gone -- but keep it reflect-only anyway, so the
              # two can be split again without touching other consumers.
              - model_name: spark-gpt-oss-20b-long
                litellm_params:
                  model: openai/qwen3.6-35b-a3b
                  api_base: http://10.0.10.237:8000/v1
                  api_key: unused-no-auth
                  # Reflect is the tool-calling stage; see num_retries above.
                  num_retries: 2

              # --- audio (spark-setup `audio` role) ---
              # Two plain Docker containers on the Spark, NOT Ollama, so they use
              # their own ports and the `mode` below tells LiteLLM which OpenAI
              # audio route each one serves. Like Ollama they have no auth of their
              # own; LiteLLM is the boundary. Round trip verified on the box: TTS ->
              # WAV -> STT returned the synthesised sentence.
              #
              # Speech-to-text: parakeet.cpp (NVIDIA Parakeet TDT 0.6B v3,
              # multilingual). An 11 s clip transcribed word-for-word in ~0.3 s warm.
              # This is the model Mealie's "audio" provider slot should point at.
              # The `openai/` prefix + api_base makes LiteLLM speak the OpenAI wire
              # format to it; the part after `openai/` is only what LiteLLM sends as
              # `model`, which parakeet accepts and ignores.
              - model_name: spark-stt
                litellm_params:
                  model: openai/tdt-0.6b-v3
                  api_base: http://10.0.10.237:8081/v1
                  api_key: unused-no-auth
                model_info:
                  mode: audio_transcription

              # Text-to-speech: Qwen3-TTS 1.7B voice-clone. The `voice` field selects
              # an entry in voices.json on the Spark (a reference clip + its exact
              # transcript), which is how character voices are added -- see the
              # spark-setup README. ~7 s warm for a ~5 s sentence, so this is fine
              # for notifications and read-aloud, not for real-time conversation.
              #
              # ⚠️ Streams the WAV, so the header's length field is bogus (a 4.8 s
              # clip reports ~89,000 s). Players cope; strict parsers may not. Ask for
              # response_format=mp3 (encoded after generation, so the header is right).
              - model_name: spark-tts
                litellm_params:
                  model: openai/tts-1
                  api_base: http://10.0.10.237:8082/v1
                  api_key: unused-no-auth
                model_info:
                  mode: audio_speech

              # --- removed 2026-09-29: spark-qwen25-14b (qwen2.5:14b-instruct) ---
              # A dense non-reasoning alternative to gpt-oss that nothing used: it
              # was reflect's escape hatch until reflect needed a ~92k window, and it
              # was never faster (26 tok/s vs gpt-oss's 63 -- dense loses to MoE on
              # a bandwidth-bound box). Removed for the memory hazard below.
              #
              # ⚠️ MEMORY HAZARD, still true for anything served by Ollama. It runs
              # with OLLAMA_KEEP_ALIVE=-1, so ANY model touched through this proxy
              # stays resident forever, and its KV cache is slots x context per
              # model: one evaluation request against the dense 14B pinned 73 GiB
              # at 4 slots and took the box to 103 of 121 GiB, with hindsight
              # operations timing out into PERMANENT failures. With vLLM now
              # holding a fixed ~36 GiB, the same load would reach earlyoom, whose
              # largest preferred target is vLLM. Before adding a dense model here,
              # size slots x context x its per-token KV against what is free.

              # --- vision ---
              # ⚠️ Since 2026-10-05 this route is the same Qwen3.6 on vLLM as the
              # text routes (see the note above the route itself). The rest of this
              # header describes qwen2.5vl on Ollama, which is now only the rollback.
              #
              # (Then:) The ONLY model here that can see an image. The gpt-oss entries above
              # are text-only, which is why karakeep's image slot and
              # homebox-companion's photo item-detection were dead after the
              # Azure migration -- gpt-4.1-mini and gpt-5-mini were both
              # vision-capable and nothing on the Spark replaced that.
              #
              # Measured on this box at OLLAMA_NUM_PARALLEL=8, not estimated:
              # 20 GiB resident alongside gpt-oss's 13 GiB (54 of 121 GiB used,
              # 67 free, when gpt-oss still ran in Ollama -- it is on vLLM now),
              # 17.6s cold including model load, then 1.3-2.7s warm.
              # It read two lines of rendered text exactly, including a currency
              # amount, and identified two shapes and their colours.
              #
              # It is DENSE, unlike gpt-oss -- see the memory hazard above. At 7B
              # that is affordable; it would not be at 14B+.
              #
              # ⚠️ Images must be sent as a base64 `data:` URI. Ollama does NOT
              # fetch remote http(s) image URLs -- its own docs list "Image URL"
              # as unsupported -- so a consumer that passes a link instead of
              # bytes gets a failure that looks like a model problem. Verified
              # working here through this exact OpenAI-compatible shape.
              #
              # ⚠️ ALSO A HISTORICAL NAME since 2026-10-05: this route now goes to
              # the same Qwen3.6 on vLLM as the text routes, which reads images
              # itself. Checked side by side with qwen2.5vl on five images: same
              # or better tags, and a rendered receipt transcribed exactly. Images
              # are capped at ~1 MP and TWO PER REQUEST on the server
              # (spark-setup vllm_extra_args) -- a request with more gets a 400
              # where Ollama accepted it. homebox-companion's multi-photo
              # detection is the consumer to check. vLLM, unlike Ollama, will fetch an
              # http(s) image URL, so the base64-only warning above no longer
              # binds -- but consumers already send bytes.
              #
              # Ollama is RETIRED on the Spark (stopped and disabled, 2026-10-05;
              # spark-setup ollama_enabled). The binary and qwen2.5vl:7b are still on
              # disk, so the rollback is two steps: ollama_enabled: true with
              # `--tags inference` there, then point this back at
              #   model: openai/qwen2.5vl:7b, api_base: http://10.0.10.237:11434/v1
              - model_name: spark-qwen25-vl-7b
                litellm_params:
                  model: openai/qwen3.6-35b-a3b
                  api_base: http://10.0.10.237:8000/v1
                  api_key: unused-no-auth
                  # Kept as cheap insurance, as on the text routes.
                  num_retries: 2

              # --- the names to use: spark-main, spark-main-vision ---
              # Model-neutral on purpose. The routes above are named after models
              # the Spark no longer runs (gpt-oss-20b, qwen2.5vl), which is what
              # naming a route after its model gets you after one swap. These say
              # what the route is FOR, so the next model change touches
              # spark-setup and this file and no consumer.
              #
              #   spark-main          text. Falls back to the hosted copy when the
              #                       Spark is down (router_settings.fallbacks).
              #   spark-main-vision   the same model, for requests carrying
              #                       images. NO fallback, so a photo never leaves
              #                       the house: that is the whole reason it is a
              #                       separate name.
              #
              # Both are thinking-off by default like every Spark route; see the
              # reasoning_effort warning on spark-gpt-oss-20b above.
              #
              # The three older names are LEGACY ALIASES of the same backend, kept
              # while the last consumer moves: the Hermes agent (its model config
              # is on its PVC, not in git). hindsight, karakeep, homebox-companion
              # and mealie (in its admin UI) moved on 2026-10-05. Every virtual key
              # already allows the new names. Once nothing sends the old ones,
              # delete those three routes and their fallbacks entries.
              - model_name: spark-main
                litellm_params:
                  model: openai/qwen3.6-35b-a3b
                  api_base: http://10.0.10.237:8000/v1
                  api_key: unused-no-auth
                  num_retries: 2

              - model_name: spark-main-vision
                litellm_params:
                  model: openai/qwen3.6-35b-a3b
                  api_base: http://10.0.10.237:8000/v1
                  api_key: unused-no-auth
                  num_retries: 2

              # --- fallback: the SAME model, hosted (Nous Portal) ---
              # Used only when the Spark fails a request after its retries; see
              # router_settings.fallbacks below. It is the same Qwen3.6-35B-A3B
              # the Spark serves, so a fallback answer comes from the same model
              # and prompt behaviour, not a stand-in.
              #
              # Why it exists: with one backend, a Spark restart, image bump or
              # engine crash failed every hindsight call in flight, and hindsight
              # retries a job a bounded number of times before failing it for
              # good. The engine restarted itself five times on 2026-10-05 alone.
              #
              # ⚠️ PRIVACY. A request that falls back LEAVES THE HOUSE: Nous
              # resells OpenRouter capacity (its usage block reports
              # `cost_details.source: openrouter_list`), so the prompt goes to
              # whichever upstream provider serves it. That applies to EVERY
              # consumer of the text routes (spark-main and the two legacy
              # names), not only hindsight:
              #   hindsight   session transcripts, commit diffs, knowledge pages
              #   karakeep    bookmark text being summarised/tagged
              #   mealie      recipe text (its settings live in its database)
              #   n8n, node-red   whatever a flow sends (none use it today)
              # homebox-companion is not affected: it uses the vision route for
              # everything, and vision does not fall back. This is the price of
              # not losing the memory, taken deliberately; the only off switch is
              # the fallbacks block, and it is all-or-nothing per route name.
              # hindsight, karakeep and mealie share `spark-main`, so keeping one
              # of them local means one more rename: give it (or hindsight) its
              # own route name and fall back only the one that should.
              #
              # `reasoning: {enabled: false}` is NOT optional. Hosted, the model
              # thinks by default: a one-word reply spent its whole 200-token cap
              # reasoning and returned empty content, and retains ran 26-142s with
              # one of three failing the schema. Off, 16 of 17 replayed retains
              # were schema-valid at 8s p50 (hosted, at 4 concurrent -- not
              # comparable to the Spark's 13s at 8). (The Spark's own switch,
              # chat_template_kwargs, is ignored here; `reasoning` is OpenRouter's.)
              #
              # Cost, measured: 17 retains for $0.026, so ~$0.0015 a call, on the
              # Nous subscription's included credits ($0.05 / $0.70 per million
              # tokens). All of hindsight for a month would be roughly $25; as a
              # fallback it is cents.
              #
              # Known gap: 1 of 17 came back as a malformed object despite
              # strict json_schema, so upstream enforcement is not as tight as
              # vLLM's grammar. Hindsight validates and retries, so it costs a
              # retry, not a bad memory.
              #
              # Not listed in any virtual key: it is reached only as a fallback,
              # never by name.
              - model_name: nous-qwen36-fallback
                litellm_params:
                  model: openai/qwen/qwen3.6-35b-a3b
                  api_base: https://inference-api.nousresearch.com/v1
                  api_key: os.environ/NOUS_API_KEY
                  extra_body:
                    reasoning:
                      enabled: false

            litellm_settings:
              drop_params: true
              # Response cache in the shared dragonfly, OPT-IN ONLY (default_off).
              # A request is cached only when the caller sends
              # `cache: {"use-cache": true}`; everything else, including all of
              # hindsight's retain/consolidation/reflect traffic, is never cached.
              # That is deliberate: those prompts are generated from evolving memory
              # with sampling on, so a blanket cache would return a stale or
              # identical "creative" answer. Turning it on per request is safe;
              # turning it on globally would be a behaviour change nobody asked for.
              #
              # `namespace` prefixes every key so this tenant is separable inside a
              # dragonfly shared with authentik, nextcloud, grafana and others. It
              # runs --cluster_mode=emulated, where SELECT-based db isolation is not
              # reliable, so a key prefix is the isolation mechanism (same as
              # tracearr's REDIS_PREFIX).
              cache: true
              cache_params:
                type: redis
                host: dragonfly.database.svc.cluster.local
                port: 6379
                namespace: litellm.cache
                mode: default_off

            # Shared state that must NOT be per-process: tpm/rpm limits, each virtual
            # key's max_parallel_requests, spend counters. Without this every worker
            # enforces its own copy, so a key capped at 2 parallel requests can
            # actually run 2 per worker, defeating the Spark slot budget the caps
            # exist to enforce, and spend can overshoot. This is what the UI's
            # "No Redis configured" banner is about; it clears once it is set.
            general_settings:
              coordination_redis:
                host: dragonfly.database.svc.cluster.local
                port: 6379

              # Keep only the last hour of spend-log rows. This is a workaround for
              # a collision, not a storage decision.
              #
              # LiteLLM keys each SpendLogs row on the provider's response id and
              # silently drops a row whose id already exists (its own code notes
              # "SpendLogs does not allow duplicate request_id"). Ollama makes ids
              # like `chatcmpl-335` from a range of about 1,000, so once the table
              # holds ~1,000 rows almost every new call collides and is not logged.
              # Measured 2026-09-23: 1,645 rows with ids spanning 0-998, and 7 of 8
              # probe calls returned an id already in the table and produced no row,
              # so store_prompts_in_spend_logs was capturing ~1% of traffic. It was
              # NOT caused by running two replicas: the same loss showed on the
              # single pod before that change.
              #
              # A short window keeps the table small enough that collisions are
              # rare (roughly 40 rows/hour here, so a few percent). The interval
              # defaults to "1d", which would let a day of rows build up between
              # cleanups and defeat the point, so it is set explicitly. Daily spend
              # aggregates and key/team totals live in other tables and are
              # unaffected. It also stops stored prompts, mental models included,
              # from accumulating in Postgres indefinitely, which the unset default
              # would do.
              #
              # Not a fix: prompt history is only ever the last hour, and a burst
              # can still collide. Hindsight's own /llm-requests log has unique ids
              # and is the reliable record for its calls.
              maximum_spend_logs_retention_period: "1h"
              maximum_spend_logs_retention_interval: "30m"

            # The router's own Redis: cooldowns and usage-based routing state. Kept
            # as a separate setting because LiteLLM treats it as a separate client.
            router_settings:
              redis_host: dragonfly.database.svc.cluster.local
              redis_port: 6379
              # Text routes only. A fallback fires after the route's own
              # num_retries are spent on errors that come back FAST: connection
              # refused, 5xx. That covers the Spark being down, restarting or its
              # engine having crashed. It does NOT cover an engine that accepts
              # the connection and then hangs: no route sets a timeout, so
              # LiteLLM's 600s default applies to each of three attempts and
              # hindsight's own 600s gives up first. Slow is not a fallback either.
              #
              # Vision (spark-main-vision, and the legacy spark-qwen25-vl-7b) is
              # deliberately NOT here: its callers
              # are interactive (karakeep tagging, homebox photos), a failed tag
              # is retried by the app, and photos are a different thing to send
              # out than text. Add it only on purpose.
              #
              # ⚠️ A fallback pointing at a dead credential is worse than none:
              # LiteLLM spends a failed round-trip and then buries the real cause
              # in a nested error ("Connection error.. Error doing the fallback:
              # AuthenticationError.."), so a Spark outage reads as an auth
              # problem somewhere else. That is what an exhausted Azure member did
              # here in 2026-09. If the Nous key or credits lapse, remove this
              # block rather than leave it.
              fallbacks:
                - spark-main:
                    - nous-qwen36-fallback
                # Legacy aliases; remove with their routes.
                - spark-gpt-oss-20b:
                    - nous-qwen36-fallback
                - spark-gpt-oss-20b-long:
                    - nous-qwen36-fallback
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config
    service:
      app:
        controller: litellm
        ports:
          http:
            port: *port
