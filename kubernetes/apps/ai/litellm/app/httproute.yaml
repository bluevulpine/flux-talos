---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# TWO HTTPRoute objects on ONE hostname, split by AUTHENTICATION POSTURE — the
# same shape as `hindsight` next door and media/calibre-web.
#
# Until 2026-10-18 this was ONE route covering `/`, entirely behind Authentik,
# on the reasoning that every API client was in-cluster and reached LiteLLM
# over `litellm.ai.svc.cluster.local:4000`. That stopped being true when Wisp
# (the Hermes desktop instance on Derek's Mac) was given a LiteLLM virtual key
# to reach `spark-main`: a bearer-token client outside the cluster cannot
# complete the interactive OIDC redirect, so every call to /v1 died at the
# outpost with a 302 to the SSO page (changed 2026-10-18).
#
# components/common renders a SecurityPolicy whose
# `targetSelectors.matchLabels: {auth: authentik}` selects whole HTTPRoute
# OBJECTS, so the label cannot be scoped to one rule — hence two objects.
# Gateway API precedence is exact path, then longest prefix by character count;
# `/v1` (3 chars) beats `/` (1 char) regardless of object or list order.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-api
  # NO `auth: authentik` label, deliberately. /v1 is protected by LiteLLM's own
  # virtual-key auth instead: with LITELLM_MASTER_KEY set, every /v1 request
  # whose Authorization header lacks a valid virtual key returns 401, and each
  # key carries its own model allow-list and spend cap, which is a tighter
  # boundary than SSO gives an API caller anyway.
  #
  # ONLY /v1. The admin UI, /ui, /health/*, /metrics, /key/* and /model/*
  # management endpoints stay on the control-plane route below, behind SSO —
  # the master key is proxy-admin and the UI is where it is used.
spec:
  hostnames:
    - litellm.${SECRET_DOMAIN}
  # Internal gateway only, same as the control plane. Tailnet clients reach it
  # the way the Mac does — ts-exit-node advertises 172.16.8.0/24.
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: litellm
          port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  annotations:
    # Gatus auto-generates an endpoint from this annotation, which gives the
    # route itself a check. It is NOT the health check for LiteLLM: this route
    # is labelled `auth: authentik`, so an unauthenticated probe is redirected
    # to SSO, and gatus follows redirects — a 200 from the Authentik login page
    # would read as healthy with LiteLLM completely dead.
    #
    # The real check is the `LiteLLM` endpoint in the gatus config, which hits
    # http://litellm.ai.svc.cluster.local:4000/health/readiness directly over
    # cluster DNS and asserts db == connected. Keep both: this one catches the
    # route/gateway/SSO path, that one catches the service.
    gatus.home-operations.com/endpoint: |
      group: ai
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "LiteLLM"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-router-network"
    gethomepage.dev/description: "Inference gateway + spend"
  labels:
    # NOT optional. LiteLLM's admin UI authenticates with LITELLM_MASTER_KEY,
    # which is proxy-admin: it mints and revokes virtual keys and reads all
    # spend. Without this label the UI is reachable by anything on the LAN or
    # tailnet that knows the hostname, and the master key is the only thing
    # between a visitor and full control of every model route.
    #
    # Requires `ai` in kubernetes/apps/identity/authentik/app/referencegrant.yaml
    # — already present for hindsight. Without the grant the SecurityPolicy
    # cannot reference ak-outpost-sso-proxy and this label SILENTLY does nothing,
    # which fails open rather than closed.
    auth: authentik
spec:
  hostnames:
    - litellm.${SECRET_DOMAIN}
  # Internal gateway only. This proxy is the single point through which every
  # LLM call in the cluster flows, and its UI can re-route models and read spend
  # across all of them. There is no case for putting it on `external`.
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000
