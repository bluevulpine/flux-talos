---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# ONE HTTPRoute covering `/`, entirely behind Authentik — deliberately NOT the
# two-object split-posture shape that `hindsight` next door uses.
#
# Hindsight needs that split because the Claude Code plugin talks to its /v1 and
# /mcp paths with a bearer token and cannot complete an interactive OIDC
# redirect, so those paths must stay unlabelled. LiteLLM has no such consumer:
# every client of its API (hindsight today; mealie, karakeep, n8n, node-red and
# homebox-companion when they migrate) is IN-CLUSTER and reaches it over
# `litellm.ai.svc.cluster.local:4000`, never through this gateway. Nothing
# outside the cluster has any business calling /v1 here.
#
# So the whole hostname goes behind SSO, which is both simpler and strictly
# safer than carving out an exception nothing needs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  annotations:
    # Closes a real monitoring gap. The `DGX Spark (Ollama)` probe in gatus
    # checks the BACKEND, so LiteLLM itself — the gateway every LLM call in the
    # cluster passes through — was unmonitored: if it died, nothing alerted and
    # the Spark probe stayed green. Gatus auto-generates an endpoint from this
    # annotation.
    gatus.home-operations.com/endpoint: |
      group: ai
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "LiteLLM"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-router-network"
    gethomepage.dev/description: "Inference gateway + spend"
  labels:
    # NOT optional. LiteLLM's admin UI authenticates with LITELLM_MASTER_KEY,
    # which is proxy-admin: it mints and revokes virtual keys and reads all
    # spend. Without this label the UI is reachable by anything on the LAN or
    # tailnet that knows the hostname, and the master key is the only thing
    # between a visitor and full control of every model route.
    #
    # Requires `ai` in kubernetes/apps/identity/authentik/app/referencegrant.yaml
    # — already present for hindsight. Without the grant the SecurityPolicy
    # cannot reference ak-outpost-sso-proxy and this label SILENTLY does nothing,
    # which fails open rather than closed.
    auth: authentik
spec:
  hostnames:
    - litellm.${SECRET_DOMAIN}
  # Internal gateway only. This proxy is the single point through which every
  # LLM call in the cluster flows, and its UI can re-route models and read spend
  # across all of them. There is no case for putting it on `external`.
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000
