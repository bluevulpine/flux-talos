---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # --- postgres-init (init container 01) ---
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .LiteLLM__Postgres__User }}"
        INIT_POSTGRES_PASS: "{{ .LiteLLM__Postgres__Password }}"
        INIT_POSTGRES_DBNAME: litellm
        # Superuser comes from the SHARED cloudnative-pg key so it lives in
        # exactly one place, never copied per-app.
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"

        # --- LiteLLM database ---
        # LiteLLM takes a DSN, so the password is percent-encoding-sensitive:
        # an `@`, `/`, `:` or `#` parses wrong and presents as a bad credential
        # rather than a malformed URL. LiteLLM__Postgres__Password is generated
        # constrained to [A-Za-z0-9] for exactly this reason — keep it that way
        # on rotation.
        DATABASE_URL: "postgresql://{{ .LiteLLM__Postgres__User }}:{{ .LiteLLM__Postgres__Password }}@${POSTGRES_HOST}:5432/litellm"

        # --- proxy credentials ---
        # Master key is the admin credential for the proxy: it creates virtual
        # keys and reads all spend. Consumers should each get their own virtual
        # key rather than sharing this one.
        LITELLM_MASTER_KEY: "{{ .LiteLLM__MasterKey }}"
        # Encrypts credentials LiteLLM persists to Postgres. Changing it after
        # anything has been written makes the stored ciphertext undecryptable,
        # so treat it as immutable once the database exists.
        LITELLM_SALT_KEY: "{{ .LiteLLM__SaltKey }}"

        # --- SSO (Authentik, generic OIDC) ---
        # Client credentials of the "Provider for LiteLLM" OAuth2 provider in
        # Authentik. These are ONLY the secret half: the endpoints, scopes and
        # attribute names are not sensitive and live in the HelmRelease.
        #
        # Why env vars and not the UI: the SSO settings page persists to the
        # database and refuses with "Set STORE_MODEL_IN_DB='True'". That flag is
        # deliberately false here (model routing is GitOps-managed in the
        # ConfigMap), and flipping it would make the DB the source of truth for
        # models too. Env-var SSO needs no such flag.
        GENERIC_CLIENT_ID: "{{ .LiteLLM__Sso__ClientId }}"
        GENERIC_CLIENT_SECRET: "{{ .LiteLLM__Sso__ClientSecret }}"

        # AZURE_API_BASE / AZURE_API_KEY were here, extracted from the shared
        # `azure-ai` key, to feed a fallback model member. Both were removed
        # with the member itself: that Azure subscription has no credits left
        # and returns 401 on every request, so the values were dead weight that
        # still had to be rotated. See the HelmRelease for the full reasoning
        # and what re-adding a fallback would take.
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: cloudnative-pg
