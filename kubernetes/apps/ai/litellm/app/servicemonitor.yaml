---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
spec:
  # LiteLLM serves /metrics on its app port only when `prometheus` is listed
  # under litellm_settings.success_callback (the `callbacks` key registers the
  # logger without mounting the endpoint, #2307) and the endpoint's own key
  # auth is off (`require_auth_for_metrics_endpoint: false`, default true in
  # v1.106.2); both in helmrelease.yaml. Before 2026-10-26 neither was set and
  # this cluster had no litellm_* series at all. Both replicas export, and
  # gauges such as litellm_provider_remaining_budget_metric are per process,
  # updated on each request that process handles, so rules take min/max across
  # pods rather than a sum. Same label note as hindsight's monitor: app-template
  # stamps the Service `app.kubernetes.io/service: <release>-<serviceKey>`, and
  # with the service key `app` that collapses to plain `litellm`. Prometheus here
  # runs serviceMonitorSelector: {}, so no `release:` label is needed.
  selector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/service: litellm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
