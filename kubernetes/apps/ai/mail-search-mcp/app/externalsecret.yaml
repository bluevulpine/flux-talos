---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Everything the server needs, from the bosun/ prefix the agent can write to:
#   bosun/mail-search-mcp     MCP_AUTH_TOKEN, the bearer LiteLLM presents (generated, 64 hex)
#   bosun/litellm-embed       the `mail-archiver-indexer` virtual key (spark-embed + spark-rerank only)
#   bosun/mail-archiver-api   the archive's read-only API key (get_mail)
#   bosun/mail-embeddings     the mail_embeddings role (same one the indexer uses)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mail-search-mcp-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        MCP_AUTH_TOKEN: "{{ .MCP_AUTH_TOKEN }}"
        LITELLM_API_KEY: "{{ .token }}"
        MAIL_ARCHIVE_TOKEN: "{{ .archive_token }}"
        MAIL_EMBEDDINGS_DB_USER: "{{ .MailEmbeddings__PostgresUser }}"
        MAIL_EMBEDDINGS_DB_PASS: "{{ .MailEmbeddings__PostgresPass }}"
  data:
    # The two `token` fields collide in one dataFrom, so the archive key is
    # pulled by name under its own alias.
    - secretKey: archive_token
      remoteRef:
        key: bosun/mail-archiver-api
        property: token
  dataFrom:
    - extract:
        key: bosun/mail-search-mcp
    - extract:
        key: bosun/litellm-embed
    - extract:
        key: bosun/mail-embeddings
