---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name wyoming-openai-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Per-app LiteLLM VIRTUAL key (alias `home-assistant-voice`, OpenBao
        # secret/litellm field LiteLLM__Keys__HomeAssistantVoice), minted
        # 2026-11-12 with models=["spark-stt","spark-tts"] and
        # max_parallel_requests=4.
        #
        # Scoped this tightly because Wyoming has no authentication at all:
        # whoever can reach the bridge's port speaks with this key. So it must
        # not be able to do more than transcribe and synthesise. Verified at
        # mint through LiteLLM: 200 on both speech routes, 403 on spark-main,
        # 401 on /key/generate. Do NOT substitute the older unrestricted
        # `HomeAssistant` key here.
        #
        # Rotate: /key/delete the alias, /key/generate with the same models,
        # `bao kv patch secret/litellm LiteLLM__Keys__HomeAssistantVoice=...`
        # (patch, never put: put replaces every field in the secret).
        STT_OPENAI_KEY: "{{ .LiteLLM__Keys__HomeAssistantVoice }}"
        TTS_OPENAI_KEY: "{{ .LiteLLM__Keys__HomeAssistantVoice }}"
  dataFrom:
    - extract:
        key: litellm
