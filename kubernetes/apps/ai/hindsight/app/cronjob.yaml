---
# Anthropic provider-failure detector (credit exhaustion + rate limiting).
#
# WHY THIS EXISTS AS A CRONJOB rather than a PrometheusRule: there is no metric
# to alert on. Hindsight's /metrics exposes only hindsight_async_operations,
# hindsight_consolidation_{backlog,failed}, db-pool and http series — nothing
# per-stage and nothing about LLM errors. Both incidents on 2026-09-07 hit
# `retain`, consolidation_failed stayed at 0 throughout, and the existing
# HindsightConsolidationFailing alert never fired for either. The failures are
# visible only in the API's own /llm-requests rows, so something has to read
# them.
#
# Credit exhaustion cannot be made proactive either. The Anthropic Admin API
# exposes members, workspaces, invites and keys — there is NO
# remaining-credit-balance endpoint, and no field on a request carries one. It
# is only ever observable after the fact.
#
# MATCH ON THE MESSAGE, NOT THE STATUS CODE. Credit exhaustion arrives as a 400
# (the same status as a malformed request), and rate limiting as a 429 — but
# keying on status alone would page for every unrelated 400. Each rule below
# matches a substring of the provider's error body instead.
#
# Two SEPARATE alerts, deliberately, because they mean different things and
# have different remedies: exhausted credits are terminal and need funds; a
# rate limit is transient, self-clears, and means "slow down". Merging them
# would produce an alert whose runbook is "it depends".
#
# Posts to Alertmanager's v2 API rather than to Pushover directly, so alerts
# inherit the existing routing, grouping, dedup and silences (Pushover is
# already the default receiver in alertmanagerconfig.yaml). endsAt is set ahead
# of the next run, so an alert self-resolves once its condition clears instead
# of needing a separate "all clear" path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hindsight-credit-alert
data:
  check.py: |
    """Scan every bank's recent LLM requests for provider-level failures."""
    import json
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request
    from datetime import datetime, timedelta, timezone

    API = os.environ["HINDSIGHT_API_URL"].rstrip("/")
    TOKEN = os.environ["HINDSIGHT_TOKEN"]
    ALERTMANAGER = os.environ["ALERTMANAGER_URL"].rstrip("/")
    WINDOW_MIN = int(os.environ.get("WINDOW_MINUTES", "20"))
    RESOLVE_MIN = int(os.environ.get("RESOLVE_MINUTES", "30"))

    # Each rule matches a substring of the provider's error body. `threshold` is
    # the number of matching ROWS in the window required to fire — note rows are
    # attempts, not logical operations: retain retries up to 4x, so ~4 rows can
    # be one failing retain.
    RULES = [
        {
            "needle": "credit balance is too low",
            "alertname": "HindsightAnthropicCreditsExhausted",
            "severity": "critical",
            # Terminal and self-inflicted-silence: nothing recovers on its own,
            # so one occurrence is worth waking up for.
            "threshold": 1,
            "what": "Anthropic credits are exhausted",
            "action": (
                "Top up at console.anthropic.com. Retain (extraction) is the only "
                "stage still on the Anthropic API and has NO fallback — the Azure "
                "failover was removed because retain's strict schema is "
                "incompatible with Azure's response_format — so extraction STOPS "
                "until credits are added. Consolidation and reflect keep running "
                "on Azure, but they have nothing new to work on."
            ),
        },
        {
            "needle": "rate_limit_error",
            "alertname": "HindsightAnthropicRateLimited",
            "severity": "warning",
            # Transient and self-clearing, so a handful of 429s during a heavy
            # ingest is normal and must not page. 20 rows in a 20m window is
            # sustained saturation: the 2026-09-07 incident ran ~79 rows/hour
            # (~26 per window) for an hour straight, which this catches, while a
            # brief burst of a few retries does not.
            "threshold": 20,
            "what": "Anthropic is rate-limiting Hindsight",
            "action": (
                "This is THROUGHPUT, not credits — the balance is fine. Usually "
                "self-clears. If sustained, lower "
                "HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT (currently 6) or reduce "
                "gitIngest depth on the busiest bank; the account limit that bit "
                "on 2026-09-07 was 80,000 output tokens/minute on Haiku."
            ),
        },
    ]

    def get(path):
        req = urllib.request.Request(
            f"{API}{path}", headers={"Authorization": f"Bearer {TOKEN}"}
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            return json.load(r)

    def banks():
        d = get("/v1/default/banks")
        items = d.get("items") or d.get("banks") or (d if isinstance(d, list) else [])
        return [b.get("id") or b.get("bank_id") for b in items if isinstance(b, dict)]

    def scan():
        """-> {rule_index: {bank: (row_count, {operations})}} for the window."""
        cutoff = datetime.now(timezone.utc) - timedelta(minutes=WINDOW_MIN)
        hits = {i: {} for i in range(len(RULES))}
        for bank in banks():
            if not bank:
                continue
            q = urllib.parse.quote(bank, safe="")
            try:
                rows = get(f"/v1/default/banks/{q}/llm-requests?limit=200").get("items") or []
            except urllib.error.URLError as e:
                print(f"warn: {bank}: {e}", file=sys.stderr)
                continue
            for r in rows:
                if r.get("status") == "success":
                    continue
                body = str(r.get("error") or r.get("error_message") or "")
                started = str(r.get("started_at") or "")[:19]
                if not started:
                    continue
                try:
                    when = datetime.fromisoformat(started).replace(tzinfo=timezone.utc)
                except ValueError:
                    continue
                if when < cutoff:
                    continue
                for i, rule in enumerate(RULES):
                    if rule["needle"] in body:
                        n, ops = hits[i].get(bank, (0, set()))
                        ops.add(r.get("operation") or "?")
                        hits[i][bank] = (n + 1, ops)
        return hits

    def main():
        hits = scan()
        payload = []
        for i, rule in enumerate(RULES):
            per_bank = hits[i]
            total = sum(n for n, _ in per_bank.values())
            if total < rule["threshold"]:
                continue
            detail = "; ".join(
                f"{b}: {n} rows ({','.join(sorted(ops))})"
                for b, (n, ops) in sorted(per_bank.items())
            )
            print(f"{rule['alertname']}: {detail}", file=sys.stderr)
            now = datetime.now(timezone.utc)
            payload.append(
                {
                    "labels": {
                        "alertname": rule["alertname"],
                        "severity": rule["severity"],
                        "namespace": "ai",
                        "service": "hindsight",
                    },
                    "annotations": {
                        "summary": f"{rule['what']} — {detail}. {rule['action']}"
                    },
                    "startsAt": now.isoformat(),
                    "endsAt": (now + timedelta(minutes=RESOLVE_MIN)).isoformat(),
                }
            )

        if not payload:
            print(f"ok: no provider failures over threshold in the last {WINDOW_MIN}m")
            return 0

        req = urllib.request.Request(
            f"{ALERTMANAGER}/api/v2/alerts",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                print(f"posted {len(payload)} alert(s): HTTP {r.status}")
        except (urllib.error.URLError, OSError) as e:
            # Deliberate non-zero: we DETECTED the condition but could not report
            # it, which is the one case that must not pass silently. A clean
            # message plus a failed Job (KubeJobFailed) is the escalation path —
            # an unhandled traceback would do the same thing far less legibly.
            print(f"FATAL: detected {len(payload)} condition(s) but Alertmanager POST failed: {e}",
                  file=sys.stderr)
            return 1
        # Exit 0 on a successfully-reported alert: a non-zero exit would ALSO trip
        # KubeJobFailed, double-paging for one condition and making a real script
        # bug indistinguishable from a detection.
        return 0

    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-credit-alert
spec:
  # Every 10 minutes. WINDOW_MINUTES is 20 — deliberately wider than the period,
  # so a run that is skipped or slow cannot open a hole the next run misses.
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          # Talks only to the Hindsight API and Alertmanager over HTTP; it has no
          # business holding a Kubernetes API token.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.14-alpine
              command:
                - "python3"
                - "/scripts/check.py"
              env:
                # `hindsight-api`, NOT `hindsight` — the chart splits the API and
                # the control plane into two Services (hindsight-api:8888 and
                # hindsight-controlplane:3000). There is no `hindsight` Service.
                - name: HINDSIGHT_API_URL
                  value: http://hindsight-api.ai.svc.cluster.local:8888
                - name: ALERTMANAGER_URL
                  value: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
                # Only the token, not envFrom the whole secret — that would also
                # mount the Postgres DSNs and both LLM keys into a pod that needs
                # none of them.
                - name: HINDSIGHT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hindsight-secret
                      key: HINDSIGHT_API_TENANT_API_KEY
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: hindsight-credit-alert
                defaultMode: 0555
