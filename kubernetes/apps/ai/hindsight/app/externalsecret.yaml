---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hindsight-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # --- postgres-init (init containers 01 and 02) ---
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Hindsight__Postgres__User }}"
        INIT_POSTGRES_PASS: "{{ .Hindsight__Postgres__Password }}"
        INIT_POSTGRES_DBNAME: hindsight
        # Superuser comes from the SHARED cloudnative-pg key, not per-app, so it
        # lives in exactly one place. Used to bootstrap the role/database and to
        # CREATE EXTENSION vector (see 02-init-vector in the HelmRelease).
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"

        # --- Hindsight database connections ---
        # Hindsight takes a DSN, not discrete host/user/pass fields — unlike
        # every other Postgres app here. That makes the password
        # percent-encoding-sensitive: an `@`, `/`, `:` or `#` in
        # Hindsight__Postgres__Password parses wrong and presents as a bad
        # credential, not as a malformed URL. Constrain the OpenBao generator to
        # [A-Za-z0-9]. See README.md.
        HINDSIGHT_API_DATABASE_URL: &dsn "postgresql://{{ .Hindsight__Postgres__User }}:{{ .Hindsight__Postgres__Password }}@${POSTGRES_HOST}:5432/hindsight"
        # Migrations get their own connection so a saturated app pool cannot
        # wedge them.
        HINDSIGHT_API_MIGRATION_DATABASE_URL: *dsn
        # Recall is read-only and is the hot path — send it to the replicas.
        # ${POSTGRES_HOST_RO} was added to cluster-settings.yaml for this app;
        # hardcoding postgres18-ro here would break the next major-version
        # cutover silently, which is the whole reason ${POSTGRES_HOST} exists.
        HINDSIGHT_API_READ_DATABASE_URL: "postgresql://{{ .Hindsight__Postgres__User }}:{{ .Hindsight__Postgres__Password }}@${POSTGRES_HOST_RO}:5432/hindsight"

        # --- credentials ---
        # Every stage now talks to the in-cluster LiteLLM gateway instead of a
        # vendor endpoint, so one base URL and one key replace three sets. The
        # Anthropic key this used to carry (Hindsight__Llm__ApiKey) is left in
        # OpenBao untouched but is no longer read here — that balance is spent,
        # which is what forced this migration.
        #
        # &llmBase is the OpenAI-compatible surface; LiteLLM appends
        # /chat/completions to it. Same-namespace, but spelled fully qualified
        # so it does not silently resolve differently if Hindsight ever moves.
        HINDSIGHT_API_LLM_BASE_URL: &llmBase "http://litellm.ai.svc.cluster.local:4000/v1"
        # This is LiteLLM's MASTER key, which is proxy-admin: it can mint and
        # revoke virtual keys and read all spend. That is more authority than
        # Hindsight needs, and the right end state is a per-consumer virtual key.
        # It is deliberately not done yet: virtual keys live only in LiteLLM's
        # Postgres, so a key stored in OpenBao would silently stop working if
        # that database were ever rebuilt, and nothing in git would explain why.
        # The master key is derivable from OpenBao alone and always valid.
        # Update: the second consumer arrived. karakeep, n8n, node-red,
        # homebox-companion (and mealie, via its UI) now each hold their own
        # restricted virtual key. Hindsight is the ONLY remaining master-key
        # consumer -- it is the sole in-house service with no user-editable
        # code path that could read its environment. Moving it to a virtual
        # key too is now a small, optional hardening step. Virtual keys are
        # safe to depend on: they live in the CNPG-backed litellm database.
        HINDSIGHT_API_LLM_API_KEY: &llmKey "{{ .LiteLLM__MasterKey }}"
        # ONE key, cluster-admin-equivalent. It grants full read AND WRITE across
        # every bank — there is no per-consumer isolation (ApiKeyTenantExtension
        # resolves every authenticated request to one hardcoded schema). Write is
        # the dangerous half: recalled memories are injected directly into the
        # prompt of a Claude Code session holding kubectl, so a planted memory is
        # a persistent prompt-injection channel with a multi-week fuse. Rotate on
        # the same footing as a cluster-admin credential.
        HINDSIGHT_API_TENANT_API_KEY: "{{ .Hindsight__TenantApiKey }}"
        # The control plane proxies to the dataplane with the SAME key. This is
        # why the UI needs Authentik in front of it — the API key does not
        # protect it; it is what makes the UI fully authenticated to anyone who
        # reaches it.
        HINDSIGHT_CP_DATAPLANE_API_KEY: "{{ .Hindsight__TenantApiKey }}"

        # --- consolidation + reflect: same LiteLLM gateway ---
        # Both stages ran on Azure until its credits were exhausted and every
        # call started returning 401. They now point at the same gateway as the
        # global slot above; per-stage MODEL selection still happens in the
        # HelmRelease, which is where that reasoning lives.
        #
        # These are still spelled out per stage rather than left to inherit,
        # because Hindsight resolves each operation's slot INDEPENDENTLY: an
        # unset REFLECT_ or CONSOLIDATION_ key falls back to the global slot
        # rather than to its neighbour. That is harmless while all three point
        # at the same place, but it is exactly the kind of implicit coupling
        # that breaks quietly the moment one stage is moved elsewhere — which is
        # a live possibility here, since reflect is the stage most likely to be
        # split onto a faster backend if it starts missing its 25s cap.
        HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY: *llmKey
        HINDSIGHT_API_CONSOLIDATION_LLM_BASE_URL: *llmBase
        HINDSIGHT_API_REFLECT_LLM_API_KEY: *llmKey
        HINDSIGHT_API_REFLECT_LLM_BASE_URL: *llmBase

        # There were HINDSIGHT_API_RETAIN_LLM_1_{API_KEY,BASE_URL} here for an
        # Azure retain failover member. Removed with the member itself — it
        # 400'd on all 73 of its calls because retain's strict schema is
        # incompatible with Azure's `response_format`; see the HelmRelease for
        # the full reason and what a working fallback would need.
        #
        # If a member is ever re-added: API_KEY is REQUIRED for the openai
        # provider (config.py:2346 raises at config load without it, taking the
        # whole API down), so restore both lines in the same change as the
        # _1_PROVIDER line — never one without the other.
  dataFrom:
    - extract:
        key: hindsight
    - extract:
        key: cloudnative-pg
    # `azure-ai` was extracted here for the reflect/consolidation credentials.
    # Dropped with them — that subscription has no credits left. The key itself
    # stays in OpenBao, but the only remaining reader is mealie, whose OPENAI_*
    # env vars are INERT anyway (its AI config moved into per-group DB tables);
    # karakeep, n8n, node-red and homebox-companion have since been migrated to
    # this same gateway.
    - extract:
        key: litellm
