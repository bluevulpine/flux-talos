---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hindsight
spec:
  groups:
    - name: hindsight.rules
      rules:
        # Gatus also watches this host, but do NOT count that as paging cover:
        # every annotation-based Gatus endpoint in this repo sets only `group:`,
        # and only the four hand-written endpoints in
        # observability/gatus/app/resources/config.yaml declare pushover alerts.
        # Treat Gatus as a dashboard tile; these rules do the paging.
        - alert: HindsightDown
          annotations:
            summary: >-
              Hindsight has no ready replicas — agent memory recall and retain
              are both offline (the worker is a separate Deployment, see
              HindsightWorkerDown). Check `kubectl logs -n ai deploy/hindsight -c
              api`. Most likely causes: postgres18 unreachable (readiness probes
              /health, which acquires a DB connection), the pgvector extension
              missing (02-init-vector failed), or connection-pool exhaustion.
          expr: |
            kube_deployment_status_replicas_ready{namespace="ai", deployment="hindsight"} == 0
          for: 15m
          labels:
            severity: critical

        # The worker is its own Deployment since the api/worker split, and the
        # API staying up says nothing about it. With the worker down the API
        # still accepts retains and answers recall, so nothing looks wrong from
        # a client -- the queue just grows. HindsightRetainBacklog would catch
        # that eventually (50 queued for 30m); this names the cause sooner.
        - alert: HindsightWorkerDown
          annotations:
            summary: >-
              The Hindsight worker has no ready replica — retain extraction,
              consolidation and mental-model refresh are stopped while the API
              keeps accepting work. Check `kubectl logs -n ai
              deploy/hindsight-worker`. It runs no migrations, so right after a
              version bump it can crash-loop until an API pod has migrated.
          expr: |
            kube_deployment_status_replicas_ready{namespace="ai", deployment="hindsight-worker"} == 0
          for: 15m
          labels:
            severity: warning

        # A Deployment whose image can't be pulled never becomes ready, so
        # HindsightDown WILL eventually fire — but ImagePullBackOff does not trip
        # the pod-failure alert (docs/runbooks/flux-image-automation.md, Gotcha
        # 3), and this names the cause directly. Not optional for a 1.42 GB image
        # behind the Nexus pull-through mirror.
        - alert: HindsightImagePullFailing
          annotations:
            summary: >-
              Hindsight pod {{ $labels.pod }} can't pull its image
              ({{ $labels.reason }}). Check the image refs in
              kubernetes/apps/ai/hindsight/app/helmrelease.yaml and the Nexus
              pull-through mirror.
          expr: |
            kube_pod_container_status_waiting_reason{namespace="ai", pod=~"hindsight-.*", reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"} > 0
          for: 15m
          labels:
            severity: critical

        # The failure mode neither alert above catches: pod 1/1 Running, retains
        # failing, memory silently frozen. Gated on
        # HINDSIGHT_API_METRICS_BACKLOG_ENABLED: "true" in the HelmRelease.
        # Gauge is refreshed every 30s by a background task
        # (BACKLOG_METRICS_REFRESH_SECONDS), so a 30m window is many samples.
        #
        # SERIES NAMES VERIFIED against the running pod on 2026-09-07, with one
        # caveat. hindsight_consolidation_backlog and _failed were both observed
        # on /metrics. hindsight_async_operations was NOT -- correctly so: it is
        # an observable gauge whose callback iterates _async_ops_counts, so with
        # nothing retained yet it yields no observations and prometheus_client
        # emits no series at all. It appears on the first retain.
        #
        # The name is still right. The exporter maps `.` to `_` and appends the
        # unit ONLY when unhyphenated -- compare hindsight_llm_tokens_input_tokens_total
        # (unit "tokens") against hindsight_consolidation_backlog (unit
        # "{memories}", no suffix). async_operations declares "{operations}", the
        # same braced form as the two that were confirmed, so it takes no suffix
        # either.
        #
        # Note the image ships NO wget and NO curl. To re-check, use its Python:
        # (The worker serves the same endpoint on :8889.)
        #   kubectl -n ai exec deploy/hindsight -c api -- python -c \
        #     "import urllib.request; print(urllib.request.urlopen(
        #      'http://localhost:8888/metrics').read().decode())" | grep ^hindsight_
        - alert: HindsightRetainBacklog
          annotations:
            summary: >-
              Hindsight has {{ $value | printf "%.0f" }} operations stuck in
              pending/processing for 30m — retains are queuing, not completing,
              and memory is going stale while the pod reads healthy — recall
              makes no LLM call, so it keeps working while retain cannot. Check
              the LLM path first: gatus "DGX Spark (vLLM)" and vLLM's /health on
              10.0.10.237:8000, then LiteLLM (`kubectl logs -n ai deploy/litellm`),
              then `kubectl logs -n ai deploy/hindsight-worker | grep -i llm` (LLM
              work runs in the worker, not the API).
              spark-setup's tools/hindsight_trends.sh tells hindsight-side
              queueing from a slow backend. Then the worker.
          expr: |
            max(sum by (pod) (hindsight_async_operations{namespace="ai", status=~"pending|processing"})) > 50
          for: 30m
          labels:
            severity: warning

        # A job claimed by a worker that will never finish it. If hindsight loses
        # its DB connection while a job's LLM call is in flight, the job fails
        # but cannot record that, so the row stays `processing` with no worker
        # behind it; hindsight never reclaims it, and every later job for that
        # bank (or conversation) is serialised behind it. Seen 2026-10-01: two
        # spark-setup jobs, ~40h, 12 jobs blocked -- invisible to
        # HindsightRetainBacklog (> 50) because the rest of the queue drained.
        #
        # Metric: CNPG custom query in
        # database/cloudnative-pg/cluster18/monitoring-hindsight.yaml (primary
        # only, so max() across instances). 3h: a legitimate job is one or a
        # few LLM calls capped at 16k output tokens, minutes each, and the
        # longest consolidation seen after the cap was well under an hour.
        - alert: HindsightOperationStuck
          annotations:
            summary: >-
              A hindsight job has been `processing` for
              {{ $value | humanizeDuration }} -- almost certainly orphaned (its
              worker lost the DB mid-job), and every later job for that bank is
              queued behind it. Find it:
              `select operation_id, bank_id, operation_type, claimed_at from
              async_operations where status='processing' order by claimed_at`
              (database hindsight on the postgres18 primary). Check
              `kubectl -n ai logs deploy/hindsight-worker | grep <operation_id>`
              ends in DB errors rather than live WORKER_TASK lines, then
              requeue it: `update async_operations set status='pending',
              worker_id=null, claimed_at=null, updated_at=now() where
              operation_id='<id>' and status='processing'`.
          expr: |
            max(cnpg_hindsight_async_ops_oldest_age_seconds{namespace="database", status="processing"}) > 3 * 3600
          for: 15m
          labels:
            severity: warning

        # HindsightOperationStuck reads a series that only exists while the CNPG
        # custom query succeeds. A hindsight upgrade that renames
        # async_operations, status or claimed_at, or a move of the hindsight
        # database, would make it vanish and the alert above go quietly blind --
        # the original failure all over again. The VALUES join keeps the series
        # present at 0 on an empty queue, so absence means the query is broken.
        # 1h rides out a primary failover.
        - alert: HindsightOperationAgeMetricMissing
          annotations:
            summary: >-
              cnpg_hindsight_async_ops_oldest_age_seconds is missing, so
              HindsightOperationStuck cannot fire. Check the postgres18 primary's
              instance-manager log for the hindsight_async_ops query error.
              "permission denied" means the column grant to
              cnpg_metrics_exporter is gone (table recreated by a hindsight
              migration) -- re-apply it from the comment in
              database/cloudnative-pg/cluster18/monitoring-hindsight.yaml.
              Otherwise compare that query with hindsight's current
              async_operations schema.
          expr: |
            absent(cnpg_hindsight_async_ops_oldest_age_seconds{namespace="database", status="processing"})
          for: 1h
          labels:
            severity: warning

        # Consolidation fires after every retain and dedups against the whole
        # bank. Permanent failures are recoverable via the consolidation recovery
        # endpoint, but nothing retries them on its own beyond the 300s reconcile
        # sweep, so a non-zero count that persists is a real backlog.
        - alert: HindsightConsolidationFailing
          annotations:
            summary: >-
              Hindsight has {{ $value | printf "%.0f" }} memories whose
              consolidation permanently failed — the observation layer that
              recall reads is falling behind the raw memories. Recoverable via
              the consolidation recovery endpoint; check LLM errors at
              /llm-requests first.
          expr: |
            max(sum by (pod) (hindsight_consolidation_failed{namespace="ai"})) > 0
          for: 1h
          labels:
            severity: warning
