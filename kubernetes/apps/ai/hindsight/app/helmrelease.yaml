---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hindsight
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      hindsight:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        # Recreate, not RollingUpdate: the model-cache PVC is RWO, so a rolling
        # update would deadlock on the new pod waiting for a volume the old pod
        # still holds. Scaling past one replica additionally requires
        # HINDSIGHT_API_MCP_STATELESS: "true" — noted so a future scale-up does
        # not silently break MCP sessions.
        strategy: Recreate
        initContainers:
          # Creates the hindsight role and database as the superuser, then grants
          # the role ownership. Idempotent; safe on every restart.
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: rolling
            envFrom: &envFrom
              - secretRef:
                  name: hindsight-secret
            securityContext: &hardened
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
          # Hindsight's own migrations TRY to create the extension
          # (migrations.py:_ensure_pgvector_extension_in_public) but that attempt
          # fails for the app role: pgvector is NOT a PostgreSQL "trusted"
          # extension (vector.control at 0.8.1 has no `trusted = true`), so a
          # non-superuser cannot CREATE EXTENSION vector. It surfaces as
          # "pgvector extension is required but not installed" and is the single
          # most likely thing to break a naive first deploy.
          #
          # Same image as 01 — it ships psql. Runs as the superuser against the
          # database 01 just made. Idempotent.
          02-init-vector:
            dependsOn: 01-init-db
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: rolling
            envFrom: *envFrom
            command:
              - "/bin/sh"
              - "-c"
            args:
              # $$ escapes each ${VAR}: these are runtime shell vars from the
              # secret, not Flux postBuild substitutions. kustomize-controller
              # runs envsubst over this whole manifest and since Flux v2.9.0 an
              # unmapped ${VAR} fails hard. $$ makes Flux emit a literal ${VAR}
              # for the shell to expand at container runtime.
              - |
                PGPASSWORD="$${INIT_POSTGRES_SUPER_PASS}" psql \
                  -h "$${INIT_POSTGRES_HOST}" -U postgres -d "$${INIT_POSTGRES_DBNAME}" \
                  -c 'CREATE EXTENSION IF NOT EXISTS vector;'
            securityContext: *hardened
        containers:
          api:
            image:
              repository: ghcr.io/vectorize-io/hindsight-api
              # PRE-1.0. Renovate calls 0.9.x -> 0.10.x a "minor", which reads as
              # routine; upstream may mean "breaking". Migrations run on startup
              # (HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP defaults true) and are
              # one-way, and CNPG PITR cannot restore this database alone — it
              # restores the whole cluster, dragging all ~34 databases with it.
              # Before merging any bump past the patch digit:
              #   kubectl -n database exec postgres18-1 -- \
              #     pg_dump -U postgres -Fc hindsight > hindsight-<ver>.dump
              #
              # No `# renovate:` annotation on purpose — app-template nested
              # images are detected natively (n8n carries none and has nine bump
              # PRs), and doubling up risks duplicate PRs.
              #
              # The FULL image, not -slim: it loads the BGE embedder and the
              # MiniLM cross-encoder reranker in-process, so embeddings and
              # reranking need no external service and no API key. -slim forces
              # both onto remote providers or in-cluster TEI — that is the
              # scale-out path, not the starting point.
              tag: 0.10.1
            envFrom: *envFrom
            env:
              TZ: "${TIMEZONE}"
              HINDSIGHT_API_HOST: 0.0.0.0
              # Set explicitly on upstream's advice: if enableServiceLinks were
              # ever true, Kubernetes would inject HINDSIGHT_API_PORT as
              # "tcp://<ip>:8888" from the hindsight-api Service and the app
              # would fail to parse its own port. app-template defaults
              # enableServiceLinks to false, so this is belt-and-braces.
              HINDSIGHT_API_PORT: &apiPort 8888
              # At one replica the upstream worker StatefulSet (whose whole point
              # is deriving a stable worker id from a pod ordinal) buys nothing.
              # Set the id statically and let the API run its in-process worker.
              HINDSIGHT_API_WORKER_ID: hindsight

              # --- auth: NOT optional ---
              # Without this, /v1 and /mcp are unauthenticated and anything on
              # the LAN can read and write every agent's memory. Note the name
              # oversells it: this is single-tenant bearer auth. authenticate()
              # compares one expected key and returns one hardcoded schema for
              # every request — there is NO per-consumer isolation, so banks are
              # a naming convention, not a boundary.
              HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension

              # --- connection pool: cap it ---
              # postgres18 runs max_connections=400 across ~34 databases, no app
              # here sets a client pool size, and there is no pgbouncer/Pooler.
              # Hindsight's default DB_POOL_MAX_SIZE is 100 — a quarter of the
              # entire cluster budget for one evaluation pod. The exhaustion mode
              # is self-obscuring: /health acquires a connection, so on pool
              # exhaustion readiness AND liveness fail and the pod restarts,
              # reading as an app bug while Authentik and Immich start failing to
              # connect first and point the investigation elsewhere.
              HINDSIGHT_API_DB_POOL_MIN_SIZE: "2"
              HINDSIGHT_API_DB_POOL_MAX_SIZE: "20"
              HINDSIGHT_API_READ_DB_POOL_MAX_SIZE: "10"

              # --- retention ---
              # KEEP the raw text: it is the provenance copy, the thing that lets
              # you judge whether a recalled fact is right — which the
              # zero-wrong-facts exit criterion depends on. Reversible at the
              # Phase 1 gate, though flipping it will not retroactively purge
              # what is already stored.
              HINDSIGHT_API_STORE_DOCUMENT_TEXT: "true"
              # But do NOT keep a second, accidental copy. Terminal operation
              # rows carry the full retain payload and default to being kept
              # FOREVER (0 = no pruning) — that is the same transcript again, as
              # a debug artifact, replicated across three CNPG instances and
              # swept offsite. 14d is enough to debug a failed retain.
              HINDSIGHT_API_OPERATION_RETENTION_DAYS: "14"
              # Surface silently-dropped facts instead of marking the retain
              # completed.
              HINDSIGHT_API_FAIL_ON_EXTRACTION_ERRORS: "true"

              # --- LLM ---
              # recall makes NO LLM call — it is pure retrieval, so the hot read
              # path costs no tokens regardless of what is set here. retain and
              # reflect do, and auto-consolidation (on by default) fires an extra
              # call after every retain, delete and update.
              #
              # Anthropic, not Gemini, and NOT the `nous` provider despite Nous
              # being the one vendor already paid for. `nous` cannot take a
              # static key: nous_llm.py ignores api_key entirely and reads a
              # ROTATING JWT from ~/.hermes/auth.json, which nous_auth.py writes
              # back on refresh and which permanently fails if a rotated token is
              # replayed (`refresh_token_reused`). It is built to share a home
              # directory with a local Hermes — a same-HOST assumption; our
              # Hermes is a separate pod in `develop` on its own RWO PVC. That is
              # the same headless-OAuth objection that rules out the
              # `claude-code` provider, so it rules out `nous` too.
              #
              # Was `anthropic` / claude-haiku-4-5, chosen on price when the
              # argument was $1/$5 per Mtok. That argument is void: the Anthropic
              # credit balance is spent, so every retain call was failing. The
              # Azure credits funding reflect and consolidation below are spent
              # too, which means EVERY Hindsight stage was down, not just this
              # one — there is no working baseline this change can regress.
              #
              # Now points at the in-cluster LiteLLM gateway, which routes to
              # Ollama on the DGX Spark. Provider is `openai` because that is
              # the OpenAI-compatible surface LiteLLM exposes; `spark-gpt-oss-20b`
              # is a LiteLLM model_name, not an Ollama tag, so the backend can be
              # swapped (Ollama -> vLLM) without touching this file.
              #
              # Retain is the stage that decides what becomes a durable belief,
              # so its schema conformance was verified before this move rather
              # than assumed: FactExtractionResponse — nested $defs/$ref, an
              # array of objects, an enum and four nullable anyOf fields — was
              # sent through this exact path and came back valid, with all six
              # required ExtractedFact fields present and the fact_type enum
              # respected. That is the same schema that 400'd on ALL 73 calls
              # when an Azure retain member was tried; Ollama enforces it with
              # llama.cpp grammar constraints rather than Azure's response_format.
              #
              # Known quality gap to watch: the model omits every OPTIONAL field
              # (entities, fact_kind, causal_relations, occurred_start). That is
              # schema-legal, but `entities` feeds retrieval, so if recall
              # degrades this is the first thing to check — it is a model/prompt
              # weakness, not a transport problem.
              #
              # A non-reasoning model was evaluated for this stage and REJECTED
              # on evidence. qwen2.5:14b-instruct was run against the real
              # FactExtractionResponse schema alongside gpt-oss and the result
              # was not close:
              #   gpt-oss:20b   7 facts, valid, all required fields, 0 reasoning chars
              #   qwen2.5:14b   4 facts, valid, all required fields, 0 reasoning chars
              # Neither populated `entities` on a single fact, so swapping the
              # model does NOT close the gap above — it is the prompt or the
              # field being schema-optional, not the model's capability.
              #
              # The premise for switching was also wrong. gpt-oss is a reasoning
              # model, but on this constrained-extraction call it emitted ZERO
              # reasoning tokens; it reasons for open-ended work, not for grammar
              # -constrained output. The reasoning tax that justifies a
              # non-reasoning model elsewhere does not exist on this stage.
              # qwen2.5 remains available as `spark-qwen25-14b` if this changes.
              HINDSIGHT_API_LLM_PROVIDER: openai
              HINDSIGHT_API_LLM_MODEL: spark-gpt-oss-20b

              # --- retain concurrency: bounded against the account rate limit ---
              # DEFAULT_LLM_MAX_CONCURRENT is 32 (config.py:1126), i.e. up to 32
              # simultaneous Haiku calls. That never mattered while gitIngest was
              # "message", but the Fiction bank moved to "full" on 2026-09-07 —
              # every commit diff now goes through retain — and 32-way
              # concurrency immediately saturated the account limit:
              #   RateLimitError 429 "would exceed your rate limit of 80,000
              #   output tokens per minute (model: claude-haiku-4-5)"
              # 79 retain errors on that bank in about an hour.
              #
              # Retain is async (Stop hook, and the deepen engine's git ingest is
              # progressive and bounded per run), so trading concurrency for a
              # clean run costs wall-clock and nothing else. 6 is well under the
              # limit for Haiku's output sizes while still keeping the worker
              # busy; raise it only alongside an account limit increase.
              #
              # NOTE this is the RATE limit, not the credit balance — the
              # credit-exhaustion CronJob (cronjob.yaml) matches on the
              # "credit balance is too low" message and correctly stays silent
              # for a 429. Throughput exhaustion is currently unmonitored.
              #
              # 6 SURVIVES the move to the Spark, but the constraint behind it
              # changed completely: there is no account rate limit any more, only
              # how many requests Ollama will serve at once, capped by
              # OLLAMA_NUM_PARALLEL.
              #
              # That makes the three stages share ONE fixed pool, so they have to
              # be budgeted together — capping retain alone is not enough. Every
              # unset stage falls back to DEFAULT_LLM_MAX_CONCURRENT, which is 32
              # (config.py:1126), so consolidation or reflect could each saturate
              # the whole pool on their own no matter what this line says.
              # Consolidation is the highest-volume stage by far (~700 of 997
              # calls on 2026-09-07), which makes that the likely one to do it.
              #
              # Budget, against OLLAMA_NUM_PARALLEL=4 on the Spark:
              #     retain 2 + consolidation 1 + reflect 1 = 4
              #
              # This was 6+2+2=10, sized from a synthetic sweep with a ~6k-token
              # prompt that showed 10-way concurrency holding per-request latency
              # under 24s. That measurement did not survive contact with the real
              # workload: hindsight runs at 32k context, and at 10 slots actual
              # requests took 2-6 MINUTES, blew their wall timeouts, and became
              # PERMANENT failures. Fewer slots that finish beat more that do not.
              # It sums to exactly the pool on purpose. Reflect is the stage that
              # must never queue — it has a hard 25s client cap it cannot
              # negotiate, and a slow queue there is indistinguishable from an
              # outage — so it gets a reserved share rather than whatever is
              # left over.
              #
              # Raising any of these three requires raising OLLAMA_NUM_PARALLEL
              # first, and that lives on the Spark in
              # /etc/systemd/system/ollama.service.d/override.conf, NOT in this
              # repo. That gap is real — nothing here reconciles it.
              # --- timeouts: raised for local inference ---
              # DEFAULT_LLM_TIMEOUT is 120s (config.py:1130), which was sized
              # against hosted APIs answering in seconds. It is too short here,
              # and the failure is not a retry -- it is permanent data loss.
              # DEFAULT_WORKER_MAX_RETRIES is 3, after which poller.py:890 sets
              # status='failed' with completed_at, and the poller only ever
              # claims status='pending' (poller.py:458). Nothing re-queues a
              # failed operation, ever.
              #
              # Measured while the Spark was draining its backlog: a real retain
              # extraction took 82.7s wall, and a trivial 60-token generation
              # reached 89s under contention. Against a 120s ceiling that is not
              # headroom, it is a coin flip -- and 10 refresh_mental_model plus 3
              # consolidation operations were observed going PERMANENTLY failed
              # inside one 30-minute window because of it.
              #
              # 600s is deliberately generous rather than tuned. Every stage
              # behind this is asynchronous: retain runs off the Stop hook,
              # consolidation and refresh_mental_model are background work, and
              # nothing user-facing blocks on any of them. A request that takes
              # four minutes costs only wall-clock; one killed at 120s costs the
              # work already done, two more attempts, and then the memory itself.
              #
              # This deliberately covers reflect too. Reflect's interactive path
              # is capped client-side at 25s regardless, but the SAME slot serves
              # refresh_mental_model, which is background and uncapped -- and
              # which accounts for 22,338 of the failed operations in the table.
              # Timing those out to protect a client cap that does not apply to
              # them is how that number got so large.
              HINDSIGHT_API_LLM_TIMEOUT: "600"
              # Raising LLM_TIMEOUT alone is NOT enough, and leaving this at its
              # default makes the pair incoherent. REFLECT_WALL_TIMEOUT is a
              # deadline on the WHOLE reflect operation (DEFAULT 300s,
              # config.py:1810), separate from the per-request LLM_TIMEOUT above
              # -- so at 600/300 a single slow call could consume the entire
              # operation budget and still be killed. Observed directly:
              # "Reflect operation timed out after 300 seconds" was the actual
              # error behind the refresh_mental_model failures, not a per-request
              # timeout at all.
              #
              # Retain and consolidation already have generous wall limits
              # (RETAIN_WALL_TIMEOUT 3600, CONSOLIDATION_WALL_TIMEOUT 7200);
              # reflect is the uniquely tight one because its default assumes a
              # waiting caller. refresh_mental_model shares the slot and has no
              # such caller.
              # 1800 was still too low -- measured, not guessed. Over 8h of
              # local operation:
              #   refresh_mental_model  73 completed, avg 1884s, max 4346s
              #                          3 FAILED at exactly 1801-1802s
              #   consolidation          5 completed, avg 6545s, max 8756s
              #                            (default cap is 7200 -- already exceeded)
              #   retain                 1 completed 1127s, 1 FAILED at exactly 3600s
              #                            (i.e. exactly its default cap)
              # The failures land on the caps to the second, and the AVERAGE
              # successful mental-model refresh exceeded the 1800 cap. Every wall
              # limit here was sized for hosted inference answering in seconds.
              #
              # The three are NOT enforced the same way, which is why a
              # consolidation could complete at 8756s under a 7200s "cap":
              #  - REFLECT self-bounds INSIDE the engine
              #    (memory_engine.py:14462 passes timeout=wall_timeout), so it is
              #    a preemptive kill and the deadline is exact — that is why the
              #    error reads "Reflect operation timed out after 300 seconds"
              #    and why the failures sit at 1801s, not 1850s.
              #  - RETAIN and CONSOLIDATION are a poller-side _WallCeiling
              #    (poller.py:82) checked BETWEEN polls, so an operation that
              #    finishes before the poller looks again survives past it.
              # Treat the reflect number as a hard deadline and the other two as
              # approximate. It also means reflect is the one where being too
              # tight is guaranteed to destroy work rather than merely likely to.
              #
              # All three are raised well past the observed maximum rather than
              # trimmed to fit it, because the cost is asymmetric: these are
              # background operations that block nothing, and a wall-timeout
              # failure is PERMANENT (poller.py:890 sets status='failed', and only
              # status='pending' is ever claimed). Slow costs wall-clock; a cap
              # costs the memory.
              #
              # Durations should fall as the backlog drains -- they are inflated
              # by a saturated box at concurrency 4. Revisit if they stay high
              # once the queue is empty.
              HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "10800"
              HINDSIGHT_API_RETAIN_WALL_TIMEOUT: "10800"
              HINDSIGHT_API_CONSOLIDATION_WALL_TIMEOUT: "21600"

              HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: "2"
              HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: "1"
              HINDSIGHT_API_REFLECT_LLM_MAX_CONCURRENT: "1"

              # --- retain batching: OFF, and it has to be ---
              # This was "true" to buy Anthropic's Message Batches API discount:
              # half price on input and output, stacking with prompt caching
              # because every item in a retain batch shares the fact-extraction
              # system prompt. That reasoning is now entirely void. Retain runs
              # on hardware we own, where there is no per-token price to halve,
              # so batching buys NOTHING and still costs the latency.
              #
              # It would also break the pod outright. The old comment here
              # carried its own warning — "⚠️ FAILS CLOSED AT STARTUP.
              # validate_retain_batch_support() runs during initialization
              # (memory_engine.py:4654), so a retain LLM that cannot serve a
              # batch stops the pod booting rather than falling back. Re-check
              # this line before changing the retain provider." This change is
              # exactly that provider change, and the check comes back negative:
              # Ollama returns 404 on /v1/batches. LiteLLM answers /v1/batches
              # and /v1/files with empty lists, so a shallow probe could even
              # pass while real submission fails — not a risk worth taking when
              # the failure mode is "pod does not boot".
              #
              # (LiteLLM did gain batch support in PR #41942, merged 2026-09-19,
              # but it targets the `hosted_vllm` provider and requires
              # STORE_MODEL_IN_DB=True, which the LiteLLM chart deliberately sets
              # false to keep routing declarative in git. So this is not a
              # near-term flip even after a move to vLLM.)
              #
              # Upside of turning it off: retain memories land seconds after a
              # session instead of minutes, since the engine no longer polls a
              # batch job every 60s.
              HINDSIGHT_API_RETAIN_BATCH_ENABLED: "false"

              # A retain failover member to Azure was tried here on 2026-09-07
              # and REMOVED the same evening: it never worked, and it made
              # failures worse rather than better. Do not re-add it as written.
              #
              # Every one of its 73 calls failed with:
              #   400 Invalid schema for response_format 'response':
              #   context=('properties','labels'), $ref cannot have keywords
              #   {'description'}
              # HINDSIGHT_API_LLM_STRICT_SCHEMA (set true below, deliberately)
              # sends a strict JSON schema whose $ref carries a sibling
              # `description`. Anthropic accepts it because its structured
              # output goes through a forced tool_use tool; Azure OpenAI's
              # strict `response_format` rejects it outright. So when Haiku
              # rate-limited, retain failed over and 400'd every time — burning
              # a second attempt per failure instead of absorbing anything.
              #
              # This is a property of retain's SCHEMA plus strict mode, not of
              # gpt-4o: gpt-5-mini would have failed identically, which is why
              # consolidation and reflect ran fine on Azure while retain could
              # not. (Retain's schema now runs fine on the Spark — Ollama enforces
              # it as a grammar rather than via Azure's response_format — so this
              # paragraph is history, not a live constraint.)
              # HINDSIGHT_API_LLM_STRUCTURED_OUTPUT_FORCED_TOOL does not rescue
              # it either — that option only applies to the LiteLLM-backed
              # providers (litellm, litellmrouter, bedrock), not plain `openai`.
              #
              # A real fallback needs one of: strict schema off (regresses
              # retain/consolidation into parse-retry storms — see the
              # STRICT_SCHEMA comment below), a litellm-routed member with the
              # forced-tool option, or an Anthropic-compatible second endpoint.
              # --- reflect -> DGX Spark via LiteLLM ---
              # This slot is NOT just the user-invoked `reflect` tool. It also
              # serves `refresh_mental_model` and `mental_model_delta_ops`, which
              # fire AUTOMATICALLY after consolidation, and that half dominates:
              # measured 2026-09-07 on the flux-talos bank, 232 calls and
              # 1,646,763 input tokens in ~2h against 3 user-invoked reflects.
              # Volume here scales with consolidation, not with how often anyone
              # asks a question. That is the durable lesson; the dollar figures
              # it was originally written around are moot now that the stage runs
              # on hardware we own.
              #
              # WATCH THIS ONE: reflect is an agentic tool-calling loop
              # (stage=llm.*.reflect_tool_call), not consolidation's single
              # structured call, so it leans harder on the model than its volume
              # suggests. It is the stage most likely to need a different model
              # from the other two.
              HINDSIGHT_API_REFLECT_LLM_PROVIDER: openai
              # Was gpt-5-mini, and REASONING_EFFORT: low did not save it.
              # gpt-5-mini is a REASONING model, and the session-start reflect
              # runs inside a UserPromptSubmit hook that the plugin caps at
              # 25.0s (HOOK_REFLECT_CAP_MS in claude-hook.js). That cap is a
              # hard constant applied as min(reflectTimeoutMs, 25_000), so
              # reflectTimeoutMs in ~/.hindsight/coding-agent.json can only
              # LOWER it, never raise it — upstream documents it as "hook
              # harnesses additionally cap it at 25s to fit the host's hook
              # window". There is no client-side knob for this.
              #
              # Measured 2026-09-09 with `low` ALREADY in place: one 2-iteration
              # loop ran 31.9s total (agent_1=2.8s, agent_2=29.1s) while the
              # hook aborted at 25.004s — the server finished 7s later and the
              # answer was thrown away. Across the diag log's 2-day span that is
              # 7 aborts to 3 successes, every abort at exactly 25.0s, and the
              # best success (23.1s) only just cleared. `minimal` was the other
              # option, but it tunes the same reasoning phase that IS the
              # problem; gpt-4o removes the phase instead of shrinking it.
              #
              # LLM_TEMPERATURE_REFLECT and REFLECT_LLM_REASONING_EFFORT stay
              # GONE from this block, and that still matters on the Spark:
              #   - reasoning_effort is passed through VERBATIM, so leaving it
              #     set would 400 every call against a backend that does not
              #     accept it;
              #   - temperature falls back to reflect's intended 0.9
              #     (config.py DEFAULT_LLM_TEMPERATURE_REFLECT), which is what
              #     the old `none` override existed to work around.
              #
              # One Azure-era consideration that does NOT carry over: gpt-4.1-mini
              # was picked partly for a 1M context window, on the reasoning that
              # reflect front-loads every mental model so headroom is free
              # insurance. It is not free here. Context on the Spark is bounded by
              # OLLAMA_CONTEXT_LENGTH (32768), and KV cache is allocated PER
              # PARALLEL SLOT, so raising it multiplies across the pool. If reflect
              # starts truncating mental models, that is the knob — and it is a
              # memory decision on the Spark, not a free one.
              #
              # All of the above is why moving reflect to a local model needed
              # measuring rather than assuming. gpt-oss:20b IS a reasoning model,
              # which is exactly what got gpt-5-mini removed — but the 25s cap is
              # about WALL CLOCK, not about reasoning in principle, so it was
              # timed instead of ruled out.
              #
              # Measured on the Spark, two-iteration tool-calling loop shaped
              # like reflect's (tool call, then synthesis over the result):
              #   gpt-oss:20b          iter1 1.0s  iter2 12.9s  TOTAL 13.9s
              #   qwen2.5:14b-instruct iter1 1.2s  iter2 14.0s  TOTAL 15.2s
              # Both clear 25s; gpt-oss wins with ~11s of margin AND produced the
              # longer synthesis (2514 vs 2015 chars).
              #
              # The counter-intuitive part: gpt-oss:20b decodes at 63 tok/s while
              # the SMALLER qwen2.5:14b manages only 26. gpt-oss is MoE with ~3.6B
              # active parameters; the dense 14B loses badly on a bandwidth-bound
              # device. Do not assume a smaller model is faster here.
              #
              # It also emitted ZERO reasoning tokens on the synthesis turn —
              # it reasons for constrained extraction (retain) but not for
              # open-ended synthesis, so the reasoning tax that killed gpt-5-mini
              # does not apply to this stage in practice.
              #
              # If it does start missing the cap: qwen2.5:14b-instruct is already
              # pulled on the Spark and exposed as `spark-qwen25-14b`, is
              # confirmed non-reasoning, and is a one-value swap here.
              HINDSIGHT_API_REFLECT_LLM_MODEL: spark-gpt-oss-20b
              # Floor on AUTOMATIC mental-model refreshes. The default is 0 — no
              # floor at all — which is how 232 refreshes ran in ~2h on
              # 2026-09-07: every consolidation batch queued another with nothing
              # rate-limiting it. Most of that is redundant work, and the floor
              # matters MORE now that the stage runs on the Spark rather than on
              # someone else's credits: a refresh storm no longer just wastes an
              # allowance, it occupies the same 10 Ollama slots retain and reflect
              # are budgeted against.
              #
              # Safe by construction: a trigger arriving inside the window is
              # PARKED until it expires, not dropped, so no refresh is lost — and
              # EXPLICIT refreshes (the hindsight_reflect MCP tool, the API, the
              # control plane) ignore the floor entirely, so on-demand reflection
              # stays instant. A per-model `trigger.min_refresh_interval_seconds`
              # still overrides this.
              HINDSIGHT_API_MENTAL_MODEL_MIN_REFRESH_INTERVAL_SECONDS: "3600"
              # Default is FALSE, and the default is wrong for us. Off, Hindsight
              # text-injects the schema and json.loads the reply, which upstream
              # warns can be violated by prose preambles and markdown fences —
              # "wedging retain/consolidation on parse retries". On, structured
              # output goes through native constrained decoding, which "guarantees
              # schema-valid JSON, eliminating the invalid-JSON retry storm
              # (issue #1002)."
              #
              # This stays true across the move off Anthropic. What changes is the
              # mechanism behind it: it used to mean a forced Anthropic tool_use
              # tool, and now means `response_format: json_schema` with
              # strict:true, which Ollama enforces as a llama.cpp grammar. That
              # was verified on the real FactExtractionResponse schema before
              # this migration, not assumed — see the retain block above.
              HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"

              # --- consolidation -> DGX Spark via LiteLLM ---
              # Consolidation is the bulk of the volume: on 2026-09-07 it was 700
              # of 997 LLM calls (~70%), against 266 for retain. It is also the
              # LOWEST-judgment stage — it merges and dedupes units retain has
              # already extracted — which is why it was the first stage moved off
              # Anthropic onto Azure credits.
              #
              # Those credits are now exhausted and the endpoint 401s, so the
              # cost argument that put it on Azure is moot; it follows retain and
              # reflect onto the Spark. Being the highest-volume and least
              # latency-sensitive stage, it is also the one that benefits most
              # from batching if vLLM replaces Ollama later.
              #
              # Provider stays plain `openai` — `azure` is not in Hindsight's
              # supported-provider list, and LiteLLM speaks the OpenAI surface
              # natively. Only the model name and the base URL in the
              # ExternalSecret change.
              HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER: openai
              HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: spark-gpt-oss-20b
              # HINDSIGHT_API_LLM_TEMPERATURE_CONSOLIDATION: none was here, and
              # removing it is REQUIRED, not cleanup. It existed solely because
              # the gpt-5 family rejects an explicit temperature and would 400 on
              # consolidation's built-in default of 0.0. gpt-oss served through
              # Ollama accepts an explicit temperature (verified on this path),
              # so leaving the override would silently discard that 0.0 and let
              # consolidation run at whatever the provider defaults to — the
              # opposite of what the setting was protecting.

              # --- observability ---
              # Neither HindsightDown nor HindsightImagePullFailing catches the
              # failure mode that actually matters: pod 1/1 Running, retains
              # failing, memory silently frozen. This enables the backlog gauges
              # the PrometheusRule alerts on.
              HINDSIGHT_API_METRICS_BACKLOG_ENABLED: "true"
            probes:
              # Liveness on /health/live, which performs NO database access.
              # /health does acquire a connection, so liveness there would
              # restart-loop the pod on every postgres18 failover. Readiness on
              # /health is correct: a pod that cannot reach the database should
              # leave the Service and rejoin when it recovers.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: *apiPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # 300s. Cold start on a node without the image is a 1.42 GB pull
              # across 15 layers (two ~565 MB torch layers), extract, ~220 MB
              # weight fetch if the cache PVC is empty, torch import, then
              # Alembic migrations.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: *apiPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # false, matching upstream: the process writes to the HuggingFace
              # cache and to /tmp. Both are mounted volumes below, but the image
              # is not built for a read-only root and upstream does not claim it.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                # Upstream's stated minimum for the full API is 1.5 GB,
                # recommended 2 GB. 4Gi is headroom for the reranker's batch
                # forward passes.
                memory: 4Gi
          control-plane:
            image:
              repository: ghcr.io/vectorize-io/hindsight-control-plane
              # See the pre-1.0 warning on the api image above — bump both
              # together; they are one release.
              tag: 0.10.0
            envFrom: *envFrom
            env:
              TZ: "${TIMEZONE}"
              NODE_ENV: production
              HINDSIGHT_CP_HOSTNAME: 0.0.0.0
              HINDSIGHT_CP_PORT: &cpPort 3000
              # Same pod, so container loopback. Note the var is
              # ..._DATAPLANE_API_URL, not ..._DATAPLANE_URL — verified against
              # upstream's controlplane-deployment.yaml; the shorter name is
              # wrong and would leave the UI unable to reach the API.
              HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888
            probes:
              # tcpSocket, matching upstream: the Next.js control plane has no
              # health endpoint of its own that is safe to probe.
              liveness: &cpProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *cpPort
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *cpProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # The namespace enforces `baseline`, but this pod complies with
      # `restricted` by construction and should keep doing so — baseline is the
      # namespace floor, not a licence to skip the pod spec. If Hermes never
      # moves in, the namespace can be tightened without touching this file.
      # PSA evaluates INIT containers too, which is why 01-init-db and
      # 02-init-vector carry the same hardened securityContext.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # amd64 only. The Pis (jormungandr1..4) are 4 CPU / 7.8 GiB and already at
      # 39-72% memory; a 1-4 Gi pod does not belong there. A nodeSelector is a
      # simpler and more durable expression of that than an anti-affinity rule.
      nodeSelector:
        kubernetes.io/arch: amd64
    service:
      api:
        controller: hindsight
        ports:
          http:
            port: *apiPort
      controlplane:
        controller: hindsight
        ports:
          http:
            port: *cpPort
    persistence:
      hf-cache:
        existingClaim: hindsight-hf-cache
        globalMounts:
          - path: /home/hindsight/.cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
