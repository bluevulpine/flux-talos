---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mail-archiver
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/ai/mail-archiver/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: ai
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: ai
      GATUS_SUBDOMAIN: mail-archiver
      # Claims are app-local (app/pvc.yaml); no VOLSYNC_* vars.
      # Explicit minutes :03/:33, unused anywhere in the fleet (local, R2 and
      # VolSync schedules checked). R2 pinned <= :39 in hour 02.
      KOPIUR_LOCAL_CRON: "3,33 * * * *"
      KOPIUR_R2_CRON: "3 2 * * *"
      # The Postgres PVC is RWO and held live: Snapshot, not Direct.
      # NOTE: components/kopiur snapshots the claim named ${APP} (the archive
      # DB volume, "mail-archiver"). A crash-consistent volume snapshot of
      # Postgres is recoverable via WAL replay; a logical dump job is a
      # reasonable later hardening.
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
