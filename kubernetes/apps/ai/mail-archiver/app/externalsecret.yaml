---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mail-archiver-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Shared CNPG postgres18 cluster, bootstrapped by the 01-init-db
        # postgres-init container (role + database, password reset each start).
        ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST};Port=5432;Database=mail_archiver;Username={{ .MailArchiver__PostgresUser }};Password={{ .MailArchiver__PostgresPass }};"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .MailArchiver__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .MailArchiver__PostgresPass }}"
        INIT_POSTGRES_DBNAME: mail_archiver
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # Local break-glass admin (OAuth__DisablePasswordLogin stays false)
        Authentication__Username: "{{ .MailArchiver__AdminUser }}"
        Authentication__Password: "{{ .MailArchiver__AdminPass }}"
        # Authentik OIDC
        OAuth__ClientId: "{{ .MailArchiver__OidcClientId }}"
        OAuth__ClientSecret: "{{ .MailArchiver__OidcClientSecret }}"
        OAuth__AdminEmails__0: "{{ .MailArchiver__AdminEmail }}"
  # Key lives under bosun/ because the agent can only write there. Admin/PG
  # passwords are generated; Oidc*/AdminEmail are PENDING until the Authentik
  # provider exists. Move to a top-level mail-archiver key if preferred.
  dataFrom:
    - extract:
        key: bosun/mail-archiver
    # Shared CNPG superuser -> Postgres__SuperPassword, used only by postgres-init.
    - extract:
        key: cloudnative-pg
