---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mail-archiver-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Postgres sidecar container (official image reads these)
        POSTGRES_DB: MailArchiver
        POSTGRES_USER: "{{ .MailArchiver__PostgresUser }}"
        POSTGRES_PASSWORD: "{{ .MailArchiver__PostgresPass }}"
        ConnectionStrings__DefaultConnection: "Host=mail-archiver-db;Port=5432;Database=MailArchiver;Username={{ .MailArchiver__PostgresUser }};Password={{ .MailArchiver__PostgresPass }};"
        # Local break-glass admin (OAuth__DisablePasswordLogin stays false)
        Authentication__Username: "{{ .MailArchiver__AdminUser }}"
        Authentication__Password: "{{ .MailArchiver__AdminPass }}"
        # Authentik OIDC
        OAuth__ClientId: "{{ .MailArchiver__OidcClientId }}"
        OAuth__ClientSecret: "{{ .MailArchiver__OidcClientSecret }}"
        OAuth__AdminEmails__0: "{{ .MailArchiver__AdminEmail }}"
  # Key lives under bosun/ because the agent can only write there. Admin/PG
  # passwords are generated; Oidc*/AdminEmail are PENDING until the Authentik
  # provider exists. Move to a top-level mail-archiver key if preferred.
  dataFrom:
    - extract:
        key: bosun/mail-archiver
