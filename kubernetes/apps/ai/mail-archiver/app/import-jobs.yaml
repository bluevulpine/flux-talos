---
# One-time MailStore import, one Job per ZIP (task t_b655c675). Each Job runs
# the upstream CLI (`dotnet MailArchiver.dll --import-eml`, doc/CLI.md) against
# the read-only /import mount (import-nfs.yaml) and exits; the web app keeps
# serving (the CLI path returns before the web host and migrations start).
# Results are the CLI's "=== Import Results ===" block in the Job log.
#
# Safe to re-run: the importer dedupes per account (Message-ID, or
# From/To/Subject/time), so a repeated run reports duplicates, not copies.
# No ttlSecondsAfterFinished on purpose: Flux would re-create a TTL-deleted Job
# and import again. backoffLimit 0: a failure is read and decided, not retried.
# Image tag must match the app's (same DB schema; the CLI runs no migrations).
# Append-only: a Job's pod template is immutable, so the next account gets a
# new Job (new name), never an edit to an existing one.
# Removed together with import-nfs.yaml once the import is reconciled.
apiVersion: batch/v1
kind: Job
metadata:
  name: mail-archiver-import-06-account6
  annotations:
    # Create once, never update: a Job is immutable, and a later edit (e.g. a
    # Renovate image bump) must not fail the Kustomization or recreate the Job
    # and re-run the import.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    # The command is a shell script ($1, $#, $ZIP_GLOB); Flux postBuild
    # substitution would blank those, so it is off for this Job (TZ literal).
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app.kubernetes.io/name: mail-archiver
    app.kubernetes.io/component: import
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail-archiver
        app.kubernetes.io/component: import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: import
          # Renovate may bump this line with the app's; that is inert (the Job
          # exists already and IfNotPresent never re-applies it). New Jobs copy
          # the app's current tag.
          image: docker.io/s1t5/mailarchiver:2611.2
          # The ZIP names are the account addresses, and some of those domains
          # stay hidden in this repo (CLAUDE.md). So each Job picks its ZIP by a
          # domain-free pattern that must match exactly one file (refuses on 0
          # or 2+), then execs the image's own entrypoint with the CLI flags.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # No field splitting (names have spaces); globbing still applies.
              IFS=
              set -- /import/zip/$ZIP_GLOB
              if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                echo "ZIP_GLOB=$ZIP_GLOB must match exactly one ZIP, got $#:" >&2
                printf '  %s\n' "$@" >&2
                exit 2
              fi
              echo "importing $(basename "$1") into account $ACCOUNT_ID"
              exec dotnet MailArchiver.dll --import-eml --file "$1" --account-id "$ACCOUNT_ID"
          env:
            # Account 6, 208 messages: the smallest account, as the test run.
            - name: ZIP_GLOB
              value: derek.jacobs@*.zip
            - name: ACCOUNT_ID
              value: "6"
            - name: TZ
              value: America/Chicago
            - name: LocalImport__AllowedPaths__0
              value: /import
          envFrom:
            - secretRef:
                name: mail-archiver-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: import
              mountPath: /import
              subPath: mailstore rescue
              readOnly: true
            # The app creates these at startup (service constructors); /app
            # is root-owned in the image, so each needs a writable mount.
            - name: scratch
              mountPath: /app/uploads
              subPath: uploads
            - name: scratch
              mountPath: /app/exports
              subPath: exports
            - name: scratch
              mountPath: /app/logs
              subPath: logs
            - name: scratch
              mountPath: /app/DataProtection-Keys
              subPath: keys
            - name: scratch
              mountPath: /tmp
              subPath: tmp
      volumes:
        - name: import
          persistentVolumeClaim:
            claimName: mail-archiver-import-nfs
            readOnly: true
        - name: scratch
          emptyDir: {}
