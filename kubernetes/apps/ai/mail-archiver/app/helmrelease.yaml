---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mail-archiver
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mail-archiver
  values:
    controllers:
      mail-archiver:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            # 1654 = the `app` user baked into mcr.microsoft.com/dotnet/aspnet
            # (the image itself defaults to root; we override).
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            fsGroup: 1654
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # Creates the role and database on the shared CNPG postgres18 cluster
          # if missing and resets the role's password on every start, so a
          # rotation is `bao kv patch` plus a pod roll (postgres-init skill).
          # The app then runs its EF migrations as that non-superuser owner:
          # its two extensions (pgcrypto, citext) are trusted, and its
          # immutability triggers are plain row triggers on its own tables.
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: rolling
            envFrom:
              - secretRef:
                  name: mail-archiver-secret
        containers:
          app:
            image:
              repository: docker.io/s1t5/mailarchiver
              # renovate: datasource=docker depName=docker.io/s1t5/mailarchiver
              tag: "2611.2"
            env:
              TZ: "${TIMEZONE}"
              AllowedHosts: mail-archiver.derekjacobs.dev
              TimeZone__DisplayTimeZoneId: "${TIMEZONE}"
              # Read-only REST API (/api/v1, upstream doc/API.md) for Bosun's
              # count reconciliation and search checks. Bearer API keys only
              # (no cookies); a key carries its owner's account permissions.
              # Whole-message and attachment downloads stay off: verification
              # needs metadata and counts, not mail bodies as files.
              Api__Enabled: "true"
              Api__AllowMessageDownloads: "false"
              Api__AllowAttachmentDownloads: "false"
              # Fixed-window budget per API key per minute (upstream default
              # 120). Raised for the one-time semantic-search backfill: the
              # list endpoint carries no bodies, so the indexer needs one
              # GET /emails/{id} per message (334k) and 120/min would take
              # ~46 h. 3000/min is ~2 h. Lower it once the initial load is
              # done and a steady-state rate is known (incremental indexing
              # needs far less). Not measured against the single-pod app's
              # load yet: the indexer self-throttles to ~50 req/s.
              Api__RateLimitPerMinute: "3000"
              # Archive posture: manual delete stays allowed during the
              # phase-1 delete test; flip to "false" for production.
              DeletionPolicy__DeletionAllowed: "true"
              # Upload cap: upstream default. The one-time MailStore import ran
              # as CLI Jobs off a NAS share (removed after the import).
              # Native OIDC with Authentik. Client id/secret/admin email come
              # from the ExternalSecret. SSO-only: local password login is
              # disabled and users are auto-redirected to Authentik
              # (Derek, task t_bf4be918). Re-enable by flipping
              # DisablePasswordLogin to "false" if Authentik is unavailable.
              OAuth__Enabled: "true"
              OAuth__Authority: https://sso.derekjacobs.dev/application/o/mail-archiver/
              OAuth__DisplayName: Authentik
              OAuth__ClientScopes__0: openid
              OAuth__ClientScopes__1: profile
              OAuth__ClientScopes__2: email
              OAuth__AutoApproveUsers: "false"
              OAuth__DisablePasswordLogin: "true"
              OAuth__AutoRedirect: "true"
            envFrom:
              - secretRef:
                  name: mail-archiver-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 5000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: mail-archiver
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # Native OIDC, so deliberately NO `auth: authentik` label (a second
          # forward-auth gate would double-login and block the bearer-key
          # API/MCP). Direct gatus probe is the in-cluster check: gatus
          # follows the redirect to the login page either way.
          gatus.home-operations.com/endpoint: |
            group: ai
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Mail Archiver"
          gethomepage.dev/group: "AI"
          gethomepage.dev/icon: "mdi-email-lock"
          gethomepage.dev/description: "Email archive"
        # Internal gateway only: mail archive, no case for public exposure.
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - mail-archiver.derekjacobs.dev
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      keys:
        existingClaim: mail-archiver-keys
        advancedMounts:
          mail-archiver:
            app:
              - path: /app/DataProtection-Keys
      logs:
        type: emptyDir
        advancedMounts:
          mail-archiver:
            app:
              - path: /app/logs
      tmp:
        type: emptyDir
        advancedMounts:
          mail-archiver:
            app:
              - path: /tmp
      # The app creates /app/uploads at startup (MBoxImportService ctor) and
      # /app is root-owned in the image, so as uid 1654 it crashlooped with
      # "Access to the path '/app/uploads' is denied". Uploads are staging for
      # web-UI mbox/eml imports only, so scratch space is enough.
      uploads:
        type: emptyDir
        advancedMounts:
          mail-archiver:
            app:
              - path: /app/uploads
      # Same failure one constructor later: ExportService creates /app/exports
      # at startup. uploads and exports are the only directory names in the
      # assembly besides the mounted DataProtection-Keys and logs (checked by
      # decoding MailArchiver.dll's string literals, 2610.1). Exports are
      # generated for download, so scratch space is enough here too.
      exports:
        type: emptyDir
        advancedMounts:
          mail-archiver:
            app:
              - path: /app/exports
