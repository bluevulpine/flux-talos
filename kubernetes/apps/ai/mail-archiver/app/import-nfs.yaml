---
# Read-only NFS mount of the MailStore Home export for the one-time import
# (`dotnet MailArchiver.dll --import-eml --file <zip>`, upstream doc/CLI.md).
# The share is `/mnt/home/downloads` on vault, NFS-exported read-only to
# 10.0.10.0/24 (Derek, 2026-11-08). Only the import Jobs (import-jobs.yaml)
# mount it, and only its `mailstore rescue` subtree; the web app does not.
# The importer reads a ZIP of .eml files only, so the per-account ZIPs are
# built on the NAS side under `mailstore rescue/zip/`.
# Native nfs PV so mountOptions apply (rationale:
# kubernetes/apps/media/plex/app/media-nfs.yaml); nconnect/nfsvers match the
# other consumers of this NAS. Remove this file and import-jobs.yaml once the
# import is reconciled.
# reclaimPolicy: Retain: this points at Derek's own files; never Delete.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mail-archiver-import-nfs
  labels:
    app.kubernetes.io/name: mail-archiver
    app.kubernetes.io/component: import
spec:
  capacity:
    storage: 1Gi # NFS ignores capacity; the field is required.
  accessModes:
    - "ReadOnlyMany"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # static binding, no dynamic provisioner
  mountOptions:
    - nfsvers=4.2
    - hard
    - noresvport
    - noatime
    - nconnect=8
    - rsize=1048576
    - wsize=1048576
  nfs:
    server: "${SECRET_NFS_SERVER}"
    path: /mnt/home/downloads
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-archiver-import-nfs
spec:
  accessModes:
    - "ReadOnlyMany"
  storageClassName: ""
  volumeName: mail-archiver-import-nfs
  resources:
    requests:
      storage: 1Gi
