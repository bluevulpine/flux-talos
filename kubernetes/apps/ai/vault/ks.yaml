---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vault
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  path: ./kubernetes/apps/ai/vault/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: ai
  # true: longhorn-2-replica binds Immediately, so the claim goes Bound as soon as it
  # is created. Waiting makes hermes' dependsOn mean "the volume is Bound", not
  # merely "the manifest was applied".
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      NS: ai
      # Must equal the claim name in app/pvc.yaml: components/kopiur targets the
      # PVC by ${APP}.
      #
      # Explicit minutes, not H: the vault is the one place human notes live, so
      # the local leg runs every 30 min at a fixed offset. :3/:33 is free in the
      # fleet's explicit-minute list (the :7..:29 odd ladder is taken).
      KOPIUR_LOCAL_CRON: "3,33 * * * *"
      # R2 pinned <= :39 in hour 02 (hour 03 is kopiur-maint-r2's); :8 is free
      # between the :5 and :10 slots.
      KOPIUR_R2_CRON: "8 2 * * *"
      # RWO + Snapshot: the mover cannot co-mount an RWO volume hermes holds, and
      # a Direct copy would read notes mid-write.
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
