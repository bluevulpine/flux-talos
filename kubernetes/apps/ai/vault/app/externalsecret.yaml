---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name vault-syncthing-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Syncthing GUI login for the sidecar, applied by the hermes pod's
        # vault-syncthing init container on every start. Same OpenBao key as
        # productivity/vault-sync: one admin login for both Syncthing GUIs,
        # both behind Authentik forward auth. Rotating it rolls BOTH pods
        # (reloader), hermes included.
        STGUI_USER: "{{ .VaultSync__GuiUser }}"
        STGUI_PASSWORD: "{{ .VaultSync__GuiPassword }}"
  dataFrom:
    - extract:
        key: vault-sync
