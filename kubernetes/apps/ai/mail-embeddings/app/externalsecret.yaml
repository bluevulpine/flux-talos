---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Consumed ONLY by the mail-embeddings-db-init Job. It carries the postgres
# superuser password, so the indexer gets its own secret later, not this one.
# Key lives under bosun/ because the agent can only write there (same as
# bosun/mail-archiver); the password is generated, [A-Za-z0-9] only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mail-embeddings-db-init-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .MailEmbeddings__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .MailEmbeddings__PostgresPass }}"
        INIT_POSTGRES_DBNAME: mail_embeddings
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
  dataFrom:
    - extract:
        key: bosun/mail-embeddings
    - extract:
        key: cloudnative-pg
