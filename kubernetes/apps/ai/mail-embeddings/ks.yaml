---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Vector store for mail-archiver semantic search (kanban t_8f3a8cc8): its own
# database and role on postgres18, apart from mail-archiver's schema and role.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mail-embeddings
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # Note the `18` suffix: a wrong name parks this Kustomization in
    # `dependency not ready` forever, with no event or alert.
    - name: cloudnative-pg-cluster18
      namespace: database
  path: ./kubernetes/apps/ai/mail-embeddings/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: ai
  # The Job is health-checked: Ready means the role, database, extension and
  # schema all exist.
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
