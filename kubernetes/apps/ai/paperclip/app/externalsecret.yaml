---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperclip-secret
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Paperclip's own Postgres (shared CNPG cluster18, like n8n). With
        # DATABASE_URL set the image skips its embedded Postgres entirely
        # (scripts/docker-entrypoint.sh), so nothing writes to /paperclip/pg.
        DATABASE_URL: "postgresql://{{ .Paperclip__PostgresUser }}:{{ .Paperclip__PostgresPass }}@${POSTGRES_HOST}:5432/{{ .Paperclip__DbName }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .Paperclip__DbName }}"
        INIT_POSTGRES_HOST: ${POSTGRES_HOST}
        INIT_POSTGRES_USER: "{{ .Paperclip__PostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .Paperclip__PostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .Postgres__SuperPassword }}"
        # Signs session cookies; losing it logs every user out, nothing more.
        BETTER_AUTH_SECRET: "{{ .Paperclip__AuthSecret }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: paperclip
