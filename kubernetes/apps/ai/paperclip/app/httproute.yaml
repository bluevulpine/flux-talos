---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
  annotations:
    gatus.home-operations.com/endpoint: |
      group: ai
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Paperclip"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-paperclip"
    gethomepage.dev/description: "Agent company orchestration"
spec:
  hostnames:
    - "paperclip.${SECRET_DOMAIN}"
  parentRefs:
    # Internal gateway only - not exposed externally
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: paperclip
          port: 3100
