---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-openbao-store
      namespace: external-secrets
    # components/kopiur's SnapshotPolicies are rejected by the fail-closed
    # webhook until the ClusterRepositories exist.
    - name: kopiur-repositories
      namespace: kopiur-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/ai/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: *app
      NS: ai
      GATUS_PORT: "9119"
      GATUS_SERVICE: hermes
      VOLSYNC_CAPACITY: 20Gi
      # Agent state: config, .env, SOUL.md, sessions, memories, skills, cron.
      # Hourly local, nightly R2 — it accretes slowly but is expensive to lose.
      # Two replicas, node-local best-effort: dataLocality best-effort keeps ONE
      # replica on the pod's node without the hard pin of strict-local, so a Talos
      # drain can still move the agent and rebuild locally; the second replica sits
      # on another node. kopiur is the backup, but a drain no longer leaves the
      # agent's only live copy on a single disk. Staged clones stay 1-replica
      # (app/kustomization.yaml staging patch).
      VOLSYNC_STORAGECLASS: longhorn-2-replica-local
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # kopiur (components/kopiur), W6. Landed one PR BEFORE the component so the
      # SnapshotSchedules are created with these crons, not the component's
      # defaults (runbook trap: a cron change does not re-pin a pending slot).
      # H picks a minute per schedule; the hours match VolSync's old ones.
      KOPIUR_LOCAL_CRON: "H * * * *"
      KOPIUR_R2_CRON: "H 6 * * *"
      # RWO + Snapshot: the mover cannot co-mount an RWO volume the agent holds,
      # and a Direct copy would read a live SQLite state.db mid-write.
      # kopia skips the uv/cargo caches (CACHEDIR.TAG) and the gateway sockets:
      # a restore re-downloads the caches (W6 restore gate, runbook).
      KOPIUR_COPYMETHOD: Snapshot
      KOPIUR_SNAPSHOTCLASS: longhorn-snapclass
