---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Wasp: the Buzz code-review agent, migrated from the Buzz desktop app on
# Derek's MacBook to a Hermes profile served by this gateway (multiplexed; see
# GATEWAY_MULTIPLEX_PROFILES in helmrelease.yaml). First of the Buzz agents to
# move; it uses the per-profile secret-file pattern from the Matrix pilot
# (docs/superpowers/plans/2026-10-03-hermes-matrix-pilot.md), and is that
# pilot's named-profile test subject.
#
# One file, profile.env, holding KEY=VALUE lines. Mounted read-only at
# /run/hermes-profiles/wasp/ and read by the profile's own config.yaml:
#   secrets.command: {enabled: true, override_existing: true,
#     command: "/bin/cat /run/hermes-profiles/wasp/profile.env"}
# A named profile cannot borrow process env under multiplexing, which is why
# this is a file and not more envFrom.
#
# Not here on purpose: the model credential. Wasp signs in to its provider
# itself (`hermes -p wasp auth add ...`); the OAuth token lives in the profile's
# own auth.json on the data claim, as the default profile's does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-profile-wasp
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        profile.env: |
          # Wasp's existing Nostr identity (same npub the Buzz community knows).
          BUZZ_PRIVATE_KEY={{ .Wasp__Buzz__PrivateKey }}
          # Self-hosted relay, same as the default profile (https, not wss: the
          # Buzz CLI takes the community's HTTP base URL).
          BUZZ_RELAY_URL=https://buzz.${SECRET_DOMAIN}
          # No BUZZ_AUTH_TAG: Wasp is a plain relay member (invited by npub), not
          # a desktop-app managed agent, so no owner attestation is needed.
          # Profile-scoped bearer for /p/wasp/v1/... on the shared API listener.
          # A named profile fails closed without its own key; this is what an
          # orchestrator (Paperclip) authenticates with.
          API_SERVER_KEY={{ .Wasp__ApiServerKey }}
          # PAT for the wasp-bot Gitea account, read scopes only. Wasp fetches
          # diffs with it and returns the review as its reply; it does not post
          # comments or reviews itself (that would need write:issue/repository),
          # and it never pushes. Rotate with the same read-only scopes.
          GITEA_TOKEN={{ .Wasp__Gitea__Token }}
          GITEA_URL=https://gitea.${SECRET_DOMAIN}
          # Wasp on Matrix: @wasp:derekjacobs.dev, device WASPHERMES (a MAS
          # compatibility token; see docs/superpowers/specs/2026-10-03-hermes-matrix-pilot-design.md).
          # These MUST come through the secret scope, not config.yaml: the adapter's
          # credential pass rewrites a YAML-only homeserver to "". device_id and
          # allowed_users live in profiles/wasp/config.yaml (platforms.matrix).
          # The recovery key is empty until the first boot bootstraps cross-signing
          # and writes it to the output file (O_EXCL, per-profile path); it is then
          # moved into OpenBao. Empty is treated as unset.
          MATRIX_HOMESERVER=https://matrix.${SECRET_DOMAIN}
          MATRIX_E2EE_MODE=required
          MATRIX_ACCESS_TOKEN={{ .Wasp__Matrix__AccessToken }}
          # Quoted: the key is space-separated groups, and an unquoted value
          # breaks any shell that sources profile.env. Hermes strips the quotes.
          MATRIX_RECOVERY_KEY="{{ .Wasp__Matrix__RecoveryKey }}"
          MATRIX_RECOVERY_KEY_OUTPUT_FILE=/opt/data/profiles/wasp/matrix-recovery-key.txt
  dataFrom:
    - extract:
        key: hermes-wasp
