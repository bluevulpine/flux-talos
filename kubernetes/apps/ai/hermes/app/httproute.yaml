---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  annotations:
    gatus.home-operations.com/endpoint: |
      group: ai
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hermes"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-robot"
    gethomepage.dev/description: "Hermes Agent dashboard"
spec:
  # ONE hostname only. HERMES_DASHBOARD_PUBLIC_URL adds its exact host to the
  # dashboard's Host / WebSocket-Origin guard, so a second name (a tailscale
  # MagicDNS entry, say) would be rejected at the WebSocket handshake.
  # Tailnet clients reach this same route: the ts-exit-node Connector advertises
  # 172.16.8.0/24, and the internal gateway lives at 172.16.8.2.
  hostnames:
    - "hermes.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The Syncthing sidecar's GUI. A separate route, not a second hostname on the
# dashboard route above: the dashboard's Host guard allows ONE name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-syncthing
  annotations:
    gatus.home-operations.com/endpoint: |
      group: ai
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hermes vault sync"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "syncthing.png"
    gethomepage.dev/description: "Obsidian vault Syncthing peer in the hermes pod"
  labels:
    # The Syncthing GUI starts with no login and can add devices and shares,
    # i.e. hand the vault to anyone. Forward auth puts the whole host behind
    # Authentik SSO; the init container's generated login is the second lock.
    auth: authentik
spec:
  hostnames:
    - "syncthing-hermes.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hermes
          port: 8384
