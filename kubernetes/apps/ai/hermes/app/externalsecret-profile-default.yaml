---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Bosun (the default profile) in the per-profile secret-file shape the named
# profiles already use (see externalsecret-profile-wasp.yaml). Mounted read-only
# at /run/hermes-profiles/default/ and read by /opt/data/config.yaml:
#   secrets.command: {enabled: true, override_existing: true,
#     command: "/bin/cat /run/hermes-profiles/default/profile.env"}
#
# Why this exists alongside hermes-secret's envFrom: under multiplexing, the
# cron ticker resolves credentials through the profile secret scope, which is
# built from <home>/.env plus secrets.command and never from process env. So the
# cron delivery preflight read Bosun's Matrix as "not connected" and blocked
# every job delivering to matrix, while the live adapter (process env) worked.
# Reproduced and fixed with fake credentials before this change.
#
# Same OpenBao fields as hermes-secret; nothing new to store. The MATRIX_* keys
# in hermes-secret stay for now (one variable at a time) and can go in a follow
# up once this file is confirmed to carry them. Never put MATRIX_* in .env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-profile-default
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        profile.env: |
          MATRIX_HOMESERVER=https://matrix.${SECRET_DOMAIN}
          MATRIX_E2EE_MODE=required
          MATRIX_ACCESS_TOKEN={{ .Hermes__Matrix__AccessToken }}
          # Quoted: space-separated groups. Hermes strips the quotes.
          MATRIX_RECOVERY_KEY="{{ .Hermes__Matrix__RecoveryKey }}"
          MATRIX_RECOVERY_KEY_OUTPUT_FILE=/opt/data/matrix-recovery-key.txt
  dataFrom:
    - extract:
        key: hermes
