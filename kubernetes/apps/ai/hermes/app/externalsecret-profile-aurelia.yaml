---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Aurelia: Paperclip's chief of staff (top of the org chart; Bosun and
# Deckhand report to her), moved off Paperclip's claude_local adapter, whose
# in-container Claude Code login kept expiring. She delegates and never
# commits, so there is no GitHub App for her. Layout as in
# externalsecret-profile-deckhand.yaml; model credential is the Anthropic
# subscription via `hermes -p aurelia auth add anthropic` in the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-profile-aurelia
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        profile.env: |
          # Profile-scoped bearer for /p/aurelia/v1/... on the shared API listener.
          # A named profile fails closed without its own key; this is what
          # Paperclip's hermes_gateway adapter authenticates with.
          API_SERVER_KEY={{ .Aurelia__ApiServerKey }}
          # Aurelia's own Paperclip agent key (one per agent, never shared: a
          # named profile cannot read the default profile's env under
          # multiplexing, and Paperclip identifies the agent by the key).
          PAPERCLIP_API_KEY={{ .Aurelia__Paperclip__APIKey }}
          PAPERCLIP_API_URL=https://paperclip.${SECRET_DOMAIN}
  dataFrom:
    - extract:
        key: agents/aurelia/profile
