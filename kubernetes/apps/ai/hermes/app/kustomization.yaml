---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./externalsecret-profile-wasp.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./rbac.yaml
  - ./ciliumnetworkpolicy.yaml
components:
  - ../../../../components/volsync-claim
  # kopiur backs this PVC up (W6 cutover, docs/runbooks/kopiur-migration.md).
  # volsync-claim stays: it owns the PVC and its (now inert) dataSourceRef.
  - ../../../../components/kopiur

patches:
  # Stage kopiur's snapshot clones on longhorn-1-replica, VolSync's old clone class. A staged PVC otherwise inherits the source
  # class, longhorn-2-replica-local here, so every run would clone a 20Gi
  # 2-replica volume only to read it once and delete it
  # (runbook waves table, footnote 6; same patch as plex/jellyfin).
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/staging/storageClassName
        value: longhorn-1-replica
  # The data claim is created IfNotPresent: on a fresh cluster Flux creates it from
  # the manifest, so it restores from backup (the DR path rehearsed in
  # docs/runbooks/volsync-app-namespace-move.md, "Retiring the permanent pin"); on
  # this cluster Flux skips it because it already exists. This replaces the
  # temporary `volumeName` pin used to move the claim to its current StorageClass.
  # kopiur app: the claim's dataSourceRef points at a VolSync RD that is no longer
  # deployed (inert), so a rebuild restores via kopiur, NOT the VolSync DR path
  # (docs/runbooks/kopiur-migration.md).
  # Consequences -- read before editing:
  #  1. NEVER remove this annotation while the claim exists: Flux owns
  #     f:volumeName, so the next apply without it stalls on the immutable field.
  #  2. Claim edits in git (VOLSYNC_CAPACITY, storageClassName, labels) are silently
  #     ignored. Expand by hand and keep git equal:
  #     kubectl -n <ns> patch pvc hermes -p '{"spec":{"resources":{"requests":{"storage":"<size>"}}}}'
  #  3. Drift is silent: a changed desired class/volumeName raises no event.
  # The kind-only target is safe ONLY while this app has exactly one
  # PersistentVolumeClaim -- a second claim would silently get IfNotPresent too
  # (nextcloud has two and targets the data claim by name).
  - target: {kind: PersistentVolumeClaim}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: not-used
        annotations:
          kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
