---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Deckhand: Paperclip's dependency-triage engineer (Renovate PRs on
# flux-talos), moved from Paperclip's claude_local adapter to a Hermes profile
# served by this gateway. Same per-profile secret-file pattern as Wasp; see
# externalsecret-profile-wasp.yaml for why it is a file and not envFrom.
#
# OpenBao layout for agent profiles (second of this shape; the third copies
# this file): secret/agents/<name>/profile holds the profile's credentials,
# secret/github-apps/<app> holds its GitHub App. Shared, non-secret values
# (PAPERCLIP_API_URL) are literals here, not Bao fields.
#
# Not here: the model credential (Nous Portal, `hermes -p deckhand auth`),
# and the GitHub App PEM, which gh-as-bot.sh reads from OpenBao directly
# (BAO_PATH=secret/data/github-apps/deckhand-bot-bvn) and never writes to
# the profile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-profile-deckhand
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        profile.env: |
          # Profile-scoped bearer for /p/deckhand/v1/... on the shared API listener.
          # A named profile fails closed without its own key; this is what
          # Paperclip's hermes_gateway adapter authenticates with.
          API_SERVER_KEY={{ .Deckhand__ApiServerKey }}
          # Deckhand's own Paperclip agent key (one per agent, never shared: a
          # named profile cannot read the default profile's env under
          # multiplexing, and Paperclip identifies the agent by the key).
          PAPERCLIP_API_KEY={{ .Deckhand__Paperclip__APIKey }}
          PAPERCLIP_API_URL=https://paperclip.${SECRET_DOMAIN}
  dataFrom:
    - extract:
        key: agents/deckhand/profile
