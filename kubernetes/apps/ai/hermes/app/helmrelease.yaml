---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  # Default is 5m and upgrade.remediation.strategy is rollback: a cold image pull
  # (922 MiB, cached on one node only) plus the readiness delay can exceed it,
  # and the rollback would put a just-started pod back to replicas 0. Remove
  # this once the move is done and the image is warm (cleanup PR).
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Run the gateway as the hermes ServiceAccount (created by the chart, bound
    # to a read-only ClusterRole in rbac.yaml). The projected SA token lets
    # kubectl use in-cluster config — no kubeconfig secret needed. The
    # chart-created SA is required rather than an externally-declared one: per
    # the rackpanel note, app-template's controller serviceAccount does not
    # adopt a same-name external SA.
    serviceAccount:
      app:
        enabled: true
    controllers:
      hermes:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        # Upstream: "Never run two Hermes gateway containers against the same
        # data directory simultaneously — session files and memory stores are
        # not designed for concurrent write access." A RollingUpdate would
        # briefly run two pods against one PVC.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
              tag: v2026.9.24
            args:
              - "gateway"
              - "run"
            env:
              TZ: "${TIMEZONE}"
              HERMES_HOME: /opt/data
              # The shared notes vault (ai/vault). The obsidian skill resolves its
              # path from this. Named profiles do not inherit process env under
              # multiplexing, so a profile that needs it must list it in its own
              # env_passthrough.
              OBSIDIAN_VAULT_PATH: /opt/data/vault
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: "0.0.0.0"
              HERMES_DASHBOARD_PORT: &port 9119
              # Required behind Envoy: controls OAuth callback construction and
              # the Host/WebSocket-Origin guard. Must match the HTTPRoute host.
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${SECRET_DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://sso.${SECRET_DOMAIN}/application/o/hermes/"
              # Not the plugin default ("openid profile email"). Both scopes are
              # load-bearing and the reasoning is in README.md "## Authentik".
              HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email offline_access groups"
              # s6-overlay starts as root, chowns /opt/data, then drops to this
              # uid/gid for the gateway itself. Matches fsGroup below.
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              # The dashboard reaches the gateway over this API, so it cannot be
              # switched off. It binds the pod IP so Paperclip can POST /v1/runs,
              # and ciliumnetworkpolicy.yaml is what keeps other PODS out:
              # ingress to 8642 is allowed from pods labelled
              # app.kubernetes.io/name=paperclip in this namespace, nothing more.
              # Known gap: Cilium's allow-localhost (default, no host firewall)
              # exempts the local node, so hostNetwork pods on hermes' node
              # (cilium-agent, node-exporter) are not blocked -- API_SERVER_KEY
              # is the guard against those. The Service still exposes 8642 under
              # the name `api` for a stable DNS target.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              API_SERVER_PORT: "8642"
              # Serve every profile under /opt/data/profiles from this one gateway
              # (one Hermes per agent profile, not one pod per agent; see
              # docs/superpowers/specs/2026-10-03-hermes-matrix-pilot-design.md).
              # MUST be explicit: v0.21.4's implicit default refuses on s6-supervised
              # containers (_host_supports_migration), and PID 1 here is s6-svscan,
              # so without this a second profile would run as a second gateway
              # process. An explicit true logs nothing at boot; check
              # /opt/data/gateway_state.json served_profiles instead.
              GATEWAY_MULTIPLEX_PROFILES: "true"
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # exec, not httpGet. An httpGet would likely work (Cilium's
              # allow-localhost exempts the node), but exec keeps the probe off
              # the policy entirely so a future allow-localhost=policy change
              # cannot break liveness. curl ships in the image (Debian 13 base,
              # curl in the apt layer).
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8642/health
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              # NOT the usual non-root default. The image's entrypoint is an
              # s6-overlay dispatcher that must start as root to fix ownership
              # on /opt/data before dropping to uid 10000. These four caps are
              # exactly what that drop needs — the same set the TrueNAS catalog
              # app grants. HERMES_ALLOW_ROOT_GATEWAY is NOT set, so the agent
              # process itself never runs as root.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
    defaultPodOptions:
      # app-template defaults this to false; without it the pod gets no
      # projected SA token and kubectl's in-cluster config has nothing to
      # authenticate with.
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      # Keep the agent off the control plane, and off its own reboot target as
      # much as scheduling allows. This is scheduling preference, not a control:
      # the real guard against self-immolation is approvals.deny (see README).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
          # Gated by ciliumnetworkpolicy.yaml (paperclip only).
          api:
            port: 8642
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/data
      # The notes vault: its own claim and backups (ai/vault), mounted INSIDE the
      # data mount so profiles find it at $HERMES_HOME/vault. The hermes claim's
      # backups do not include it (a nested mount is a different volume).
      vault:
        existingClaim: vault
        globalMounts:
          - path: /opt/data/vault
      # /opt/hermes is read-only by design; the agent still needs somewhere to
      # put kubectl/talosctl and scratch work. Anything that must survive a
      # restart belongs under /opt/data.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Per-profile secret files (one entry per named Hermes profile). A named
      # profile cannot read process env under multiplexing, so its secrets
      # arrive as one KEY=VALUE file read by the profile's own secrets.command
      # source. Directory mount, NOT subPath: a subPath mount never receives
      # Secret updates. 0440 + fsGroup 10000 is exactly what the gateway
      # (uid/gid 10000, no caps) needs to read it.
      #
      # wasp: Buzz code reviewer, and the Matrix pilot's named profile (it
      # replaced the throwaway canary). See externalsecret-profile-wasp.yaml.
      wasp-secrets:
        type: secret
        name: hermes-profile-wasp
        defaultMode: 0440
        globalMounts:
          - path: /run/hermes-profiles/wasp
            readOnly: true
