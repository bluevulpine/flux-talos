---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  # Default is 5m and upgrade.remediation.strategy is rollback: a cold image pull
  # (922 MiB, cached on one node only) plus the readiness delay can exceed it,
  # and the rollback would put a just-started pod back to replicas 0. Remove
  # this once the move is done and the image is warm (cleanup PR).
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Run the gateway as the hermes ServiceAccount (created by the chart, bound
    # to a read-only ClusterRole in rbac.yaml). The projected SA token lets
    # kubectl use in-cluster config — no kubeconfig secret needed. The
    # chart-created SA is required rather than an externally-declared one: per
    # the rackpanel note, app-template's controller serviceAccount does not
    # adopt a same-name external SA.
    serviceAccount:
      app:
        enabled: true
    controllers:
      hermes:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        # Upstream: "Never run two Hermes gateway containers against the same
        # data directory simultaneously — session files and memory stores are
        # not designed for concurrent write access." A RollingUpdate would
        # briefly run two pods against one PVC.
        strategy: Recreate
        initContainers:
          # Prepares the Syncthing sidecar (same shape as productivity/vault-sync):
          # `syncthing generate` creates the config if absent and (re)sets the
          # GUI login on every start, so OpenBao stays the source of truth and
          # the GUI is never open. The grep makes a login that did not land in
          # the config fail the pod rather than start an unauthenticated GUI.
          # It also seeds the vault's .stignore (per device, never synced):
          # lost+found is ext4's root-owned dir at the volume root, .git/.qmd
          # are the Mac's local-only trees, and the LiveSync plugin dir holds
          # CouchDB credentials that the vault's .gitignore already keeps out
          # of git for the same reason. Agents do not need any of them. For
          # the documents share it seeds lost+found, .git and /Obsidian — the
          # vault is already its own share, and two Syncthing folders over the
          # same bytes corrupt indexes (ai/documents/README.md).
          vault-syncthing:
            image: &syncthingImage
              repository: ghcr.io/syncthing/syncthing
              # renovate: datasource=docker depName=ghcr.io/syncthing/syncthing
              tag: 2.1.7
            command:
              - /bin/sh
              - -c
              - >-
                printf '%s\n' "$STGUI_PASSWORD" | syncthing --home=/var/syncthing/config generate --gui-user="$STGUI_USER" --gui-password=- && grep -q "<user>$STGUI_USER</user>" /var/syncthing/config/config.xml && { [ -f /opt/data/vault/.stignore ] || printf '%s\n' lost+found .git .qmd .obsidian/plugins/obsidian-livesync > /opt/data/vault/.stignore; } && { [ -f /opt/data/documents/.stignore ] || printf '%s\n' lost+found .git /Obsidian > /opt/data/documents/.stignore; }
            env:
              TZ: "${TIMEZONE}"
              STNODEFAULTFOLDER: "1"
              STGUI_USER:
                valueFrom:
                  secretKeyRef:
                    name: vault-syncthing-secret
                    key: STGUI_USER
              STGUI_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vault-syncthing-secret
                    key: STGUI_PASSWORD
            securityContext: &syncthingSecurityContext
              # The pod has no runAsUser (hermes' s6 entrypoint starts as root
              # and drops to 10000 itself), so pin it here: the sidecar must
              # write the vault as the same uid the agents run as. Syncthing
              # replicates the Mac's 0600/0700 modes, so group access via
              # fsGroup would not be enough.
              runAsNonRoot: true
              runAsUser: 10000
              runAsGroup: 10000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
              seccompProfile:
                type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              # renovate: datasource=docker depName=docker.io/nousresearch/hermes-agent
              tag: v2026.9.24
            args:
              - "gateway"
              - "run"
            env:
              TZ: "${TIMEZONE}"
              HERMES_HOME: /opt/data
              # The shared notes vault (ai/vault). The obsidian skill resolves its
              # path from this. Named profiles do not inherit process env under
              # multiplexing, so a profile that needs it must list it in its own
              # env_passthrough.
              # NOT $HERMES_HOME/vault: that directory is Hermes' own encrypted
              # credential store (vault_store.py: vault.key + vault.json.enc +
              # .vault.lock under <HERMES_HOME>/vault/, not configurable), and
              # file_safety.py denies the agent's file tools any read there. The
              # first mount at /opt/data/vault made Bosun's read_file refuse every
              # note and would have put the key and ciphertext into Syncthing and
              # Gitea. Must stay under /opt/data: HERMES_WRITE_SAFE_ROOT.
              OBSIDIAN_VAULT_PATH: /opt/data/obsidian
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: "0.0.0.0"
              HERMES_DASHBOARD_PORT: &port 9119
              # Required behind Envoy: controls OAuth callback construction and
              # the Host/WebSocket-Origin guard. Must match the HTTPRoute host.
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${SECRET_DOMAIN}"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://sso.${SECRET_DOMAIN}/application/o/hermes/"
              # Not the plugin default ("openid profile email"). Both scopes are
              # load-bearing and the reasoning is in README.md "## Authentik".
              HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email offline_access groups"
              # s6-overlay starts as root, chowns /opt/data, then drops to this
              # uid/gid for the gateway itself. Matches fsGroup below.
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              # The dashboard reaches the gateway over this API, so it cannot be
              # switched off. It binds the pod IP so Paperclip can POST /v1/runs,
              # and ciliumnetworkpolicy.yaml is what keeps other PODS out:
              # ingress to 8642 is allowed from pods labelled
              # app.kubernetes.io/name=paperclip in this namespace, nothing more.
              # Known gap: Cilium's allow-localhost (default, no host firewall)
              # exempts the local node, so hostNetwork pods on hermes' node
              # (cilium-agent, node-exporter) are not blocked -- API_SERVER_KEY
              # is the guard against those. The Service still exposes 8642 under
              # the name `api` for a stable DNS target.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: "0.0.0.0"
              API_SERVER_PORT: "8642"
              # Serve every profile under /opt/data/profiles from this one gateway
              # (one Hermes per agent profile, not one pod per agent; see
              # docs/superpowers/specs/2026-10-03-hermes-matrix-pilot-design.md).
              # MUST be explicit: v0.21.4's implicit default refuses on s6-supervised
              # containers (_host_supports_migration), and PID 1 here is s6-svscan,
              # so without this a second profile would run as a second gateway
              # process. An explicit true logs nothing at boot; check
              # /opt/data/gateway_state.json served_profiles instead.
              GATEWAY_MULTIPLEX_PROFILES: "true"
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # exec, not httpGet. An httpGet would likely work (Cilium's
              # allow-localhost exempts the node), but exec keeps the probe off
              # the policy entirely so a future allow-localhost=policy change
              # cannot break liveness. curl ships in the image (Debian 13 base,
              # curl in the apt layer).
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8642/health
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              # NOT the usual non-root default. The image's entrypoint is an
              # s6-overlay dispatcher that must start as root to fix ownership
              # on /opt/data before dropping to uid 10000. These four caps are
              # exactly what that drop needs — the same set the TrueNAS catalog
              # app grants. HERMES_ALLOW_ROOT_GATEWAY is NOT set, so the agent
              # process itself never runs as root.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
          # Syncthing peer: a live replica of the Obsidian vault, in this pod
          # because the vault claim is RWO. Pairs with the NAS (introducer) the
          # same way productivity/vault-sync does; agents read and write the
          # files directly and the vault-sync pod's committer is what puts the
          # result in Gitea. The sync port is not exposed: this side dials OUT,
          # and Syncthing connections are bidirectional once established.
          syncthing:
            image: *syncthingImage
            env:
              TZ: "${TIMEZONE}"
              # Running as non-root, the image entrypoint skips its su-exec/PUID
              # path and execs syncthing directly. Without this, first start
              # creates ~/Sync under /var/syncthing.
              STNODEFAULTFOLDER: "1"
              STNOUPGRADE: "1"
            probes:
              # exec, like the hermes container: keeps the probe off the
              # CiliumNetworkPolicy. Same check as the image's own HEALTHCHECK.
              # Liveness only. A readiness probe on a sidecar marks the whole
              # pod NotReady, and the Service would drop 9119 (dashboard) and
              # 8642 (paperclip -> hermes API) because Syncthing was slow to
              # start. Liveness restarts just this container; the GUI route
              # may 503 for a moment while it does.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - -o
                      - /dev/null
                      - http://127.0.0.1:8384/rest/noauth/health
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 5
            securityContext: *syncthingSecurityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # app-template defaults this to false; without it the pod gets no
      # projected SA token and kubectl's in-cluster config has nothing to
      # authenticate with.
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      # Keep the agent off the control plane, and off its own reboot target as
      # much as scheduling allows. This is scheduling preference, not a control:
      # the real guard against self-immolation is approvals.deny (see README).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *port
          # Gated by ciliumnetworkpolicy.yaml (paperclip only).
          api:
            port: 8642
          # Syncthing GUI, reached only through httproute.yaml (Authentik).
          syncthing:
            port: 8384
    persistence:
      # Agent state, scratch and profile secrets are the hermes container's
      # alone (advancedMounts, not globalMounts): the Syncthing sidecar and its
      # init container get the vault and nothing else.
      data:
        existingClaim: *app
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
      # The Obsidian vault (ai/vault). Two paths for one volume, on purpose:
      # - hermes sees it at /opt/data/obsidian (OBSIDIAN_VAULT_PATH above).
      #   It must sit under /opt/data (HERMES_WRITE_SAFE_ROOT) and must NOT be
      #   /opt/data/vault, which is Hermes' own credential store directory.
      # - the sidecar and its init container keep /opt/data/vault: that is the
      #   folder path in Syncthing's config (set at pairing time, on the config
      #   claim), and HERMES_HOME means nothing in those containers.
      # Nested inside the data mount, so the hermes claim's backups do not
      # include it (a nested mount is a different volume). The volume ROOT is
      # the Syncthing folder: lost+found at that root is kept out by the
      # .stignore the init container seeds.
      vault:
        existingClaim: vault
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/obsidian
            syncthing: &vaultMount
              - path: /opt/data/vault
            vault-syncthing: *vaultMount
      # ~/Documents (ai/documents), the vault pattern one level up the tree.
      # Same path for every container that sees it — no credential-store
      # collision to route around. Nested inside the data mount for hermes
      # (so the hermes claim's backups exclude it), volume root = the
      # Syncthing folder. The init container above seeds its .stignore:
      # /Obsidian is the hard one (the vault is already its own share; two
      # folders over the same bytes corrupt indexes), .git keeps the Fiction
      # repo Mac-git-only. Who-writes-what: ai/documents/README.md.
      documents:
        existingClaim: documents
        advancedMounts:
          hermes:
            app:
              - path: /opt/data/documents
            syncthing: &documentsMount
              - path: /opt/data/documents
            vault-syncthing: *documentsMount
      # Syncthing's HOME and state. The image's /var/syncthing is root-owned
      # and the sidecar's root filesystem is read-only, so HOME is an emptyDir
      # and the config (device key, index) sits on its own small claim.
      vault-syncthing-home:
        type: emptyDir
        advancedMounts:
          hermes:
            syncthing: &syncthingHome
              - path: /var/syncthing
            vault-syncthing: *syncthingHome
      vault-syncthing-config:
        existingClaim: vault-syncthing-config
        advancedMounts:
          hermes:
            syncthing: &syncthingConfig
              - path: /var/syncthing/config
            vault-syncthing: *syncthingConfig
      # /opt/hermes is read-only by design; the agent still needs somewhere to
      # put kubectl/talosctl and scratch work. Anything that must survive a
      # restart belongs under /opt/data.
      tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /tmp
      # Per-profile secret files (one entry per named Hermes profile). A named
      # profile cannot read process env under multiplexing, so its secrets
      # arrive as one KEY=VALUE file read by the profile's own secrets.command
      # source. Directory mount, NOT subPath: a subPath mount never receives
      # Secret updates. 0440 + fsGroup 10000 is exactly what the gateway
      # (uid/gid 10000, no caps) needs to read it.
      #
      # wasp: Buzz code reviewer, and the Matrix pilot's named profile (it
      # replaced the throwaway canary). See externalsecret-profile-wasp.yaml.
      wasp-secrets:
        type: secret
        name: hermes-profile-wasp
        defaultMode: 0440
        advancedMounts:
          hermes:
            app:
              - path: /run/hermes-profiles/wasp
                readOnly: true
      # deckhand: Paperclip dependency-triage engineer (Renovate PRs). See
      # externalsecret-profile-deckhand.yaml.
      deckhand-secrets:
        type: secret
        name: hermes-profile-deckhand
        defaultMode: 0440
        advancedMounts:
          hermes:
            app:
              - path: /run/hermes-profiles/deckhand
                readOnly: true
      # aurelia: Paperclip chief of staff. See externalsecret-profile-aurelia.yaml.
      aurelia-secrets:
        type: secret
        name: hermes-profile-aurelia
        defaultMode: 0440
        advancedMounts:
          hermes:
            app:
              - path: /run/hermes-profiles/aurelia
                readOnly: true
