---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tailscale.com/proxyclass_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: multi-vlan-exit-node
spec:
  statefulSet:
    labels:
      app.kubernetes.io/name: tailscale-exit-node
    pod:
      labels:
        app.kubernetes.io/name: tailscale-exit-node
      annotations:
        # Attach multiple VLANs using Multus
        # Attempts DHCP first, falls back to static .253 addresses if DHCP unavailable
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "vlan-10",
              "namespace": "kube-system",
              "interface": "net1",
              "ips": ["10.0.10.253/24"]
            },
            {
              "name": "vlan-30",
              "namespace": "kube-system",
              "interface": "net2",
              "ips": ["192.168.30.253/24"]
            },
            {
              "name": "vlan-50",
              "namespace": "kube-system",
              "interface": "net3",
              "ips": ["192.168.50.253/24"]
            }
          ]
      # Ensure pod runs on nodes with VLAN interfaces (brokkr01, brokkr02, brokkr03)
      # Prefer brokkr nodes, avoid low-power nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - brokkr01
                      - brokkr02
                      - brokkr03
      tailscaleContainer:
        env:
          # Cilium auto-detects pod MTU as the minimum across its device list
          # (bond0 9000, bond0.30/50 1500, host tailscale0 1280), so pod eth0
          # lands at 1280 — the same as tailscaled's default tun MTU. Every
          # full-size WireGuard packet the pod SENDS is then ~1340 B (1280
          # inner + 60 B outer IP/UDP/WireGuard) and gets fragmented in two,
          # and those fragments have to survive the open internet. Measured
          # 2026-09-15: exit-node -> laptop ran 1.9 Mbit/s while laptop ->
          # exit-node (which does not fragment) ran 123-200 Mbit/s, and the
          # lossy reverse path also throttled uploads to 16 Mbit/s via delayed
          # TCP ACKs. 1280 - 60 = 1220 keeps outbound packets at exactly 1280.
          # NOTE: below 1280 this would break IPv6 over the tailnet (1280 is
          # the IPv6 minimum link MTU); 1220 is deliberately the inner MTU, so
          # the outer packet stays at 1280.
          - name: TS_DEBUG_MTU
            value: "1220"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            smarter-devices/net_tun: "1"
          limits:
            memory: 256Mi
            smarter-devices/net_tun: "1"
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
