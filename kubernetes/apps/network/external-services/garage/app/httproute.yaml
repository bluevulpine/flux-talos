---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage
  annotations:
    gethomepage.dev/enabled: "true"
    # External service on the NAS — no in-cluster pod, so use an HTTP ping for
    # status instead of the (always "not found") kubernetes pod lookup.
    gethomepage.dev/siteMonitor: https://garage.${SECRET_DOMAIN}
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Garage
    gethomepage.dev/icon: https://garagehq.deuxfleurs.fr/images/garage-logo.svg
    gatus.home-operations.com/endpoint: |
      group: network
spec:
  hostnames:
    - "garage.${SECRET_DOMAIN}"
  parentRefs:
    # Internal gateway only - not exposed externally
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: garage
          port: 80
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  annotations:
    # S3 API returns 403 Forbidden on root path without credentials - that's expected
    gatus.home-operations.com/endpoint: |
      group: network
      conditions:
        - "[STATUS] == 403"
spec:
  hostnames:
    - "s3.${SECRET_DOMAIN}"
  parentRefs:
    # Internal gateway only - not exposed externally
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: garage-s3
          port: 80

