---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest
  labels:
    auth: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    # External service (proxied to the NAS) — no in-cluster pod; ping for status.
    gethomepage.dev/siteMonitor: https://openspeedtest.${SECRET_DOMAIN}
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Openspeedtest
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/openspeedtest.svg
    gatus.home-operations.com/endpoint: |
      group: network
spec:
  hostnames:
    - "openspeedtest.${SECRET_DOMAIN}"
  parentRefs:
    - name: external-pangolin
      namespace: network
      sectionName: https
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: openspeedtest
          port: 80

