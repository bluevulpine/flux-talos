---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: network
  annotations:
    # Target annotation tells external-dns to create CNAME records pointing to
    # the Cloudflare tunnel instead of A records to the private LoadBalancer IP
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: ${SVC_NGINX_EXTERNAL}
  # Consolidated listeners - single HTTPS listener handles all domains to avoid
  # HTTP/2 connection coalescing issues. When clients reuse TLS connections across
  # domains (due to shared wildcard certificate), SNI may not match the Host header.
  # By removing hostname restrictions, routing is based purely on HTTPRoute hostnames.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # No hostname restriction - HTTPRoutes filter by hostname
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      # No hostname restriction - HTTPRoutes filter by hostname
      # This prevents HTTP/2 connection coalescing from causing 404s
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: network
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: ${SVC_NGINX_INTERNAL}
  # Consolidated listeners - same as external Gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-pangolin
  namespace: network
  annotations:
    # Belt-and-braces: neither external-dns instance watches this gateway
    # (cloudflare is scoped --gateway-name=external, unifi --gateway-name=internal),
    # and public DNS for Pangolin-served hosts comes from DNSEndpoint CRs instead.
    external-dns.alpha.kubernetes.io/controller: none
spec:
  gatewayClassName: envoy
  # Third ingress door, alongside `external` (Cloudflare tunnel) and `internal`
  # (LAN). Traffic arrives from the Pangolin VPS via the in-cluster Newt
  # connector, bypassing Cloudflare's 100MB upload cap and per-stream throughput
  # limit. Keeping it as its own Gateway is what preserves split-horizon DNS:
  # external-dns derives records per-gateway, so a host served here gets its
  # public record from a DNSEndpoint while `internal` still publishes the LAN
  # A record. ClusterIP-only -- reached solely by Newt inside the cluster.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-proxy-pangolin
  listeners:
    # HTTPS only: Newt forwards to :443; there is no plaintext hop to redirect.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-direct
  namespace: network
  annotations:
    # Same split-horizon arrangement as external-pangolin: no external-dns
    # instance derives records from this gateway; the public record is a
    # DNSEndpoint CNAME to wheels (WAN1, DDNS'd), and LAN clients keep getting
    # the internal gateway's A record for the same hostname.
    external-dns.alpha.kubernetes.io/controller: none
spec:
  gatewayClassName: envoy
  # Fourth ingress door: the UniFi WAN1 port forward lands here, so anything
  # attached to this gateway is on the open internet with no Cloudflare or
  # Pangolin in front. Chosen for Jellyfin over Pangolin because its native
  # apps cannot pass a proxy login wall (so Pangolin would add no auth), and
  # video wants the direct path -- the same reason Plex streams over WAN1.
  #
  # Exposure is fenced twice: routes are accepted only from the media namespace,
  # and the listener only serves the Jellyfin hostname. Publishing another app
  # here means widening one of those on purpose.
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: ${SVC_NGINX_DIRECT}
  listeners:
    # HTTPS only: nothing should ever be reachable over plaintext from the WAN.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "jellyfin.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: network
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: external
      namespace: network
      sectionName: http
    - name: internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

