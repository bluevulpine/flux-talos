---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name external-dns-secret-unifi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The home-operations webhook (>= 0.10) authenticates only with an API key. The key was
        # created as the external-dns user while it was temporarily Super Admin (the only role
        # UniFi lets create keys) and keeps working after the user is downgraded again.
        EXTERNAL_DNS_UNIFI_API_KEY: "{{ .Unifi__ExternalDns__ApiKey }}"
  dataFrom:
    - extract:
        key: unifi
