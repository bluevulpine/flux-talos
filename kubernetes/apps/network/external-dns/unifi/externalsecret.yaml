---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name external-dns-secret-unifi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The home-operations webhook 0.11.0 authenticates only with an API key. Only a Super
        # Admin can create one, so on 2026-11-10 the external-dns user was promoted, created it
        # (POST /proxy/users/api/v2/user/self/keys) and was demoted again. The key's rights follow
        # the user's current role: after the demotion Protect answers 403, DNS records 200.
        EXTERNAL_DNS_UNIFI_API_KEY: "{{ .Unifi__ExternalDns__ApiKey }}"
  dataFrom:
    - extract:
        key: unifi
