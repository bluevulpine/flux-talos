---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns-unifi
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    logLevel: debug
    provider:
      name: webhook
      webhook:
        image:
          # kashalls/external-dns-unifi-webhook moved to home-operations (last old tag v0.9.0).
          # 0.11 dropped username/password login (UNIFI_API_KEY is required) and wants
          # UNIFI_SITE as the console-URL site name; the default, "default", is ours.
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.11.0@sha256:663442f116d7b45546782bdf7ace50d05ac15cc630c7236d443d69593845e992
        env:
          - name: UNIFI_HOST
            value: https://10.0.10.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-secret-unifi
                key: EXTERNAL_DNS_UNIFI_API_KEY
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    extraArgs:
      - --ignore-ingress-tls-spec
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      # Filter to only watch internal gateway for split-horizon DNS
      # External gateway has CNAME target annotation for Cloudflare
      # Internal gateway publishes A records with direct IPs
      - --gateway-namespace=network
      - --gateway-name=internal
    policy: sync
    # v0.22.0 (bundled in this chart bump) drops the external-dns.alpha.kubernetes.io/
    # fallback and makes the annotation prefix a required, no-default setting — the
    # release notes warn the change "can delete all your DNS records". The "service"
    # source here reads that exact annotation off every LoadBalancer Service in the
    # cluster (e.g. valheim), so pin it explicitly to preserve current behavior.
    annotationPrefix: "external-dns.alpha.kubernetes.io/"
    sources:
      - "service"
      - "gateway-httproute"
    txtOwnerId: main
    txtPrefix: k8s.
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${SECRET_DOMAIN_BLOG}"
      - "${SECRET_DOMAIN_BLOGCOM}"
      - "${SECRET_DOMAIN_MEDIA}"
      - "${SECRET_DOMAIN_LAKE}"
      - "${SECRET_DOMAIN_YOYO}"
      - "${SECRET_DOMAIN_BON}"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
