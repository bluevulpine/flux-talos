---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    logLevel: debug
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-secret-cloudflare
            key: api-token
    extraArgs:
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-namespace=network
      - --gateway-name=external
    policy: sync
    # v0.22.0 (bundled in this chart bump) drops the external-dns.alpha.kubernetes.io/
    # fallback and makes the annotation prefix a required, no-default setting — the
    # release notes warn the change "can delete all your DNS records". The
    # `target` annotation on the `external` Gateway and the HTTPRoute annotations
    # (this instance's gateway-httproute source) still use this prefix, so keep it pinned. The DNSEndpoints no longer depend on it: since
    # v0.23 their providerSpecific property is `cloudflare/proxied` (the old
    # `external-dns.alpha.kubernetes.io/cloudflare-proxied` name is deprecated and
    # only rewritten). A property name neither form recognises silently falls back
    # to --cloudflare-proxied=true, so orange-clouds a DNS-only record.
    annotationPrefix: "external-dns.alpha.kubernetes.io/"
    sources:
      - "crd"
      - "gateway-httproute"
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${SECRET_DOMAIN_BLOG}"
      - "${SECRET_DOMAIN_BLOGCOM}"
      - "${SECRET_DOMAIN_MEDIA}"
      - "${SECRET_DOMAIN_LAKE}"
      - "${SECRET_DOMAIN_YOYO}"
      - "${SECRET_DOMAIN_BON}"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
