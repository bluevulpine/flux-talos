---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    logLevel: debug
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-secret-cloudflare
            key: api-token
    extraArgs:
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-namespace=network
      - --gateway-name=external
    policy: sync
    # v0.22.0 (bundled in this chart bump) drops the external-dns.alpha.kubernetes.io/
    # fallback and makes the annotation prefix a required, no-default setting — the
    # release notes warn the change "can delete all your DNS records". The `crd`
    # source here reads that exact key as a literal providerSpecific property name on
    # every DNSEndpoint (e.g. cloudflare-proxied: false on pangolin, echo-server-pangolin),
    # so pin it explicitly or every record silently falls back to --cloudflare-proxied=true.
    annotationPrefix: "external-dns.alpha.kubernetes.io/"
    sources:
      - "crd"
      - "gateway-httproute"
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${SECRET_DOMAIN_BLOG}"
      - "${SECRET_DOMAIN_BLOGCOM}"
      - "${SECRET_DOMAIN_MEDIA}"
      - "${SECRET_DOMAIN_LAKE}"
      - "${SECRET_DOMAIN_YOYO}"
      - "${SECRET_DOMAIN_BON}"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
