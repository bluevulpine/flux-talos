---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-phantom-clients-cleanup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: unifi-phantom-clients-cleanup
              # Pinned to a commit tag + digest, never :latest. On 2026-11-04 a
              # run with imagePullPolicy Always still got a month-old :latest
              # from the node-side cache, ran the old rule and forgot ~79 real
              # clients again. 84ebf8ac is the stale-randomised-MAC rule.
              # renovate: datasource=docker depName=gitea.derekjacobs.dev/bvn-homelab/unifi-phantom-clients-cleanup
              image: gitea.derekjacobs.dev/bvn-homelab/unifi-phantom-clients-cleanup:84ebf8ac@sha256:4b79965331d9d19cbad7862893bb98aec8a904492a2dfc59fa8862332a6500c0
              imagePullPolicy: IfNotPresent
              args:
                - "-verbose"
              envFrom:
                - secretRef:
                    name: unifi-phantom-clients-cleanup-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "200m"
                  memory: "64Mi"
          restartPolicy: OnFailure
