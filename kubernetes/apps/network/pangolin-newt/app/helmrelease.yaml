---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pangolin-newt
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: pangolin-newt
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      pangolin-newt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/fosrl/newt
              # renovate: datasource=docker depName=docker.io/fosrl/newt
              tag: 1.16.0
            # Newt is the tunnel *client*: it dials out to the Pangolin server
            # (PANGOLIN_ENDPOINT over 443 + Gerbil WireGuard over UDP) and, once
            # registered, forwards traffic to the target configured in the
            # Pangolin dashboard for this Site -- point that at the same internal
            # origin cloudflared uses (external.network.svc.cluster.local:443) so
            # the existing Envoy HTTPRoutes/certs/authentik are unchanged. Nothing
            # about the target lives here; only the connector credentials do.
            # Newt's built-in Prometheus exporter (`-metrics`). It is the only
            # metrics source for the Pangolin path that lives inside the cluster:
            # gerbil/traefik on the VPS are behind a Tailscale ACL boundary, so
            # this is what makes the tunnel observable without depending on the
            # VPS being scrapable. The default bind is 127.0.0.1:2112, which no
            # ServiceMonitor could ever reach -- it must be 0.0.0.0 to be scraped.
            # `-pprof` is deliberately NOT set: it would put debug/heap handlers
            # on the same unauthenticated admin listener.
            args:
              - -metrics
              - -metrics-admin-addr
              - 0.0.0.0:2112
            envFrom:
              - secretRef:
                  name: pangolin-newt-secret
            securityContext:
              # Newt uses userspace WireGuard (netstack), so it needs no NET_ADMIN,
              # no /dev/net/tun, and no privileged ports -- fully locked down.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                # Newt buffers tunneled bytes for every forwarded connection, so
                # its footprint scales with in-flight throughput. The 128Mi limit
                # OOMKilled repeatedly under Immich first-time-backup traffic (the
                # same surge that drove the ML sidecar bump in #1571); 512Mi gives
                # headroom for that peak while staying tiny for a userspace client.
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      affinity:
        # Newt sits in the Immich data path (it forwards the tunneled bytes to
        # the origin), so keep it on the amd64 (brokkr) nodes, off the arm64 Pis.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    # Newt is an outbound-only tunnel client -- this Service exists solely so the
    # ServiceMonitor has a named `metrics` port to select. Nothing routes traffic
    # to it. (app-template 5.x does not emit container `ports`, so a PodMonitor
    # keyed on a port name would silently select nothing -- see the rackpanel
    # ServiceMonitor for the same trap.)
    service:
      metrics:
        controller: pangolin-newt
        ports:
          metrics:
            port: 2112
    persistence:
      # readOnlyRootFilesystem needs a writable /tmp for any scratch state.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
