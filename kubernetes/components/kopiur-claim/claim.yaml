---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${APP}"
spec:
  # RWX by default, as in ../volsync-claim: kopiur's Direct copy method mounts
  # the PVC in the backup mover alongside the running app.
  accessModes:
    - "${CLAIM_ACCESSMODES:-ReadWriteMany}"
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: "${APP}-claim"
  resources:
    requests:
      storage: "${CLAIM_CAPACITY:-20Gi}"
  storageClassName: "${CLAIM_STORAGECLASS:-tns-csi-nfs}"
