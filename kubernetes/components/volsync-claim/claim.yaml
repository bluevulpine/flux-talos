---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${APP}"
spec:
  # Default to RWX for Direct copy method (allows mover pod to access PVC alongside app)
  accessModes:
    - "${CLAIM_ACCESSMODES:-ReadWriteMany}"
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    # Dead while the claim exists (a bound claim ignores its dataSource; kept
    # because dataSourceRef is immutable). If this claim is ever DELETED, Flux
    # recreates it pointing at a ReplicationDestination that no longer exists
    # and it stays Pending: swap to ../kopiur-claim first
    # (docs/runbooks/kopiur-claim.md).
    name: "${APP}-dst-local"
  resources:
    requests:
      storage: "${CLAIM_CAPACITY:-20Gi}"
  storageClassName: "${CLAIM_STORAGECLASS:-tns-csi-nfs}"

