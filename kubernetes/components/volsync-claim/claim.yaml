---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${APP}"
spec:
  # Default to RWX for Direct copy method (allows mover pod to access PVC alongside app)
  accessModes:
    - "${CLAIM_ACCESSMODES:-ReadWriteMany}"
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    # Never resolved again: VolSync is gone, and a bound claim ignores its
    # dataSource. Kept only because dataSourceRef is immutable once bound.
    name: "${APP}-dst-local"
  resources:
    requests:
      storage: "${CLAIM_CAPACITY:-20Gi}"
  storageClassName: "${CLAIM_STORAGECLASS:-tns-csi-nfs}"

