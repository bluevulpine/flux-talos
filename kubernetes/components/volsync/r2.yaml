---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP:=temp}-volsync-r2"
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: "${APP:=temp}-volsync-r2-secret"
    template:
      engineVersion: v2
      data:
        # Kopia uses a single repository for all apps (maximizes deduplication)
        # Each app is identified by username (app@namespace) - unified naming
        KOPIA_REPOSITORY: "{{ .VolSync__R2__KopiaRepository }}"
        KOPIA_PASSWORD: "{{ .VolSync__R2__KopiaPassword }}"
        AWS_ACCESS_KEY_ID: "{{ .VolSync__R2__AwsAccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .VolSync__R2__AwsSecretKey }}"
        AWS_S3_ENDPOINT: "{{ .VolSync__R2__AwsS3Endpoint }}"
  dataFrom:
    - extract:
        key: volsync-r2-template
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: "${APP:=temp}-r2"
spec:
  sourcePVC: "${APP:=temp}"
  trigger:
    # Must be staggered per-app via VOLSYNC_R2_SCHEDULE in the app's ks.yaml.
    #
    # This was hardcoded to "0 0 * * *" for every app, which fired all ~39 R2
    # sources against the TrueNAS API simultaneously. Under that load a
    # CreateVolume call can take 40s+, and the external-provisioner then issues a
    # duplicate CreateVolume. tns-csi v0.17.6's already-exists path returns a
    # response without volume.content_source, so the provisioner rejects it with
    # "volume content source missing" and rolls back by calling DeleteVolume —
    # destroying the ZFS dataset behind an already-Bound PV. The mover then hangs
    # in ContainerCreating on ENOENT or ESTALE and that night's backup is lost.
    #
    # 18 days of controller logs showed 9 such incidents across 6 apps and both
    # NFS and NVMe-oF, every one between 00:02:10 and 00:03:06 -- one burst
    # destroyed two volumes in the same second. The local sources, which have
    # always been staggered, have never hit it.
    #
    # Staggering does not fix the driver bug (0.17.6 is the newest release); it
    # removes the concurrency that triggers it. See
    # docs/runbooks/volsync-mover-stuck.md.
    #
    # Slots run 00:03-05:49, ~8min apart. **Hour 03 is deliberately left empty**:
    # kopia-maint-r2 runs at "0 3 * * *" against the same Kopia R2 repository
    # these backups write to, and unifi-phantom-clients-cleanup also runs then.
    # Keep new apps out of hour 03.
    schedule: "${VOLSYNC_R2_SCHEDULE}"
  kopia:
    # Default to Direct for NFS (clone intermediate skips snapshot overhead for RWX PVCs)
    # iSCSI/NVMe-oF workloads should override with VOLSYNC_COPYMETHOD: Snapshot
    copyMethod: "${VOLSYNC_COPYMETHOD:-Direct}"
    repository: "${APP}-volsync-r2-secret"
    # Unified snapshot identity: app@namespace (same for both local and R2)
    # This allows snapshots to be restored from either repository
    username: "${APP:=temp}"
    volumeSnapshotClassName: "${VOLSYNC_SNAPSHOTCLASS:-tns-csi-nfs-snapshot}"
    cacheCapacity: ${VOLSYNC_CACHE_CAPACITY:-16Gi}
    cacheStorageClassName: "${VOLSYNC_CACHE_CLASS:-longhorn-1-replica}"
    cacheAccessModes:
      - "${VOLSYNC_CACHE_ACCESSMODES:-ReadWriteOnce}"
    storageClassName: "${VOLSYNC_CLONE_STORAGECLASS:-tns-csi-nfs}"
    # Default to RWX for Direct copy method (allows mover pod to access PVC alongside app)
    accessModes:
      - "${VOLSYNC_ACCESSMODES:-ReadWriteMany}"
    capacity: "${VOLSYNC_CAPACITY:-20Gi}"
    # Run mover as root to avoid slow recursive chown on cloned volumes
    # This bypasses VolumePermissionChangeInProgress delays (10+ min on large volumes)
    moverSecurityContext:
      runAsUser: ${VOLSYNC_RUN_AS_USER:-0}
      runAsGroup: ${VOLSYNC_RUN_AS_GROUP:-0}
      fsGroup: ${VOLSYNC_FS_GROUP:-0}
      fsGroupChangePolicy: OnRootMismatch
    # Kopia retention policy for cloud backup (less aggressive than local)
    retain:
      hourly: 6
      daily: 7
      weekly: 4
      monthly: 3
      # NOTE: ReplicationDestination for R2 is in separate optional component
      # kubernetes/components/volsync-r2-restore for disaster recovery scenarios

